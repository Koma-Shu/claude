<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ポーカー</title>
<script src="sound.js"></script>
<script src="cards.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:radial-gradient(circle at 50% 25%,#1a3a5c,#0a1a30);min-height:100vh;
    font-family:'Hiragino Sans','Meiryo','Segoe UI',sans-serif;color:#eaf4ff;
    display:flex;flex-direction:column;align-items:center;padding:54px 12px 80px;--cw:60px;--ch:85px;}
  h1{font-size:1.4rem;letter-spacing:4px;color:#ffe27a;margin-bottom:4px;}
  .chips{font-size:.9rem;color:#ffe27a;margin-bottom:8px;}
  .area{width:100%;max-width:580px;margin:5px 0;}
  .label{font-size:.8rem;letter-spacing:2px;opacity:.85;margin-bottom:5px;}
  .rank-name{color:#7dffb0;font-weight:bold;}
  .hand{display:flex;gap:7px;min-height:var(--ch);justify-content:center;flex-wrap:wrap;}
  .community{display:flex;gap:7px;min-height:var(--ch);justify-content:center;flex-wrap:wrap;
    background:rgba(0,0,0,.18);border-radius:12px;padding:10px;}
  .comm-lbl{font-size:.72rem;opacity:.7;text-align:center;margin-bottom:5px;letter-spacing:2px;}
  .msg{min-height:28px;font-size:1.05rem;font-weight:bold;margin:10px 0;text-align:center;}
  .msg.win{color:#7dffb0;}.msg.lose{color:#ff9090;}.msg.push{color:#ffe27a;}
  .controls{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:6px;}
  button{font-family:inherit;font-size:.95rem;font-weight:bold;border:none;border-radius:10px;
    padding:11px 24px;cursor:pointer;letter-spacing:1px;transition:transform .1s;}
  button:active{transform:scale(.95);}button:disabled{opacity:.4;cursor:default;}
  .b-draw{background:#3b82f6;color:#fff;}.b-deal{background:#ffe27a;color:#222;}
  .b-next{background:#10b981;color:#fff;}
  .hint{font-size:.78rem;opacity:.7;margin-bottom:8px;text-align:center;}
  .topbtn{position:fixed;top:12px;border-radius:8px;padding:7px 14px;font-size:.8rem;cursor:pointer;border:none;}
  .topbtn.back{left:12px;background:#374151;color:#fff;}
  .topbtn.mode{right:12px;background:#7c3aed;color:#fff;}
  .pcard.held{outline:3px solid #ffe27a;outline-offset:1px;}
  .held-tag{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:.65rem;color:#ffe27a;font-weight:bold;}
</style>
</head>
<body>
<button class="topbtn back" id="backbtn" onclick="location.href='index.html'">戻る</button>
<button class="topbtn mode" id="modebtn"></button>
<h1 id="title">ポーカー</h1>
<div class="chips" id="chips"></div>

<div class="area">
  <div class="label" id="cpu-lbl">CPU</div>
  <div class="hand" id="cpu"></div>
</div>

<div class="area" id="comm-area" style="display:none">
  <div class="comm-lbl" id="comm-lbl">COMMUNITY</div>
  <div class="community" id="community"></div>
</div>

<div class="msg" id="msg"></div>

<div class="area">
  <div class="label"><span id="you-lbl">あなた</span> — <span class="rank-name" id="yourrank"></span></div>
  <div class="hint" id="hint"></div>
  <div class="hand" id="you"></div>
</div>

<div class="controls" id="controls"></div>

<script>
const L={
  title:{ja:'ポーカー',en:'Poker'},you:{ja:'あなた',en:'You'},cpu:{ja:'CPU',en:'CPU'},
  chips:{ja:'チップ',en:'Chips'},deal:{ja:'配る',en:'Deal'},draw:{ja:'交換して勝負',en:'Draw & Show'},
  hintHold:{ja:'残したいカードをタップ（交換しないカード）',en:'Tap cards to HOLD (keep them)'},
  win:{ja:'あなたの勝ち！',en:'You win!'},lose:{ja:'CPUの勝ち…',en:'CPU wins…'},push:{ja:'引き分け',en:'Push'},
  hc:{ja:'ハイカード',en:'High Card'},pair:{ja:'ワンペア',en:'Pair'},twopair:{ja:'ツーペア',en:'Two Pair'},
  trips:{ja:'スリーカード',en:'Three of a Kind'},straight:{ja:'ストレート',en:'Straight'},
  flush:{ja:'フラッシュ',en:'Flush'},fh:{ja:'フルハウス',en:'Full House'},
  quads:{ja:'フォーカード',en:'Four of a Kind'},sf:{ja:'ストレートフラッシュ',en:'Straight Flush'},
  rf:{ja:'ロイヤルフラッシュ',en:'Royal Flush'},
  back:{ja:'戻る',en:'Back'},
  modeDraw:{ja:'モード: ドロー',en:'Mode: 5-Draw'},
  modeHoldem:{ja:'モード: テキサス',en:'Mode: Hold\'em'},
  flop:{ja:'フロップを見る',en:'See Flop'},turn:{ja:'ターンを見る',en:'See Turn'},
  river:{ja:'リバーを見る',en:'See River'},show:{ja:'勝負！',en:'Showdown!'},
  community:{ja:'共通カード',en:'COMMUNITY'},
  hintHoldem:{ja:'手札2枚＋共通5枚で最強の5枚役を作ります',en:'Best 5-card hand from your 2 + 5 community'},
  easy:{ja:'弱',en:'Easy'},normal:{ja:'普通',en:'Normal'},hard:{ja:'強',en:'Hard'},diff:{ja:'難易度',en:'Difficulty'},
};
let lang=localStorage.getItem('lang')||'ja';
const t=k=>(L[k]&&L[k][lang])||k;
const C=window.CARDS,$=id=>document.getElementById(id);
let mode=localStorage.getItem('poker_mode')||'draw'; // 'draw' | 'holdem'
let difficulty=localStorage.getItem('poker_diff')||'medium';
let deck,you,cpu,held,phase='deal',chips=500,msgKey='',msgCls='',busy=false;
let community,street; // holdem: street 0=preflop,1=flop,2=turn,3=river,4=showdown
const RNAMES=['hc','pair','twopair','trips','straight','flush','fh','quads','sf','rf'];

// ── Hand evaluation ───────────────────────────────────────────────
function evalHand(h){
  const vals=h.map(c=>c.value).sort((a,b)=>a-b);
  const suits=h.map(c=>c.suit);
  const counts={};vals.forEach(v=>counts[v]=(counts[v]||0)+1);
  const groups=Object.entries(counts).map(([v,c])=>[c,+v]).sort((a,b)=>b[0]-a[0]||b[1]-a[1]);
  const flush=suits.every(s=>s===suits[0]);
  let uniq=[...new Set(vals)];
  let straight=uniq.length===5&&(uniq[4]-uniq[0]===4);
  let high=vals[4];
  if(uniq.length===5 && JSON.stringify(uniq)===JSON.stringify([1,10,11,12,13])){straight=true;high=13;}
  if(uniq.length===5 && uniq[0]===1 && uniq[1]===2 && uniq[4]===5){straight=true;high=5;}
  let cat,tiebreak;
  const c0=groups[0][0],c1=(groups[1]||[0])[0];
  if(straight&&flush&&high===13&&uniq.includes(1)){cat=9;tiebreak=[14];}
  else if(straight&&flush){cat=8;tiebreak=[high];}
  else if(c0===4){cat=7;tiebreak=[groups[0][1],groups[1][1]];}
  else if(c0===3&&c1===2){cat=6;tiebreak=[groups[0][1],groups[1][1]];}
  else if(flush){cat=5;tiebreak=vals.slice().reverse();}
  else if(straight){cat=4;tiebreak=[high];}
  else if(c0===3){cat=3;tiebreak=[groups[0][1],...groups.slice(1).map(g=>g[1])];}
  else if(c0===2&&c1===2){cat=2;tiebreak=[groups[0][1],groups[1][1],groups[2][1]];}
  else if(c0===2){cat=1;tiebreak=[groups[0][1],...groups.slice(1).map(g=>g[1])];}
  else {cat=0;tiebreak=vals.slice().reverse();}
  if(tiebreak)tiebreak=tiebreak.map(v=>v===1?14:v);
  return {cat,tiebreak:tiebreak||[high===13?14:high]};
}
function cmp(a,b){
  if(a.cat!==b.cat)return a.cat-b.cat;
  for(let i=0;i<Math.max(a.tiebreak.length,b.tiebreak.length);i++){
    const d=(a.tiebreak[i]||0)-(b.tiebreak[i]||0);if(d)return d;
  }
  return 0;
}
// Best 5-card hand from n cards (n=5..7)
function bestHand(cards){
  if(cards.length<5) return null;
  let best=null;
  const n=cards.length;
  const idx=[0,1,2,3,4];
  const combos=[];
  (function rec(start,combo){
    if(combo.length===5){combos.push(combo.slice());return;}
    for(let i=start;i<n;i++){combo.push(i);rec(i+1,combo);combo.pop();}
  })(0,[]);
  for(const cb of combos){
    const e=evalHand(cb.map(i=>cards[i]));
    if(!best||cmp(e,best)>0)best=e;
  }
  return best;
}
function revealedCommunity(){ return street>=4?5:(street===0?0:street+2); }
function currentRankName(){
  if(!you||!you.length)return '';
  if(mode==='draw'){ return you.length===5?t(RNAMES[evalHand(you).cat]):''; }
  // holdem: need at least 3 community revealed (2 hole + 3 = 5)
  const avail=you.concat((community||[]).slice(0,revealedCommunity()));
  if(avail.length<5)return '';
  return t(RNAMES[bestHand(avail).cat]);
}

// ── Rendering ─────────────────────────────────────────────────────
function setStaticText(){
  $('title').textContent=t('title');$('you-lbl').textContent=t('you');$('cpu-lbl').textContent=t('cpu');
  $('backbtn').textContent=t('back');
  $('modebtn').textContent=(mode==='draw')?t('modeDraw'):t('modeHoldem');
  $('chips').textContent=`💰 ${t('chips')}: ${chips}`;
  $('comm-lbl').textContent=t('community');
  $('comm-area').style.display=(mode==='holdem')?'block':'none';
}
function renderControls(){
  setStaticText();
  const m=$('msg');m.textContent=msgKey?t(msgKey):'';m.className='msg '+msgCls;
  $('yourrank').textContent=currentRankName();
  const ctr=$('controls');ctr.innerHTML='';
  if(busy)return;
  if(mode==='draw'){
    $('hint').textContent=phase==='draw'?t('hintHold'):'';
    if(phase==='deal'||phase==='over'){
      ctr.appendChild(mkBtn('b-deal',t('deal'),deal));
    }else if(phase==='draw'){
      ctr.appendChild(mkBtn('b-draw',t('draw'),drawPhase));
    }
  }else{ // holdem
    $('hint').textContent=phase==='play'?t('hintHoldem'):'';
    if(phase==='deal'||phase==='over'){
      ctr.appendChild(mkBtn('b-deal',t('deal'),deal));
    }else if(phase==='play'){
      const lbls=[t('flop'),t('turn'),t('river'),t('show')];
      ctr.appendChild(mkBtn('b-next',lbls[street],nextStreet));
    }
  }
}
function mkBtn(cls,txt,fn){const b=document.createElement('button');b.className=cls;b.textContent=txt;b.onclick=fn;return b;}

// Full static render of card areas (used when not animating)
function renderCards(){
  const yEl=$('you'),cEl=$('cpu');yEl.innerHTML='';cEl.innerHTML='';
  (you||[]).forEach((c,i)=>{
    const el=C.cardEl(c,true);
    if(mode==='draw'&&phase==='draw'){
      el.classList.add('playable');if(held[i])el.classList.add('held');
      el.onclick=()=>{if(busy)return;held[i]=!held[i];SND.sfx.click&&SND.sfx.click();renderCards();};
      if(held[i]){const tag=document.createElement('div');tag.className='held-tag';tag.textContent='KEEP';el.appendChild(tag);}
    }
    yEl.appendChild(el);
  });
  const cpuFace=(phase==='over');
  (cpu||[]).forEach(c=>cEl.appendChild(C.cardEl(c,cpuFace)));
  if(mode==='holdem'){
    const comEl=$('community');comEl.innerHTML='';
    const reveal=street>=4?5:(street===0?0:street+2); // flop=3,turn=4,river=5
    (community||[]).forEach((c,i)=>comEl.appendChild(C.cardEl(c,i<reveal)));
  }
}

// ── Deal ──────────────────────────────────────────────────────────
function deal(){
  if(busy)return;
  busy=true;
  deck=C.shuffle(C.makeDeck());
  msgKey='';msgCls='';
  renderControls();
  const yEl=$('you'),cEl=$('cpu'),comEl=$('community');
  yEl.innerHTML='';cEl.innerHTML='';comEl.innerHTML='';
  if(mode==='draw'){
    you=[deck.pop(),deck.pop(),deck.pop(),deck.pop(),deck.pop()];
    cpu=[deck.pop(),deck.pop(),deck.pop(),deck.pop(),deck.pop()];
    held=[false,false,false,false,false];
    phase='draw';
    for(let i=0;i<5;i++){const el=C.cardEl(cpu[i],false);cEl.appendChild(el);C.dealIn(el,i*70);}
    let done=0;
    you.forEach((card,i)=>{
      const el=C.cardEl(card,false);yEl.appendChild(el);
      C.dealIn(el,200+i*90,()=>C.flipCard(el,card,()=>{SND.sfx.flip&&SND.sfx.flip();if(++done===5){busy=false;renderCards();renderControls();}}));
    });
  }else{
    you=[deck.pop(),deck.pop()];
    cpu=[deck.pop(),deck.pop()];
    community=[deck.pop(),deck.pop(),deck.pop(),deck.pop(),deck.pop()];
    street=0;phase='play';
    // CPU hole cards face-down
    for(let i=0;i<2;i++){const el=C.cardEl(cpu[i],false);cEl.appendChild(el);C.dealIn(el,i*70);}
    // 5 community face-down
    for(let i=0;i<5;i++){const el=C.cardEl(community[i],false);comEl.appendChild(el);C.dealIn(el,150+i*60);}
    // your hole cards face-down → flip
    let done=0;
    you.forEach((card,i)=>{
      const el=C.cardEl(card,false);yEl.appendChild(el);
      C.dealIn(el,450+i*90,()=>C.flipCard(el,card,()=>{SND.sfx.flip&&SND.sfx.flip();if(++done===2){busy=false;renderControls();}}));
    });
  }
}

// ── 5-Card Draw exchange ──────────────────────────────────────────
function drawPhase(){
  if(busy)return;
  busy=true;renderControls();$('hint').textContent='';
  const yEl=$('you');
  for(let i=0;i<5;i++)if(!held[i])you[i]=deck.pop();
  cpuDraw();
  const els=Array.from(yEl.children);
  let pending=0,started=false;
  // exchange non-held in place (preserves order): shrink out → back → deal in → flip new
  for(let i=0;i<5;i++){
    if(held[i])continue;
    started=true;pending++;
    const el=els[i];
    el.style.transition='transform .18s ease-in,opacity .18s';
    el.style.transform='translateY(-26px) scale(.6) rotateY(80deg)';
    el.style.opacity='0';
    setTimeout(()=>{
      el.className='pcard back';el.innerHTML='<div class="pc-back"></div>';
      el.style.transition='none';el.style.transform='translateY(-26px) scale(.85)';
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        el.style.transition='transform .2s cubic-bezier(.22,.8,.36,1),opacity .18s';
        el.style.transform='';el.style.opacity='1';
        setTimeout(()=>C.flipCard(el,you[i],()=>{SND.sfx.flip&&SND.sfx.flip();if(--pending===0)revealCpu();}),210);
      }));
    },190);
  }
  if(!started)revealCpu();
}
function revealCpu(){
  const cEl=$('cpu');const els=Array.from(cEl.children);
  let pending=cpu.length;
  els.forEach((el,i)=>{
    setTimeout(()=>C.flipCard(el,cpu[i],()=>{SND.sfx.flip&&SND.sfx.flip();if(--pending===0)finishDraw();}),i*120);
  });
}
function finishDraw(){
  phase='over';busy=false;
  const r=cmp(evalHand(you),evalHand(cpu));
  settle(r);
  renderCards();renderControls();
}
function cpuDraw(){
  const n=cpu.length;
  let keep=[];
  if(difficulty==='easy'){
    // Keep 1-2 random cards
    const keepN=1+Math.floor(Math.random()*2);
    const idxs=Array.from({length:n},(_,i)=>i);
    while(keep.length<keepN&&idxs.length){
      const ri=Math.floor(Math.random()*idxs.length);
      keep.push(idxs.splice(ri,1)[0]);
    }
  }else if(difficulty==='medium'){
    // Keep pairs and high cards
    const vals={};cpu.forEach((c,i)=>{(vals[c.value]=vals[c.value]||[]).push(i);});
    for(const v in vals){if(vals[v].length>=2)vals[v].forEach(i=>keep.push(i));}
    if(!keep.length){let best=-1,bi=-1;cpu.forEach((c,i)=>{const v=c.value===1?14:c.value;if(v>best){best=v;bi=i;}});if(bi>=0)keep.push(bi);}
  }else{
    // Hard: keep anything contributing to a strong hand (pairs, flush draws, straight draws)
    const vals={};cpu.forEach((c,i)=>{(vals[c.value]=vals[c.value]||[]).push(i);});
    // Keep pairs/trips
    for(const v in vals){if(vals[v].length>=2)vals[v].forEach(i=>keep.push(i));}
    // Keep flush draw (3+ same suit)
    const suits={};cpu.forEach((c,i)=>{(suits[c.suit]=suits[c.suit]||[]).push(i);});
    for(const s in suits){if(suits[s].length>=3)suits[s].forEach(i=>{if(!keep.includes(i))keep.push(i);});}
    // Keep high cards if no other keeps
    if(!keep.length){cpu.forEach((c,i)=>{const v=c.value===1?14:c.value;if(v>=11)keep.push(i);});}
    if(!keep.length){let best=-1,bi=-1;cpu.forEach((c,i)=>{const v=c.value===1?14:c.value;if(v>best){best=v;bi=i;}});if(bi>=0)keep.push(bi);}
  }
  const discard=Array.from({length:n},(_,i)=>i).filter(i=>!keep.includes(i));
  discard.forEach(()=>{cpu.splice(Math.floor(Math.random()*cpu.length),1,deck.pop());});
}

// ── Texas Hold'em street advance ──────────────────────────────────
function nextStreet(){
  if(busy)return;
  busy=true;renderControls();$('hint').textContent='';
  const comEl=$('community');
  if(street===0){ // reveal flop (cards 0,1,2)
    flipCommunity([0,1,2],()=>{street=1;busy=false;renderControls();});
  }else if(street===1){ // turn (card 3)
    flipCommunity([3],()=>{street=2;busy=false;renderControls();});
  }else if(street===2){ // river (card 4)
    flipCommunity([4],()=>{street=3;busy=false;renderControls();});
  }else{ // showdown
    showdownHoldem();
  }
}
function flipCommunity(idxs,done){
  const comEl=$('community');let pending=idxs.length;
  idxs.forEach((i,k)=>{
    setTimeout(()=>{
      C.flipCard(comEl.children[i],community[i],()=>{SND.sfx.flip&&SND.sfx.flip();if(--pending===0)done();});
    },k*160);
  });
}
function showdownHoldem(){
  // reveal CPU hole cards
  const cEl=$('cpu');let pending=2;
  Array.from(cEl.children).forEach((el,i)=>{
    setTimeout(()=>C.flipCard(el,cpu[i],()=>{SND.sfx.flip&&SND.sfx.flip();if(--pending===0)finishHoldem();}),i*150);
  });
}
function finishHoldem(){
  street=4;phase='over';busy=false;
  const r=cmp(bestHand(you.concat(community)),bestHand(cpu.concat(community)));
  $('yourrank').textContent=t(RNAMES[bestHand(you.concat(community)).cat]);
  settle(r);
  renderControls();
}

function settle(r){
  if(r>0){msgKey='win';msgCls='win';chips+=100;SND.sfx.win&&SND.sfx.win();}
  else if(r<0){msgKey='lose';msgCls='lose';chips=Math.max(0,chips-100);SND.sfx.lose&&SND.sfx.lose();}
  else{msgKey='push';msgCls='push';SND.sfx.point&&SND.sfx.point();}
}

$('modebtn').onclick=()=>{
  if(busy)return;
  mode=(mode==='draw')?'holdem':'draw';
  localStorage.setItem('poker_mode',mode);
  SND.sfx.click&&SND.sfx.click();
  you=[];cpu=[];community=[];phase='deal';msgKey='';msgCls='';
  renderCards();renderControls();
};

you=[];cpu=[];community=[];held=[];street=0;
renderCards();renderControls();
// Difficulty row for poker
const pokerDiffRow=document.createElement('div');
pokerDiffRow.style.cssText='position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;z-index:10;';
const pokerDiffLbl=document.createElement('span');pokerDiffLbl.style.cssText='font-size:.75rem;color:#aaa;margin-right:4px;';pokerDiffLbl.textContent=t('diff')+':';
pokerDiffRow.appendChild(pokerDiffLbl);
['easy','normal','hard'].forEach(d=>{
  const b=document.createElement('button');
  b.style.cssText=`font-size:.75rem;font-weight:bold;border:none;border-radius:6px;padding:4px 10px;cursor:pointer;color:#fff;background:${d===difficulty?'#3b82f6':'#374151'};`;
  b.textContent=t(d);
  b.onclick=()=>{
    difficulty=d;localStorage.setItem('poker_diff',d);
    pokerDiffRow.querySelectorAll('button').forEach((x,i)=>{const ds=['easy','normal','hard'][i];x.style.background=ds===difficulty?'#3b82f6':'#374151';});
  };
  pokerDiffRow.appendChild(b);
});
document.body.appendChild(pokerDiffRow);
if(typeof SND!=='undefined'){SND.createBtn(document.body);SND.startBGM('game');}
</script>
</body>
</html>
