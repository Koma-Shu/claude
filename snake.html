    /* ヘルプ */
    #lang-btn { position: fixed; top: 14px; left: 14px; background: #1e1e2e; border: 1px solid #444; border-radius: 6px; color: #888; font-family: 'Courier New', monospace; font-size: .72rem; padding: 5px 10px; cursor: pointer; z-index: 10; }

    #help-panel { display: none; position: fixed; top: 44px; right: 14px; background: #13131f; border: 1px solid #333; border-radius: 8px; padding: 14px 16px; z-index: 10; min-width: 190px; }

<script>
// ============================================================
// Supabase 設定（セットアップ後にここを更新してください）

const SUPABASE_URL  = 'https://qveznkwqfjjtjxqxdyls.supabase.co';

// ============================================================

const GAME = 'snake';

// ── i18n ─────────────────────────────────────────────────────
const LANG={

    dialogPrefix:'Score ', dialogSuffix:' — register to leaderboard?',namePlaceholder:'Name (optional)',
    submitScore:'Submit',skip:'Skip',sending:'Sending...',sendFail:'Send failed. Please try again.',

let lang=localStorage.getItem('lang')||'ja';
function T(k){return(LANG[lang]||LANG.ja)[k]||k;}
function applyLang(){
  document.getElementById('lang-btn').textContent=lang==='ja'?'EN':'JA';
  document.documentElement.lang=lang;
  document.getElementById('lbl-score').textContent=T('score');
  document.getElementById('lbl-hi').textContent=T('hi');
  document.getElementById('lbl-gb').textContent=T('gb');
  document.getElementById('m2p').textContent=T('m2p');
  document.getElementById('help-toggle').textContent=T('helpToggle');

  document.getElementById('submit-rating').textContent=T('submitRating');
  document.getElementById('player-name-input').placeholder=T('namePlaceholder');
  document.getElementById('btn-submit-score').textContent=T('submitScore');
  document.getElementById('btn-skip-score').textContent=T('skip');
  if(!running) document.getElementById('message').textContent=gameMode==='2p'?T('msg2pStart'):T('msgStart');

document.getElementById('lang-btn').addEventListener('click',()=>{
  lang=lang==='ja'?'en':'ja';localStorage.setItem('lang',lang);applyLang();
});

async function sbFetch(path, options = {}) {
  const res = await fetch(SUPABASE_URL + path, {
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal',
      ...options.headers
    },
    ...options
  });
  if (!res.ok && res.status !== 201) throw new Error(await res.text());
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function loadLeaderboard() {
  if (!SUPABASE_READY) { document.getElementById('leaderboard-list').innerHTML = '<div class="lb-empty">—</div>'; return; }
  try {
    const data = await sbFetch(`/rest/v1/scores?game=eq.${GAME}&order=score.desc&limit=10&select=score,player_name`);
    const el = document.getElementById('leaderboard-list');
    if (!data || !data.length) { el.innerHTML = `<div class="lb-empty">${T('noScores')}</div>`; return; }
    const medals = ['gold','silver','bronze'];
    el.innerHTML = data.map((r,i) => `
      <div class="lb-row">
        <span class="lb-rank ${medals[i]||''}">${i+1}</span>
        <span class="lb-name">${(r.player_name||'Anonymous').replace(/</g,'&lt;')}</span>
        <span class="lb-score">${r.score}</span>
      </div>`).join('');
    // グローバルベスト
    if (data[0]) {
      document.getElementById('gb-score').textContent = data[0].score;
      document.getElementById('gb-name').textContent = '(' + (data[0].player_name || 'Anonymous') + ')';
    }
  } catch(e) { console.error(e); }
}

async function submitScore(score, playerName) {
  if (!SUPABASE_READY) return;
  await sbFetch('/rest/v1/scores', {
    method: 'POST',
    body: JSON.stringify({ game: GAME, score, player_name: playerName || 'Anonymous' })
  });
  loadLeaderboard();
}

async function loadRatings() {
  if (!SUPABASE_READY) { renderLocalRatings(); return; }
  try {
    const data = await sbFetch(`/rest/v1/ratings?game=eq.${GAME}&order=created_at.desc&limit=20&select=stars,comment,created_at`);
    renderRatings(data || []);
    updateAvgBadge(data || []);
  } catch(e) { renderLocalRatings(); }
}

async function submitRating(stars, comment) {
  if (!SUPABASE_READY) {
    const list = JSON.parse(localStorage.getItem('ratings_'+GAME)||'[]');
    list.unshift({stars,comment,created_at:new Date().toISOString()});
    localStorage.setItem('ratings_'+GAME,JSON.stringify(list));
    renderLocalRatings();
    return;
  }
  await sbFetch('/rest/v1/ratings', {
    method: 'POST',
    body: JSON.stringify({ game: GAME, stars, comment })
  });
  loadRatings();
}

function renderLocalRatings() {
  const list = JSON.parse(localStorage.getItem('ratings_'+GAME)||'[]');
  renderRatings(list.map(r => ({...r, created_at: r.created_at || new Date().toISOString()})));
  updateAvgBadge(list);
}

function renderRatings(list) {
  const el = document.getElementById('ratings-list');
  if (!list.length) { el.innerHTML = `<div class="lb-empty">${T('noRatings')}</div>`; return; }
  el.innerHTML = list.map(r => {
    const d = new Date(r.created_at).toLocaleDateString('ja-JP');
    return `<div class="rating-item">
      <span class="rating-stars">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)}</span>
      <span class="rating-date">${d}</span>
      ${r.comment ? `<p class="rating-comment">${r.comment.replace(/</g,'&lt;')}</p>` : ''}
    </div>`;
  }).join('');
}

function updateAvgBadge(list) {
  const el = document.getElementById('avg-display');
  if (!list.length) { el.textContent = ''; return; }
  const avg = (list.reduce((s,r)=>s+r.stars,0)/list.length).toFixed(1);
  el.innerHTML = `<span>${'★'.repeat(Math.round(avg))}</span> ${avg} (${list.length}${T('ratingCount')})`;
}

// ゲームロジック
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const COLS = 20, ROWS = 20;
let CELL, W, H;

function resizeCanvas() {
  const maxW = Math.min(window.innerWidth - 20, 420);
  CELL = Math.floor(maxW / COLS); W = CELL * COLS; H = CELL * ROWS;
  canvas.width = W; canvas.height = H;
}
resizeCanvas();
window.addEventListener('resize', () => { resizeCanvas(); if (!running) draw(); });

let snake, dir, next, food, score, hiScore = 0, running = false, loop;
let snake2, dir2, next2, score2;
let gameMode = '1p'; // '1p' | '2p'

function init() {
  snake = [{x:5,y:10},{x:4,y:10},{x:3,y:10}];
  dir = {x:1,y:0}; next = {x:1,y:0};
  score = 0;
  if (gameMode === '2p') {
    snake2 = [{x:14,y:10},{x:15,y:10},{x:16,y:10}];
    dir2 = {x:-1,y:0}; next2 = {x:-1,y:0};
    score2 = 0;
    document.getElementById('p2-info').style.display='block';
    document.getElementById('score2').textContent = 0;
  } else {
    snake2 = null;
    document.getElementById('p2-info').style.display='none';
  }
  placeFood();
  document.getElementById('score').textContent = 0;
}

function placeFood() {
  let pos, tries=0;
  do {
    pos = {x:Math.floor(Math.random()*COLS), y:Math.floor(Math.random()*ROWS)};
    tries++;
  } while (tries<200 && (snake.some(s=>s.x===pos.x&&s.y===pos.y) || (snake2&&snake2.some(s=>s.x===pos.x&&s.y===pos.y))));
  food = pos;
}

function step() {
  if (gameMode === '2p') { step2p(); return; }
  dir = next;
  const head = {x: snake[0].x+dir.x, y: snake[0].y+dir.y};
  if (head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS||snake.some(s=>s.x===head.x&&s.y===head.y)) {
    gameOver(); return;
  }
  snake.unshift(head);
  if (head.x===food.x&&head.y===food.y) {
    score++;
    document.getElementById('score').textContent = score;
    if (score > hiScore) { hiScore = score; document.getElementById('hi').textContent = hiScore; }
    placeFood();
  } else { snake.pop(); }
  draw();
}

function step2p() {
  dir = next; dir2 = next2;
  const h1 = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};
  const h2 = {x:snake2[0].x+dir2.x, y:snake2[0].y+dir2.y};
  const dead1 = h1.x<0||h1.x>=COLS||h1.y<0||h1.y>=ROWS||snake.some(s=>s.x===h1.x&&s.y===h1.y)||snake2.some(s=>s.x===h1.x&&s.y===h1.y);
  const dead2 = h2.x<0||h2.x>=COLS||h2.y<0||h2.y>=ROWS||snake2.some(s=>s.x===h2.x&&s.y===h2.y)||snake.some(s=>s.x===h2.x&&s.y===h2.y);
  if (dead1||dead2) { gameOver2p(dead1,dead2); return; }
  snake.unshift(h1); snake2.unshift(h2);
  let ate1=h1.x===food.x&&h1.y===food.y, ate2=h2.x===food.x&&h2.y===food.y;
  if (ate1) { score++; document.getElementById('score').textContent=score; }
  else snake.pop();
  if (ate2) { score2++; document.getElementById('score2').textContent=score2; }
  else snake2.pop();
  if (ate1||ate2) placeFood();
  draw();
}

function draw() {
  ctx.fillStyle = '#0f0f1a'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.lineWidth = 0.5;
  for(let i=0;i<=COLS;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,H);ctx.stroke();}
  for(let j=0;j<=ROWS;j++){ctx.beginPath();ctx.moveTo(0,j*CELL);ctx.lineTo(W,j*CELL);ctx.stroke();}
  ctx.fillStyle='#ff6b6b'; ctx.shadowColor='#ff6b6b'; ctx.shadowBlur=10;
  ctx.fillRect(food.x*CELL+2,food.y*CELL+2,CELL-4,CELL-4); ctx.shadowBlur=0;
  // P1 snake (teal)
  snake.forEach((seg,i) => {
    const ratio = 1-i/snake.length;
    ctx.fillStyle=`rgba(0,${Math.floor(180+75*ratio)},${Math.floor(100+110*ratio)},1)`;
    ctx.shadowColor=i===0?'#00d4aa':'transparent'; ctx.shadowBlur=i===0?8:0;
    ctx.fillRect(seg.x*CELL+1,seg.y*CELL+1,CELL-2,CELL-2);
  });
  // P2 snake (orange) in 2P mode
  if (snake2) {
    snake2.forEach((seg,i) => {
      const ratio = 1-i/snake2.length;
      ctx.fillStyle=`rgba(${Math.floor(200+55*ratio)},${Math.floor(100+40*ratio)},0,1)`;
      ctx.shadowColor=i===0?'#ff8c00':'transparent'; ctx.shadowBlur=i===0?8:0;
      ctx.fillRect(seg.x*CELL+1,seg.y*CELL+1,CELL-2,CELL-2);
    });
  }
  ctx.shadowBlur=0;
}

function gameOver() {
  clearInterval(loop); running=false;
  ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ff6b6b'; ctx.font=`bold ${CELL}px Courier New`; ctx.textAlign='center';
  ctx.fillText('GAME OVER',W/2,H/2-10);
  ctx.fillStyle='#aaa'; ctx.font=`${CELL*0.6}px Courier New`;
  ctx.fillText(T('goRestart'),W/2,H/2+CELL);
  document.getElementById('message').textContent='';
  if (score > 0) showScoreDialog(score);
}

function gameOver2p(dead1, dead2) {
  clearInterval(loop); running=false;
  ctx.fillStyle='rgba(0,0,0,0.65)'; ctx.fillRect(0,0,W,H);
  let msg;
  if (dead1&&dead2) msg=T('draw');
  else if (dead1) msg=T('p2win');
  else msg=T('p1win');
  ctx.fillStyle=dead1&&dead2?'#aaa':dead2?'#00d4aa':'#ff8c00';
  ctx.font=`bold ${CELL}px Courier New`; ctx.textAlign='center';
  ctx.fillText(msg,W/2,H/2-10);
  ctx.fillStyle='#666'; ctx.font=`${CELL*0.55}px Courier New`;
  ctx.fillText(`P1:${score}  P2:${score2}`,W/2,H/2+CELL*0.9);
  ctx.fillStyle='#444'; ctx.font=`${CELL*0.5}px Courier New`;
  ctx.fillText(T('goSpaceRestart'),W/2,H/2+CELL*1.9);
  document.getElementById('message').textContent='';
}

function showScoreDialog(s) {
  document.getElementById('dialog-score-val').textContent = s;
  document.getElementById('dialog-msg').innerHTML = T('dialogPrefix')+'<b style="color:#00d4aa">'+s+'</b>'+T('dialogSuffix');
  document.getElementById('player-name-input').value = localStorage.getItem('playerName') || '';
  document.getElementById('score-dialog').classList.add('open');
}

document.getElementById('btn-submit-score').addEventListener('click', async () => {
  const name = document.getElementById('player-name-input').value.trim() || 'Anonymous';
  localStorage.setItem('playerName', name);
  document.getElementById('score-dialog').classList.remove('open');
  await submitScore(score, name);
});
document.getElementById('btn-skip-score').addEventListener('click', () => {
  document.getElementById('score-dialog').classList.remove('open');
});

function start() {
  if (running) return;
  document.getElementById('score-dialog').classList.remove('open');
  init(); draw(); running=true;
  document.getElementById('message').textContent = gameMode==='2p' ? T('msg2pPlay') : T('msg1p');
  loop = setInterval(step, 130);
}

document.addEventListener('keydown', e => {
  if (e.code==='Space'){start();return;}
  if (gameMode==='2p') {
    const wm={w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0}};
    const wd=wm[e.key]; if(wd&&!(wd.x===-dir.x&&wd.y===-dir.y)){next=wd;e.preventDefault();return;}
    const am={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}};
    const ad=am[e.key]; if(ad&&!(ad.x===-dir2.x&&ad.y===-dir2.y)){next2=ad;e.preventDefault();}
  } else {
    const map={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}};
    const d=map[e.key]; if(d&&!(d.x===-dir.x&&d.y===-dir.y)){next=d;e.preventDefault();}
  }
});

// Mode buttons
document.getElementById('m1p').addEventListener('click',()=>{
  gameMode='1p'; running=false; clearInterval(loop);
  document.getElementById('m1p').classList.add('active');
  document.getElementById('m2p').classList.remove('active');
  document.getElementById('global-best').style.display='';
  document.getElementById('bottom-section').style.display='';
  document.getElementById('dpad').style.display='grid';
  init(); draw(); document.getElementById('message').textContent=T('msgStart');
});
document.getElementById('m2p').addEventListener('click',()=>{
  gameMode='2p'; running=false; clearInterval(loop);
  document.getElementById('m2p').classList.add('active');
  document.getElementById('m1p').classList.remove('active');
  document.getElementById('global-best').style.display='none';
  document.getElementById('bottom-section').style.display='none';
  document.getElementById('dpad').style.display='none';
  init(); draw(); document.getElementById('message').textContent=T('msg2pStart');
});
canvas.addEventListener('touchend', e=>{e.preventDefault();start();},{passive:false});

function setDir(dx,dy){ if(!(dx===-dir.x&&dy===-dir.y)) next={x:dx,y:dy}; start(); }
document.getElementById('dpad-up').addEventListener('touchstart',    e=>{e.preventDefault();setDir(0,-1);},{passive:false});
document.getElementById('dpad-down').addEventListener('touchstart',  e=>{e.preventDefault();setDir(0,1);},{passive:false});
document.getElementById('dpad-left').addEventListener('touchstart',  e=>{e.preventDefault();setDir(-1,0);},{passive:false});
document.getElementById('dpad-right').addEventListener('touchstart', e=>{e.preventDefault();setDir(1,0);},{passive:false});
document.getElementById('dpad-up').addEventListener('click',    ()=>setDir(0,-1));
document.getElementById('dpad-down').addEventListener('click',  ()=>setDir(0,1));
document.getElementById('dpad-left').addEventListener('click',  ()=>setDir(-1,0));
document.getElementById('dpad-right').addEventListener('click', ()=>setDir(1,0));

document.getElementById('help-toggle').addEventListener('click',()=>document.getElementById('help-panel').classList.toggle('open'));

// 評価フォーム
let selectedStars = 0;
document.getElementById('rating-toggle').addEventListener('click',()=>document.getElementById('rating-form').classList.toggle('open'));
document.querySelectorAll('.star').forEach(s=>{
  s.addEventListener('click',()=>{
    selectedStars=parseInt(s.dataset.v);
    document.querySelectorAll('.star').forEach((st,i)=>st.classList.toggle('active',i<selectedStars));
  });
});
document.getElementById('submit-rating').addEventListener('click', async ()=>{
  if(!selectedStars){alert(T('starAlert'));return;}
  const statusEl = document.getElementById('rating-status');
  statusEl.textContent=T('sending');
  try {
    await submitRating(selectedStars, document.getElementById('comment-input').value.trim());
    selectedStars=0;
    document.querySelectorAll('.star').forEach(s=>s.classList.remove('active'));
    document.getElementById('comment-input').value='';
    document.getElementById('rating-form').classList.remove('open');
    statusEl.textContent='';
  } catch(e) { statusEl.textContent=T('sendFail'); }
});

applyLang();
loadLeaderboard();
loadRatings();
init(); draw();
</script>
