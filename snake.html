<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Snake Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Courier New', monospace;
      color: #e0e0e0;
    }
    h1 { font-size: 2rem; margin-bottom: 10px; color: #00d4aa; letter-spacing: 4px; }
    #info {
      display: flex;
      gap: 40px;
      margin-bottom: 14px;
      font-size: 1.1rem;
    }
    #info span { color: #00d4aa; font-weight: bold; }
    canvas {
      border: 2px solid #00d4aa;
      box-shadow: 0 0 20px rgba(0, 212, 170, 0.4);
    }
    #message {
      margin-top: 16px;
      font-size: 1rem;
      color: #aaa;
      height: 1.2em;
    }
    .back { margin-top: 20px; font-size: 0.75rem; color: #444; text-decoration: none; letter-spacing: 2px; }
    .back:hover { color: #888; }
  </style>
</head>
<body>
  <h1>SNAKE</h1>
  <div id="info">
    スコア: <span id="score">0</span>
    &nbsp;&nbsp;ハイスコア: <span id="hi">0</span>
  </div>
  <canvas id="c" width="400" height="400"></canvas>
  <div id="message">スペースキーでスタート</div>
  <a href="index.html" class="back">← ARCADE</a>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const CELL = 20, COLS = 20, ROWS = 20;

let snake, dir, next, food, score, hiScore = 0, running = false, loop;

function init() {
  snake = [{x:10, y:10}, {x:9, y:10}, {x:8, y:10}];
  dir = {x:1, y:0};
  next = {x:1, y:0};
  score = 0;
  placeFood();
  document.getElementById('score').textContent = 0;
}

function placeFood() {
  let pos;
  do {
    pos = {x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS)};
  } while (snake.some(s => s.x===pos.x && s.y===pos.y));
  food = pos;
}

function step() {
  dir = next;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS ||
      snake.some(s => s.x===head.x && s.y===head.y)) {
    gameOver();
    return;
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    document.getElementById('score').textContent = score;
    if (score > hiScore) {
      hiScore = score;
      document.getElementById('hi').textContent = hiScore;
    }
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.fillStyle = '#0f0f1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= COLS; i++) {
    ctx.beginPath(); ctx.moveTo(i*CELL, 0); ctx.lineTo(i*CELL, canvas.height); ctx.stroke();
  }
  for (let j = 0; j <= ROWS; j++) {
    ctx.beginPath(); ctx.moveTo(0, j*CELL); ctx.lineTo(canvas.width, j*CELL); ctx.stroke();
  }
  ctx.fillStyle = '#ff6b6b';
  ctx.shadowColor = '#ff6b6b';
  ctx.shadowBlur = 10;
  ctx.fillRect(food.x*CELL+2, food.y*CELL+2, CELL-4, CELL-4);
  ctx.shadowBlur = 0;
  snake.forEach((seg, i) => {
    const ratio = 1 - i / snake.length;
    ctx.fillStyle = `rgba(0, ${Math.floor(180 + 75*ratio)}, ${Math.floor(100 + 110*ratio)}, 1)`;
    ctx.shadowColor = i === 0 ? '#00d4aa' : 'transparent';
    ctx.shadowBlur = i === 0 ? 8 : 0;
    ctx.fillRect(seg.x*CELL+1, seg.y*CELL+1, CELL-2, CELL-2);
  });
  ctx.shadowBlur = 0;
}

function gameOver() {
  clearInterval(loop);
  running = false;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#ff6b6b';
  ctx.font = 'bold 2rem Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2 - 10);
  ctx.fillStyle = '#aaa';
  ctx.font = '1rem Courier New';
  ctx.fillText('スペースキーでリスタート', canvas.width/2, canvas.height/2 + 24);
  document.getElementById('message').textContent = '';
}

function start() {
  if (running) return;
  init();
  draw();
  running = true;
  document.getElementById('message').textContent = '矢印キーで操作';
  loop = setInterval(step, 120);
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space') { start(); return; }
  const map = {
    ArrowUp:    {x:0, y:-1},
    ArrowDown:  {x:0, y:1},
    ArrowLeft:  {x:-1, y:0},
    ArrowRight: {x:1, y:0},
  };
  const d = map[e.key];
  if (d && !(d.x === -dir.x && d.y === -dir.y)) {
    next = d;
    e.preventDefault();
  }
});

init();
draw();
</script>
</body>
</html>
