<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大富豪</title>
<script src="sound.js"></script>
<script src="cards.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:radial-gradient(circle at 50% 28%,#3a1a4c,#1a0a28);min-height:100vh;
    font-family:'Hiragino Sans','Meiryo','Segoe UI',sans-serif;color:#f4eaff;
    display:flex;flex-direction:column;align-items:center;padding:46px 8px 20px;--cw:48px;--ch:68px;}
  h1{font-size:1.3rem;letter-spacing:4px;color:#e0a0ff;margin-bottom:6px;}
  .cpus{display:flex;gap:12px;margin-bottom:10px;flex-wrap:wrap;justify-content:center;}
  .cpu{background:rgba(0,0,0,.3);border-radius:10px;padding:6px 14px;font-size:.8rem;text-align:center;min-width:78px;}
  .cpu.act{outline:2px solid #e0a0ff;}.cpu .n{font-weight:bold;}
  .field{min-height:calc(var(--ch) + 20px);display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:6px;background:rgba(0,0,0,.22);border-radius:12px;padding:12px 20px;margin-bottom:8px;min-width:200px;}
  .field-cards{display:flex;gap:6px;}
  .field-lbl{font-size:.72rem;opacity:.7;}
  .turn{font-size:.88rem;margin:6px 0;min-height:20px;text-align:center;}
  .myhand{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:820px;margin-top:6px;}
  .controls{margin-top:12px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  button{font-family:inherit;font-size:.9rem;font-weight:bold;border:none;border-radius:9px;padding:10px 22px;cursor:pointer;}
  button:disabled{opacity:.4;cursor:default;}
  .b-play{background:#10b981;color:#fff;}.b-pass{background:#ef4444;color:#fff;}.b-new{background:#e0a0ff;color:#222;}
  .topbtn{position:fixed;top:12px;left:12px;background:#374151;color:#fff;border-radius:8px;padding:7px 14px;font-size:.8rem;cursor:pointer;border:none;}
  .win-msg{font-size:1.1rem;font-weight:bold;margin-top:12px;text-align:center;}
  .rank-list{font-size:.8rem;opacity:.85;margin-top:4px;text-align:center;}
  .badge8{color:#ffe27a;font-size:.78rem;font-weight:bold;}
</style>
</head>
<body>
<button class="topbtn" id="backbtn" onclick="location.href='index.html'">戻る</button>
<h1 id="title">大富豪</h1>
<div class="cpus" id="cpus"></div>
<div class="field" id="field"></div>
<div class="turn" id="turn"></div>
<div class="myhand" id="myhand"></div>
<div class="win-msg" id="winmsg"></div>
<div class="rank-list" id="ranklist"></div>
<div class="controls">
  <button class="b-play" id="playbtn"></button>
  <button class="b-pass" id="passbtn"></button>
  <button class="b-new" id="newbtn"></button>
</div>

<script>
const L={
  title:{ja:'大富豪',en:'Daifugo'},you:{ja:'あなた',en:'You'},
  yourturn:{ja:'あなたの番 — カードを選んで出す',en:'Your turn — pick cards & play'},
  cputurn:{ja:'の番…',en:'\'s turn…'},play:{ja:'出す',en:'Play'},pass:{ja:'パス',en:'Pass'},
  newgame:{ja:'新しいゲーム',en:'New Game'},empty:{ja:'場は空 — 何でも出せる',en:'Field empty — play anything'},
  fieldlbl:{ja:'場のカード',en:'Field'},cut8:{ja:'8切り！',en:'8 cut!'},
  cards:{ja:'枚',en:''},finished:{ja:'ゲーム終了',en:'Game Over'},
  daifugo:{ja:'大富豪',en:'1st'},fugo:{ja:'富豪',en:'2nd'},hinmin:{ja:'貧民',en:'3rd'},daihinmin:{ja:'大貧民',en:'4th'},
  back:{ja:'戻る',en:'Back'},
};
let lang=localStorage.getItem('lang')||'ja';
const t=k=>(L[k]&&L[k][lang])||k;
const C=window.CARDS,$=id=>document.getElementById(id);
const NP=4;
let hands,field,turn,lastPlayer,passed,finishOrder,gameOver,selected,cut8flash;

// strength: 3..K (value 3..13)=>0..10, A(1)=>11, 2(2)=>12
function strength(v){return v===1?11:(v===2?12:v-3);}

function setup(){
  const deck=C.shuffle(C.makeDeck());
  hands=[[],[],[],[]];
  deck.forEach((c,i)=>hands[i%NP].push(c));
  hands.forEach(sortHand);
  field=null;lastPlayer=-1;passed=[false,false,false,false];finishOrder=[];gameOver=false;selected=new Set();cut8flash=0;
  // start: holder of D3 (lowest)
  turn=hands.findIndex(h=>h.some(c=>c.id==='D3'));if(turn<0)turn=0;
  $('winmsg').textContent='';$('ranklist').textContent='';
  render();
  if(turn!==0)setTimeout(cpuTurn,700);
}
function sortHand(h){h.sort((a,b)=>strength(a.value)-strength(b.value)||a.suit.localeCompare(b.suit));}

function render(){
  $('title').textContent=t('title');$('newbtn').textContent=t('newgame');$('backbtn').textContent=t('back');
  $('playbtn').textContent=t('play');$('passbtn').textContent=t('pass');
  const cE=$('cpus');cE.innerHTML='';
  for(let p=1;p<NP;p++){
    const d=document.createElement('div');d.className='cpu'+(turn===p&&!gameOver?' act':'');
    let st=`${hands[p].length}枚`;
    const fi=finishOrder.indexOf(p);
    if(fi>=0)st=rankName(fi);
    if(passed[p]&&turn!==p&&fi<0)st+=' ✋';
    d.innerHTML=`<div class="n">CPU ${p}</div><div>${st}</div>`;
    cE.appendChild(d);
  }
  const f=$('field');f.innerHTML='';
  const lbl=document.createElement('div');lbl.className='field-lbl';
  if(cut8flash>0){lbl.innerHTML=`<span class="badge8">${t('cut8')}</span>`;}
  else lbl.textContent=field?t('fieldlbl'):t('empty');
  f.appendChild(lbl);
  if(field){
    const fc=document.createElement('div');fc.className='field-cards';
    field.cards.forEach(c=>fc.appendChild(C.cardEl(c,true)));
    f.appendChild(fc);
  }
  $('turn').textContent=gameOver?t('finished'):(turn===0?t('yourturn'):`CPU ${turn}${t('cputurn')}`);
  const mh=$('myhand');mh.innerHTML='';
  hands[0].forEach(c=>{
    const el=C.cardEl(c,true);
    if(turn===0&&!gameOver){el.classList.add('playable');
      if(selected.has(c.id))el.classList.add('sel');
      el.onclick=()=>{selected.has(c.id)?selected.delete(c.id):selected.add(c.id);render();};}
    mh.appendChild(el);
  });
  const sel=[...selected].map(id=>hands[0].find(c=>c.id===id)).filter(Boolean);
  $('playbtn').disabled=!(turn===0&&!gameOver&&validPlay(sel));
  $('passbtn').disabled=!(turn===0&&!gameOver&&field!==null);
}
function rankName(i){return [t('daifugo'),t('fugo'),t('hinmin'),t('daihinmin')][i];}

// valid: all same rank, count matches field (or any if field empty), strength greater
function validPlay(cards){
  if(!cards.length)return false;
  const v=cards[0].value;
  if(!cards.every(c=>c.value===v))return false;
  if(field){
    if(cards.length!==field.count)return false;
    return strength(v)>field.strength;
  }
  return true;
}

function doPlay(p,cards){
  const ids=new Set(cards.map(c=>c.id));
  hands[p]=hands[p].filter(c=>!ids.has(c.id));
  field={cards:cards.slice(),count:cards.length,strength:strength(cards[0].value),val:cards[0].value};
  lastPlayer=p;
  SND.sfx.discard&&SND.sfx.discard();
  const is8=cards.some(c=>c.value===8);
  if(p===0)selected.clear();
  // finished?
  if(hands[p].length===0){finishOrder.push(p);SND.sfx.pointWin&&SND.sfx.pointWin();}
  if(is8){
    // 8-cut: clear field, same player leads again (if still in)
    cut8flash=1;field=null;passed=[false,false,false,false];SND.sfx.coin&&SND.sfx.coin();
    render();
    if(checkEnd())return;
    if(finishOrder.includes(p)){ advanceFrom(p); } // finished on the 8 → next leads
    else { turn=p; render(); if(turn!==0)setTimeout(cpuTurn,800); }
    return;
  }
  if(checkEnd())return;
  advanceFrom(p);
}
function doPass(p){
  passed[p]=true;SND.sfx.click&&SND.sfx.click();
  advanceFrom(p);
}
function activePlayers(){const a=[];for(let p=0;p<NP;p++)if(!finishOrder.includes(p))a.push(p);return a;}
function advanceFrom(p){
  cut8flash=0;
  if(checkEnd())return;
  // find next active player
  let nt=p;
  for(let i=0;i<NP;i++){nt=(nt+1)%NP;if(!finishOrder.includes(nt))break;}
  // Does field clear? It clears when everyone except lastPlayer has passed (or finished).
  if(field){
    const act=activePlayers().filter(x=>x!==lastPlayer);
    const allPassed=act.every(x=>passed[x]);
    if(allPassed||lastPlayer===nt){
      // clear field; lastPlayer leads (if active) else next active
      field=null;passed=[false,false,false,false];
      let leader=lastPlayer;
      if(finishOrder.includes(leader)){for(let i=0;i<NP;i++){leader=(leader+1)%NP;if(!finishOrder.includes(leader))break;}}
      turn=leader;render();
      if(turn!==0)setTimeout(cpuTurn,800);else if(turn===0){}
      return;
    }
  }
  // skip players who already passed (in current field round)
  while(passed[nt]&&!finishOrder.includes(nt)){nt=(nt+1)%NP;}
  turn=nt;render();
  if(turn!==0)setTimeout(cpuTurn,750);
}
function checkEnd(){
  if(activePlayers().length<=1){
    activePlayers().forEach(p=>finishOrder.push(p));
    endGame();return true;
  }
  return false;
}
function cpuTurn(){
  if(gameOver||turn===0||finishOrder.includes(turn))return;
  const p=turn;
  const plays=enumeratePlays(hands[p]);
  if(plays.length===0){doPass(p);return;}
  // play the weakest valid combo; prefer dumping larger groups when field empty late
  plays.sort((a,b)=>a[0].length-b[0].length||strength(a[0][0].value)-strength(b[0][0].value));
  let choice;
  if(!field){
    // lead with weakest single normally, but dump pairs/triples sometimes
    choice=plays[0][0];
  }else{
    // play weakest that beats field
    choice=plays[0][0];
    // strategic: if only slightly stronger and holding few cards, ok
  }
  doPlay(p,choice);
}
// enumerate legal plays for a hand against current field
function enumeratePlays(hand){
  const byVal={};hand.forEach(c=>{(byVal[c.value]=byVal[c.value]||[]).push(c);});
  const res=[];
  for(const v in byVal){
    const group=byVal[v];
    if(field){
      if(group.length>=field.count && strength(+v)>field.strength){
        res.push([group.slice(0,field.count)]);
      }
    }else{
      // can play 1..group.length of same rank
      for(let n=1;n<=group.length;n++)res.push([group.slice(0,n)]);
    }
  }
  return res;
}
function endGame(){
  gameOver=true;SND.stopBGM&&SND.stopBGM();
  for(let p=0;p<NP;p++)if(!finishOrder.includes(p))finishOrder.push(p);
  const myRank=finishOrder.indexOf(0);
  const m=$('winmsg');
  if(myRank===0){m.textContent='🏆 '+t('daifugo')+'！';m.style.color='#7dffb0';SND.sfx.win&&SND.sfx.win();}
  else{m.textContent=`${t('you')}: ${rankName(myRank)}`;m.style.color=myRank<=1?'#ffe27a':'#ff9090';
    (myRank<=1?SND.sfx.point:SND.sfx.lose)&&(myRank<=1?SND.sfx.point():SND.sfx.lose());}
  $('ranklist').textContent=finishOrder.map((p,i)=>`${rankName(i)}: ${p===0?t('you'):'CPU '+p}`).join('   ');
  render();
}
$('playbtn').onclick=()=>{
  const sel=[...selected].map(id=>hands[0].find(c=>c.id===id)).filter(Boolean);
  if(validPlay(sel))doPlay(0,sel);
};
$('passbtn').onclick=()=>{if(turn===0&&field)doPass(0);};
$('newbtn').onclick=()=>{SND.startBGM&&SND.startBGM('game');setup();};

setup();
if(typeof SND!=='undefined'){SND.createBtn(document.body);SND.startBGM('game');}
</script>
</body>
</html>
