<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大富豪</title>
<script src="netplay.js"></script>
<script src="sound.js"></script>
<script src="track.js"></script>
<script src="cards.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:radial-gradient(circle at 50% 28%,#3a1a4c,#1a0a28);min-height:100vh;
    font-family:'Hiragino Sans','Meiryo','Segoe UI',sans-serif;color:#f4eaff;
    display:flex;flex-direction:column;align-items:center;padding:46px 8px 20px;--cw:48px;--ch:68px;}
  h1{font-size:1.3rem;letter-spacing:4px;color:#e0a0ff;margin-bottom:6px;}
  .cpus{display:flex;gap:12px;margin-bottom:10px;flex-wrap:wrap;justify-content:center;}
  .cpu{background:rgba(0,0,0,.3);border-radius:10px;padding:6px 14px;font-size:.8rem;text-align:center;min-width:78px;}
  .cpu.act{outline:2px solid #e0a0ff;}.cpu .n{font-weight:bold;}
  .field{min-height:calc(var(--ch) + 20px);display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:6px;background:rgba(0,0,0,.22);border-radius:12px;padding:12px 20px;margin-bottom:8px;min-width:200px;}
  .field-cards{display:flex;gap:6px;}
  .field-lbl{font-size:.72rem;opacity:.7;}
  .turn{font-size:.88rem;margin:6px 0;min-height:20px;text-align:center;}
  .myhand{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:820px;margin-top:6px;}
  .controls{margin-top:12px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  button{font-family:inherit;font-size:.9rem;font-weight:bold;border:none;border-radius:9px;padding:10px 22px;cursor:pointer;}
  button:disabled{opacity:.4;cursor:default;}
  .b-play{background:#10b981;color:#fff;}.b-pass{background:#ef4444;color:#fff;}.b-new{background:#e0a0ff;color:#222;}
  .topbtn{position:fixed;top:12px;left:12px;background:#374151;color:#fff;border-radius:8px;padding:7px 14px;font-size:.8rem;cursor:pointer;border:none;}
  .win-msg{font-size:1.1rem;font-weight:bold;margin-top:12px;text-align:center;}
  .rank-list{font-size:.8rem;opacity:.85;margin-top:4px;text-align:center;}
  .badge8{color:#ffe27a;font-size:.78rem;font-weight:bold;}
</style>
</head>
<body>
<button class="topbtn" id="backbtn" onclick="location.href='arcade.html'">戻る</button>
<h1 id="title">大富豪</h1>
<div class="cpus" id="cpus"></div>
<div class="field" id="field"></div>
<div class="turn" id="turn"></div>
<div class="myhand" id="myhand"></div>
<div class="win-msg" id="winmsg"></div>
<div class="rank-list" id="ranklist"></div>
<div class="controls">
  <button class="b-play" id="playbtn"></button>
  <button class="b-pass" id="passbtn"></button>
  <button class="b-new" id="newbtn"></button>
</div>

<script>
const L={
  title:{ja:'大富豪',en:'Daifugo'},you:{ja:'あなた',en:'You'},
  yourturn:{ja:'あなたの番 — カードを選んで出す',en:'Your turn — pick cards & play'},
  cputurn:{ja:'の番…',en:'\'s turn…'},play:{ja:'出す',en:'Play'},pass:{ja:'パス',en:'Pass'},
  newgame:{ja:'新しいゲーム',en:'New Game'},empty:{ja:'場は空 — 何でも出せる',en:'Field empty — play anything'},
  fieldlbl:{ja:'場のカード',en:'Field'},cut8:{ja:'8切り！',en:'8 cut!'},
  cards:{ja:'枚',en:''},finished:{ja:'ゲーム終了',en:'Game Over'},
  daifugo:{ja:'大富豪',en:'1st'},fugo:{ja:'富豪',en:'2nd'},hinmin:{ja:'貧民',en:'3rd'},daihinmin:{ja:'大貧民',en:'4th'},
  back:{ja:'戻る',en:'Back'},
  p2:{ja:'P2',en:'P2'}, opponent:{ja:'相手',en:'Opponent'},
  online:{ja:'オンライン',en:'Online'}, local2p:{ja:'ローカル2P',en:'Local 2P'},
  players:{ja:'人数',en:'Players'}, leave:{ja:'退出',en:'Leave'},
  waiting:{ja:'相手の番…',en:'Opponent\'s turn…'},
  easy:{ja:'弱',en:'Easy'},normal:{ja:'普通',en:'Normal'},hard:{ja:'強',en:'Hard'},diff:{ja:'難易度',en:'Difficulty'},
};
let lang=localStorage.getItem('lang')||'ja';
const t=k=>(L[k]&&L[k][lang])||k;
const C=window.CARDS,$=id=>document.getElementById(id);

let np=parseInt(localStorage.getItem('daifugo_np'))||4;
let difficulty=localStorage.getItem('daifugo_diff')||'medium';
if(difficulty==='normal')difficulty='medium'; // legacy value from old button bug
let gameMode='solo'; // 'solo' | 'local2p' | 'online'
let myIdx=0;         // my player index (0=host/solo, 1=guest)
let onlineRole=null; // 'host' | 'guest'
let roomId=null,onlineSeq=-1,sbar=null;
let trackSent=false;

let hands,field,turn,lastPlayer,passed,finishOrder,gameOver,selected,cut8flash;

// strength: 3..K (value 3..13)=>0..10, A(1)=>11, 2(2)=>12
function strength(v){return v===1?11:(v===2?12:v-3);}

function isHuman(p){
  if(gameMode==='solo')return p===myIdx;
  return p===0||p===1;
}
function playerLabel(p){
  if(p===myIdx)return t('you');
  if(gameMode==='local2p'&&p<2)return t('p2');
  if(gameMode==='online'&&p<2)return t('opponent');
  return 'CPU '+p;
}

function computeInitState(){
  const deck=C.shuffle(C.makeDeck());
  const h=Array.from({length:np},()=>[]);
  deck.forEach((c,i)=>h[i%np].push(c));
  h.forEach(sortHand);
  const tt=h.findIndex(x=>x.some(c=>c.id==='D3'));
  const seq=0;
  return {hands:h,field:null,lastPlayer:-1,passed:new Array(np).fill(false),
    finishOrder:[],gameOver:false,cut8flash:0,turn:tt>=0?tt:0,seq};
}

function setup(){
  const st=computeInitState();
  onlineSeq=st.seq;
  hands=st.hands;field=st.field;lastPlayer=st.lastPlayer;passed=st.passed;
  finishOrder=st.finishOrder;gameOver=st.gameOver;cut8flash=st.cut8flash;turn=st.turn;
  selected=new Set();trackSent=false;
  $('winmsg').textContent='';$('ranklist').textContent='';
  render();
  afterTurnChange();
}
function sortHand(h){h.sort((a,b)=>strength(a.value)-strength(b.value)||a.suit.localeCompare(b.suit));}

function render(){
  $('title').textContent=t('title');$('newbtn').textContent=t('newgame');$('backbtn').textContent=t('back');
  $('playbtn').textContent=t('play');$('passbtn').textContent=t('pass');
  const cE=$('cpus');cE.innerHTML='';
  for(let p=0;p<np;p++){
    if(p===myIdx)continue; // skip self
    const d=document.createElement('div');d.className='cpu'+(turn===p&&!gameOver?' act':'');
    const label=playerLabel(p);
    let st=`${hands[p].length}${t('cards')||'枚'}`;
    const fi=finishOrder.indexOf(p);
    if(fi>=0)st=rankName(fi);
    if(passed[p]&&turn!==p&&fi<0)st+=' ✋';
    d.innerHTML=`<div class="n">${label}</div><div>${st}</div>`;
    cE.appendChild(d);
  }
  const f=$('field');f.innerHTML='';
  const lbl=document.createElement('div');lbl.className='field-lbl';
  if(cut8flash>0){lbl.innerHTML=`<span class="badge8">${t('cut8')}</span>`;}
  else lbl.textContent=field?t('fieldlbl'):t('empty');
  f.appendChild(lbl);
  if(field){
    const fc=document.createElement('div');fc.className='field-cards';
    field.cards.forEach(c=>fc.appendChild(C.cardEl(c,true)));
    f.appendChild(fc);
  }
  // Turn indicator
  let turnTxt;
  if(gameOver){
    turnTxt=t('finished');
  }else if(turn===myIdx){
    turnTxt=t('yourturn');
  }else if(!isHuman(turn)){
    turnTxt=playerLabel(turn)+t('cputurn');
  }else{
    turnTxt=t('waiting');
  }
  $('turn').textContent=turnTxt;

  const mh=$('myhand');mh.innerHTML='';
  const myIsActive=turn===myIdx&&!gameOver&&(gameMode!=='online'||(onlineRole!=null));
  hands[myIdx].forEach(c=>{
    const el=C.cardEl(c,true);
    if(myIsActive){el.classList.add('playable');
      if(selected.has(c.id))el.classList.add('sel');
      el.onclick=()=>{selected.has(c.id)?selected.delete(c.id):selected.add(c.id);render();};}
    mh.appendChild(el);
  });
  const sel=[...selected].map(id=>hands[myIdx].find(c=>c.id===id)).filter(Boolean);
  $('playbtn').disabled=!(myIsActive&&validPlay(sel));
  $('passbtn').disabled=!(myIsActive&&field!==null);
}

function rankName(i){
  const names4=[t('daifugo'),t('fugo'),t('hinmin'),t('daihinmin')];
  if(np===4)return names4[i]||`${i+1}位`;
  return `${i+1}${lang==='ja'?'位':(['st','nd','rd'][i]||'th')}`;
}

// valid: all same rank, count matches field (or any if field empty), strength greater
function validPlay(cards){
  if(!cards.length)return false;
  const v=cards[0].value;
  if(!cards.every(c=>c.value===v))return false;
  if(field){
    if(cards.length!==field.count)return false;
    return strength(v)>field.strength;
  }
  return true;
}

function afterTurnChange(){
  render();
  if(gameOver)return;
  if(!isHuman(turn)){
    // CPU turn — host (or solo) runs it
    if(gameMode!=='online'||onlineRole==='host') setTimeout(cpuTurn,750);
    return;
  }
  if(turn===myIdx){
    // My turn — controls enabled via render()
    return;
  }
  // Other human's turn
  if(gameMode==='local2p'){
    NETPLAY.showHandoff(playerLabel(turn),lang,()=>{ myIdx=turn; render(); });
  }
  // online: wait for poll (guest just watches)
}

function doPlay(p,cards){
  const ids=new Set(cards.map(c=>c.id));
  hands[p]=hands[p].filter(c=>!ids.has(c.id));
  field={cards:cards.slice(),count:cards.length,strength:strength(cards[0].value),val:cards[0].value};
  lastPlayer=p;
  SND.sfx.discard&&SND.sfx.discard();
  const is8=cards.some(c=>c.value===8);
  if(p===myIdx)selected.clear();
  // finished?
  if(hands[p].length===0){finishOrder.push(p);SND.sfx.pointWin&&SND.sfx.pointWin();}
  if(is8){
    // 8-cut: clear field, same player leads again (if still in)
    cut8flash=1;field=null;passed=new Array(np).fill(false);SND.sfx.coin&&SND.sfx.coin();
    render();
    if(checkEnd()){if(gameMode==='online')pushOnline();return;}
    if(gameMode==='online')pushOnline();
    if(finishOrder.includes(p)){advanceFrom(p);}
    else{turn=p;afterTurnChange();}
    return;
  }
  if(checkEnd()){if(gameMode==='online')pushOnline();return;}
  if(gameMode==='online')pushOnline();
  advanceFrom(p);
}
function doPass(p){
  passed[p]=true;SND.sfx.click&&SND.sfx.click();
  if(gameMode==='online')pushOnline();
  advanceFrom(p);
}
function activePlayers(){
  const a=[];
  for(let p=0;p<np;p++)if(!finishOrder.includes(p))a.push(p);
  return a;
}
function advanceFrom(p){
  cut8flash=0;
  if(checkEnd())return;
  // find next active player
  let nt=p;
  for(let i=0;i<np;i++){nt=(nt+1)%np;if(!finishOrder.includes(nt))break;}
  // Does field clear? It clears when everyone except lastPlayer has passed (or finished).
  if(field){
    const act=activePlayers().filter(x=>x!==lastPlayer);
    const allPassed=act.every(x=>passed[x]);
    if(allPassed||lastPlayer===nt){
      // clear field; lastPlayer leads (if active) else next active
      field=null;passed=new Array(np).fill(false);
      let leader=lastPlayer;
      if(finishOrder.includes(leader)){
        for(let i=0;i<np;i++){leader=(leader+1)%np;if(!finishOrder.includes(leader))break;}
      }
      turn=leader;
      afterTurnChange();
      return;
    }
  }
  // skip players who already passed (in current field round)
  while(passed[nt]&&!finishOrder.includes(nt)){nt=(nt+1)%np;}
  turn=nt;
  afterTurnChange();
}
function checkEnd(){
  if(activePlayers().length<=1){
    activePlayers().forEach(p=>finishOrder.push(p));
    endGame();return true;
  }
  return false;
}
function cpuTurn(){
  if(gameOver||isHuman(turn)||finishOrder.includes(turn))return;
  const p=turn;
  const plays=enumeratePlays(hands[p]);
  if(plays.length===0){doPass(p);return;}
  let choice;
  if(difficulty==='easy'){
    // Random legal play
    choice=plays[Math.floor(Math.random()*plays.length)][0];
  }else if(difficulty==='medium'){
    // Play fewest and weakest cards first
    plays.sort((a,b)=>a[0].length-b[0].length||strength(a[0][0].value)-strength(b[0][0].value));
    choice=plays[0][0];
  }else{
    // Hard: on empty field play middle-strength sets; when following play the minimum viable
    plays.sort((a,b)=>a[0].length-b[0].length||strength(a[0][0].value)-strength(b[0][0].value));
    if(!field&&plays.length>2){
      // Play a mid-strength option to preserve best cards
      choice=plays[Math.floor(plays.length/3)][0];
    }else{
      choice=plays[0][0];
    }
  }
  doPlay(p,choice);
}
// enumerate legal plays for a hand against current field
function enumeratePlays(hand){
  const byVal={};hand.forEach(c=>{(byVal[c.value]=byVal[c.value]||[]).push(c);});
  const res=[];
  for(const v in byVal){
    const group=byVal[v];
    if(field){
      if(group.length>=field.count && strength(+v)>field.strength){
        res.push([group.slice(0,field.count)]);
      }
    }else{
      for(let n=1;n<=group.length;n++)res.push([group.slice(0,n)]);
    }
  }
  return res;
}
function reportTrack(){
  if(trackSent||gameMode==='local2p'||!(window.TRACK&&TRACK.result))return;
  trackSent=true;
  const r=finishOrder.indexOf(myIdx);
  TRACK.result(r===0?'win':r===finishOrder.length-1?'loss':'draw');
}
function endGame(){
  gameOver=true;SND.stopBGM&&SND.stopBGM();
  if(gameMode==='online')NETPLAY.stopPoll();
  for(let p=0;p<np;p++)if(!finishOrder.includes(p))finishOrder.push(p);
  reportTrack();
  const myRank=finishOrder.indexOf(myIdx);
  const m=$('winmsg');
  if(myRank===0){m.textContent='🏆 '+rankName(0)+'！';m.style.color='#7dffb0';SND.sfx.win&&SND.sfx.win();}
  else{m.textContent=`${t('you')}: ${rankName(myRank)}`;m.style.color=myRank<=1?'#ffe27a':'#ff9090';
    (myRank<=1?SND.sfx.point:SND.sfx.lose)?.();}
  $('ranklist').textContent=finishOrder.map((p,i)=>`${rankName(i)}: ${playerLabel(p)}`).join('   ');
  if(gameMode==='online')pushOnline();
  render();
}

// ── Online helpers ──────────────────────────────────────────────────────────
function getState(){
  return {hands,field,lastPlayer,passed,finishOrder,gameOver,cut8flash,turn,seq:++onlineSeq};
}
async function pushOnline(){
  try{await NETPLAY.pushState(roomId,getState());}catch(e){console.error('push err',e);}
}
function applyState(st){
  if(st.seq<=onlineSeq)return;
  onlineSeq=st.seq;
  hands=st.hands;field=st.field;lastPlayer=st.lastPlayer;passed=st.passed;
  finishOrder=st.finishOrder;gameOver=st.gameOver;cut8flash=st.cut8flash;turn=st.turn;
  selected=new Set();
}
function onPoll(room){
  if(!room.state||room.state.seq<=onlineSeq)return;
  applyState(room.state);
  if(room.state.gameOver){NETPLAY.stopPoll();reportTrack();}
  afterTurnChange();
}

// ── Button handlers ──────────────────────────────────────────────────────────
$('playbtn').onclick=()=>{
  const sel=[...selected].map(id=>hands[myIdx].find(c=>c.id===id)).filter(Boolean);
  if(turn===myIdx&&validPlay(sel))doPlay(myIdx,sel);
};
$('passbtn').onclick=()=>{if(turn===myIdx&&field)doPass(myIdx);};
$('newbtn').onclick=()=>{
  if(gameMode==='online'){
    // reset online seq and push fresh state as host, or just restart locally
    onlineSeq=-1;
  }
  SND.startBGM&&SND.startBGM('game');
  setup();
};

// ── initUI ────────────────────────────────────────────────────────────────────
function initUI(){
  const area=document.querySelector('.controls');
  const np_div=document.createElement('div');
  np_div.style.cssText='display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:10px;';

  // Player count picker
  np_div.appendChild(NETPLAY.playerCountPicker({min:2,max:6,current:np,lang,onChange:n=>{
    np=n;localStorage.setItem('daifugo_np',n);
    if(gameMode==='online'){gameMode='solo';myIdx=0;if(sbar){sbar.remove();sbar=null;}NETPLAY.stopPoll();}
    setup();
    if(window._dfUpdateMode)window._dfUpdateMode();
  }}));

  // Mode buttons row
  const modeRow=document.createElement('div');modeRow.style.cssText='display:flex;gap:8px;';
  const l2btn=document.createElement('button');l2btn.textContent=t('local2p');
  l2btn.style.cssText='background:#7c3aed;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:.82rem;cursor:pointer;font-weight:bold;';
  l2btn.onclick=()=>{
    if(gameMode==='online'){NETPLAY.stopPoll();if(sbar){sbar.remove();sbar=null;}onlineRole=null;roomId=null;}
    if(gameMode==='local2p'){gameMode='solo';myIdx=0;}
    else{gameMode='local2p';myIdx=0;}
    setup();
    updateModeButtons();
  };
  const onbtn=document.createElement('button');onbtn.textContent=t('online');
  onbtn.style.cssText='background:#10b981;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:.82rem;cursor:pointer;font-weight:bold;';
  onbtn.onclick=()=>{
    NETPLAY.showLobby({
      game:'daifugo',lang,
      initState:()=>{
        const s=computeInitState();
        // apply to local state for host
        hands=s.hands;field=s.field;lastPlayer=s.lastPlayer;passed=s.passed;
        finishOrder=s.finishOrder;gameOver=s.gameOver;cut8flash=s.cut8flash;turn=s.turn;
        selected=new Set();
        onlineSeq=s.seq;
        return s;
      },
      onHost:(id,room)=>{
        roomId=id;onlineRole='host';myIdx=0;gameMode='online';
        applyState(room.state);
        if(sbar)sbar.remove();sbar=NETPLAY.statusBar(lang);sbar.online('host');
        $('winmsg').textContent='';$('ranklist').textContent='';
        render();afterTurnChange();
        NETPLAY.startPoll(roomId,1500,onPoll);
        updateModeButtons();
      },
      onJoin:(room,tok)=>{
        roomId=room.id;onlineRole='guest';myIdx=1;gameMode='online';
        applyState(room.state);
        if(sbar)sbar.remove();sbar=NETPLAY.statusBar(lang);sbar.online('guest');
        $('winmsg').textContent='';$('ranklist').textContent='';
        render();afterTurnChange();
        NETPLAY.startPoll(roomId,1500,onPoll);
        updateModeButtons();
      },
      onCancel:()=>{}
    });
  };
  modeRow.appendChild(l2btn);modeRow.appendChild(onbtn);
  np_div.appendChild(modeRow);
  area.parentNode.insertBefore(np_div,area.nextSibling);

  function updateModeButtons(){
    l2btn.style.opacity=gameMode==='local2p'?'1':'.55';
    onbtn.style.opacity=gameMode==='online'?'1':'.55';
  }
  window._dfUpdateMode=updateModeButtons;
  updateModeButtons();
}

setup();
initUI();
(()=>{
  const diffRow=document.createElement('div');
  diffRow.style.cssText='margin-top:6px;display:flex;gap:6px;align-items:center;justify-content:center;';
  const diffLbl=document.createElement('span');diffLbl.style.cssText='font-size:.78rem;color:#aaa;margin-right:4px;';diffLbl.textContent=t('diff')+':';
  diffRow.appendChild(diffLbl);
  const DIFFS=[['easy','easy'],['medium','normal'],['hard','hard']]; // [value, label key]
  DIFFS.forEach(([d,lab])=>{
    const b=document.createElement('button');
    b.style.cssText=`font-size:.75rem;font-weight:bold;border:none;border-radius:6px;padding:4px 10px;cursor:pointer;color:#fff;background:${d===difficulty?'#7c3aed':'#374151'};`;
    b.textContent=t(lab);
    b.onclick=()=>{
      difficulty=d;localStorage.setItem('daifugo_diff',d);
      diffRow.querySelectorAll('button').forEach((x,i)=>{x.style.background=DIFFS[i][0]===difficulty?'#7c3aed':'#374151';});
      if(gameMode==='solo')setup();
    };
    diffRow.appendChild(b);
  });
  document.querySelector('.controls').insertAdjacentElement('afterend',diffRow);
})();
if(typeof SND!=='undefined'){SND.createBtn(document.body);SND.startBGM('game');}
</script>
<script src="nav.js"></script>
</body>
</html>
