<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>CAP BASEBALL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0d0d1a;min-height:100vh;font-family:'Courier New',monospace;color:#eee;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;user-select:none;}
#lang-btn{position:fixed;top:14px;left:14px;background:#1e1e2e;border:1px solid #444;border-radius:6px;color:#888;font-family:'Courier New',monospace;font-size:.72rem;padding:5px 10px;cursor:pointer;z-index:100;}
#back-btn{position:fixed;top:14px;right:14px;background:#1e1e2e;border:1px solid #444;border-radius:6px;color:#888;font-family:'Courier New',monospace;font-size:.72rem;padding:5px 10px;cursor:pointer;z-index:100;text-decoration:none;}

/* ===== SETUP SCREEN ===== */
#screen-setup{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:32px;padding:80px 20px;}
.setup-title{font-size:1.6rem;letter-spacing:8px;color:#ff6633;text-shadow:0 0 20px rgba(255,102,51,.6);}
.setup-section{background:#13131f;border:1px solid #2a2a3a;border-radius:12px;padding:22px 28px;width:100%;max-width:420px;}
.setup-label{font-size:.6rem;letter-spacing:4px;color:#555;margin-bottom:14px;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;}
.sel-btn{background:#1e1e2e;border:1px solid #333;border-radius:8px;color:#777;font-family:'Courier New',monospace;font-size:.8rem;letter-spacing:2px;padding:10px 18px;cursor:pointer;transition:all .15s;}
.sel-btn:hover{border-color:#666;color:#bbb;}
.sel-btn.active{border-color:#ff6633;color:#ff6633;background:rgba(255,102,51,.1);}
.start-btn{background:linear-gradient(135deg,#ff6633,#cc3300);border:none;border-radius:10px;color:#fff;font-family:'Courier New',monospace;font-size:1rem;letter-spacing:4px;padding:14px 40px;cursor:pointer;transition:opacity .15s;width:100%;max-width:420px;}
.start-btn:hover{opacity:.85;}

/* ===== GAME SCREEN ===== */
#screen-game{display:none;flex-direction:column;align-items:center;width:100%;max-width:520px;padding:70px 10px 20px;}

/* Scoreboard */
#scoreboard{width:100%;background:#13131f;border:1px solid #2a2a3a;border-radius:8px;padding:8px 12px;display:grid;font-size:.6rem;letter-spacing:1px;margin-bottom:8px;}
.sb-row{display:flex;gap:2px;align-items:center;}
.sb-team{width:44px;color:#555;font-size:.58rem;}
.sb-cell{flex:1;text-align:center;padding:3px 1px;border-radius:3px;min-width:20px;}
.sb-hdr{color:#333;}
.sb-active{background:rgba(255,102,51,.18);color:#ff9966;}
.sb-you{color:#00d4aa;}
.sb-cpu{color:#ff6633;}
.sb-total{color:#ffd700;font-weight:bold;width:28px;text-align:center;}

/* Game canvas */
#gc{border-radius:10px;border:1px solid #222;width:100%;max-width:500px;cursor:crosshair;touch-action:manipulation;}

/* HUD */
#hud{display:flex;justify-content:space-between;align-items:center;width:100%;padding:6px 4px 4px;gap:4px;}
.hud-grp{display:flex;flex-direction:column;align-items:center;gap:3px;}
.hud-lbl{font-size:.5rem;color:#555;letter-spacing:2px;}
.hud-val{font-size:1rem;color:#eee;min-width:20px;text-align:center;}
.dots{display:flex;gap:4px;}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid #333;}
.dot.ball-on{background:#00d4aa;border-color:#00d4aa;}
.dot.str-on{background:#ff4444;border-color:#ff4444;}
.dot.out-on{background:#ff6633;border-color:#ff6633;}

/* Zone grid (HTML, not canvas) */
#zone-wrap{width:100%;margin-top:6px;}
.zone-label{font-size:.55rem;letter-spacing:3px;color:#555;text-align:center;margin-bottom:6px;}
#zone-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:100%;max-width:300px;margin:0 auto;}
.zc{background:#13131f;border:1px solid #222;border-radius:5px;aspect-ratio:1;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.55rem;color:#444;transition:all .1s;position:relative;}
.zc.strike{border-color:#333;color:#555;}
.zc:hover{border-color:#666;color:#888;}
.zc.selected{border-color:#ff6633;background:rgba(255,102,51,.18);color:#ff9966;}
.zc.result-hit{background:rgba(0,212,170,.25);border-color:#00d4aa;}
.zc.result-miss{background:rgba(255,68,68,.15);border-color:#ff4444;}
.zc.pitch-landed{border-color:#ffd700;background:rgba(255,215,0,.15);}

/* Pitch type buttons */
#pitch-types{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px;}
.pt-btn{background:#1e1e2e;border:1px solid #333;border-radius:6px;color:#666;font-family:'Courier New',monospace;font-size:.65rem;padding:7px 12px;cursor:pointer;transition:all .1s;letter-spacing:1px;}
.pt-btn:hover{border-color:#666;color:#aaa;}
.pt-btn.active{border-color:#ff6633;color:#ff6633;background:rgba(255,102,51,.1);}

/* Action buttons */
#action-area{display:flex;gap:10px;margin-top:8px;width:100%;justify-content:center;}
.act-btn{background:linear-gradient(135deg,#ff6633,#cc3300);border:none;border-radius:8px;color:#fff;font-family:'Courier New',monospace;font-size:.85rem;letter-spacing:3px;padding:11px 28px;cursor:pointer;transition:opacity .1s;flex:1;max-width:200px;}
.act-btn:hover{opacity:.85;}
.act-btn:disabled{opacity:.35;cursor:default;}
.act-btn.secondary{background:#1e1e2e;border:1px solid #444;color:#888;}
.act-btn.secondary:hover{border-color:#666;color:#bbb;}
.act-btn.swing-btn{background:linear-gradient(135deg,#00d4aa,#0088cc);color:#000;font-weight:bold;}

/* Overlay */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;gap:14px;}
#overlay.hidden{display:none;}
#ov-title{font-size:1.8rem;letter-spacing:4px;color:#ff6633;text-shadow:0 0 20px rgba(255,102,51,.7);text-align:center;}
#ov-sub{font-size:.85rem;color:#888;letter-spacing:2px;text-align:center;white-space:pre-line;}
#ov-btn{background:linear-gradient(135deg,#ff6633,#cc3300);border:none;border-radius:8px;color:#fff;font-family:'Courier New',monospace;font-size:.9rem;letter-spacing:3px;padding:12px 36px;cursor:pointer;}

/* 2P pass screen */
#pass-screen{position:fixed;inset:0;background:#0d0d1a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:60;}
#pass-screen.hidden{display:none;}
.pass-title{font-size:1.2rem;letter-spacing:4px;color:#ffd700;}
.pass-sub{font-size:.75rem;color:#555;letter-spacing:2px;text-align:center;}
.pass-btn{background:linear-gradient(135deg,#ffd700,#aa8800);border:none;border-radius:8px;color:#000;font-family:'Courier New',monospace;font-size:.9rem;letter-spacing:3px;padding:12px 32px;cursor:pointer;font-weight:bold;}

/* Result flash */
#result-flash{font-size:1.2rem;letter-spacing:3px;text-align:center;min-height:28px;color:#fff;margin-top:4px;}
</style>
</head>
<body>
<button id="lang-btn">EN</button>
<a href="index.html" id="back-btn">← ARCADE</a>

<!-- SETUP SCREEN -->
<div id="screen-setup">
  <div class="setup-title" id="st-title">CAP BASEBALL</div>

  <div class="setup-section">

<!-- Overlay -->
<div id="overlay" class="hidden">
  <div id="ov-title"></div>

</div>

<!-- 2P pass screen -->
<div id="pass-screen" class="hidden">

</div>

<script>
// ============================================================
// i18n
// ============================================================
const LANG = {
  ja:{
    setupMode:'モード', setup1p:'1P vs CPU', setup2p:'2Pローカル',
    setupInn:'イニング数', setupPlay:'▶ プレイ開始',

    top:'表', bot:'裏', you:'YOU', cpu:'CPU', total:'計',
    zoneSelectPitch:'配球コースを選択', zoneSelectSwing:'振るコースを選択',
    pitchTypes:{straight:'直球',curve:'カーブ',slider:'スライダー',fork:'フォーク',sinker:'シンカー'},
    btnThrow:'投げる！', btnSwing:'スイング！', btnTake:'見逃す',
    pass2pTitle:'デバイスを渡してください',
    pass2pBat:(n)=>`P${n} のバッター、準備はいい？`,
    pass2pPitch:(n)=>`P${n} のピッチャー、準備はいい？`,
    passOk:'準備OK！',
    resultHR:'🎉 ホームラン！', result3b:'🔥 3塁打！', result2b:'⚡ 2塁打！',
    result1b:'✅ ヒット！', resultFoul:'ファール', resultMiss:'空振り！',
    resultStrikeCalled:'見逃しストライク', resultBall:'ボール',
    resultOut:'アウト！', resultWalk:'四球！',
    halfIntroTop:(i)=>`${i}回表`, halfIntroBot:(i)=>`${i}回裏`,
    halfIntroSubTop:'あなたの攻撃', halfIntroSubBot:'CPUの攻撃',
    halfIntroSub2pTop:(n)=>`P${n} の攻撃`,
    threeOuts:'3アウト！チェンジ',
    gameOver:'ゲーム終了',
    youWin:'あなたの勝ち！', cpuWin:'CPUの勝ち！', p1win:'P1の勝ち！', p2win:'P2の勝ち！', draw:'引き分け！',
    scoreDetail:(y,c)=>`YOU ${y} - CPU ${c}`,
    score2pDetail:(a,b)=>`P1 ${a} - P2 ${b}`,
    playAgain:'もう一度プレイ',
    pitching:'投球中...', deciding:'判定中...',
  },
  en:{
    setupMode:'MODE', setup1p:'1P vs CPU', setup2p:'2P LOCAL',
    setupInn:'INNINGS', setupPlay:'▶ PLAY',
    lblInn:'INNING', lblBall:'BALLS', lblStr:'STRIKES', lblOut:'OUTS',
    top:'▲', bot:'▼', you:'YOU', cpu:'CPU', total:'R',
    zoneSelectPitch:'Select pitch location', zoneSelectSwing:'Select swing zone',
    pitchTypes:{straight:'Fastball',curve:'Curve',slider:'Slider',fork:'Forkball',sinker:'Sinker'},
    btnThrow:'THROW!', btnSwing:'SWING!', btnTake:'TAKE',
    pass2pTitle:'Pass the device',
    pass2pBat:(n)=>`P${n}: Ready to bat?`,
    pass2pPitch:(n)=>`P${n}: Ready to pitch?`,
    passOk:"I'M READY!",
    resultHR:'🎉 HOME RUN!', result3b:'🔥 TRIPLE!', result2b:'⚡ DOUBLE!',
    result1b:'✅ SINGLE!', resultFoul:'FOUL', resultMiss:'SWING & MISS!',
    resultStrikeCalled:'CALLED STRIKE', resultBall:'BALL',
    resultOut:'OUT!', resultWalk:'WALK!',
    halfIntroTop:(i)=>`Inning ${i} Top`, halfIntroBot:(i)=>`Inning ${i} Bottom`,
    halfIntroSubTop:'Your turn to bat', halfIntroSubBot:'CPU batting',
    halfIntroSub2pTop:(n)=>`P${n} batting`,
    threeOuts:'3 Outs! Change sides',
    gameOver:'GAME OVER',
    youWin:'YOU WIN!', cpuWin:'CPU WINS!', p1win:'P1 WINS!', p2win:'P2 WINS!', draw:'DRAW!',
    scoreDetail:(y,c)=>`YOU ${y} - CPU ${c}`,
    score2pDetail:(a,b)=>`P1 ${a} - P2 ${b}`,
    playAgain:'PLAY AGAIN',
    pitching:'Pitching...', deciding:'Deciding...',
  }
};
let lang = localStorage.getItem('lang')||'ja';
function T(k,...a){const v=(LANG[lang]||LANG.ja)[k]||(LANG.ja)[k]||k;return typeof v==='function'?v(...a):v;}
function applyLang(){
  document.getElementById('lang-btn').textContent=lang==='ja'?'EN':'JA';
  document.getElementById('st-title').textContent='CAP BASEBALL';
  document.getElementById('st-mode-lbl').textContent=T('setupMode');
  document.getElementById('st-inn-lbl').textContent=T('setupInn');
  document.getElementById('start-btn').textContent=T('setupPlay');
  document.getElementById('btn-1p').textContent=T('setup1p');
  document.getElementById('btn-2p').textContent=T('setup2p');
  document.getElementById('lbl-inn').textContent=T('lblInn');
  document.getElementById('lbl-b').textContent=T('lblBall');
  document.getElementById('lbl-s').textContent=T('lblStr');
  document.getElementById('lbl-o').textContent=T('lblOut');
  document.documentElement.lang=lang;
}
document.getElementById('lang-btn').addEventListener('click',()=>{
  lang=lang==='ja'?'en':'ja'; localStorage.setItem('lang',lang); applyLang();
  renderScoreboard(); renderInning(); renderZoneGrid(); renderPitchTypes();
});

// ============================================================
// Constants
// ============================================================
// Zone system: 5x5 grid (flat index 0-24)
// Inner 3x3 (indices 6,7,8,11,12,13,16,17,18) = strike zone
// Outer ring = ball zone
// Strike zone mapped to game zones 0-8:
//   grid[6]→0  grid[7]→1  grid[8]→2
//   grid[11]→3 grid[12]→4 grid[13]→5
//   grid[16]→6 grid[17]→7 grid[18]→8
const STRIKE_CELLS = [6,7,8,11,12,13,16,17,18];
const CELL_TO_ZONE = {}; // grid cell → game zone 0-8
STRIKE_CELLS.forEach((c,i)=>CELL_TO_ZONE[c]=i);

// Canvas zone center positions (batter's-eye view)
// Zone grid drawn on canvas: centered, each cell ~60×52px
const CW=500, CH=280;
const GCX=CW/2, GCY=140; // grid center on canvas
const GCELL_W=60, GCELL_H=52;
const ZONE_POS = [
  {x:GCX-GCELL_W,y:GCY-GCELL_H},{x:GCX,y:GCY-GCELL_H},{x:GCX+GCELL_W,y:GCY-GCELL_H},
  {x:GCX-GCELL_W,y:GCY         },{x:GCX,y:GCY         },{x:GCX+GCELL_W,y:GCY         },
  {x:GCX-GCELL_W,y:GCY+GCELL_H},{x:GCX,y:GCY+GCELL_H},{x:GCX+GCELL_W,y:GCY+GCELL_H},
];
// Outside zone canvas positions (for ball pitches)
const BALL_ZONE_POS = [
  {x:GCX, y:GCY-GCELL_H*2.2},    // row 0 (high)
  {x:GCX-GCELL_W*2.2, y:GCY-GCELL_H}, // col 0 (inside)
  {x:GCX+GCELL_W*2.2, y:GCY-GCELL_H}, // col 4 (outside)
  {x:GCX-GCELL_W*2.2, y:GCY},
  {x:GCX+GCELL_W*2.2, y:GCY},
  {x:GCX, y:GCY+GCELL_H*2.2},    // row 4 (low)
];
// For a given grid cell, get canvas position
function cellCanvasPos(cell){
  if(STRIKE_CELLS.includes(cell)) return ZONE_POS[CELL_TO_ZONE[cell]];
  // Ball zone: approximate
  const r=Math.floor(cell/5), c=cell%5;
  const x=GCX+(c-2)*GCELL_W*1.1;
  const y=GCY+(r-2)*GCELL_H*1.1;
  return {x,y};
}

const PITCH_TYPES = {
  straight:{color:'#ff6633', breakR:0,   breakC:0,   speed:1.0,  apparentOffR:0,   apparentOffC:0},
  curve:   {color:'#44aaff', breakR:2.2, breakC:-1.2,speed:0.75, apparentOffR:-2,  apparentOffC:1},
  slider:  {color:'#ff44aa', breakR:0.4, breakC:2.3, speed:0.85, apparentOffR:-0.2,apparentOffC:-2},
  fork:    {color:'#44ff88', breakR:2.8, breakC:0,   speed:0.78, apparentOffR:-2.5,apparentOffC:0},
  sinker:  {color:'#ffaa44', breakR:1.8, breakC:-1.5,speed:0.88, apparentOffR:-1.5,apparentOffC:1.2},
};
const PT_KEYS = Object.keys(PITCH_TYPES);

// ============================================================
// Game state
// ============================================================
let MODE='1p'; // '1p' or '2p'
let INNINGS=5;
let inning=1, half=0; // half: 0=top(P1/you bat), 1=bot(P2/cpu bat)
let balls=0,strikes=0,outs=0;
let runners=[false,false,false];
let inningScore=0;
let scores={a:Array(9).fill(null), b:Array(9).fill(null)};
let phase='idle'; // idle|pitcher|batter_wait|batter_anim|result|change|over

let selectedCell=-1; // pitcher: target cell; batter: swing cell
let selectedPitchType='straight';
let pitchTargetCell=-1;
let pitchType='straight';
let swingCell=-1;
let swingTiming=-1; // -1=no swing, 0=perfect...1=worst
let animRaf=null;
let animT=0;
let animDur=0; // ms
let animStart=0;

const canvas=document.getElementById('gc');
const ctx=canvas.getContext('2d');

// ============================================================
// Setup screen
// ============================================================
document.querySelectorAll('[data-mode]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('[data-mode]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    MODE=btn.dataset.mode;
  });
});
document.querySelectorAll('[data-inn]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('[data-inn]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    INNINGS=parseInt(btn.dataset.inn);
  });
});
document.getElementById('start-btn').addEventListener('click',startGame);

// ============================================================
// Zone grid (HTML)
// ============================================================
function buildZoneGrid(){
  const g=document.getElementById('zone-grid');
  g.innerHTML='';
  for(let i=0;i<25;i++){
    const div=document.createElement('div');
    div.className='zc'+(STRIKE_CELLS.includes(i)?' strike':'');
    div.dataset.cell=i;
    // Label: zone number for strike cells
    if(STRIKE_CELLS.includes(i)){
      const z=CELL_TO_ZONE[i];
      const labels=['↖','↑','↗','←','●','→','↙','↓','↘'];
      div.textContent=labels[z];
    }
    div.addEventListener('click',()=>onZoneCellClick(i));
    g.appendChild(div);
  }
}
function onZoneCellClick(cell){
  if(phase==='pitcher'){
    selectedCell=cell;
    document.querySelectorAll('.zc').forEach(c=>c.classList.remove('selected'));
    document.querySelector(`.zc[data-cell="${cell}"]`)?.classList.add('selected');
  } else if(phase==='batter_anim'||phase==='batter_wait'){
    if(!STRIKE_CELLS.includes(cell)) return; // batter can only swing at strike zones
    swingCell=cell;
    document.querySelectorAll('.zc').forEach(c=>c.classList.remove('selected'));
    document.querySelector(`.zc[data-cell="${cell}"]`)?.classList.add('selected');
  }
}
function renderZoneGrid(){
  const label=document.getElementById('zone-label');
  if(phase==='pitcher'){
    label.textContent=T('zoneSelectPitch');
  } else {
    label.textContent=T('zoneSelectSwing');
  }
  // Reset cell styles
  document.querySelectorAll('.zc').forEach(c=>{
    c.classList.remove('selected','result-hit','result-miss','pitch-landed');
  });
  if(selectedCell>=0){
    document.querySelector(`.zc[data-cell="${selectedCell}"]`)?.classList.add('selected');
  }
}

// ============================================================
// Pitch type buttons
// ============================================================
function renderPitchTypes(){
  const area=document.getElementById('pitch-types');
  if(phase!=='pitcher'){area.innerHTML='';return;}
  area.innerHTML='';
  PT_KEYS.forEach(k=>{
    const btn=document.createElement('button');
    btn.className='pt-btn'+(selectedPitchType===k?' active':'');
    btn.textContent=T('pitchTypes')[k]||k;
    btn.style.borderColor=PITCH_TYPES[k].color;
    if(selectedPitchType===k) btn.style.color=PITCH_TYPES[k].color;
    btn.addEventListener('click',()=>{
      selectedPitchType=k;
      renderPitchTypes();
    });
    area.appendChild(btn);
  });
}

// ============================================================
// Action buttons
// ============================================================
function renderActions(){
  const area=document.getElementById('action-area');
  area.innerHTML='';
  if(phase==='pitcher'){
    const btn=document.createElement('button');
    btn.className='act-btn';
    btn.textContent=T('btnThrow');
    btn.addEventListener('click',doThrow);
    area.appendChild(btn);
  } else if(phase==='batter_wait'||phase==='batter_anim'){
    const swBtn=document.createElement('button');
    swBtn.className='act-btn swing-btn';
    swBtn.id='swing-btn';
    swBtn.textContent=T('btnSwing');
    swBtn.addEventListener('click',doSwing);
    const takeBtn=document.createElement('button');
    takeBtn.className='act-btn secondary';
    takeBtn.textContent=T('btnTake');
    takeBtn.addEventListener('click',doTake);
    area.appendChild(swBtn);
    area.appendChild(takeBtn);
  }
}

// ============================================================
// HUD
// ============================================================
function renderHUD(){
  const bd=document.getElementById('ball-dots');
  const sd=document.getElementById('str-dots');
  const od=document.getElementById('out-dots');
  bd.innerHTML=[0,1,2].map(i=>`<div class="dot${i<balls?' ball-on':''}"></div>`).join('');
  sd.innerHTML=[0,1].map(i=>`<div class="dot${i<strikes?' str-on':''}"></div>`).join('');
  od.innerHTML=[0,1,2].map(i=>`<div class="dot${i<outs?' out-on':''}"></div>`).join('');
}
function renderInning(){
  const suf=half===0?T('top'):T('bot');
  document.getElementById('val-inn').textContent=`${inning}${suf}`;
}

// ============================================================
// Scoreboard
// ============================================================
function renderScoreboard(){
  const sb=document.getElementById('scoreboard');
  const teamA=MODE==='2p'?'P1':T('you');
  const teamB=MODE==='2p'?'P2':T('cpu');
  const activeA=half===0?inning:0;
  const activeB=half===1?inning:0;
  let h=`<div class="sb-row"><div class="sb-team"></div>`;
  for(let i=1;i<=INNINGS;i++) h+=`<div class="sb-cell sb-hdr">${i}</div>`;
  h+=`<div class="sb-total">${T('total')}</div></div>`;

  h+=`<div class="sb-row"><div class="sb-team sb-you">${teamA}</div>`;
  for(let i=1;i<=INNINGS;i++){
    const v=scores.a[i-1];
    const ac=(i===activeA&&half===0)?' sb-active':'';
    h+=`<div class="sb-cell sb-you${ac}">${v===null?'-':v}</div>`;
  }
  h+=`<div class="sb-total">${scores.a.reduce((s,v)=>s+(v||0),0)}</div></div>`;

  h+=`<div class="sb-row"><div class="sb-team sb-cpu">${teamB}</div>`;
  for(let i=1;i<=INNINGS;i++){
    const v=scores.b[i-1];
    const ac=(i===activeB&&half===1)?' sb-active':'';
    h+=`<div class="sb-cell sb-cpu${ac}">${v===null?'-':v}</div>`;
  }
  h+=`<div class="sb-total">${scores.b.reduce((s,v)=>s+(v||0),0)}</div></div>`;
  sb.innerHTML=h;
}

// ============================================================
// Canvas rendering
// ============================================================
function drawField(capX,capY,capR,capAngle,pitchColor){
  ctx.clearRect(0,0,CW,CH);
  // Sky gradient
  const sky=ctx.createLinearGradient(0,0,0,CH*0.5);
  sky.addColorStop(0,'#0d0d1a'); sky.addColorStop(1,'#1a1a2e');
  ctx.fillStyle=sky; ctx.fillRect(0,0,CW,CH*0.5);
  // Ground
  const gnd=ctx.createLinearGradient(0,CH*0.5,0,CH);
  gnd.addColorStop(0,'#1a2e14'); gnd.addColorStop(1,'#0d1a0a');
  ctx.fillStyle=gnd; ctx.fillRect(0,CH*0.5,CW,CH*0.5);
  // Pitcher mound (perspective)
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(CW/2,CH*0.42,22,10,0,0,Math.PI*2);
  ctx.fillStyle='rgba(120,80,40,0.6)'; ctx.fill();
  ctx.restore();
  // Pitcher figure
  drawPitcher(CW/2, CH*0.35);
  // Home plate frame (perspective trapezoid)
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,0.18)';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(CW/2-GCELL_W*1.6,CH*0.52);
  ctx.lineTo(CW/2+GCELL_W*1.6,CH*0.52);
  ctx.lineTo(CW/2+GCELL_W*2.2,CH-10);
  ctx.lineTo(CW/2-GCELL_W*2.2,CH-10);
  ctx.closePath(); ctx.stroke();
  ctx.restore();
  // Strike zone box on canvas (visual reference)
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,0.12)';
  ctx.lineWidth=1;
  ctx.strokeRect(GCX-GCELL_W*1.5,GCY-GCELL_H*1.5,GCELL_W*3,GCELL_H*3);
  // Grid lines
  for(let i=1;i<3;i++){
    ctx.beginPath(); ctx.moveTo(GCX-GCELL_W*1.5+i*GCELL_W,GCY-GCELL_H*1.5);
    ctx.lineTo(GCX-GCELL_W*1.5+i*GCELL_W,GCY+GCELL_H*1.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(GCX-GCELL_W*1.5,GCY-GCELL_H*1.5+i*GCELL_H);
    ctx.lineTo(GCX+GCELL_W*1.5,GCY-GCELL_H*1.5+i*GCELL_H); ctx.stroke();
  }
  ctx.restore();
  // Runner indicators
  const rpos=[{x:CW-50,y:CH-55},{x:CW-80,y:CH-90},{x:50,y:CH-90}];
  runners.forEach((on,i)=>{
    ctx.beginPath(); ctx.arc(rpos[i].x,rpos[i].y,8,0,Math.PI*2);
    ctx.fillStyle=on?'#00d4aa':'rgba(255,255,255,0.1)';
    if(on){ctx.shadowColor='#00d4aa';ctx.shadowBlur=10;}
    ctx.fill(); ctx.shadowBlur=0;
  });
  // Batter silhouette at bottom
  drawBatter(80,CH-20);
  // Cap
  if(capR>0) drawCap(capX,capY,capR,capAngle,pitchColor||'#ff6633');
}
function drawPitcher(x,y){
  ctx.save();
  ctx.fillStyle='rgba(255,102,51,0.7)';
  ctx.beginPath(); ctx.arc(x,y-14,6,0,Math.PI*2); ctx.fill();
  ctx.fillRect(x-4,y-8,8,14);
  // Throwing arm
  ctx.strokeStyle='rgba(255,102,51,0.7)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(x+4,y-4); ctx.lineTo(x+14,y-12); ctx.stroke();
  ctx.restore();
}
function drawBatter(x,y){
  ctx.save();
  ctx.translate(x,y);
  ctx.fillStyle='#00d4aa';
  ctx.beginPath(); ctx.arc(18,-42,8,0,Math.PI*2); ctx.fill();
  ctx.fillRect(14,-34,8,18);
  ctx.strokeStyle='#ffd700'; ctx.lineWidth=4;
  ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(22,-28); ctx.lineTo(50,-50); ctx.stroke();
  ctx.restore();
}
function drawCap(x,y,r,angle,color){
  ctx.save();
  ctx.translate(x,y); ctx.rotate(angle);
  ctx.shadowColor=color; ctx.shadowBlur=r*0.6;
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2);
  ctx.fillStyle=color; ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.4)'; ctx.lineWidth=1.5; ctx.stroke();
  // Tab
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.fillRect(-r*0.3,-r*1.25,r*0.6,r*0.35);
  // Shine
  ctx.beginPath(); ctx.arc(-r*0.25,-r*0.25,r*0.28,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.25)'; ctx.fill();
  ctx.shadowBlur=0;
  ctx.restore();
}

// ============================================================
// Pitch animation
// ============================================================
let capCurX=CW/2, capCurY=60;
let capAngle=0;
let pitchColor='#ff6633';
let apparentTarget={x:CW/2,y:60};
let actualTarget={x:CW/2,y:60};
const CAP_START={x:CW/2,y:CH*0.36};
const BREAK_PHASE=0.55; // fraction where break kicks in

function startPitchAnim(targetCell,ptype,onArrive){
  if(animRaf) cancelAnimationFrame(animRaf);
  const pt=PITCH_TYPES[ptype];
  pitchColor=pt.color;
  // Actual landing position on canvas
  let actualPos;
  if(STRIKE_CELLS.includes(targetCell)){
    actualPos={...ZONE_POS[CELL_TO_ZONE[targetCell]]};
  } else {
    actualPos={...cellCanvasPos(targetCell)};
  }
  actualTarget=actualPos;
  // Apparent position: shifted by break in opposite direction
  // apparentOff is in "zone units", convert to pixels
  const aox=pt.apparentOffC*GCELL_W;
  const aoy=pt.apparentOffR*GCELL_H;
  apparentTarget={x:actualPos.x+aox, y:actualPos.y+aoy};
  // Clamp to canvas
  apparentTarget.x=Math.max(30,Math.min(CW-30,apparentTarget.x));
  apparentTarget.y=Math.max(30,Math.min(CH-30,apparentTarget.y));

  animDur=(900/pt.speed);
  animStart=performance.now();
  capCurX=CAP_START.x; capCurY=CAP_START.y;
  capAngle=0;
  let swungDone=false;

  function step(now){
    const elapsed=now-animStart;
    const t=Math.min(elapsed/animDur,1);
    // Cap position
    let px,py;
    if(t<BREAK_PHASE){
      const s=t/BREAK_PHASE;
      px=lerp(CAP_START.x,apparentTarget.x,ease(s));
      py=lerp(CAP_START.y,apparentTarget.y,ease(s));
    } else {
      const s=(t-BREAK_PHASE)/(1-BREAK_PHASE);
      // Start from where we were at end of phase 1
      const p1x=lerp(CAP_START.x,apparentTarget.x,ease(1));
      const p1y=lerp(CAP_START.y,apparentTarget.y,ease(1));
      px=lerp(p1x,actualTarget.x,ease(s));
      py=lerp(p1y,actualTarget.y,ease(s));
    }
    // Cap size grows as it approaches
    const minR=5, maxR=20;
    const r=lerp(minR,maxR,ease(t));
    capCurX=px; capCurY=py;
    capAngle+=0.2;
    drawField(px,py,r,capAngle,pitchColor);
    if(t<1){
      animRaf=requestAnimationFrame(step);
    } else {
      animRaf=null;
      drawField(actualTarget.x,actualTarget.y,maxR,capAngle,pitchColor);
      if(!swungDone) onArrive();
    }
    // Check if swing happened
    if(swingTiming>=0&&!swungDone&&phase==='batter_anim'){
      swungDone=true;
      swingTiming=t; // actual timing = t when swing happened (0=early/late, near 0.85=perfect)
      if(animRaf){cancelAnimationFrame(animRaf);animRaf=null;}
      onArrive();
    }
  }
  animRaf=requestAnimationFrame(step);
}
function lerp(a,b,t){return a+(b-a)*t;}
function ease(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}

// ============================================================
// Game logic
// ============================================================
function zoneRowCol(cell){
  const r=Math.floor(cell/5), c=cell%5; return {r,c};
}
function zoneDist(cellA, cellB){
  // Distance between two cells on the 5x5 grid
  const ra=Math.floor(cellA/5), ca=cellA%5;
  const rb=Math.floor(cellB/5), cb=cellB%5;
  return Math.max(Math.abs(ra-rb),Math.abs(ca-cb));
}

function evaluateAtBat(pitchCell,ptype,swCell,timing){
  // timing: -1=no swing; 0-1 where ~0.85 is perfect timing, deviation = worse
  const pitchIsStrike=STRIKE_CELLS.includes(pitchCell);

  if(timing<0){
    // No swing
    return pitchIsStrike ? {type:'called_strike'} : {type:'ball'};
  }
  // Swing
  const timingPerfect=0.82; // perfect timing is near end of animation
  const timingError=Math.abs(timing-timingPerfect);
  // timingScore: 0=perfect, 1=worst
  const timingScore=Math.min(timingError/0.25,1);

  if(swCell<0){
    // Swung but no zone selected - miss
    return {type:'miss'};
  }
  const dist=zoneDist(pitchCell,swCell);

  // Result logic
  if(dist===0&&timingScore<0.3) return {type:'HR'};
  if(dist===0&&timingScore<0.55) return {type:'3B'};
  if(dist<=1&&timingScore<0.35) return {type:'2B'};
  if(dist<=1&&timingScore<0.6) return {type:'1B'};
  if(dist<=1&&timingScore<0.85) return {type:'foul'};
  if(dist<=2&&timingScore<0.5) return {type:'1B'};
  if(dist<=2&&timingScore<0.75) return {type:'foul'};
  return {type:'miss'};
}

function advanceRunners(bases){
  let runs=0;
  const nr=[false,false,false];
  for(let i=2;i>=0;i--){
    if(runners[i]){
      const nb=i+1+bases;
      if(nb>=3) runs++;
      else nr[nb]=true;
    }
  }
  if(bases>=4) runs++;
  else if(bases>0) nr[bases-1]=true;
  runners=nr;
  inningScore+=runs;
  return runs;
}

function applyHit(type){
  let runs=0;
  if(type==='HR')  runs=advanceRunners(4);
  else if(type==='3B') runs=advanceRunners(3);
  else if(type==='2B') runs=advanceRunners(2);
  else if(type==='1B') runs=advanceRunners(1);
  return runs;
}

function flashResult(msg,color){
  const el=document.getElementById('result-flash');
  el.textContent=msg; el.style.color=color||'#fff';
}

function showResultOnGrid(pitchCell,swCell,hit){
  document.querySelectorAll('.zc').forEach(c=>c.classList.remove('pitch-landed','result-hit','result-miss'));
  document.querySelector(`.zc[data-cell="${pitchCell}"]`)?.classList.add('pitch-landed');
  if(swCell>=0){
    document.querySelector(`.zc[data-cell="${swCell}"]`)?.classList.add(hit?'result-hit':'result-miss');
  }
}

// ============================================================
// CPU pitcher logic
// ============================================================
function cpuPitch(){
  // Mix strategies: prefer strikes (70%), sometimes work the corners
  const strategies=[
    ()=>({ cell:6,  pt:'straight' }),  // top-left
    ()=>({ cell:8,  pt:'slider'   }),  // top-right
    ()=>({ cell:16, pt:'sinker'   }),  // bot-left
    ()=>({ cell:18, pt:'fork'     }),  // bot-right
    ()=>({ cell:12, pt:'straight' }),  // center
    ()=>({ cell:7,  pt:'curve'    }),  // top-center
    ()=>({ cell:17, pt:'fork'     }),  // bot-center
    ()=>({ cell:11, pt:'slider'   }),  // mid-left
    ()=>({ cell:13, pt:'sinker'   }),  // mid-right
    ()=>({ cell:0,  pt:'curve'    }),  // high-outside (ball)
    ()=>({ cell:24, pt:'fork'     }),  // low-inside (ball)
    ()=>({ cell:4,  pt:'slider'   }),  // high (ball)
  ];
  // Weight toward strikes
  const idx=Math.random()<0.72?Math.floor(Math.random()*9):9+Math.floor(Math.random()*3);
  const s=strategies[idx]();
  return {cell:s.cell, pt:s.pt};
}

// ============================================================
// CPU batter logic
// ============================================================
function cpuBat(pitchCell,ptype){
  const isStrike=STRIKE_CELLS.includes(pitchCell);
  // CPU swings on strikes (85%) or on close balls (25%)
  const shouldSwing=isStrike?(Math.random()<0.85):(Math.random()<0.25);
  if(!shouldSwing) return {swingCell:-1,timing:-1};
  // Zone selection: mostly correct zone ±1
  const skillOff=Math.floor(Math.random()*3)-1; // -1,0,1
  // Find nearest strike cell to pitch
  let swCell=pitchCell;
  if(!STRIKE_CELLS.includes(swCell)){
    // Find closest strike cell
    let minD=999;
    STRIKE_CELLS.forEach(sc=>{
      const d=zoneDist(sc,pitchCell);
      if(d<minD){minD=d;swCell=sc;}
    });
  }
  // Apply skill offset
  const zi=STRIKE_CELLS.indexOf(swCell);
  const ni=Math.max(0,Math.min(8,zi+skillOff));
  const finalCell=STRIKE_CELLS[ni];
  // Timing: near perfect with some variance
  const timing=0.82+((Math.random()-0.5)*0.3);
  return {swingCell:finalCell,timing:Math.max(0.4,Math.min(1,timing))};
}

// ============================================================
// Turn management
// ============================================================
function isBatterHuman(){
  // In 1P: batter is human when half=0 (you bat)
  // In 2P: always human
  return MODE==='2p'||(MODE==='1p'&&half===0);
}
function isPitcherHuman(){
  return MODE==='2p'||(MODE==='1p'&&half===1);
}

function startHalf(){
  outs=0; balls=0; strikes=0;
  runners=[false,false,false]; inningScore=0;
  renderHUD(); renderInning(); renderScoreboard();
  drawField(0,0,0,0,'#ff6633');
  const title=half===0?T('halfIntroTop',inning):T('halfIntroBot',inning);
  let sub;
  if(MODE==='2p'){
    sub=T('halfIntroSub2pTop', half===0?1:2);
  } else {
    sub=half===0?T('halfIntroSubTop'):T('halfIntroSubBot');
  }
  showOverlay(title,sub,T('btnThrow'),()=>{
    hideOverlay();
    startAtBat();
  });
}

function startAtBat(){
  selectedCell=-1; selectedPitchType='straight';
  swingCell=-1; swingTiming=-1;
  flashResult('','#fff');
  document.querySelectorAll('.zc').forEach(c=>c.classList.remove('selected','pitch-landed','result-hit','result-miss'));
  if(isPitcherHuman()){
    if(MODE==='2p'){
      // Show pass screen for pitcher
      const who=half===0?2:1; // in top (team A bats), team B pitches = P2 pitches
      // Actually in 2p: top=P1 bats, P2 pitches; bottom=P2 bats, P1 pitches
      const pitcher=half===0?2:1;
      showPassScreen(T('pass2pPitch',pitcher),()=>{
        setPitcherPhase();
      });
    } else {
      setPitcherPhase();
    }
  } else {
    // CPU pitches - show brief animation
    const {cell,pt}=cpuPitch();
    pitchTargetCell=cell; pitchType=pt;
    selectedCell=cell; selectedPitchType=pt;
    setPitcherPhase(); // show grid briefly then auto-throw
    setTimeout(()=>doThrow(true),600);
  }
}

function setPitcherPhase(){
  phase='pitcher';
  renderZoneGrid(); renderPitchTypes(); renderActions();
  drawField(0,0,0,0,'#ff6633');
}

function doThrow(cpuAuto){
  if(!cpuAuto&&phase!=='pitcher') return;
  if(!cpuAuto&&selectedCell<0){
    // Default to center if nothing selected
    selectedCell=12;
  }
  pitchTargetCell=selectedCell; pitchType=selectedPitchType;

  if(isBatterHuman()){
    if(MODE==='2p'){
      const batter=half===0?1:2;
      showPassScreen(T('pass2pBat',batter),()=>{
        startBatterPhase();
      });
    } else {
      startBatterPhase();
    }
  } else {
    // CPU bats
    phase='batter_anim';
    renderZoneGrid(); renderPitchTypes(); renderActions();
    flashResult(T('pitching'),'#555');
    const {swingCell:sc,timing:tim}=cpuBat(pitchTargetCell,pitchType);
    swingCell=sc; swingTiming=tim;
    startPitchAnim(pitchTargetCell,pitchType,()=>{
      // For CPU, timing is pre-calculated
      resolveAtBat(sc,tim);
    });
  }
}

function startBatterPhase(){
  phase='batter_wait';
  swingCell=-1; swingTiming=-1;
  selectedCell=-1;
  renderZoneGrid(); renderPitchTypes(); renderActions();
  flashResult('','#fff');
  // Short delay then animate pitch
  setTimeout(()=>{
    phase='batter_anim';
    renderActions();
    startPitchAnim(pitchTargetCell,pitchType,()=>{
      // Pitch arrived with no swing
      resolveAtBat(swingCell,swingTiming);
    });
  },400);
}

function doSwing(){
  if(phase!=='batter_anim'&&phase!=='batter_wait') return;
  swingTiming=0.99; // will be overridden by actual t in animation
  if(phase==='batter_wait'){
    // Swung before animation - very early swing
    swingTiming=0.1;
    phase='batter_anim';
    startPitchAnim(pitchTargetCell,pitchType,()=>{
      resolveAtBat(swingCell,0.1);
    });
  } else {
    // During animation: record timing, animation will see swingTiming>=0 and call onArrive
    swingTiming=0.99; // Will be set to actual t value in animation step
  }
}

function doTake(){
  if(phase!=='batter_anim'&&phase!=='batter_wait') return;
  swingTiming=-1; // no swing
  if(animRaf){cancelAnimationFrame(animRaf);animRaf=null;}
  resolveAtBat(-1,-1);
}

function resolveAtBat(sc,tim){
  phase='result';
  const result=evaluateAtBat(pitchTargetCell,pitchType,sc,tim);
  showResultOnGrid(pitchTargetCell,sc,['HR','3B','2B','1B'].includes(result.type));

  let msg='', color='#eee';
  let delay=1200;

  if(result.type==='ball'){
    balls++; msg=T('resultBall'); color='#aaa';
    if(balls>=4){
      advanceRunners(1);
      balls=0;strikes=0;
      msg=T('resultWalk'); color='#00d4aa'; delay=1500;
    }
  } else if(result.type==='called_strike'||result.type==='miss'){
    strikes++;
    msg=result.type==='miss'?T('resultMiss'):T('resultStrikeCalled');
    color='#ff4444';
    if(strikes>=3){
      outs++; balls=0; strikes=0;
      msg+='\n'+T('resultOut'); delay=1500;
    }
  } else if(result.type==='foul'){
    if(strikes<2) strikes++;
    msg=T('resultFoul'); color='#ffaa00';
  } else if(['HR','3B','2B','1B'].includes(result.type)){
    applyHit(result.type);
    balls=0; strikes=0;
    if(result.type==='HR') {msg=T('resultHR');color='#ffd700';}
    else if(result.type==='3B') {msg=T('result3b');color='#ff9933';}
    else if(result.type==='2B') {msg=T('result2b');color='#00d4aa';}
    else {msg=T('result1b');color='#88ff88';}
  }

  flashResult(msg,color);
  renderHUD(); renderScoreboard();
  drawField(actualTarget.x,actualTarget.y,20,capAngle,pitchColor);

  const nextFn=()=>{
    if(outs>=3){
      endHalf();
    } else {
      startAtBat();
    }
  };
  setTimeout(nextFn, delay);
}

function endHalf(){
  if(half===0) scores.a[inning-1]=inningScore;
  else scores.b[inning-1]=inningScore;

  const wasHalf=half;
  const wasInning=inning;

  if(half===1){
    if(inning>=INNINGS){ endGame(); return; }
    inning++;
  }
  half=1-half;
  renderScoreboard();
  showOverlay(T('threeOuts'),'',T('btnThrow'),()=>{
    hideOverlay(); startHalf();
  });
}

function endGame(){
  phase='over';
  const ta=scores.a.reduce((s,v)=>s+(v||0),0);
  const tb=scores.b.reduce((s,v)=>s+(v||0),0);
  let result;
  if(MODE==='2p'){
    result=ta>tb?T('p1win'):tb>ta?T('p2win'):T('draw');
  } else {
    result=ta>tb?T('youWin'):tb>ta?T('cpuWin'):T('draw');
  }
  const detail=MODE==='2p'?T('score2pDetail',ta,tb):T('scoreDetail',ta,tb);
  showOverlay(T('gameOver'),result+'\n'+detail,T('playAgain'),()=>{
    hideOverlay();
    document.getElementById('screen-game').style.display='none';
    document.getElementById('screen-setup').style.display='flex';
  });
}

// ============================================================
// Overlays
// ============================================================
function showOverlay(title,sub,btnText,cb){
  const ov=document.getElementById('overlay');
  document.getElementById('ov-title').textContent=title;
  document.getElementById('ov-sub').textContent=sub||'';
  const btn=document.getElementById('ov-btn');
  btn.textContent=btnText;
  ov.classList.remove('hidden');
  btn.onclick=()=>{ if(cb) cb(); };
}
function hideOverlay(){ document.getElementById('overlay').classList.add('hidden'); }

function showPassScreen(sub,cb){
  const ps=document.getElementById('pass-screen');
  document.getElementById('pass-title').textContent=T('pass2pTitle');
  document.getElementById('pass-sub').textContent=sub;
  document.getElementById('pass-btn').textContent=T('passOk');
  ps.classList.remove('hidden');
  document.getElementById('pass-btn').onclick=()=>{
    ps.classList.add('hidden');
    if(cb) cb();
  };
}

// ============================================================
// Keyboard input
// ============================================================
document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){
    e.preventDefault();
    if(phase==='batter_anim'||phase==='batter_wait') doSwing();
    else if(phase==='pitcher'){
      const btn=document.querySelector('#action-area .act-btn');
      if(btn) btn.click();
    }
  }
});

// ============================================================
// Start game
// ============================================================
function startGame(){
  inning=1; half=0;
  scores={a:Array(9).fill(null),b:Array(9).fill(null)};
  outs=0;balls=0;strikes=0;runners=[false,false,false];inningScore=0;
  phase='idle';

  document.getElementById('screen-setup').style.display='none';
  document.getElementById('screen-game').style.display='flex';
  buildZoneGrid();
  applyLang(); renderHUD(); renderScoreboard(); renderInning();
  renderZoneGrid(); renderPitchTypes(); renderActions();
  drawField(0,0,0,0,'#ff6633');
  startHalf();
}

// ============================================================
// Canvas resize
// ============================================================
function resizeCanvas(){
  const maxW=Math.min(500,window.innerWidth-20);
  canvas.style.width=maxW+'px';
  canvas.style.height=Math.round(280*(maxW/500))+'px';
}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);

// Init
applyLang();
document.getElementById('screen-game').style.display='none';
</script>
</body>
</html>
