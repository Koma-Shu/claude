<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英語日記 添削 | ENGLISH</title>
  <link rel="manifest" href="english.webmanifest">
  <meta name="theme-color" content="#fb923c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="英語日記">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-eng-180.png">
  <link rel="icon" type="image/png" href="icon-eng-192.png">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    :root{
      --bg:#0d0d1a; --panel:#13131f; --panel2:#0f0f1a; --line:#222; --line2:#2a2a3a;
      --txt:#eee; --dim:#888; --dim2:#555; --accent:#fb923c; --accent2:#f97316;
      --good:#34d399; --warn:#fbbf24; --bad:#ff5566; --purple:#a78bfa; --pink:#f472b6; --blue:#60a5fa;
    }
    body{background:var(--bg);min-height:100vh;font-family:'Courier New',monospace;color:var(--txt);
      padding:58px 16px 64px;display:flex;flex-direction:column;align-items:center;}
    a{color:inherit;}
    #lang-btn{position:fixed;top:14px;left:14px;background:#1e1e2e;border:1px solid #444;border-radius:6px;color:#888;font-family:inherit;font-size:.72rem;padding:5px 10px;cursor:pointer;z-index:30;}
    #top-right{position:fixed;top:14px;right:14px;display:flex;gap:8px;z-index:30;}
    .top-btn{background:#1e1e2e;border:1px solid #444;border-radius:6px;color:#888;font-family:inherit;font-size:.72rem;padding:5px 10px;cursor:pointer;text-decoration:none;display:inline-block;transition:.15s;}
    .top-btn:hover{color:#eee;border-color:#666;}
    .top-btn.primary{border-color:var(--accent);color:var(--accent);}
    .wrap{width:100%;max-width:760px;}
    h1{font-size:1.55rem;letter-spacing:4px;color:var(--accent);text-align:center;margin-bottom:6px;text-shadow:0 0 20px rgba(251,146,60,.4);}
    .subtitle{color:var(--dim2);font-size:.72rem;letter-spacing:2px;text-align:center;margin-bottom:18px;}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;}
    .sec-title{font-size:.72rem;letter-spacing:3px;color:var(--dim);margin:22px 0 12px;display:flex;align-items:center;gap:10px;}
    .sec-title::after{content:"";flex:1;height:1px;background:var(--line);}
    .sec-title .hint{letter-spacing:0;color:var(--dim2);font-size:.64rem;}
    /* prompt / topic */
    .topic{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 13px;margin-bottom:12px;font-size:.78rem;color:var(--dim);line-height:1.6;}
    .topic b{color:var(--accent);}
    .topic .roll{margin-left:auto;background:#0a0a14;border:1px solid var(--line2);border-radius:7px;color:var(--dim);font-family:inherit;font-size:.66rem;padding:6px 9px;cursor:pointer;white-space:nowrap;}
    .topic .roll:hover{border-color:var(--accent);color:var(--accent);}
    .topic-lbl{color:var(--accent);font-size:.74rem;white-space:nowrap;font-weight:bold;}
    .topic-input{flex:1;min-width:120px;background:#0a0a14;border:1px solid var(--line2);border-radius:7px;color:var(--txt);font-family:inherit;font-size:.8rem;padding:8px 11px;outline:none;}
    .topic-input:focus{border-color:var(--accent);}
    .topic .roll.icon{padding:7px 10px;font-size:.9rem;}
    /* input */
    .date-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
    .date-row input[type=date]{background:#0a0a14;border:1px solid var(--line2);border-radius:7px;color:var(--txt);font-family:inherit;font-size:.8rem;padding:7px 10px;outline:none;}
    .date-row input[type=date]:focus{border-color:var(--accent);}
    .count{margin-left:auto;font-size:.66rem;color:var(--dim2);}
    textarea.diary{width:100%;min-height:170px;background:#0a0a14;border:1px solid var(--line2);border-radius:10px;color:var(--txt);font-family:inherit;font-size:.95rem;line-height:1.8;padding:14px 16px;outline:none;resize:vertical;}
    textarea.diary:focus{border-color:var(--accent);}
    .mic-row{display:flex;align-items:center;gap:10px;margin-top:11px;flex-wrap:wrap;}
    .mic-btn{display:flex;align-items:center;gap:8px;background:#0a0a14;border:1px solid var(--line2);border-radius:9px;color:var(--txt);font-family:inherit;font-size:.84rem;padding:11px 18px;cursor:pointer;transition:.15s;}
    .mic-btn:hover{border-color:var(--accent);}
    .mic-btn.rec{border-color:var(--bad);color:#ff8a99;background:rgba(255,85,102,.08);}
    .mic-dot{width:9px;height:9px;border-radius:50%;background:var(--dim2);}
    .mic-btn.rec .mic-dot{background:var(--bad);animation:pulse 1s infinite;}
    @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
    .mic-note{font-size:.64rem;color:var(--dim2);line-height:1.6;flex:1;min-width:180px;}
    .clear-btn{background:none;border:none;color:var(--dim2);font-family:inherit;font-size:.66rem;cursor:pointer;text-decoration:underline;}
    /* actions */
    .actions{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
    .act-primary{display:flex;gap:10px;flex-wrap:wrap;}
    .btn{background:#0a0a14;border:1px solid var(--line2);border-radius:9px;color:var(--txt);font-family:inherit;font-size:.82rem;padding:12px 18px;cursor:pointer;letter-spacing:1px;transition:.13s;display:inline-flex;align-items:center;gap:8px;justify-content:center;}
    .btn:hover{border-color:var(--accent);color:var(--accent);}
    .btn.solid{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1a0f00;font-weight:bold;border:none;flex:1;min-width:180px;}
    .btn.solid:hover{opacity:.92;color:#1a0f00;}
    .btn:disabled{opacity:.45;cursor:not-allowed;}
    .btn.danger:hover{border-color:var(--bad);color:var(--bad);}
    .handoff{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
    .handoff .lbl{font-size:.66rem;color:var(--dim2);letter-spacing:1px;width:100%;}
    .handoff .btn{flex:1;min-width:120px;font-size:.74rem;padding:10px;}
    .spinner{width:15px;height:15px;border:2px solid rgba(26,15,0,.35);border-top-color:#1a0f00;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .err{margin-top:12px;background:rgba(255,85,102,.08);border:1px solid #5c1d28;border-radius:9px;padding:11px 14px;font-size:.76rem;color:#ff8a99;line-height:1.7;white-space:pre-wrap;}
    /* feedback (rendered markdown) */
    .fb{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 12px 12px 0;padding:18px 20px;font-size:.85rem;line-height:1.9;color:#d6d6de;}
    .fb h3{color:var(--accent);font-size:.92rem;letter-spacing:1px;margin:18px 0 8px;}
    .fb h3:first-child{margin-top:0;}
    .fb h4{color:var(--blue);font-size:.82rem;margin:14px 0 6px;}
    .fb p{margin:8px 0;}
    .fb ul{margin:8px 0 8px 20px;} .fb li{margin:5px 0;}
    .fb strong{color:var(--txt);}
    .fb code{background:#171723;border:1px solid var(--line2);border-radius:5px;padding:1px 6px;font-size:.82em;color:#ffd9b3;}
    .fb-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px;}
    .elsa-note{margin-top:12px;font-size:.72rem;color:var(--dim);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px 13px;line-height:1.7;}
    .elsa-note a{color:var(--blue);}
    /* history */
    .hist-list{display:flex;flex-direction:column;gap:9px;}
    .hist-item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:.13s;}
    .hist-item:hover{border-color:#444;}
    .hist-date{font-size:.72rem;color:var(--accent);white-space:nowrap;}
    .hist-prev{flex:1;font-size:.74rem;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .hist-badge{font-size:.58rem;border:1px solid var(--line2);border-radius:20px;padding:2px 8px;color:var(--dim2);white-space:nowrap;}
    .hist-del{background:none;border:none;color:var(--dim2);font-family:inherit;cursor:pointer;font-size:.9rem;}
    .hist-del:hover{color:var(--bad);}
    .hist-empty{color:var(--dim2);font-size:.78rem;text-align:center;padding:14px;}
    /* settings */
    .set-field{margin-bottom:13px;}
    .set-field label{font-size:.7rem;color:var(--dim);display:block;margin-bottom:7px;letter-spacing:1px;}
    .set-field input,.set-field select,.set-field textarea{width:100%;background:#0a0a14;border:1px solid var(--line2);border-radius:7px;color:var(--txt);font-family:inherit;font-size:.84rem;padding:10px 12px;outline:none;}
    .set-field input:focus,.set-field select:focus,.set-field textarea:focus{border-color:var(--accent);}
    .set-field .u{font-size:.62rem;color:var(--dim2);margin-top:5px;line-height:1.6;}
    .set-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .keyrow{display:flex;gap:8px;}
    .keyrow input{flex:1;}
    .keyrow button{background:#0a0a14;border:1px solid var(--line2);border-radius:7px;color:var(--dim);font-family:inherit;font-size:.66rem;padding:0 11px;cursor:pointer;white-space:nowrap;}
    .keyrow button:hover{border-color:var(--accent);color:var(--accent);}
    .warn-box{background:#1a1408;border:1px solid #4a3a1a;border-radius:9px;padding:11px 14px;font-size:.7rem;color:#caa84a;line-height:1.8;margin-bottom:14px;}
    .footnote{font-size:.66rem;color:var(--dim2);text-align:center;line-height:1.8;margin-top:24px;}
    .hidden{display:none!important;}
    .gate{width:100%;max-width:520px;min-height:58vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;margin:0 auto;}
    .gate-card{background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:32px 26px;max-width:440px;margin-top:20px;}
    .gate-ico{font-size:2.6rem;margin-bottom:14px;}
    .gate-h{font-size:1.1rem;color:var(--accent);letter-spacing:2px;margin-bottom:12px;}
    .gate-p{font-size:.8rem;color:var(--dim);line-height:1.95;margin-bottom:22px;}
    .gate-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
    .gate-actions .btn{text-decoration:none;}
    @media(max-width:560px){ .set-grid{grid-template-columns:1fr;} h1{font-size:1.3rem;} }
  </style>
</head>
<body>
<button id="lang-btn">EN</button>
<div id="top-right">
  <a href="english.html" class="top-btn" id="back-btn">← ENGLISH</a>
  <span id="auth-area"></span>
</div>

<div class="wrap" id="app-wrap">
  <h1 id="t-title">英語日記 添削</h1>
  <div class="subtitle" id="t-subtitle">口頭で話して、表現・構成・構文をAIで添削</div>

  <!-- ── INPUT ── -->
  <div class="panel">
    <div class="topic" id="topic">
      <span class="topic-lbl" id="topic-lbl">お題</span>
      <input type="text" id="topic-input" class="topic-input" autocomplete="off">
      <button class="roll icon" id="topic-save" title="">☆</button>
      <button class="roll" id="topic-roll">🎲 <span id="t-roll">生成</span></button>
    </div>
    <div class="date-row">
      <span style="font-size:.72rem;color:var(--dim);" id="t-date">日付</span>
      <input type="date" id="diary-date">
      <span class="count" id="count">0 words</span>
    </div>
    <textarea class="diary" id="diary" placeholder=""></textarea>
    <div class="mic-row">
      <button class="mic-btn" id="mic"><span class="mic-dot"></span><span id="mic-label">🎤 録音して入力</span></button>
      <button class="clear-btn" id="clear">クリア</button>
      <span class="mic-note" id="mic-note"></span>
    </div>
  </div>

  <!-- ── ACTIONS ── -->
  <div class="actions">
    <div class="act-primary">
      <button class="btn solid" id="run-ai"><span id="run-label">🤖 AIで添削する</span></button>
      <button class="btn" id="open-settings">⚙ <span id="t-settings">設定</span></button>
    </div>
    <div class="handoff">
      <span class="lbl" id="t-handoff">APIキーを使わず、契約中のAIに渡す：</span>
      <button class="btn" id="copy-prompt">📋 <span id="t-copy">プロンプトをコピー</span></button>
      <button class="btn" data-ext="https://claude.ai/new">Claude</button>
      <button class="btn" data-ext="https://chatgpt.com/">ChatGPT</button>
      <button class="btn" data-ext="https://gemini.google.com/app">Gemini</button>
    </div>
    <div id="err" class="err hidden"></div>
  </div>

  <!-- ── FEEDBACK ── -->
  <div id="fb-section" class="hidden">
    <div class="sec-title" id="t-fb">添削結果</div>
    <div class="fb" id="fb"></div>
    <div class="fb-actions">
      <button class="btn" id="copy-fb" style="font-size:.74rem;padding:9px 14px;">📋 <span id="t-copyfb">結果をコピー</span></button>
    </div>
    <div class="elsa-note" id="elsa-note"></div>
  </div>

  <!-- ── HISTORY ── -->
  <div class="sec-title"><span id="t-hist">これまでの日記</span> <span class="hint" id="t-hist-hint">— タップで開く</span></div>
  <div class="hist-list" id="hist"></div>

  <!-- ── SETTINGS ── -->
  <div id="settings" class="hidden">
    <div class="sec-title" id="t-set">設定</div>
    <div class="panel">
      <div class="warn-box" id="t-warn"></div>
      <div class="set-field">
        <label id="t-prov">添削に使うAI（自分のAPIキーで実行）</label>
        <select id="set-provider">
          <option value="claude">Claude（Anthropic）</option>
          <option value="openai">ChatGPT（OpenAI）</option>
          <option value="gemini">Gemini（Google）</option>
        </select>
        <div class="u" id="t-prov-u">Claude を既定にしています（モデルは下で変更可）。</div>
      </div>
      <div class="set-grid">
        <div class="set-field">
          <label id="t-model">モデル</label>
          <input type="text" id="set-model" autocomplete="off">
          <div class="u" id="t-model-u"></div>
        </div>
        <div class="set-field">
          <label id="t-key">APIキー</label>
          <div class="keyrow">
            <input type="password" id="set-key" autocomplete="off" placeholder="sk-...">
            <button id="key-toggle">表示</button>
          </div>
          <div class="u" id="t-key-u">この端末にのみ保存されます。</div>
        </div>
      </div>
      <div class="set-grid">
        <div class="set-field">
          <label id="t-stt">音声入力の言語</label>
          <select id="set-stt">
            <option value="en-US">English (US)</option>
            <option value="en-GB">English (UK)</option>
            <option value="en-AU">English (AU)</option>
          </select>
        </div>
        <div class="set-field">
          <label id="t-profile">学習者プロフィール（添削の前提）</label>
          <textarea id="set-profile" rows="3" style="resize:vertical;"></textarea>
        </div>
      </div>
      <div class="set-field">
        <label id="t-mytopics">マイお題（1行に1つ・🎲の候補になります）</label>
        <textarea id="set-topics" rows="4" style="resize:vertical;" placeholder=""></textarea>
      </div>
      <div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:6px;">
        <button class="btn solid" id="set-save" style="flex:0 0 auto;min-width:120px;">保存</button>
        <button class="btn danger" id="set-clearkey">このAIのキーを削除</button>
      </div>
    </div>
  </div>

  <div class="footnote" id="footnote"></div>
</div>

<!-- ── ADMIN GATE ── -->
<div class="gate hidden" id="gate"></div>

<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);

// ── admin gate ──────────────────────────────────────────────────────────────
function getUser(){ try{ return JSON.parse(localStorage.getItem('arcade_user')||'null'); }catch(_){ return null; } }
function isAdmin(){
  try{ if (sessionStorage.getItem('arcade_admin')==='1') return true; }catch(_){}
  const u = getUser(); return !!(u && u.username==='admin');
}

let lang = localStorage.getItem('lang') || 'ja';

// ── persistence ─────────────────────────────────────────────────────────────
let user = getUser();
function cfgKey(){ return 'engdiary_cfg_v1_' + (user ? user.id : 'guest'); }
function dataKey(){ return 'engdiary_v1_' + (user ? user.id : 'guest'); }
const DEF_PROFILE = 'TOEIC 820 / Versant 55。目標はビジネスレベルの英会話と、字幕なしで洋画・洋楽を楽しむこと。PROGRITのプログラム後に学習を再開中。';
const DEF_MODELS = { claude:'claude-opus-4-8', openai:'gpt-4o-mini', gemini:'gemini-2.0-flash' };
function loadCfg(){
  try{
    const o = JSON.parse(localStorage.getItem(cfgKey()) || '{}');
    return {
      provider: o.provider || 'claude',
      models: Object.assign({}, DEF_MODELS, o.models || {}),
      keys: Object.assign({ claude:'', openai:'', gemini:'' }, o.keys || {}),
      sttLang: o.sttLang || 'en-US',
      profile: o.profile || DEF_PROFILE,
      topic: o.topic || '',
      customTopics: Array.isArray(o.customTopics) ? o.customTopics : []
    };
  }catch(_){ return { provider:'claude', models:Object.assign({},DEF_MODELS), keys:{claude:'',openai:'',gemini:''}, sttLang:'en-US', profile:DEF_PROFILE, topic:'', customTopics:[] }; }
}
let cfg = loadCfg();
function saveCfg(){ try{ localStorage.setItem(cfgKey(), JSON.stringify(cfg)); }catch(_){} }
function loadData(){ try{ const o=JSON.parse(localStorage.getItem(dataKey())||'{}'); return { entries:o.entries||[] }; }catch(_){ return { entries:[] }; } }
let DB = loadData();
function saveData(){ try{ localStorage.setItem(dataKey(), JSON.stringify(DB)); }catch(_){} }

// 学習日は午前3時で切り替え（00:00–02:59は前日扱い、english.html と統一）
function todayStr(){ const d=new Date(Date.now()-3*3600000); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

// ════════════════════════════════════════════════════════════════════════════
//  PROMPT + PROVIDERS (pure — no DOM)
// ════════════════════════════════════════════════════════════════════════════
function sysInstruction(profile){
  return `あなたはプロの英語ライティングコーチ兼校正者です。学習者は日本人のビジネスパーソンで、背景は「${profile}」。
以下は学習者が口頭で吹き込んだ英語日記です。音声入力なので、明らかな認識ミス（句読点や大文字小文字など）は意味に影響する場合のみ触れ、実際の英語の誤りと自然さの改善に集中してください。

出力は必ず次のMarkdown構成で、説明は日本語、英文はそのまま英語で書いてください。前置き・メタ的な説明・締めの挨拶は書かず、添削結果のみを出力すること。

## ✅ 添削後（自然な英語）
（自然でビジネスにふさわしいが、不自然に硬すぎない英語の全文）

## ✍️ 主な修正点
- **原文の語句** → **修正後** — 種類（文法／構文／語法／語彙／自然さ）：日本語で簡潔に理由

## 🧩 構成・流れ
（論理構成や話の流れへのフィードバックを日本語で2〜4点。箇条書き）

## 💡 もっと自然な言い回し
- よりネイティブらしい代替表現（英語）＋ 一言ニュアンス解説（日本語）

## 🌟 良かった点
- うまく書けている点（日本語で1〜3点）

## 📈 レベル目安と次の一歩
CEFR／英検の目安と、次に意識すべきポイント2点（日本語）`;
}
function userContent(text){ return `今日の英語日記:\n\n${text}`; }
function handoffPrompt(text, profile){ return sysInstruction(profile) + '\n\n----\n\n' + userContent(text); }

// Build the HTTP request for a provider. Pure: returns {url, headers, body}.
function providerRequest(provider, text, key, model, profile){
  const sys = sysInstruction(profile), usr = userContent(text);
  if (provider === 'claude'){
    return {
      url: 'https://api.anthropic.com/v1/messages',
      headers: {
        'content-type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: { model: model || 'claude-opus-4-8', max_tokens: 4096, system: sys,
              messages: [{ role:'user', content: usr }] }
    };
  }
  if (provider === 'openai'){
    return {
      url: 'https://api.openai.com/v1/chat/completions',
      headers: { 'content-type':'application/json', 'Authorization':'Bearer ' + key },
      body: { model: model || 'gpt-4o-mini',
              messages: [{ role:'system', content: sys }, { role:'user', content: usr }] }
    };
  }
  // gemini
  return {
    url: 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model || 'gemini-2.0-flash') + ':generateContent?key=' + encodeURIComponent(key),
    headers: { 'content-type':'application/json' },
    body: { systemInstruction: { parts:[{ text: sys }] },
            contents: [{ role:'user', parts:[{ text: usr }] }] }
  };
}
// Extract the markdown text (or throw a human-readable error).
function parseResponse(provider, data){
  if (provider === 'claude'){
    if (data && data.stop_reason === 'refusal') throw new Error(lang==='ja'?'AIが安全上の理由で添削を断りました。内容を見直してください。':'The model refused for safety reasons. Revise the content.');
    if (!data || data.type === 'error' || data.error) throw new Error((data && data.error && data.error.message) || 'API error');
    const t = (data.content || []).filter(b=>b.type==='text').map(b=>b.text).join('').trim();
    if (!t) throw new Error(lang==='ja'?'空の応答でした。':'Empty response.');
    return t;
  }
  if (provider === 'openai'){
    if (!data || data.error) throw new Error((data && data.error && data.error.message) || 'API error');
    const t = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    if (!t) throw new Error(lang==='ja'?'空の応答でした。':'Empty response.');
    return t.trim();
  }
  // gemini
  if (!data || data.error) throw new Error((data && data.error && data.error.message) || 'API error');
  const cand = data.candidates && data.candidates[0];
  if (cand && cand.finishReason === 'SAFETY') throw new Error(lang==='ja'?'安全フィルタにより添削できませんでした。':'Blocked by the safety filter.');
  const t = cand && cand.content && cand.content.parts && cand.content.parts.map(p=>p.text||'').join('');
  if (!t) throw new Error(lang==='ja'?'空の応答でした。':'Empty response.');
  return t.trim();
}

// ── minimal, safe markdown → HTML (headings, lists, bold, inline code) ───────
function escapeHTML(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function inlineMd(s){
  let h = escapeHTML(s);
  h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
  h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
  return h;
}
function mdToHtml(md){
  const lines = String(md).replace(/\r/g,'').split('\n');
  let html = '', inList = false, para = [];
  const flushP = ()=>{ if(para.length){ html += '<p>' + para.map(inlineMd).join('<br>') + '</p>'; para = []; } };
  const closeList = ()=>{ if(inList){ html += '</ul>'; inList = false; } };
  for (let raw of lines){
    const line = raw.replace(/\s+$/,'');
    let m;
    if ((m = /^###\s+(.*)$/.exec(line))){ flushP(); closeList(); html += '<h4>'+inlineMd(m[1])+'</h4>'; }
    else if ((m = /^##\s+(.*)$/.exec(line))){ flushP(); closeList(); html += '<h3>'+inlineMd(m[1])+'</h3>'; }
    else if ((m = /^#\s+(.*)$/.exec(line))){ flushP(); closeList(); html += '<h3>'+inlineMd(m[1])+'</h3>'; }
    else if ((m = /^\s*[-*]\s+(.*)$/.exec(line))){ flushP(); if(!inList){ html += '<ul>'; inList = true; } html += '<li>'+inlineMd(m[1])+'</li>'; }
    else if (line.trim() === ''){ flushP(); closeList(); }
    else { if(inList) closeList(); para.push(line); }
  }
  flushP(); closeList();
  return html;
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recording = false;
function setMic(){ const b=$('mic'); b.classList.toggle('rec', recording); $('mic-label').textContent = recording ? T('micStop') : T('micStart'); }
function toggleRec(){
  if (!SR){ alert(T('micNote')); $('diary').focus(); return; }
  if (recording){ try{ rec.stop(); }catch(_){} return; }
  rec = new SR(); rec.lang = cfg.sttLang || 'en-US'; rec.continuous = true; rec.interimResults = true;
  let base = $('diary').value ? $('diary').value.replace(/\s+$/,'') + ' ' : '';
  let finalAdd = '';
  rec.onresult = e=>{
    let interim = '';
    for (let i=e.resultIndex; i<e.results.length; i++){
      const tr = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalAdd += tr.replace(/\s+$/,'') + ' '; else interim += tr;
    }
    $('diary').value = base + finalAdd + interim;
    updateCount();
  };
  rec.onend = ()=>{ base = $('diary').value ? $('diary').value.replace(/\s+$/,'') + ' ' : ''; finalAdd=''; recording=false; setMic(); };
  rec.onerror = ev=>{ recording=false; setMic(); if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){ alert(lang==='ja'?'マイクの使用が許可されていません。':'Microphone permission denied.'); } };
  try{ rec.start(); recording=true; setMic(); }catch(_){ recording=false; setMic(); }
}

function setBusy(v){ busy=v; const b=$('run-ai'); b.disabled=v; $('run-label').innerHTML = v ? (T('running')+' <span class="spinner"></span>') : T('run'); }
function showErr(msg){ const e=$('err'); e.classList.remove('hidden'); e.textContent = msg; }

function showFeedback(md){ $('fb').innerHTML = mdToHtml(md); $('fb-section').classList.remove('hidden'); $('fb-section').scrollIntoView({behavior:'smooth',block:'start'}); }

async function runAI(){
  clearErr();
  const text = $('diary').value.trim();
  if (!text){ showErr(T('needText')); return; }
  const key = (cfg.keys||{})[cfg.provider];
  if (!key){ showErr(T('needKey')); openSettings(); return; }
  setBusy(true);
  try{
    const req = providerRequest(cfg.provider, text, key, cfg.models[cfg.provider], cfg.profile);
    const res = await fetch(req.url, { method:'POST', headers:req.headers, body:JSON.stringify(req.body) });
    let data; try{ data = await res.json(); }catch(_){ data = null; }
    if (!res.ok){
      const apiMsg = data && (data.error && data.error.message || data.message);
      throw new Error('HTTP ' + res.status + (apiMsg ? ' — ' + apiMsg : ''));
    }
    const md = parseResponse(cfg.provider, data);
    showFeedback(md);
    saveEntry(text, md, cfg.provider);
  }catch(err){
    let m = err && err.message ? err.message : String(err);
    if (/Failed to fetch|NetworkError|CORS/i.test(m)) m += lang==='ja' ? '\n（通信エラー。キー・モデル名・ネットワークをご確認ください。Claude推奨。）' : '\n(Network/CORS error. Check key, model and connection. Claude recommended.)';
    showErr(m);
  }finally{ setBusy(false); }
}

function saveEntry(text, feedback, provider){
  const date = $('diary-date').value || todayStr();
  DB.entries.unshift({ id:'d'+Date.now(), date, ts:Date.now(), text, feedback, provider });
  DB.entries = DB.entries.slice(0, 100);
  saveData();
  renderHistory();
}
function renderHistory(){
  const wrap = $('hist');
  if (!DB.entries.length){ wrap.innerHTML = `<div class="hist-empty">${T('histEmpty')}</div>`; return; }
  wrap.innerHTML = DB.entries.map(e=>{
    const prev = (e.text||'').replace(/\s+/g,' ').slice(0,60);
    return `<div class="hist-item" data-id="${e.id}">
      <span class="hist-date">${e.date}</span>
      <span class="hist-prev">${escapeHTML(prev)}</span>
      <span class="hist-badge">${e.provider||''}</span>
      <button class="hist-del" data-del="${e.id}" title="delete">🗑</button>
    </div>`;
  }).join('');
  wrap.querySelectorAll('[data-id]').forEach(el=> el.onclick = (ev)=>{ if(ev.target.dataset.del) return; openEntry(el.dataset.id); });
  wrap.querySelectorAll('[data-del]').forEach(b=> b.onclick = (ev)=>{ ev.stopPropagation(); DB.entries = DB.entries.filter(x=>x.id!==b.dataset.del); saveData(); renderHistory(); });
}

  const e = DB.entries.find(x=>x.id===id); if(!e) return;

    cfg.sttLang = $('set-stt').value;
    cfg.profile = $('set-profile').value.trim() || DEF_PROFILE;
    cfg.customTopics = $('set-topics').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,50);
    saveCfg(); fillSettings(); applyChrome();
    flash($('set-save'), T('saved'));
  };
  $('set-clearkey').onclick = ()=>{ const p=$('set-provider').value; cfg.keys[p]=''; $('set-key').value=''; saveCfg(); };
}

// ── boot ─────────────────────────────────────────────────────────────────────
// Directly accessible by URL so a saved/bookmarked link always opens the diary
// (unlisted on the public portal; data + API keys stay per-device).
$('diary-date').value = todayStr();
$('diary-date').max = todayStr();   // 未来日付は不可
wire(); applyChrome(); updateCount();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body>
</html>
