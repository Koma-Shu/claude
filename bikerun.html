<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>チャリ走 - BIKE RUSH</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d1a;
      display: flex; flex-direction: column; align-items: center;
      justify-content: flex-start; min-height: 100vh;
      padding: 16px 10px 40px;
      font-family: 'Courier New', monospace; color: #e0e0e0;
    }
    h1 { font-size: 1.8rem; margin-bottom: 8px; color: #00d4aa; letter-spacing: 4px; }
    #info { display: flex; gap: 20px; margin-bottom: 6px; font-size: 0.9rem; flex-wrap: wrap; justify-content: center; }
    #info span { color: #00d4aa; font-weight: bold; }
    #global-best { font-size: 0.72rem; color: #555; margin-bottom: 8px; text-align: center; }
    #global-best b { color: #ffd700; }
    canvas { display: block; border: 2px solid #00d4aa; box-shadow: 0 0 20px rgba(0,212,170,0.4); max-width: 100%; }
    #message { margin-top: 10px; font-size: 0.85rem; color: #aaa; height: 1.2em; text-align: center; }

    #lang-btn { position: fixed; top: 14px; left: 14px; background: #1e1e2e; border: 1px solid #444; border-radius: 6px; color: #888; font-family: 'Courier New', monospace; font-size: .72rem; padding: 5px 10px; cursor: pointer; z-index: 10; }
    #back-btn { position: fixed; top: 14px; right: 14px; background: #1e1e2e; border: 1px solid #444; border-radius: 6px; color: #888; font-family: 'Courier New', monospace; font-size: 0.72rem; padding: 5px 10px; cursor: pointer; letter-spacing: 1px; z-index: 10; text-decoration: none; display: inline-block; }

    #bottom-section { margin-top: 20px; width: 100%; max-width: 500px; }

    .section-title { font-size: 0.65rem; letter-spacing: 3px; color: #555; margin-bottom: 10px; text-align: center; }
    #leaderboard-list { font-size: 0.75rem; }
    .lb-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #1a1a2a; color: #666; }
    .lb-rank { color: #444; width: 24px; }
    .lb-name { flex: 1; color: #888; }
    .lb-score { color: #00d4aa; font-weight: bold; }
    .lb-rank.gold { color: #ffd700; } .lb-rank.silver { color: #aaa; } .lb-rank.bronze { color: #cd7f32; }
    .lb-empty { color: #333; text-align: center; padding: 8px 0; font-size: 0.72rem; }

    #rating-toggle { cursor: pointer; font-size: 0.8rem; color: #555; letter-spacing: 2px; text-align: center; padding: 6px; }
    #rating-toggle:hover { color: #00d4aa; }
    #rating-form { display: none; margin-top: 10px; }
    #rating-form.open { display: block; }
    #star-input { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; }
    .star { font-size: 1.8rem; cursor: pointer; color: #333; transition: color 0.1s; -webkit-tap-highlight-color: transparent; }
    .star.active { color: #ffd700; }
    #comment-input { width: 100%; background: #0d0d1a; border: 1px solid #333; border-radius: 6px; color: #ccc; font-family: 'Courier New', monospace; font-size: 0.78rem; padding: 8px 10px; resize: vertical; min-height: 60px; margin-bottom: 10px; }
    #submit-rating { display: block; width: 100%; padding: 9px; background: linear-gradient(135deg, #00d4aa, #0088cc); border: none; border-radius: 6px; color: #000; font-family: 'Courier New', monospace; font-size: 0.8rem; letter-spacing: 2px; cursor: pointer; font-weight: bold; }
    #submit-rating:hover { opacity: 0.85; }
    #ratings-list { margin-top: 12px; }
    .rating-item { border-top: 1px solid #1a1a2a; padding: 8px 0; font-size: 0.75rem; }
    .rating-stars { color: #ffd700; font-size: 0.9rem; }
    .rating-date { color: #444; margin-left: 8px; font-size: 0.65rem; }
    .rating-comment { color: #777; margin-top: 4px; line-height: 1.5; }
    .avg-display { text-align: center; font-size: 0.8rem; color: #666; margin-bottom: 6px; }
    .avg-display span { color: #ffd700; }
    .status-msg { font-size: 0.65rem; color: #444; text-align: center; margin-top: 4px; }

    #score-dialog { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 20; align-items: center; justify-content: center; }
    #score-dialog.open { display: flex; }
    #score-dialog-inner { background: #13131f; border: 1px solid #333; border-radius: 12px; padding: 24px; width: 300px; text-align: center; }
    #score-dialog h3 { color: #00d4aa; letter-spacing: 4px; margin-bottom: 8px; }
    #score-dialog p { color: #888; font-size: 0.8rem; margin-bottom: 16px; }
    #player-name-input { width: 100%; background: #0d0d1a; border: 1px solid #333; border-radius: 6px; color: #ccc; font-family: 'Courier New', monospace; font-size: 0.9rem; padding: 8px 10px; margin-bottom: 12px; text-align: center; }
    .dialog-btns { display: flex; gap: 8px; }
    .dialog-btn { flex: 1; padding: 9px; border: none; border-radius: 6px; font-family: 'Courier New', monospace; font-size: 0.8rem; cursor: pointer; letter-spacing: 1px; font-weight: bold; }
    #btn-submit-score { background: linear-gradient(135deg, #00d4aa, #0088cc); color: #000; }
    #btn-skip-score { background: #222; color: #555; }
  </style>
  <script src="sound.js"></script>
</head>
<body>
  <button id="lang-btn">EN</button>
  <a id="back-btn" href="index.html">← ARCADE</a>

  <h1 id="game-title">チャリ走</h1>
  <div id="info">
    <span id="lbl-score">スコア:</span> <span id="score">0</span>

  <div id="bottom-section">

          <span class="star" data-v="3">★</span><span class="star" data-v="4">★</span>
          <span class="star" data-v="5">★</span>

        <div class="status-msg" id="rating-status"></div>
      </div>
      <div id="ratings-list"></div>
    </div>
  </div>

  <!-- スコア投稿ダイアログ -->
  <div id="score-dialog">
    <div id="score-dialog-inner">
      <h3>GAME OVER</h3>
      <p id="dialog-msg"></p>
      <input id="player-name-input" type="text" placeholder="名前（任意）" maxlength="20">
      <div class="dialog-btns">
        <button class="dialog-btn" id="btn-submit-score">登録</button>
        <button class="dialog-btn" id="btn-skip-score">スキップ</button>
      </div>
    </div>
  </div>

<script>
const SUPABASE_URL = 'https://qveznkwqfjjtjxqxdyls.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Eu8ppaJ-BxQvwGyj1UlNjw_vyywq8ge';
const GAME = 'bikerun';

// ── i18n ─────────────────────────────────────────────────────
const LANG = {
  ja: {
    title: 'チャリ走', score: 'スコア:', hi: 'ハイスコア:',
    tap: 'タップまたはSPACEでスタート', restart: 'スペース/タップでリスタート',
    submit: '登録', skip: 'スキップ', name: '名前（任意）', sending: '送信中...',
    rateGame: 'このゲームを評価する', noRatings: 'まだ評価がありません',
    submitRating: '送信', commentPlaceholder: 'コメント（任意）...',
    noScores: 'まだスコアがありません', ratingCount: '件の評価',
    dialogMsg: 'スコア ', dialogSuffix: ' をランキングに登録しますか？',
    sendFail: '送信失敗。後でお試しください。', starAlert: '星を選んでください',
    loading: '読み込み中...',
  },
  en: {
    title: 'BIKE RUSH', score: 'Score:', hi: 'Hi-Score:',
    tap: 'Space or Tap to Start', restart: 'Space/Tap to Restart',
    submit: 'Submit', skip: 'Skip', name: 'Name (optional)', sending: 'Sending...',
    rateGame: 'Rate this game', noRatings: 'No ratings yet',
    submitRating: 'Submit', commentPlaceholder: 'Comment (optional)...',
    noScores: 'No scores yet', ratingCount: ' ratings',
    dialogMsg: 'Score ', dialogSuffix: ' — register to leaderboard?',
    sendFail: 'Send failed. Please try again.', starAlert: 'Please select a star rating',
    loading: 'Loading...',
  }
};
let lang = localStorage.getItem('lang') || 'ja';
function T(k) { return (LANG[lang] || LANG.ja)[k] || k; }
function applyLang() {
  document.getElementById('lang-btn').textContent = lang === 'ja' ? 'EN' : 'JA';
  document.documentElement.lang = lang;
  document.getElementById('game-title').textContent = T('title');
  document.getElementById('lbl-score').textContent = T('score');
  document.getElementById('lbl-hi').textContent = T('hi');
  document.getElementById('lbl-rate').textContent = T('rateGame');
  document.getElementById('comment-input').placeholder = T('commentPlaceholder');
  document.getElementById('submit-rating').textContent = T('submitRating');
  document.getElementById('player-name-input').placeholder = T('name');
  document.getElementById('btn-submit-score').textContent = T('submit');
  document.getElementById('btn-skip-score').textContent = T('skip');
  if (!gameRunning) document.getElementById('message').textContent = T('tap');
}
document.getElementById('lang-btn').addEventListener('click', () => {
  lang = lang === 'ja' ? 'en' : 'ja';
  localStorage.setItem('lang', lang);
  applyLang();
});

// ── Supabase helpers ──────────────────────────────────────────
async function sbFetch(path, options = {}) {
  const res = await fetch(SUPABASE_URL + path, {
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal',
      ...options.headers
    },
    ...options
  });
  if (!res.ok && res.status !== 201) throw new Error(await res.text());
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function loadLeaderboard() {
  try {
    const data = await sbFetch(`/rest/v1/scores?game=eq.${GAME}&order=score.desc&limit=10&select=score,player_name`);
    const el = document.getElementById('leaderboard-list');
    if (!data || !data.length) { el.innerHTML = `<div class="lb-empty">${T('noScores')}</div>`; return; }
    const medals = ['gold', 'silver', 'bronze'];
    el.innerHTML = data.map((r, i) => `
      <div class="lb-row">
        <span class="lb-rank ${medals[i] || ''}">${i + 1}</span>
        <span class="lb-name">${(r.player_name || 'Anonymous').replace(/</g, '&lt;')}</span>
        <span class="lb-score">${r.score}</span>
      </div>`).join('');
    if (data[0]) {
      document.getElementById('gb-score').textContent = data[0].score;
      document.getElementById('gb-name').textContent = '(' + (data[0].player_name || 'Anonymous') + ')';
    }
  } catch (e) { console.error(e); }
}

async function submitScore(score, playerName) {
  await sbFetch('/rest/v1/scores', {
    method: 'POST',
    body: JSON.stringify({ game: GAME, score, player_name: playerName || 'Anonymous' })
  });
  loadLeaderboard();
}

async function loadRatings() {
  try {
    const data = await sbFetch(`/rest/v1/ratings?game=eq.${GAME}&order=created_at.desc&limit=20&select=stars,comment,created_at`);
    renderRatings(data || []);
    updateAvgBadge(data || []);
  } catch (e) { renderRatings([]); }
}

async function submitRating(stars, comment) {
  await sbFetch('/rest/v1/ratings', {
    method: 'POST',
    body: JSON.stringify({ game: GAME, stars, comment })
  });
  loadRatings();
}

function renderRatings(list) {
  const el = document.getElementById('ratings-list');
  if (!list.length) { el.innerHTML = `<div class="lb-empty">${T('noRatings')}</div>`; return; }
  el.innerHTML = list.map(r => {
    const d = new Date(r.created_at).toLocaleDateString('ja-JP');
    return `<div class="rating-item">
      <span class="rating-stars">${'★'.repeat(r.stars)}${'☆'.repeat(5 - r.stars)}</span>
      <span class="rating-date">${d}</span>
      ${r.comment ? `<p class="rating-comment">${r.comment.replace(/</g, '&lt;')}</p>` : ''}
    </div>`;
  }).join('');
}

function updateAvgBadge(list) {
  const el = document.getElementById('avg-display');
  if (!list.length) { el.textContent = ''; return; }
  const avg = (list.reduce((s, r) => s + r.stars, 0) / list.length).toFixed(1);
  el.innerHTML = `<span>${'★'.repeat(Math.round(avg))}</span> ${avg} (${list.length}${T('ratingCount')})`;
}

// ── Game ─────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 500, H = 280;
const GROUND_Y = H - 55; // road surface y
const PLAYER_X = 100;

let gameRunning = false;
let gameStarted = false;
let score = 0;
let hiScore = parseInt(localStorage.getItem('bikerun_hi') || '0');
let frameCount = 0;
let raf;

// Player state
let playerY = GROUND_Y;
let playerVY = 0;
let jumping = false;
let spaceHeld = false;
let wheelAngle = 0;
let legPhase = 0;

// Obstacles
let obstacles = [];
let speed = 4;
let nextObstacleFrame = 80;

// Parallax layers
let bgOffset1 = 0; // buildings (slow)
let bgOffset2 = 0; // trees (medium)
let roadOffset = 0; // road dashes

// Obstacle types
const OBS_TYPES = ['barrier', 'cone', 'pothole', 'car'];

function resetGame() {
  score = 0;
  frameCount = 0;
  speed = 4;
  playerY = GROUND_Y;
  playerVY = 0;
  jumping = false;
  obstacles = [];
  nextObstacleFrame = 90;
  bgOffset1 = 0;
  bgOffset2 = 0;
  roadOffset = 0;
  wheelAngle = 0;
  legPhase = 0;
  document.getElementById('score').textContent = '0';
}

function spawnObstacle() {
  const type = OBS_TYPES[Math.floor(Math.random() * OBS_TYPES.length)];
  let obs = { type, x: W + 20 };
  switch (type) {
    case 'barrier':  obs.w = 18; obs.h = 38; obs.y = GROUND_Y - 38; break;
    case 'cone':     obs.w = 20; obs.h = 32; obs.y = GROUND_Y - 32; break;
    case 'pothole':  obs.w = 40; obs.h = 10; obs.y = GROUND_Y + 2; break;
    case 'car':      obs.w = 70; obs.h = 36; obs.y = GROUND_Y - 36; break;
  }
  obstacles.push(obs);
}

function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  grad.addColorStop(0, '#0a0a1f');
  grad.addColorStop(0.5, '#0d1a3a');
  grad.addColorStop(1, '#1a2a55');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, GROUND_Y);

  // Stars (static)
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  const starSeeds = [17, 53, 91, 137, 173, 211, 257, 293, 331, 367, 401, 431, 461, 487, 509];
  for (let s of starSeeds) {
    const sx = (s * 37) % W;
    const sy = (s * 19) % (GROUND_Y - 20);
    ctx.fillRect(sx, sy, 1, 1);
  }

  // Moon
  ctx.fillStyle = '#fffde0';
  ctx.shadowColor = '#fffde0';
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.arc(420, 30, 12, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawBuildings(offset) {
  const buildings = [
    { x: 30, w: 50, h: 70, color: '#0e1a2e' },
    { x: 95, w: 35, h: 50, color: '#0c1828' },
    { x: 145, w: 60, h: 90, color: '#0f1d33' },
    { x: 218, w: 40, h: 60, color: '#0c1828' },
    { x: 270, w: 55, h: 80, color: '#0e1a2e' },
    { x: 338, w: 30, h: 45, color: '#0c1828' },
    { x: 378, w: 65, h: 100, color: '#0f1d33' },
    { x: 455, w: 45, h: 65, color: '#0e1a2e' },
    { x: 510, w: 50, h: 75, color: '#0c1828' },
    { x: 570, w: 35, h: 55, color: '#0f1d33' },
  ];
  const totalW = 620;
  for (let b of buildings) {
    const bx = ((b.x - offset * 0.3) % totalW + totalW) % totalW;
    ctx.fillStyle = b.color;
    ctx.fillRect(bx, GROUND_Y - b.h, b.w, b.h);
    // windows
    ctx.fillStyle = 'rgba(255,220,80,0.15)';
    for (let wy = GROUND_Y - b.h + 8; wy < GROUND_Y - 8; wy += 14) {
      for (let wx = bx + 6; wx < bx + b.w - 6; wx += 12) {
        if ((Math.floor(wx / 12) + Math.floor(wy / 14)) % 3 !== 0)
          ctx.fillRect(wx, wy, 6, 8);
      }
    }
  }
}

function drawTrees(offset) {
  const trees = [10, 80, 155, 230, 305, 380, 455, 530, 600];
  const totalW = 640;
  for (let tx of trees) {
    const bx = ((tx - offset * 0.6) % totalW + totalW) % totalW;
    // trunk
    ctx.fillStyle = '#2a1a0a';
    ctx.fillRect(bx + 6, GROUND_Y - 30, 6, 30);
    // foliage
    ctx.fillStyle = '#0d2b10';
    ctx.beginPath();
    ctx.arc(bx + 9, GROUND_Y - 38, 16, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#0f3614';
    ctx.beginPath();
    ctx.arc(bx + 9, GROUND_Y - 46, 12, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawRoad() {
  // Road base
  const roadGrad = ctx.createLinearGradient(0, GROUND_Y, 0, H);
  roadGrad.addColorStop(0, '#2a2a2a');
  roadGrad.addColorStop(1, '#1e1e1e');
  ctx.fillStyle = roadGrad;
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

  // Road edge line
  ctx.strokeStyle = '#444';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  ctx.lineTo(W, GROUND_Y);
  ctx.stroke();

  // Center dashes
  ctx.strokeStyle = '#ffd700';
  ctx.lineWidth = 2;
  ctx.setLineDash([20, 20]);
  ctx.lineDashOffset = -roadOffset;
  const centerY = GROUND_Y + (H - GROUND_Y) / 2;
  ctx.beginPath();
  ctx.moveTo(0, centerY);
  ctx.lineTo(W, centerY);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawBike(x, y, wheelAng, legPh) {
  const s = 1; // scale
  ctx.save();
  ctx.translate(x, y);

  // Wheel radius
  const wr = 18;
  const frameColor = '#00d4aa';
  const spokeColor = 'rgba(0,212,170,0.5)';
  const wheelColor = '#555';
  const rimColor = '#00d4aa';
  const seatColor = '#8b4513';

  // Rear wheel
  const rwx = -20, rwy = 0;
  ctx.strokeStyle = wheelColor;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(rwx, rwy, wr, 0, Math.PI * 2);
  ctx.stroke();
  ctx.strokeStyle = rimColor;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(rwx, rwy, wr, 0, Math.PI * 2);
  ctx.stroke();
  // Spokes rear
  ctx.strokeStyle = spokeColor;
  ctx.lineWidth = 1;
  for (let i = 0; i < 8; i++) {
    const a = wheelAng + (i * Math.PI / 4);
    ctx.beginPath();
    ctx.moveTo(rwx, rwy);
    ctx.lineTo(rwx + Math.cos(a) * wr, rwy + Math.sin(a) * wr);
    ctx.stroke();
  }
  // Rear hub
  ctx.fillStyle = '#00d4aa';
  ctx.beginPath();
  ctx.arc(rwx, rwy, 3, 0, Math.PI * 2);
  ctx.fill();

  // Front wheel
  const fwx = 20, fwy = 0;
  ctx.strokeStyle = wheelColor;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(fwx, fwy, wr, 0, Math.PI * 2);
  ctx.stroke();
  ctx.strokeStyle = rimColor;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(fwx, fwy, wr, 0, Math.PI * 2);
  ctx.stroke();
  // Spokes front
  ctx.strokeStyle = spokeColor;
  ctx.lineWidth = 1;
  for (let i = 0; i < 8; i++) {
    const a = wheelAng + (i * Math.PI / 4);
    ctx.beginPath();
    ctx.moveTo(fwx, fwy);
    ctx.lineTo(fwx + Math.cos(a) * wr, fwy + Math.sin(a) * wr);
    ctx.stroke();
  }
  ctx.fillStyle = '#00d4aa';
  ctx.beginPath();
  ctx.arc(fwx, fwy, 3, 0, Math.PI * 2);
  ctx.fill();

  // Chain ring (at rear axle area, pedal center)
  ctx.strokeStyle = '#ffd700';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(-8, -2, 8, 0, Math.PI * 2);
  ctx.stroke();

  // Frame: bottom bracket to rear axle
  ctx.strokeStyle = frameColor;
  ctx.lineWidth = 3;
  // Chain stays: BB to rear axle
  ctx.beginPath();
  ctx.moveTo(-8, -2);
  ctx.lineTo(rwx, rwy);
  ctx.stroke();
  // Down tube: head tube to BB
  ctx.beginPath();
  ctx.moveTo(fwx - 4, -22);
  ctx.lineTo(-8, -2);
  ctx.stroke();
  // Seat tube: BB to seat
  ctx.beginPath();
  ctx.moveTo(-8, -2);
  ctx.lineTo(-6, -32);
  ctx.stroke();
  // Top tube: seat to head
  ctx.beginPath();
  ctx.moveTo(-6, -32);
  ctx.lineTo(fwx - 4, -22);
  ctx.stroke();
  // Seat stays: seat to rear axle
  ctx.beginPath();
  ctx.moveTo(-6, -32);
  ctx.lineTo(rwx, rwy);
  ctx.stroke();
  // Fork: head to front axle
  ctx.beginPath();
  ctx.moveTo(fwx - 4, -22);
  ctx.lineTo(fwx, fwy);
  ctx.stroke();

  // Handlebars
  ctx.strokeStyle = frameColor;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(fwx - 4, -22);
  ctx.lineTo(fwx - 2, -30);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(fwx - 2, -30);
  ctx.lineTo(fwx + 8, -28);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(fwx - 2, -30);
  ctx.lineTo(fwx - 10, -28);
  ctx.stroke();
  // Handlebar grips
  ctx.fillStyle = '#333';
  ctx.beginPath(); ctx.arc(fwx + 8, -28, 3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(fwx - 10, -28, 3, 0, Math.PI * 2); ctx.fill();

  // Seat
  ctx.fillStyle = seatColor;
  ctx.beginPath();
  ctx.ellipse(-6, -35, 10, 4, -0.1, 0, Math.PI * 2);
  ctx.fill();

  // Rider
  // Pedaling legs
  const kneeLX = -8 + Math.cos(legPh) * 10;
  const kneeLY = -2 + Math.sin(legPh) * 10;
  const kneeLX2 = -8 + Math.cos(legPh + Math.PI) * 10;
  const kneeLY2 = -2 + Math.sin(legPh + Math.PI) * 10;
  const footLX = -8 + Math.cos(legPh) * 18;
  const footLY = -2 + Math.sin(legPh) * 18;
  const footLX2 = -8 + Math.cos(legPh + Math.PI) * 18;
  const footLY2 = -2 + Math.sin(legPh + Math.PI) * 18;

  // Back leg
  ctx.strokeStyle = '#ffcc88';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-6, -35);
  ctx.lineTo(kneeLX2, kneeLY2);
  ctx.lineTo(footLX2, footLY2);
  ctx.stroke();
  ctx.fillStyle = '#cc8844';
  ctx.beginPath(); ctx.arc(footLX2, footLY2, 3, 0, Math.PI * 2); ctx.fill();

  // Body
  ctx.strokeStyle = '#4488ff';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(-6, -35);
  ctx.lineTo(-4, -52);
  ctx.stroke();

  // Arms to handlebar
  ctx.strokeStyle = '#ffcc88';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(-4, -50);
  ctx.lineTo(fwx - 2, -30);
  ctx.stroke();

  // Front leg
  ctx.strokeStyle = '#ffcc88';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-6, -35);
  ctx.lineTo(kneeLX, kneeLY);
  ctx.lineTo(footLX, footLY);
  ctx.stroke();
  ctx.fillStyle = '#cc8844';
  ctx.beginPath(); ctx.arc(footLX, footLY, 3, 0, Math.PI * 2); ctx.fill();

  // Head
  ctx.fillStyle = '#ffcc88';
  ctx.beginPath();
  ctx.arc(-4, -58, 8, 0, Math.PI * 2);
  ctx.fill();
  // Helmet
  ctx.fillStyle = '#ff4444';
  ctx.beginPath();
  ctx.ellipse(-4, -63, 9, 6, 0, Math.PI, 0);
  ctx.fill();
  // Helmet strap
  ctx.strokeStyle = '#cc2222';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(-4, -58, 8, 0.3, Math.PI - 0.3);
  ctx.stroke();
  // Eye
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(2, -58, 1.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawObstacle(obs) {
  ctx.save();
  switch (obs.type) {
    case 'barrier': {
      // Red/orange road barrier
      ctx.fillStyle = '#cc2200';
      ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
      // Stripes
      ctx.fillStyle = '#ff6600';
      for (let i = 0; i < 4; i++) {
        if (i % 2 === 0)
          ctx.fillRect(obs.x, obs.y + i * (obs.h / 4), obs.w, obs.h / 4);
      }
      // Top cap
      ctx.fillStyle = '#ff2200';
      ctx.fillRect(obs.x - 2, obs.y - 4, obs.w + 4, 5);
      // Reflectors
      ctx.fillStyle = '#fff';
      ctx.fillRect(obs.x + 4, obs.y + 8, 4, 3);
      ctx.fillRect(obs.x + 4, obs.y + 20, 4, 3);
      break;
    }
    case 'cone': {
      // Orange traffic cone
      ctx.fillStyle = '#ff6600';
      ctx.beginPath();
      ctx.moveTo(obs.x + obs.w / 2, obs.y);
      ctx.lineTo(obs.x, obs.y + obs.h);
      ctx.lineTo(obs.x + obs.w, obs.y + obs.h);
      ctx.closePath();
      ctx.fill();
      // White stripes
      ctx.fillStyle = 'white';
      ctx.beginPath();
      const p = 0.65;
      ctx.moveTo(obs.x + obs.w / 2 * (1 - p), obs.y + obs.h * p);
      ctx.lineTo(obs.x + obs.w / 2 * (1 + p), obs.y + obs.h * p);
      ctx.lineTo(obs.x + obs.w / 2 * (1 + p) + 2, obs.y + obs.h * p + 5);
      ctx.lineTo(obs.x + obs.w / 2 * (1 - p) - 2, obs.y + obs.h * p + 5);
      ctx.closePath();
      ctx.fill();
      // Base
      ctx.fillStyle = '#333';
      ctx.fillRect(obs.x - 3, obs.y + obs.h - 4, obs.w + 6, 4);
      break;
    }
    case 'pothole': {
      // Dark pothole in road
      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.ellipse(obs.x + obs.w / 2, obs.y + 5, obs.w / 2, 8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 1;
      ctx.stroke();
      // Crack lines
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(obs.x + 5, obs.y);
      ctx.lineTo(obs.x - 5, obs.y - 8);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(obs.x + obs.w - 5, obs.y);
      ctx.lineTo(obs.x + obs.w + 5, obs.y - 10);
      ctx.stroke();
      break;
    }
    case 'car': {
      // Small car (viewed from side)
      // Body
      ctx.fillStyle = '#cc3333';
      ctx.beginPath();
      ctx.roundRect(obs.x, obs.y + 14, obs.w, obs.h - 14, 4);
      ctx.fill();
      // Roof
      ctx.fillStyle = '#aa2222';
      ctx.beginPath();
      ctx.roundRect(obs.x + 10, obs.y, obs.w - 22, 16, 4);
      ctx.fill();
      // Windows
      ctx.fillStyle = 'rgba(100,200,255,0.6)';
      ctx.fillRect(obs.x + 12, obs.y + 2, 16, 12);
      ctx.fillRect(obs.x + 32, obs.y + 2, 14, 12);
      // Wheels
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.arc(obs.x + 14, obs.y + obs.h, 8, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(obs.x + obs.w - 14, obs.y + obs.h, 8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#555';
      ctx.beginPath(); ctx.arc(obs.x + 14, obs.y + obs.h, 4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(obs.x + obs.w - 14, obs.y + obs.h, 4, 0, Math.PI * 2); ctx.fill();
      // Headlight
      ctx.fillStyle = '#ffff88';
      ctx.fillRect(obs.x + obs.w - 6, obs.y + 18, 6, 6);
      // Taillight
      ctx.fillStyle = '#ff4444';
      ctx.fillRect(obs.x, obs.y + 18, 5, 6);
      break;
    }
  }
  ctx.restore();
}

function drawScene() {
  // Sky
  drawSky();
  // Background buildings
  drawBuildings(bgOffset1);
  // Trees (mid-ground)
  drawTrees(bgOffset2);
  // Road
  drawRoad();
  // Obstacles
  for (let obs of obstacles) drawObstacle(obs);
  // Player bike
  drawBike(PLAYER_X, playerY, wheelAngle, legPhase);
}

function drawStartScreen() {
  drawSky();
  drawBuildings(0);
  drawTrees(0);
  drawRoad();
  drawBike(PLAYER_X, GROUND_Y, 0, 0);
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ff4444';
  ctx.font = 'bold 36px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('GAME OVER', W / 2, H / 2 - 16);
  ctx.fillStyle = '#00d4aa';
  ctx.font = '16px Courier New';
  ctx.fillText(T('restart'), W / 2, H / 2 + 16);
  ctx.textAlign = 'left';
}

function checkCollision() {
  const bx = PLAYER_X - 16, bw = 32;
  const by = playerY - 60, bh = 60;

  for (let obs of obstacles) {
    let ox = obs.x, ow = obs.w, oy = obs.y, oh;
    // Generous hitbox reduction
    const margin = 6;
    if (obs.type === 'pothole') {
      // Pothole: only collide if bike is on ground
      if (playerY >= GROUND_Y - 2) {
        oh = obs.h;
        if (bx + bw - margin > ox + margin && bx + margin < ox + ow - margin &&
            by + bh > oy && by < oy + oh + 2) return true;
      }
    } else {
      oh = obs.h;
      if (bx + bw - margin > ox + margin && bx + margin < ox + ow - margin &&
          by + bh - margin > oy + margin && by + margin < oy + oh - margin) return true;
    }
  }
  return false;
}

function gameLoop() {
  frameCount++;
  speed = 4 + frameCount * 0.001;

  // Parallax scroll
  bgOffset1 += speed * 0.3;
  bgOffset2 += speed * 0.6;
  roadOffset = (roadOffset + speed) % 40;

  // Jump physics
  if (jumping || playerY < GROUND_Y) {
    playerVY += 0.7;
    playerY += playerVY;
    if (playerY >= GROUND_Y) {
      playerY = GROUND_Y;
      playerVY = 0;
      jumping = false;
    }
  }
  // Hold-jump boost: while space held and just started jumping, allow a bit more impulse
  // (handled in input)

  // Wheel/pedal animation
  wheelAngle += speed * 0.06;
  legPhase += speed * 0.06;

  // Spawn obstacles
  if (frameCount >= nextObstacleFrame) {
    spawnObstacle();
    // Gap between obstacles decreases with speed
    const gap = Math.max(60, 120 - Math.floor(speed * 5));
    nextObstacleFrame = frameCount + gap + Math.floor(Math.random() * 40);
  }

  // Move obstacles
  for (let obs of obstacles) obs.x -= speed;
  obstacles = obstacles.filter(o => o.x + o.w + 10 > 0);

  // Score
  score += Math.floor(speed);
  document.getElementById('score').textContent = score;
  if (score > hiScore) {
    hiScore = score;
    localStorage.setItem('bikerun_hi', hiScore);
    document.getElementById('hi').textContent = hiScore;
  }

  // Collision
  if (checkCollision()) {
    endGame();
    return;
  }

  drawScene();
  raf = requestAnimationFrame(gameLoop);
}

function startGame() {
  if (gameRunning) return;
  document.getElementById('score-dialog').classList.remove('open');
  gameRunning = true;
  gameStarted = true;
  resetGame();
  document.getElementById('message').textContent = '';
  raf = requestAnimationFrame(gameLoop);
}

function endGame() {
  gameRunning = false;
  cancelAnimationFrame(raf);
  drawScene();
  drawGameOver();
  document.getElementById('message').textContent = '';
  if (score > 0) showScoreDialog(score);
}

function jump() {
  if (!gameRunning) {
    startGame();
    return;
  }
  if (!jumping && playerY >= GROUND_Y - 2) {
    playerVY = -12;
    jumping = true;
  }
}

// Score dialog
function showScoreDialog(s) {
  document.getElementById('dialog-msg').innerHTML =
    T('dialogMsg') + '<b style="color:#00d4aa">' + s + '</b>' + T('dialogSuffix');
  document.getElementById('player-name-input').value = localStorage.getItem('playerName') || '';
  document.getElementById('score-dialog').classList.add('open');
}

document.getElementById('btn-submit-score').addEventListener('click', async () => {
  const name = document.getElementById('player-name-input').value.trim() || 'Anonymous';
  localStorage.setItem('playerName', name);
  document.getElementById('score-dialog').classList.remove('open');
  try { await submitScore(score, name); } catch (e) { console.error(e); }
});
document.getElementById('btn-skip-score').addEventListener('click', () => {
  document.getElementById('score-dialog').classList.remove('open');
});

// Controls
document.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (!gameRunning && gameStarted) { startGame(); return; }
    jump();
  }
});

canvas.addEventListener('click', () => {
  if (!gameRunning && gameStarted) { startGame(); return; }
  jump();
});
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (!gameRunning && gameStarted) { startGame(); return; }
  jump();
}, { passive: false });

// Rating form
let selectedStars = 0;
document.getElementById('rating-toggle').addEventListener('click', () => document.getElementById('rating-form').classList.toggle('open'));
document.querySelectorAll('.star').forEach(s => {
  s.addEventListener('click', () => {
    selectedStars = parseInt(s.dataset.v);
    document.querySelectorAll('.star').forEach((st, i) => st.classList.toggle('active', i < selectedStars));
  });
});
document.getElementById('submit-rating').addEventListener('click', async () => {
  if (!selectedStars) { alert(T('starAlert')); return; }
  const statusEl = document.getElementById('rating-status');
  statusEl.textContent = T('sending');
  try {
    await submitRating(selectedStars, document.getElementById('comment-input').value.trim());
    selectedStars = 0;
    document.querySelectorAll('.star').forEach(s => s.classList.remove('active'));
    document.getElementById('comment-input').value = '';
    document.getElementById('rating-form').classList.remove('open');
    statusEl.textContent = '';
  } catch (e) { statusEl.textContent = T('sendFail'); }
});

// Init
document.getElementById('hi').textContent = hiScore;
applyLang();
loadLeaderboard();
loadRatings();
drawStartScreen();
</script>

(function () {
  var _started = false;
  function _startAudio() {
    if (_started) return; _started = true;
    if (typeof SND !== 'undefined') {
      SND.startBGM && SND.startBGM("game");
      SND.createBtn && SND.createBtn();
    }
  }
  document.addEventListener("click", _startAudio, { once: true });
  document.addEventListener("keydown", _startAudio, { once: true });
})();
</script>
