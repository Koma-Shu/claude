    #score-display { display:flex; align-items:center; gap:16px; margin-bottom:6px; font-size:0.8rem; }

    canvas { display:block; margin-bottom:8px; border:1px solid #1a2a3a; cursor:default; }

    #msg { font-size:0.9rem; color:#00d4aa; margin-bottom:8px; height:1.4em; text-align:center; letter-spacing:2px; }
    #play-again { display:none; padding:9px 28px; border-radius:8px; background:linear-gradient(135deg,#00d4aa,#aadd00); border:none; color:#000; font-family:'Courier New',monospace; font-size:0.85rem; letter-spacing:2px; cursor:pointer; font-weight:bold; margin-bottom:10px; }

    #rating-section { margin-top:16px; width:100%; max-width:500px; border-top:1px solid #222; padding-top:14px; }
    #rtoggle { cursor:pointer; font-size:0.8rem; color:#555; letter-spacing:2px; text-align:center; padding:6px; }

    #cmt { width:100%; background:#0d0d1a; border:1px solid #333; border-radius:6px; color:#ccc; font-family:'Courier New',monospace; font-size:0.78rem; padding:8px; resize:vertical; min-height:60px; margin-bottom:10px; }
    #rsub { display:block; width:100%; padding:9px; background:linear-gradient(135deg,#00d4aa,#aadd00); border:none; border-radius:6px; color:#000; font-family:'Courier New',monospace; font-size:0.8rem; letter-spacing:2px; cursor:pointer; font-weight:bold; }
    #rlist { margin-top:14px; }

    .avg-d { text-align:center; font-size:0.8rem; color:#666; margin-bottom:6px; }

<body>

<div id="score-display">

<script>
// ===== i18n =====
const LANG = {
  en: {
    your_serve:'YOUR SERVE', cpu_serve:'CPU SERVE', p2_serve:'P2 SERVE',
    fault:'FAULT!', double_fault:'DOUBLE FAULT', out:'OUT!', net:'NET!',
    deuce:'DEUCE', advantage_you:'ADV YOU', advantage_cpu:'ADV CPU',
    advantage_p1:'ADV P1', advantage_p2:'ADV P2',
    game_you:'GAME YOU!', game_cpu:'GAME CPU!', game_p1:'GAME P1!', game_p2:'GAME P2!',
    set_you:'SET YOU!', set_cpu:'SET CPU!', set_p1:'SET P1!', set_p2:'SET P2!',
    you_win:'YOU WIN!', cpu_wins:'CPU WINS!', p1_wins:'P1 WINS!', p2_wins:'P2 WINS!',
    press_space:'PRESS SPACE TO SERVE', press_space_swing:'SPACE TO SWING',
    hint1p:'← → ↑ ↓ MOVE  |  SPACE: SERVE/SWING',
    hint2p:'P1:← → ↑ ↓ + SPACE  |  P2:WASD + SHIFT',
    you:'YOU', cpu:'CPU', p1:'P1', p2:'P2',
  },
  ja: {
    your_serve:'あなたのサーブ', cpu_serve:'CPUのサーブ', p2_serve:'P2のサーブ',
    fault:'フォルト!', double_fault:'ダブルフォルト', out:'アウト!', net:'ネット!',
    deuce:'デュース', advantage_you:'アドバンテージ あなた', advantage_cpu:'アドバンテージ CPU',
    advantage_p1:'アドバンテージ P1', advantage_p2:'アドバンテージ P2',
    game_you:'ゲーム あなた!', game_cpu:'ゲーム CPU!', game_p1:'ゲーム P1!', game_p2:'ゲーム P2!',
    set_you:'セット あなた!', set_cpu:'セット CPU!', set_p1:'セット P1!', set_p2:'セット P2!',
    you_win:'あなたの勝ち!', cpu_wins:'CPUの勝ち!', p1_wins:'P1の勝ち!', p2_wins:'P2の勝ち!',
    press_space:'スペースでサーブ', press_space_swing:'スペースでスウィング',
    hint1p:'← → ↑ ↓ 移動  |  スペース: サーブ/スウィング',
    hint2p:'P1:← → ↑ ↓ + スペース  |  P2:WASD + シフト',
    you:'YOU', cpu:'CPU', p1:'P1', p2:'P2',
  }
};
let lang = localStorage.getItem('lang') || 'ja';
function T(k){ return (LANG[lang]||LANG.en)[k] || k; }
function applyLang(){
  document.getElementById('lang-btn').textContent = lang==='ja'?'EN':'JA';
  document.getElementById('controls-hint').textContent = mode==='2p'?T('hint2p'):T('hint1p');
  updateScoreDisplay();
  showStatus();
}
document.getElementById('lang-btn').addEventListener('click',()=>{
  lang = lang==='ja'?'en':'ja';
  localStorage.setItem('lang',lang);
  applyLang();
});

// ===== Canvas & Court geometry =====
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 600, H = 450;

// Court perspective constants
const CX = W/2;                 // center x
const COURT_NEAR_Y = H - 60;   // near baseline y on screen
const COURT_FAR_Y = 120;       // far baseline y on screen
const COURT_NEAR_HW = 220;     // half-width at near baseline (screen px)
const COURT_FAR_HW = 90;       // half-width at far baseline (screen px)
const NET_Z = 0.5;              // net is at z=0.5

// Convert 3D court coords to screen coords
// x: -1 (left) to 1 (right), z: 0 (near) to 1 (far), yh: height above ground (0=ground)
function courtToScreen(x, z, yh) {
  const t = z; // 0=near, 1=far
  const screenY_base = COURT_NEAR_Y + t * (COURT_FAR_Y - COURT_NEAR_Y);
  const hw = COURT_NEAR_HW + t * (COURT_FAR_HW - COURT_NEAR_HW);
  const screenX = CX + x * hw;
  // height: shrinks with depth
  const heightScale = 80 + (1-t) * 120; // taller near, shorter far
  const screenY = screenY_base - yh * heightScale;
  return { sx: screenX, sy: screenY };
}

function zToHW(z) {
  return COURT_NEAR_HW + z * (COURT_FAR_HW - COURT_NEAR_HW);
}

// ===== Game State =====
let mode = '1p';
let difficulty = 'normal';
let gameState = 'idle'; // idle, playing, gameover
let serveState = 'wait'; // wait, toss, live, point_delay
let server = 1; // 1=player1, 2=player2/CPU

// Score
let sets1=0, sets2=0, games1=0, games2=0;
let pts1=0, pts2=0; // raw points 0-4 (4=ADV after deuce)
let deuce=false;
let setsWon1=[], setsWon2=[]; // arrays of games won per set

// Ball state (3D)
let ball = { x:0, z:0.1, yh:0, vx:0, vz:0, vy:0, inPlay:false, bounces:0 };

// Player 1 (near side, blue) - seen from behind
let p1 = { x:0, z:0.1, moving:{left:false,right:false,up:false,down:false}, swinging:false };
// Player 2 / CPU (far side, red)
let p2 = { x:0, z:0.9, moving:{left:false,right:false,up:false,down:false}, swinging:false };

let statusText = '';
let msgText = '';
let msgTimer = 0;
let pointDelayTimer = 0;
let serveCount = 0; // fault counter (1st or 2nd serve)
let lastBounceZ = -1; // track which side ball bounced on

// CPU AI
let cpuTargetX = 0;
let cpuTargetZ = 0.85;
let cpuSwingCooldown = 0;
let cpuMoveTimer = 0;

// Timing
let lastTime = 0;
const PHYSICS_DT = 1/60;

// ===== Mode / Difficulty UI =====
document.getElementById('btn-1p').addEventListener('click',()=>{ mode='1p'; updateModeUI(); });
document.getElementById('btn-2p').addEventListener('click',()=>{ mode='2p'; updateModeUI(); });
['easy','normal','hard'].forEach(d=>{
  document.getElementById('diff-'+d).addEventListener('click',()=>{ difficulty=d; updateDiffUI(); });
});
function updateModeUI(){
  ['1p','2p'].forEach(m=>document.getElementById('btn-'+m).classList.toggle('active',mode===m));
  document.getElementById('diff-row').style.display = mode==='1p'?'flex':'none';
  document.getElementById('lbl-p2').textContent = mode==='1p'?T('cpu'):T('p2');
  applyLang();
}
function updateDiffUI(){
  ['easy','normal','hard'].forEach(d=>document.getElementById('diff-'+d).classList.toggle('active',difficulty===d));
}

// ===== Input =====
const keys = {};
document.addEventListener('keydown', e=>{
  const k = e.key;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','a','d','w','s','Shift'].includes(k)) e.preventDefault();
  if(!keys[k]) {
    keys[k] = true;
    handleKeyDown(k);
  }
});
document.addEventListener('keyup', e=>{ keys[e.key] = false; });

function handleKeyDown(k) {
  if(gameState === 'idle') {
    startGame();
    return;
  }
  if(gameState === 'gameover') return;

  // P1 swing / serve
  if(k === ' ') {
    if(serveState === 'wait' && server === 1) doServe(1);
    else if(serveState === 'live') trySwing(1);
  }
  // P2 swing / serve (2p mode)
  if(mode === '2p') {
    if(k === 'Shift') {
      if(serveState === 'wait' && server === 2) doServe(2);
      else if(serveState === 'live') trySwing(2);
    }
  }
}

// ===== Game Start / Reset =====
function startGame() {
  gameState = 'playing';
  sets1=0; sets2=0; games1=0; games2=0; pts1=0; pts2=0; deuce=false;
  server = 1;
  resetForServe();
  updateScoreDisplay();
  document.getElementById('play-again').style.display='none';
  applyLang();
}

function resetForServe() {
  serveCount = 0;
  serveState = 'wait';
  lastBounceZ = -1;
  ball.inPlay = false;
  ball.yh = 0; ball.vx=0; ball.vz=0; ball.vy=0;
  // Position serving player
  if(server === 1) {
    p1.x = 0; p1.z = 0.05;
    ball.x = p1.x; ball.z = p1.z; ball.yh = 0.3;
    statusText = T('your_serve');
  } else {
    p2.x = 0; p2.z = 0.95;
    ball.x = p2.x; ball.z = p2.z; ball.yh = 0.3;
    statusText = mode==='2p'?T('p2_serve'):T('cpu_serve');
  }
  showMsg('');
}

// ===== Serve mechanic =====
function doServe(player) {
  if(serveState !== 'wait') return;
  serveState = 'live';
  ball.inPlay = true;

  if(player === 1) {
    // P1 serves toward opponent (z increases, toward far side)
    // Ball starts above P1 position
    ball.x = p1.x;
    ball.z = p1.z + 0.02;
    ball.yh = 0.5; // above player
    ball.vx = (Math.random() - 0.5) * 0.05; // small side offset
    ball.vz = 0.028 + Math.random()*0.006;   // forward (toward far side)
    ball.vy = 0.018; // slight upward toss, gravity pulls down
  } else {
    // P2/CPU serves toward near side (z decreases)
    ball.x = p2.x;
    ball.z = p2.z - 0.02;
    ball.yh = 0.5;
    ball.vx = (Math.random() - 0.5) * 0.05;
    ball.vz = -(0.028 + Math.random()*0.006); // toward near side
    ball.vy = 0.018;
  }
  lastBounceZ = -1;
}

// ===== Swing mechanic =====
function trySwing(player) {
  if(serveState !== 'live' || !ball.inPlay) return;
  const p = player === 1 ? p1 : p2;
  const ballScrn = courtToScreen(ball.x, ball.z, ball.yh);
  const pScrn = courtToScreen(p.x, p.z, 0);
  const dist = Math.hypot(ballScrn.sx - pScrn.sx, ballScrn.sy - pScrn.sy);

  // Can only swing if ball is on own side
  const ownSide = player === 1 ? ball.z < NET_Z + 0.05 : ball.z > NET_Z - 0.05;
  if(!ownSide) return;
  if(dist > 100) return; // too far

  // Determine shot direction from movement keys
  let aimX = 0, aimZ = 0;
  if(player === 1) {
    if(p1.moving.left) aimX = -1;
    if(p1.moving.right) aimX = 1;
    if(p1.moving.up) aimZ = 1;    // toward opponent
    if(p1.moving.down) aimZ = -0.3; // drop shot
  } else {
    if(p2.moving.right) aimX = -1;
    if(p2.moving.left) aimX = 1;
    if(p2.moving.down) aimZ = -1;
    if(p2.moving.up) aimZ = 0.3;
  }

  // Default aim: random cross
  if(aimX === 0 && aimZ === 0) {
    aimX = (Math.random() < 0.5 ? -1 : 1) * (0.4 + Math.random()*0.4);
    aimZ = 0.8;
  }

  fireShot(player, aimX, aimZ);
}

function fireShot(player, aimX, aimZ) {
  const power = 0.025 + Math.random()*0.008;
  const dir = player === 1 ? 1 : -1; // 1=forward (increasing z), -1=backward (decreasing z)
  const absAimZ = Math.abs(aimZ) * dir;

  ball.vx = aimX * power * 0.7;
  ball.vz = absAimZ * power * 1.5 + dir * power * 0.5;
  if(ball.vz * dir < 0.01) ball.vz = dir * 0.02; // ensure moving toward opponent
  ball.vy = power * 1.2; // upward arc
}

// ===== CPU AI =====
function updateCPU(dt) {
  if(mode === '2p') return;

  const speed = difficulty==='easy'?0.004 : difficulty==='normal'?0.007 : 0.012;
  const reactDelay = difficulty==='easy'?0.8 : difficulty==='normal'?0.4 : 0.15;

  cpuMoveTimer += dt;
  if(cpuMoveTimer >= reactDelay) {
    cpuMoveTimer = 0;
    if(ball.z > NET_Z && ball.inPlay) {
      // Ball on CPU side - move toward it
      cpuTargetX = ball.x + (difficulty==='easy'?(Math.random()-0.5)*0.6 : difficulty==='normal'?(Math.random()-0.5)*0.3 : 0);
      cpuTargetZ = Math.max(0.6, Math.min(0.95, ball.z));
    } else {
      // Return to base
      cpuTargetX = 0;
      cpuTargetZ = 0.85;
    }
  }

  // Move toward target
  const dx = cpuTargetX - p2.x;
  const dz = cpuTargetZ - p2.z;
  const d = Math.hypot(dx, dz);
  if(d > 0.01) {
    p2.x += (dx/d)*speed*60*dt;
    p2.z += (dz/d)*speed*60*dt;
  }
  p2.x = Math.max(-0.85, Math.min(0.85, p2.x));
  p2.z = Math.max(0.55, Math.min(0.98, p2.z));

  // CPU serve
  if(serveState === 'wait' && server === 2) {
    const delay = difficulty==='easy'?2.0:difficulty==='normal'?1.2:0.6;
    cpuSwingCooldown += dt;
    if(cpuSwingCooldown >= delay) {
      cpuSwingCooldown = 0;
      doServe(2);
    }
    return;
  }

  // CPU swing
  cpuSwingCooldown += dt;
  const swingReady = difficulty==='easy'?0.5:difficulty==='normal'?0.3:0.15;
  if(cpuSwingCooldown < swingReady) return;

  if(serveState === 'live' && ball.inPlay && ball.z > NET_Z - 0.05) {
    const ballScrn = courtToScreen(ball.x, ball.z, ball.yh);
    const p2Scrn = courtToScreen(p2.x, p2.z, 0);
    const dist = Math.hypot(ballScrn.sx - p2Scrn.sx, ballScrn.sy - p2Scrn.sy);
    if(dist < 90 && ball.z > NET_Z) {
      // Aim at player side randomly
      const errX = difficulty==='easy'?(Math.random()-0.5)*1.4:difficulty==='normal'?(Math.random()-0.5)*0.8:(Math.random()-0.5)*0.3;
      const aimX = -p1.x + errX;
      fireShot(2, aimX, 0.8);
      cpuSwingCooldown = 0;
    }
  }
}

// ===== Physics =====
const GRAVITY = -0.04;
function updatePhysics(dt) {
  if(!ball.inPlay) return;

  ball.x += ball.vx;
  ball.z += ball.vz;
  ball.yh += ball.vy;
  ball.vy += GRAVITY * dt * 60;

  // Bounce on ground
  if(ball.yh <= 0) {
    ball.yh = 0;
    if(Math.abs(ball.vy) > 0.003) {
      ball.vy = -ball.vy * 0.55;
      ball.vx *= 0.75;
      ball.vz *= 0.75;
      ball.bounces = (ball.bounces||0) + 1;
      checkBounce();
    } else {
      ball.vy = 0;
      ball.vx = 0;
      ball.vz = 0;
    }
  }

  // Check out of bounds (x)
  if(ball.z > 0.05 && ball.z < 0.95) { // within court z range
    if(Math.abs(ball.x) > 1.05) { pointResult(ball.z < NET_Z ? 2 : 1, 'out'); return; }
  }

  // Ball past far baseline (z > 1)
  if(ball.z > 1.02) { pointResult(1, 'out'); return; }
  // Ball past near baseline (z < 0)
  if(ball.z < -0.02) { pointResult(2, 'out'); return; }

  // Net check: ball crosses net at z=0.5
  // If ball height too low when crossing net
  if(lastBallZ !== undefined) {
    const crossedNet = (lastBallZ < NET_Z && ball.z >= NET_Z) || (lastBallZ > NET_Z && ball.z <= NET_Z);
    if(crossedNet && ball.yh < 0.08) {
      pointResult(ball.z >= NET_Z ? 1 : 2, 'net');
      return;
    }
  }
  lastBallZ = ball.z;
}

let lastBallZ = undefined;

function checkBounce() {
  const side = ball.z < NET_Z ? 1 : 2; // which side bounced on
  if(serveState === 'live') {
    // Second bounce = point to other side
    if(lastBounceZ >= 0 && ((lastBounceZ < NET_Z) === (ball.z < NET_Z))) {
      // bounced twice on same side
      pointResult(side === 1 ? 2 : 1, '');
    }
    lastBounceZ = ball.z;
  }
}

// ===== Point resolution =====
function pointResult(winner, reason) {
  ball.inPlay = false;
  serveState = 'point_delay';
  let msg = '';
  if(reason === 'out') msg = T('out');
  else if(reason === 'net') msg = T('net');
  else if(reason === 'fault') msg = T('fault');
  else if(reason === 'double_fault') msg = T('double_fault');
  showMsg(msg);

  setTimeout(()=>{
    awardPoint(winner);
  }, 1500);
}

function awardPoint(winner) {
  if(winner === 1) pts1++;
  else pts2++;
  checkGameOver();
}

const PTS_LABELS = ['0','15','30','40'];
function checkGameOver() {
  // Deuce logic
  if(pts1 >= 3 && pts2 >= 3) {
    if(pts1 === pts2) {
      deuce = true;
      showMsg(T('deuce'));
    } else if(pts1 > pts2) {
      if(pts1 - pts2 >= 2) { grantGame(1); return; }
      showMsg(mode==='2p'?T('advantage_p1'):T('advantage_you'));
    } else {
      if(pts2 - pts1 >= 2) { grantGame(2); return; }
      showMsg(mode==='2p'?T('advantage_p2'):T('advantage_cpu'));
    }
    updateScoreDisplay();
    setTimeout(resetForServe, 1000);
    return;
  }
  if(pts1 >= 4) { grantGame(1); return; }
  if(pts2 >= 4) { grantGame(2); return; }
  updateScoreDisplay();
  setTimeout(resetForServe, 800);
}

function grantGame(winner) {
  pts1=0; pts2=0; deuce=false;
  if(winner===1) games1++; else games2++;
  const gmsg = winner===1?(mode==='2p'?T('game_p1'):T('game_you')):(mode==='2p'?T('game_p2'):T('game_cpu'));
  showMsg(gmsg);
  // Check set
  const won = checkSet(winner);
  if(!won) {
    updateScoreDisplay();
    setTimeout(()=>{ server = server===1?2:1; resetForServe(); }, 1500);
  }
}

function checkSet(winner) {
  const g1=games1, g2=games2;
  const hasSet = (g1>=6&&g1-g2>=2)||(g2>=6&&g2-g1>=2)||(g1>=7||g2>=7);
  if(!hasSet) return false;
  games1=0; games2=0;
  if(winner===1) sets1++; else sets2++;
  const smsg = winner===1?(mode==='2p'?T('set_p1'):T('set_you')):(mode==='2p'?T('set_p2'):T('set_cpu'));
  showMsg(smsg);
  updateScoreDisplay();
  // Best of 3
  if(sets1>=2||sets2>=2) {
    setTimeout(()=>endGame(winner), 2000);
    return true;
  }
  setTimeout(()=>{ server=server===1?2:1; resetForServe(); }, 2000);
  return true;
}

function endGame(winner) {
  gameState = 'gameover';
  const wmsg = winner===1?(mode==='2p'?T('p1_wins'):T('you_win')):(mode==='2p'?T('p2_wins'):T('cpu_wins'));
  showMsg(wmsg);
  document.getElementById('play-again').style.display='block';
}

// ===== Score display =====
function updateScoreDisplay() {
  document.getElementById('sets-p1').textContent = sets1;
  document.getElementById('sets-p2').textContent = sets2;
  document.getElementById('games-p1').textContent = games1;
  document.getElementById('games-p2').textContent = games2;
  // Points display
  let p1str, p2str;
  if(deuce || (pts1>=3 && pts2>=3)) {
    if(pts1>pts2) { p1str='ADV'; p2str='-'; }
    else if(pts2>pts1) { p1str='-'; p2str='ADV'; }
    else { p1str='40'; p2str='40'; }
  } else {
    p1str = PTS_LABELS[Math.min(pts1,3)];
    p2str = PTS_LABELS[Math.min(pts2,3)];
  }
  document.getElementById('pts-p1').textContent = p1str;
  document.getElementById('pts-p2').textContent = p2str;
  document.getElementById('lbl-p1').textContent = mode==='2p'?T('p1'):T('you');
  document.getElementById('lbl-p2').textContent = mode==='2p'?T('p2'):T('cpu');
}

function showMsg(m) { msgText=m; document.getElementById('msg').textContent=m; }
function showStatus() { document.getElementById('status').textContent = statusText; }

// ===== Rendering =====
function drawCourt() {
  // Sky/background
  ctx.fillStyle = '#1a2a1a';
  ctx.fillRect(0,0,W,H);

  // Court surface (trapezoid)
  ctx.beginPath();
  ctx.moveTo(CX - COURT_NEAR_HW, COURT_NEAR_Y);
  ctx.lineTo(CX + COURT_NEAR_HW, COURT_NEAR_Y);
  ctx.lineTo(CX + COURT_FAR_HW, COURT_FAR_Y);
  ctx.lineTo(CX - COURT_FAR_HW, COURT_FAR_Y);
  ctx.closePath();
  ctx.fillStyle = '#2d6a1e';
  ctx.fill();

  // Court outline
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Sidelines (already drawn by outline)
  // Near baseline
  ctx.beginPath();
  ctx.moveTo(CX - COURT_NEAR_HW, COURT_NEAR_Y);
  ctx.lineTo(CX + COURT_NEAR_HW, COURT_NEAR_Y);
  ctx.strokeStyle = '#fff'; ctx.lineWidth=2; ctx.stroke();

  // Far baseline
  ctx.beginPath();
  ctx.moveTo(CX - COURT_FAR_HW, COURT_FAR_Y);
  ctx.lineTo(CX + COURT_FAR_HW, COURT_FAR_Y);
  ctx.stroke();

  // Net (z=0.5)
  const netL = courtToScreen(-1, NET_Z, 0);
  const netR = courtToScreen(1, NET_Z, 0);
  const netTop = courtToScreen(0, NET_Z, 0.15);
  ctx.beginPath();
  ctx.moveTo(netL.sx, netL.sy);
  ctx.lineTo(netR.sx, netR.sy);
  ctx.strokeStyle='#cccccc'; ctx.lineWidth=3; ctx.stroke();
  // Net posts
  const netHeight = netTop.sy;
  ctx.beginPath();
  ctx.moveTo(netL.sx, netL.sy); ctx.lineTo(netL.sx, netHeight);
  ctx.moveTo(netR.sx, netR.sy); ctx.lineTo(netR.sx, netHeight);
  ctx.strokeStyle='#888'; ctx.lineWidth=2; ctx.stroke();
  // Net top tape
  ctx.beginPath();
  ctx.moveTo(netL.sx, netHeight); ctx.lineTo(netR.sx, netHeight);
  ctx.strokeStyle='#ffffff'; ctx.lineWidth=2; ctx.stroke();
  // Net mesh lines
  ctx.strokeStyle='rgba(180,180,180,0.3)'; ctx.lineWidth=1;
  for(let i=1;i<8;i++){
    const xx = netL.sx + (netR.sx-netL.sx)*i/8;
    ctx.beginPath(); ctx.moveTo(xx, netL.sy); ctx.lineTo(xx, netHeight); ctx.stroke();
  }
  for(let i=1;i<4;i++){
    const yy = netL.sy + (netHeight - netL.sy)*i/4;
    ctx.beginPath(); ctx.moveTo(netL.sx, yy); ctx.lineTo(netR.sx, yy); ctx.stroke();
  }

  // Center line (near side)
  const cl1 = courtToScreen(0, 0, 0);
  const clNet = courtToScreen(0, NET_Z, 0);
  ctx.beginPath(); ctx.moveTo(cl1.sx, cl1.sy); ctx.lineTo(clNet.sx, clNet.sy);
  ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.stroke();
  // Center line (far side)
  const cl2 = courtToScreen(0, 1, 0);
  ctx.beginPath(); ctx.moveTo(clNet.sx, clNet.sy); ctx.lineTo(cl2.sx, cl2.sy);
  ctx.stroke();

  // Service boxes (z=0.25 and z=0.75)
  function drawServiceLine(z) {
    const l = courtToScreen(-1, z, 0);
    const r = courtToScreen(1, z, 0);
    ctx.beginPath(); ctx.moveTo(l.sx, l.sy); ctx.lineTo(r.sx, r.sy);
    ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=1; ctx.stroke();
  }
  drawServiceLine(0.25);
  drawServiceLine(0.75);

  // Background (beyond far baseline)
  ctx.fillStyle='#1a2a1a';
  ctx.fillRect(0,0,W,COURT_FAR_Y);
}

function drawPlayer(p, color, isBack) {
  const pos = courtToScreen(p.x, p.z, 0);
  const scaleF = 0.5 + (1-p.z)*0.9; // bigger when near
  const size = 22 * scaleF;

  ctx.save();
  ctx.translate(pos.sx, pos.sy);

  if(isBack) {
    // Seen from behind: head, torso, arms, legs
    ctx.fillStyle = color;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2*scaleF;
    // head
    ctx.beginPath();
    ctx.arc(0, -size*1.3, size*0.4, 0, Math.PI*2);
    ctx.fillStyle = '#ffcc99'; ctx.fill();
    ctx.strokeStyle=color; ctx.stroke();
    // body
    ctx.beginPath();
    ctx.moveTo(0, -size*0.9); ctx.lineTo(0, -size*0.1);
    ctx.strokeStyle=color; ctx.lineWidth=3*scaleF; ctx.stroke();
    // shirt (colored rectangle)
    ctx.fillStyle = color;
    ctx.fillRect(-size*0.35, -size*0.9, size*0.7, size*0.6);
    // arms
    ctx.beginPath();
    ctx.moveTo(-size*0.35, -size*0.8); ctx.lineTo(-size*0.7, -size*0.4);
    ctx.moveTo(size*0.35, -size*0.8); ctx.lineTo(size*0.7, -size*0.4);
    ctx.strokeStyle='#ffcc99'; ctx.lineWidth=2*scaleF; ctx.stroke();
    // legs
    ctx.beginPath();
    ctx.moveTo(0, -size*0.1); ctx.lineTo(-size*0.3, size*0.5);
    ctx.moveTo(0, -size*0.1); ctx.lineTo(size*0.3, size*0.5);
    ctx.strokeStyle='#333'; ctx.lineWidth=3*scaleF; ctx.stroke();
    // racket (raised arm)
    if(p.swinging) {
      ctx.beginPath();
      ctx.arc(size*0.8, -size*0.6, size*0.3, 0, Math.PI*2);
      ctx.strokeStyle='#aaa'; ctx.lineWidth=2*scaleF; ctx.stroke();
    }
  } else {
    // CPU: facing toward player (front view simplified)
    ctx.fillStyle='#ffcc99';
    ctx.beginPath(); ctx.arc(0,-size*1.1,size*0.4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=color;
    ctx.fillRect(-size*0.35,-size*0.7,size*0.7,size*0.6);
    ctx.strokeStyle='#333'; ctx.lineWidth=3*scaleF;
    ctx.beginPath();
    ctx.moveTo(0,size*-0.1); ctx.lineTo(-size*0.3,size*0.5);
    ctx.moveTo(0,size*-0.1); ctx.lineTo(size*0.3,size*0.5);
    ctx.stroke();
    ctx.strokeStyle='#ffcc99'; ctx.lineWidth=2*scaleF;
    ctx.beginPath();
    ctx.moveTo(-size*0.35,-size*0.6); ctx.lineTo(-size*0.75,-size*0.2);
    ctx.moveTo(size*0.35,-size*0.6); ctx.lineTo(size*0.75,-size*0.2);
    ctx.stroke();
  }
  ctx.restore();
}

function drawBall() {
  if(ball.z < -0.05 || ball.z > 1.05) return;
  const pos = courtToScreen(ball.x, ball.z, ball.yh);
  const shadow = courtToScreen(ball.x, ball.z, 0);
  const r = Math.max(3, 8 * (0.5 + (1-ball.z)*0.5));

  // Shadow
  ctx.beginPath();
  ctx.ellipse(shadow.sx, shadow.sy, r*0.8, r*0.3, 0, 0, Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.fill();

  // Ball
  const grad = ctx.createRadialGradient(pos.sx-r*0.3, pos.sy-r*0.3, r*0.1, pos.sx, pos.sy, r);
  grad.addColorStop(0,'#ffff66');
  grad.addColorStop(1,'#cccc00');
  ctx.beginPath();
  ctx.arc(pos.sx, pos.sy, r, 0, Math.PI*2);
  ctx.fillStyle=grad; ctx.fill();
}

function render() {
  ctx.clearRect(0,0,W,H);
  drawCourt();

  // Draw players (far first for z-order)
  drawPlayer(p2, '#ff4444', false);
  drawPlayer(p1, '#4488ff', true);

  // Ball
  drawBall();

  // Swing range indicator when ball is close
  if(serveState==='live' && ball.inPlay && ball.z < NET_Z + 0.05) {
    const ballScrn = courtToScreen(ball.x, ball.z, ball.yh);
    const p1Scrn = courtToScreen(p1.x, p1.z, 0);
    const dist = Math.hypot(ballScrn.sx-p1Scrn.sx, ballScrn.sy-p1Scrn.sy);
    if(dist < 100) {
      ctx.beginPath();
      ctx.arc(p1Scrn.sx, p1Scrn.sy-10, 45, 0, Math.PI*2);
      ctx.strokeStyle='rgba(0,212,170,0.3)'; ctx.lineWidth=2; ctx.stroke();
    }
  }

  // Serve ball indicator
  if(serveState==='wait') {
    const ballScrn = courtToScreen(ball.x, ball.z, ball.yh);
    ctx.beginPath();
    ctx.arc(ballScrn.sx, ballScrn.sy, 9, 0, Math.PI*2);
    ctx.fillStyle='#ffff44'; ctx.fill();
    // Pulsing ring
    const pulse = (Math.sin(Date.now()/300)+1)/2;
    ctx.beginPath();
    ctx.arc(ballScrn.sx, ballScrn.sy, 9+pulse*8, 0, Math.PI*2);
    ctx.strokeStyle=`rgba(255,255,68,${0.5-pulse*0.4})`; ctx.lineWidth=2; ctx.stroke();
  }

  // Status overlay when waiting
  if(serveState==='wait' && gameState==='playing') {
    const hint = server===1?T('press_space'):T('press_space_swing');
    ctx.fillStyle='rgba(0,212,170,0.7)';
    ctx.font='bold 14px Courier New';
    ctx.textAlign='center';
    ctx.fillText(hint, W/2, H-15);
  }
}

// ===== Game loop =====
function update(dt) {
  if(gameState !== 'playing') return;

  // Update player 1 movement keys
  p1.moving.left = !!keys['ArrowLeft'];
  p1.moving.right = !!keys['ArrowRight'];
  p1.moving.up = !!keys['ArrowUp'];
  p1.moving.down = !!keys['ArrowDown'];

  if(mode==='2p') {
    p2.moving.left = !!keys['a'];
    p2.moving.right = !!keys['d'];
    p2.moving.up = !!keys['w'];
    p2.moving.down = !!keys['s'];
  }

  // Move P1
  const p1speed = 0.01;
  if(p1.moving.left) p1.x -= p1speed*60*dt;
  if(p1.moving.right) p1.x += p1speed*60*dt;
  if(p1.moving.up) p1.z -= p1speed*40*dt; // forward = less z (near baseline)
  if(p1.moving.down) p1.z += p1speed*40*dt;
  p1.x = Math.max(-0.85, Math.min(0.85, p1.x));
  p1.z = Math.max(0.02, Math.min(0.45, p1.z));

  // Move P2 (in 2p mode)
  if(mode==='2p') {
    const p2speed = 0.01;
    if(p2.moving.left) p2.x -= p2speed*60*dt;
    if(p2.moving.right) p2.x += p2speed*60*dt;
    if(p2.moving.up) p2.z -= p2speed*40*dt;
    if(p2.moving.down) p2.z += p2speed*40*dt;
    p2.x = Math.max(-0.85, Math.min(0.85, p2.x));
    p2.z = Math.max(0.55, Math.min(0.98, p2.z));
  }

  // Update ball position while serving (follows player until toss)
  if(serveState==='wait') {
    if(server===1) {
      ball.x = p1.x; ball.z = p1.z;
      ball.yh = 0.3;
    } else {
      ball.x = p2.x; ball.z = p2.z;
      ball.yh = 0.3;
    }
  }

  updateCPU(dt);
  if(serveState==='live') updatePhysics(dt);

  showStatus();
  statusText = serveState==='wait'?(server===1?T('your_serve'):(mode==='2p'?T('p2_serve'):T('cpu_serve'))):statusText;
}

function gameLoop(ts) {
  const dt = Math.min((ts - lastTime)/1000, 0.05);
  lastTime = ts;
  update(dt);
  render();
  requestAnimationFrame(gameLoop);
}

// ===== Idle screen =====
function drawIdleScreen() {
  ctx.clearRect(0,0,W,H);
  drawCourt();
  // Title overlay
  ctx.fillStyle='rgba(13,13,26,0.5)';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#00d4aa';
  ctx.font='bold 36px Courier New';
  ctx.textAlign='center';
  ctx.fillText('TENNIS', W/2, H/2-30);
  ctx.fillStyle='#aadd00';
  ctx.font='14px Courier New';
  ctx.fillText('PRESS ANY KEY TO START', W/2, H/2+20);
}

// ===== Play again =====
document.getElementById('play-again').addEventListener('click',()=>{
  gameState='idle';
  document.getElementById('play-again').style.display='none';
  showMsg('');
  drawIdleScreen();
});

document.addEventListener('keydown', e=>{
  if(gameState==='idle' && !['F5','F11','Tab'].includes(e.key)) {
    startGame();
  }
}, true);
