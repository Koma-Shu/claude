<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TENNIS</title>
  <script src="sound.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#0d0d1a; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:16px 10px; font-family:'Courier New',monospace; color:#eee; user-select:none; }
    h1 { font-size:1.8rem; letter-spacing:4px; color:#44ff99; margin-bottom:6px; text-shadow:0 0 20px rgba(68,255,153,0.4); }
    #lang-btn { position:fixed; top:14px; left:14px; background:#1e1e2e; border:1px solid #444; border-radius:6px; color:#888; font-family:'Courier New',monospace; font-size:0.72rem; padding:5px 10px; cursor:pointer; z-index:10; }
    #back-btn { position:fixed; top:14px; right:14px; background:#1e1e2e; border:1px solid #444; border-radius:6px; color:#888; font-family:'Courier New',monospace; font-size:0.72rem; padding:5px 10px; cursor:pointer; z-index:10; text-decoration:none; }
    #back-btn:hover { color:#aaa; }
    #mode-buttons { display:flex; gap:10px; margin-bottom:8px; }
    .mbtn { padding:7px 18px; border-radius:6px; border:1px solid #333; background:#13131f; color:#666; font-family:'Courier New',monospace; font-size:0.78rem; cursor:pointer; letter-spacing:1px; transition:all .15s; }
    .mbtn:hover { border-color:#555; color:#aaa; }
    .mbtn.active { border-color:#44ff99; color:#44ff99; background:#0a1f10; }
    #diff-row { display:flex; gap:6px; margin-bottom:8px; }
    .dbtn { padding:5px 14px; border-radius:6px; border:1px solid #333; background:#13131f; color:#555; font-family:'Courier New',monospace; font-size:0.72rem; cursor:pointer; transition:all .15s; }
    .dbtn:hover { border-color:#555; color:#aaa; }
    .dbtn.active { border-color:#44ff99; color:#44ff99; background:#0a1f10; }
    #score-display { display:flex; align-items:center; gap:16px; margin-bottom:6px; font-size:0.8rem; }
    .player-score { display:flex; flex-direction:column; align-items:center; gap:2px; }
    .player-label { font-size:0.65rem; color:#555; letter-spacing:2px; }
    .sets-score { font-size:1.1rem; font-weight:bold; }
    .p1-color { color:#4488ff; }
    .p2-color { color:#ff4444; }
    .score-sep { color:#333; font-size:1.2rem; }
    .games-score { font-size:0.85rem; color:#888; }
    .points-score { font-size:1.3rem; font-weight:bold; }
    canvas { display:block; margin-bottom:8px; border:1px solid #1a2a3a; }
    #status { font-size:0.78rem; color:#666; margin-bottom:6px; height:1.2em; text-align:center; letter-spacing:1px; min-width:200px; }
    #msg { font-size:0.9rem; color:#44ff99; margin-bottom:8px; height:1.4em; text-align:center; letter-spacing:2px; }
    #play-again { display:none; padding:9px 28px; border-radius:8px; background:linear-gradient(135deg,#44ff99,#0088cc); border:none; color:#000; font-family:'Courier New',monospace; font-size:0.85rem; letter-spacing:2px; cursor:pointer; font-weight:bold; margin-bottom:10px; }
    #controls-hint { font-size:0.65rem; color:#333; text-align:center; margin-bottom:6px; letter-spacing:1px; }
    #rating-section { margin-top:16px; width:100%; max-width:500px; border-top:1px solid #222; padding-top:14px; }
    #rtoggle { cursor:pointer; font-size:0.8rem; color:#555; letter-spacing:2px; text-align:center; padding:6px; }
    #rtoggle:hover { color:#44ff99; }
    #rform { display:none; margin-top:12px; }
    #rform.open { display:block; }
    #star-input { display:flex; gap:6px; justify-content:center; margin-bottom:10px; }
    .star { font-size:1.8rem; cursor:pointer; color:#333; }
    .star.active { color:#ffd700; }
    #cmt { width:100%; background:#0d0d1a; border:1px solid #333; border-radius:6px; color:#ccc; font-family:'Courier New',monospace; font-size:0.78rem; padding:8px; resize:vertical; min-height:60px; margin-bottom:10px; }
    #rsub { display:block; width:100%; padding:9px; background:linear-gradient(135deg,#44ff99,#0088cc); border:none; border-radius:6px; color:#000; font-family:'Courier New',monospace; font-size:0.8rem; letter-spacing:2px; cursor:pointer; font-weight:bold; }
    #rlist { margin-top:14px; }
    .ri { border-top:1px solid #1a1a2a; padding:8px 0; font-size:0.75rem; }
    .rs { color:#ffd700; } .rd { color:#444; margin-left:8px; font-size:0.65rem; } .rc { color:#777; margin-top:4px; }
    .avg-d { text-align:center; font-size:0.8rem; color:#666; margin-bottom:6px; }
    .avg-d span { color:#ffd700; }
    .back { display:block; margin-top:14px; font-size:0.75rem; color:#444; text-decoration:none; letter-spacing:2px; text-align:center; }
    .back:hover { color:#888; }
  </style>
</head>
<body>
<button id="lang-btn">EN</button>
<a href="index.html" id="back-btn">← ARCADE</a>
<h1 id="game-title">テニス</h1>

<div id="mode-buttons">
  <button class="mbtn active" id="btn-cpu" data-mode="cpu">vs CPU</button>
  <button class="mbtn" id="btn-2p" data-mode="2p">2P ローカル</button>
</div>
<div id="diff-row">
  <button class="dbtn" id="diff-easy" data-d="easy">易しい</button>
  <button class="dbtn active" id="diff-normal" data-d="normal">普通</button>
  <button class="dbtn" id="diff-hard" data-d="hard">難しい</button>
</div>

<div id="score-display">
  <div class="player-score">
    <div class="player-label" id="lbl-p1">P1</div>
    <div class="sets-score p1-color" id="sets-p1">0</div>
    <div class="games-score p1-color" id="games-p1">0</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:2px">
    <div style="font-size:0.6rem;color:#333;letter-spacing:2px" id="lbl-sets">セット</div>
    <div class="score-sep">|</div>
    <div style="font-size:0.6rem;color:#333;letter-spacing:2px" id="lbl-games">ゲーム</div>
  </div>
  <div class="player-score">
    <div class="player-label" id="lbl-p2">CPU</div>
    <div class="sets-score p2-color" id="sets-p2">0</div>
    <div class="games-score p2-color" id="games-p2">0</div>
  </div>
  <div style="width:2px;background:#222;height:50px"></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
    <div style="font-size:0.6rem;color:#333;letter-spacing:2px" id="lbl-point">ポイント</div>
    <div style="display:flex;gap:8px;align-items:center">
      <div class="points-score p1-color" id="pts-p1">0</div>
      <div style="color:#333">-</div>
      <div class="points-score p2-color" id="pts-p2">0</div>
    </div>
  </div>
</div>

<canvas id="c" width="500" height="340"></canvas>
<div id="status"></div>
<div id="msg"></div>
<button id="play-again">もう一度</button>
<div id="controls-hint" id="controls-hint"></div>

<div id="rating-section">
  <div class="avg-d" id="avg-d"></div>
  <div id="rtoggle">★ <span id="lbl-rate">このゲームを評価する</span></div>
  <div id="rform">
    <div id="star-input">
      <span class="star" data-v="1">★</span><span class="star" data-v="2">★</span>
      <span class="star" data-v="3">★</span><span class="star" data-v="4">★</span>
      <span class="star" data-v="5">★</span>
    </div>
    <textarea id="cmt" placeholder="コメント（任意）..."></textarea>
    <button id="rsub">送信</button>
  </div>
  <div id="rlist"></div>
</div>
<a href="index.html" class="back">← ARCADE</a>

<script>
// ============ i18n ============
const LANG = {
  ja: {
    title:'テニス', p1:'P1', cpu:'CPU', p2:'P2',
    sets:'セット', games:'ゲーム', point:'ポイント',
    yourServe:'あなたのサーブ', cpuServe:'CPUのサーブ',
    p1Serve:'P1のサーブ', p2Serve:'P2のサーブ',
    win:'あなたの勝ち！🎉', lose:'CPUの勝ち', p1win:'P1の勝ち！', p2win:'P2の勝ち！',
    deuce:'デュース', advP1:'P1 アドバンテージ', advP2:'P2 アドバンテージ',
    advYou:'あなた アドバンテージ', advCPU:'CPU アドバンテージ',
    match:'試合終了', playAgain:'もう一度',
    easy:'易しい', normal:'普通', hard:'難しい',
    hint1p:'← → 移動 | Space スイング', hint2p:'A/D 移動 W スイング | ← → 移動 ↑ スイング',
    pressSpace:'スペースでサーブ', press1p:'[Space] でサーブ', pressW:'[W] でサーブ',
    setWon:'セット獲得！', rateGame:'このゲームを評価する',
    noRatings:'まだ評価がありません', submitBtn:'送信',
    commentPlaceholder:'コメント（任意）...',
    vsMode:'vs CPU', localMode:'2P ローカル',
  },
  en: {
    title:'TENNIS', p1:'P1', cpu:'CPU', p2:'P2',
    sets:'Set', games:'Game', point:'Point',
    yourServe:'Your serve', cpuServe:'CPU serve',
    p1Serve:'P1 serve', p2Serve:'P2 serve',
    win:'You win! 🎉', lose:'CPU wins', p1win:'P1 wins!', p2win:'P2 wins!',
    deuce:'Deuce', advP1:'Adv P1', advP2:'Adv P2',
    advYou:'Adv You', advCPU:'Adv CPU',
    match:'Match Over', playAgain:'Play Again',
    easy:'Easy', normal:'Normal', hard:'Hard',
    hint1p:'← → Move | Space Swing', hint2p:'A/D Move W Swing | ← → Move ↑ Swing',
    pressSpace:'Press Space to serve', press1p:'[Space] to serve', pressW:'[W] to serve',
    setWon:'Set won!', rateGame:'Rate this game',
    noRatings:'No ratings yet', submitBtn:'Submit',
    commentPlaceholder:'Comment (optional)...',
    vsMode:'vs CPU', localMode:'2P Local',
  }
};
let lang = localStorage.getItem('lang') || 'ja';
function T(k) { return LANG[lang][k] || LANG.ja[k] || k; }

function applyLang() {
  document.getElementById('lang-btn').textContent = lang==='ja'?'EN':'JA';
  document.documentElement.lang = lang;
  document.getElementById('game-title').textContent = T('title');
  document.getElementById('lbl-sets').textContent = T('sets');
  document.getElementById('lbl-games').textContent = T('games');
  document.getElementById('lbl-point').textContent = T('point');
  document.getElementById('lbl-rate').textContent = T('rateGame');
  document.getElementById('cmt').placeholder = T('commentPlaceholder');
  document.getElementById('rsub').textContent = T('submitBtn');
  document.getElementById('play-again').textContent = T('playAgain');
  document.getElementById('btn-cpu').textContent = T('vsMode');
  document.getElementById('btn-2p').textContent = T('localMode');
  document.querySelectorAll('.dbtn').forEach(b => b.textContent = T(b.dataset.d));
  updateLabels();
  updateHint();
}
document.getElementById('lang-btn').addEventListener('click', () => {
  lang = lang==='ja'?'en':'ja';
  localStorage.setItem('lang', lang);
  applyLang();
});

// ============ Supabase ============
const SUPABASE_URL = 'https://qveznkwqfjjtjxqxdyls.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Eu8ppaJ-BxQvwGyj1UlNjw_vyywq8ge';
const GAME = 'tennis';
async function sb(path, opts={}) {
  const r = await fetch(SUPABASE_URL+path, {
    headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=representation',...(opts.headers||{})},
    ...opts
  });
  if (!r.ok && r.status!==201) throw new Error(await r.text());
  const t = await r.text(); return t ? JSON.parse(t) : null;
}
async function loadRatings() {
  try { const rows=await sb(`/rest/v1/ratings?game=eq.${GAME}&order=created_at.desc&limit=20`); renderR(rows||[]); avgBadge(rows||[]); } catch(e) { renderR([]); }
}
async function subRating(stars,cmt) {
  const me = JSON.parse(localStorage.getItem('arcade_user')||'null');
  const body = {game:GAME, stars, comment:cmt||null};
  if (me) { body.user_id=me.id; body.username=me.username; }
  await sb('/rest/v1/ratings',{method:'POST',body:JSON.stringify(body)});
  loadRatings();
}
function renderR(list) {
  const el = document.getElementById('rlist');
  if (!list.length) { el.innerHTML=`<div style="color:#333;text-align:center;font-size:0.72rem;padding:8px">${T('noRatings')}</div>`; return; }
  el.innerHTML = list.map(r=>`<div class="ri"><span class="rs">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)}</span>${r.username?`<span class="rd" style="color:#00d4aa">@${r.username.replace(/</g,'&lt;')}</span>`:''}<span class="rd">${new Date(r.created_at).toLocaleDateString('ja-JP')}</span>${r.comment?`<p class="rc">${r.comment.replace(/</g,'&lt;')}</p>`:''}</div>`).join('');
}
function avgBadge(list) {
  const el = document.getElementById('avg-d');
  if (!list.length) { el.textContent=''; return; }
  const avg = (list.reduce((s,r)=>s+r.stars,0)/list.length).toFixed(1);
  el.innerHTML = `<span>${'★'.repeat(Math.round(avg))}</span> ${avg} (${list.length}件)`;
}
let selStar = 0;
document.getElementById('rtoggle').addEventListener('click',()=>document.getElementById('rform').classList.toggle('open'));
document.querySelectorAll('.star').forEach(s=>s.addEventListener('click',()=>{
  selStar=+s.dataset.v;
  document.querySelectorAll('.star').forEach((st,i)=>st.classList.toggle('active',i<selStar));
}));
document.getElementById('rsub').addEventListener('click', async()=>{
  if (!selStar) { alert(lang==='ja'?'星を選んでください':'Please select a star rating'); return; }
  await subRating(selStar, document.getElementById('cmt').value.trim());
  selStar=0;
  document.querySelectorAll('.star').forEach(s=>s.classList.remove('active'));
  document.getElementById('cmt').value='';
  document.getElementById('rform').classList.remove('open');
});

// ============ Game ============
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 500, H = 340;
const GROUND_Y = 280;
const NET_X = 250;
const NET_H = 50; // height of net above ground
const NET_TOP = GROUND_Y - NET_H;
const PLAYER_Y = GROUND_Y - 20; // player feet y
const PLAYER_H = 44; // player total height
const REACH_X = 52;
const REACH_Y = 64;
const BALL_R = 7;

let gameMode = 'cpu'; // 'cpu' | '2p'
let difficulty = 'normal';

// Score state
let score = {
  sets: [0, 0],
  games: [0, 0],
  points: [0, 0],  // 0,1,2,3 = 0,15,30,40; 4=adv
  deuce: false,
  server: 0, // 0=p1, 1=p2
  matchOver: false,
  setWinner: -1, // -1=none, 0 or 1
};

// Physics state
let ball = { x:0, y:0, vx:0, vy:0, bounced:false, side:-1, inPlay:false };
let players = [
  { x:80, y:PLAYER_Y, vx:0, swinging:false, swingT:0, hit:false, hitFlash:0 },
  { x:420, y:PLAYER_Y, vx:0, swinging:false, swingT:0, hit:false, hitFlash:0 },
];
let keys = {};
let gameState = 'serve'; // 'serve'|'rally'|'point'|'gameover'
let pointWinner = -1;
let serveTick = 0;
let messageTimeout = null;
let rallyCount = 0;

// CPU state
let cpuTarget = 420;
let cpuReact = 0; // reaction delay frames
let lastBounceX = 0;

const POINT_LABELS = ['0','15','30','40'];

function updateLabels() {
  if (gameMode === 'cpu') {
    document.getElementById('lbl-p1').textContent = T('p1');
    document.getElementById('lbl-p2').textContent = T('cpu');
  } else {
    document.getElementById('lbl-p1').textContent = T('p1');
    document.getElementById('lbl-p2').textContent = T('p2');
  }
}

function updateHint() {
  const el = document.getElementById('controls-hint');
  el.textContent = gameMode === 'cpu' ? T('hint1p') : T('hint2p');
}

function getPointLabel(p, idx) {
  if (!p.deuce) return POINT_LABELS[Math.min(p.points[idx], 3)];
  if (p.points[0] === p.points[1]) return T('deuce');
  if (idx===0) return p.points[0] > p.points[1] ? (gameMode==='cpu'?T('advYou'):T('advP1')) : '';
  if (idx===1) return p.points[1] > p.points[0] ? (gameMode==='cpu'?T('advCPU'):T('advP2')) : '';
  return '';
}

function updateScoreDisplay() {
  document.getElementById('sets-p1').textContent = score.sets[0];
  document.getElementById('sets-p2').textContent = score.sets[1];
  document.getElementById('games-p1').textContent = score.games[0];
  document.getElementById('games-p2').textContent = score.games[1];

  if (score.deuce) {
    const diff = score.points[0] - score.points[1];
    if (diff === 0) {
      document.getElementById('pts-p1').textContent = T('deuce');
      document.getElementById('pts-p2').textContent = '';
    } else if (diff > 0) {
      document.getElementById('pts-p1').textContent = gameMode==='cpu'?T('advYou'):T('advP1');
      document.getElementById('pts-p2').textContent = '';
    } else {
      document.getElementById('pts-p1').textContent = '';
      document.getElementById('pts-p2').textContent = gameMode==='cpu'?T('advCPU'):T('advP2');
    }
  } else {
    document.getElementById('pts-p1').textContent = POINT_LABELS[Math.min(score.points[0],3)];
    document.getElementById('pts-p2').textContent = POINT_LABELS[Math.min(score.points[1],3)];
  }
}

function setStatus(msg) { document.getElementById('status').textContent = msg; }
function setMsg(msg, duration=2500) {
  document.getElementById('msg').textContent = msg;
  if (messageTimeout) clearTimeout(messageTimeout);
  if (duration > 0) messageTimeout = setTimeout(()=>{ document.getElementById('msg').textContent=''; }, duration);
}

function initMatch() {
  score = { sets:[0,0], games:[0,0], points:[0,0], deuce:false, server:0, matchOver:false, setWinner:-1 };
  rallyCount = 0;
  resetForServe(0);
}

function resetForServe(server) {
  score.server = server;
  score.points = [0,0];
  score.deuce = false;
  ball.inPlay = false;
  ball.x = server===0 ? 100 : 400;
  ball.y = PLAYER_Y - 20;
  ball.vx = 0; ball.vy = 0; ball.bounced = false; ball.side = server;
  players[0].x = 80; players[0].swinging=false; players[0].hitFlash=0;
  players[1].x = 420; players[1].swinging=false; players[1].hitFlash=0;
  gameState = 'serve';
  serveTick = 0;
  cpuTarget = players[1].x;
  updateScoreDisplay();
  if (!score.matchOver) {
    const s = server===0 ? (gameMode==='cpu'?T('yourServe'):T('p1Serve')) : (gameMode==='cpu'?T('cpuServe'):T('p2Serve'));
    setStatus(s);
    setMsg('');
  }
}

function awardPoint(winner) {
  // winner = 0 or 1
  if (score.matchOver) return;
  gameState = 'point';
  pointWinner = winner;
  rallyCount = 0;

  if (score.deuce) {
    score.points[winner]++;
    const diff = score.points[0] - score.points[1];
    if (Math.abs(diff) >= 2) {
      // game won by winner
      awardGame(winner);
    }
    // else advantage continues
  } else {
    score.points[winner]++;
    // Check for deuce
    if (score.points[0] >= 3 && score.points[1] >= 3 && score.points[0]===score.points[1]) {
      score.deuce = true;
    } else if (score.points[winner] >= 4) {
      awardGame(winner);
    } else if (!score.deuce && score.points[0]===3 && score.points[1]===3) {
      score.deuce = true;
    }
  }
  updateScoreDisplay();
  ball.inPlay = false;
  setTimeout(()=>{ resetForServe(score.server); }, 1800);
}

function awardGame(winner) {
  score.games[winner]++;
  // Check set
  const g0 = score.games[0], g1 = score.games[1];
  let setDone = false;
  if (g0 >= 6 || g1 >= 6) {
    if (Math.abs(g0-g1) >= 2 || (g0===7||g1===7)) {
      setDone = true;
    }
  }
  if (setDone) {
    score.sets[winner]++;
    score.games = [0,0];
    setMsg(T('setWon'), 2000);
    // Check match (best of 3)
    if (score.sets[winner] >= 2) {
      score.matchOver = true;
      setTimeout(()=>endMatch(winner), 1500);
    } else {
      // alternate server at set start
      score.server = winner;
    }
  } else {
    // alternate server each game
    score.server = 1 - score.server;
  }
  score.points = [0,0]; score.deuce = false;
  updateScoreDisplay();
}

function endMatch(winner) {
  gameState = 'gameover';
  let msg;
  if (gameMode==='cpu') msg = winner===0 ? T('win') : T('lose');
  else msg = winner===0 ? T('p1win') : T('p2win');
  setStatus(T('match'));
  setMsg(msg, 0);
  document.getElementById('play-again').style.display = 'inline-block';
  if (window.SND) { winner===0 ? SND.sfx.win() : SND.sfx.lose(); }
}

// ---- Physics ----
function resetBallForServe() {
  const srv = score.server;
  ball.x = srv===0 ? players[0].x : players[1].x;
  ball.y = PLAYER_Y - 30;
  ball.vx = 0; ball.vy = 0;
  ball.inPlay = false; ball.bounced = false; ball.side = srv;
}

function launchBall(playerIdx, power) {
  const p = players[playerIdx];
  const targetX = playerIdx===0 ? players[1].x + (Math.random()-0.5)*80 : players[0].x + (Math.random()-0.5)*80;
  const dir = playerIdx===0 ? 1 : -1;
  const spd = 9 + power * 4;
  const dx = targetX - p.x;
  const dist = Math.abs(dx);
  ball.vx = dir * spd;
  ball.vy = -10 - power * 2;
  ball.inPlay = true;
  ball.bounced = false;
  ball.side = playerIdx===0 ? 1 : 0; // ball goes to other side
  if (window.SND) SND.sfx.flip();
  players[playerIdx].hitFlash = 12;
  rallyCount++;
}

function physicsStep() {
  if (!ball.inPlay) return;
  // gravity
  ball.vy += 0.35;
  ball.x += ball.vx;
  ball.y += ball.vy;

  // Ground bounce
  if (ball.y + BALL_R >= GROUND_Y) {
    ball.y = GROUND_Y - BALL_R;
    ball.vy *= -0.72;
    ball.vx *= 0.88;
    if (Math.abs(ball.vy) < 1.5) ball.vy = 0;

    const onP1Side = ball.x < NET_X;
    const onP2Side = ball.x >= NET_X;

    if (ball.bounced) {
      // second bounce = point to other player
      const loser = onP1Side ? 0 : 1;
      awardPoint(1 - loser);
      if (window.SND) SND.sfx.invalid();
      return;
    } else {
      ball.bounced = true;
      if (window.SND) SND.sfx.move();
    }
  }

  // Out of bounds horizontal
  if (ball.x < -20 || ball.x > W+20) {
    // who missed?
    const loser = ball.x < 0 ? 0 : 1;
    awardPoint(1 - loser);
    if (window.SND) SND.sfx.invalid();
    return;
  }

  // Net check: ball crossing net zone
  if (ball.x >= NET_X - 8 && ball.x <= NET_X + 8) {
    if (ball.y + BALL_R > NET_TOP) {
      // hit the net - ball was going which direction?
      const loser = ball.vx > 0 ? 0 : 1;
      awardPoint(1 - loser);
      if (window.SND) SND.sfx.invalid();
      return;
    }
  }

  // Ball went past baseline without being hit
  if (ball.x < 20 && ball.vx < 0) {
    awardPoint(1);
    if (window.SND) SND.sfx.invalid();
    return;
  }
  if (ball.x > W-20 && ball.vx > 0) {
    awardPoint(0);
    if (window.SND) SND.sfx.invalid();
    return;
  }
}

function tryHit(playerIdx) {
  if (!ball.inPlay && gameState==='serve') {
    // serve
    if (playerIdx !== score.server) return;
    ball.inPlay = true;
    const dir = playerIdx===0 ? 1 : -1;
    ball.vx = dir * (9 + Math.random()*2);
    ball.vy = -11;
    ball.x = players[playerIdx].x + dir*10;
    ball.y = PLAYER_Y - 30;
    ball.bounced = false;
    ball.side = 1 - playerIdx;
    gameState = 'rally';
    setStatus('');
    if (window.SND) SND.sfx.flip();
    players[playerIdx].hitFlash = 10;
    rallyCount = 0;
    return;
  }
  if (!ball.inPlay || gameState!=='rally') return;
  const p = players[playerIdx];
  const dx = Math.abs(ball.x - p.x);
  const dy = Math.abs(ball.y - (p.y - PLAYER_H/2));
  if (dx < REACH_X && dy < REACH_Y) {
    // timing power: closer = more power
    const distRatio = 1 - (dx/REACH_X * 0.5 + dy/REACH_Y * 0.5);
    const power = Math.min(1, distRatio + 0.2);

    // Only hit if ball is on correct side or just crossed
    const ballOnMySide = playerIdx===0 ? ball.x <= NET_X + 30 : ball.x >= NET_X - 30;
    if (!ballOnMySide) return;

    // Prevent hitting ball going away from us
    const ballComingToMe = playerIdx===0 ? ball.vx < 0 || ball.x < 200 : ball.vx > 0 || ball.x > 300;

    launchBall(playerIdx, power * 0.6);
    players[playerIdx].swinging = true;
    players[playerIdx].swingT = 10;
  }
}

// ---- CPU AI ----
function cpuAI() {
  if (gameMode !== 'cpu') return;
  const cpu = players[1];
  const diffMap = { easy:0.03, normal:0.06, hard:0.12 };
  const speed = diffMap[difficulty] * 60;
  const reactionDelay = { easy:40, normal:20, hard:5 }[difficulty];
  const aimNoise = { easy:60, normal:25, hard:8 }[difficulty];

  if (gameState === 'serve' && score.server === 1) {
    // CPU serves
    serveTick++;
    if (serveTick > 60) {
      tryHit(1);
      serveTick = 0;
    }
    return;
  }

  if (gameState !== 'rally' || !ball.inPlay) return;

  // Move toward predicted ball position
  let targetX;
  if (ball.vx > 0 || ball.x > NET_X) {
    // ball coming to CPU side
    // predict landing
    const noise = (Math.random()-0.5)*aimNoise;
    if (ball.vy !== 0) {
      // simple prediction
      let simX = ball.x, simY = ball.y, simVx = ball.vx, simVy = ball.vy;
      let ticks = 0;
      while (simX < W-20 && simX > 20 && ticks < 120) {
        simVy += 0.35; simX += simVx; simY += simVy;
        if (simY + BALL_R >= GROUND_Y) { simY = GROUND_Y-BALL_R; simVy *= -0.72; simVx *= 0.88; }
        ticks++;
        if (simX > NET_X && ticks > reactionDelay) break;
      }
      targetX = simX + noise;
    } else {
      targetX = ball.x + noise;
    }
    cpuTarget = Math.max(270, Math.min(470, targetX));
  } else {
    cpuTarget = 420; // return to base
  }

  // Move
  const dx = cpuTarget - cpu.x;
  const mv = Math.min(Math.abs(dx), speed);
  cpu.x += Math.sign(dx) * mv;
  cpu.x = Math.max(270, Math.min(470, cpu.x));

  // Hit
  const ballOnCpuSide = ball.x >= NET_X - 20;
  if (ballOnCpuSide && ball.inPlay) {
    const dx2 = Math.abs(ball.x - cpu.x);
    const dy2 = Math.abs(ball.y - (cpu.y - PLAYER_H/2));
    const reachMult = { easy:0.7, normal:0.9, hard:1.0 }[difficulty];
    if (dx2 < REACH_X * reachMult && dy2 < REACH_Y * reachMult) {
      tryHit(1);
    }
  }
}

// ---- Player 2 AI (2P mode does nothing, human controls) ----

// ---- Controls ----
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  // prevent page scroll
  if (['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code)) e.preventDefault();

  // Serve / swing triggers
  if (gameState === 'serve') {
    if (e.code === 'Space' && score.server===0) tryHit(0);
    if (gameMode==='2p' && e.code==='KeyW' && score.server===0) tryHit(0);
    if (gameMode==='2p' && e.code==='ArrowUp' && score.server===1) tryHit(1);
  } else if (gameState === 'rally') {
    if (e.code === 'Space') tryHit(0);
    if (gameMode==='2p' && e.code==='KeyW') tryHit(0);
    if (gameMode==='2p' && e.code==='ArrowUp') tryHit(1);
  }
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

function handlePlayerInput() {
  const spd = 4.5;
  // Player 1: Arrow keys (1P) or A/D (2P)
  const p1 = players[0];
  if (gameMode==='cpu') {
    if (keys['ArrowLeft'])  p1.x -= spd;
    if (keys['ArrowRight']) p1.x += spd;
  } else {
    if (keys['KeyA']) p1.x -= spd;
    if (keys['KeyD']) p1.x += spd;
  }
  p1.x = Math.max(30, Math.min(230, p1.x));

  // Player 2 (human in 2P)
  if (gameMode==='2p') {
    const p2 = players[1];
    if (keys['ArrowLeft'])  p2.x -= spd;
    if (keys['ArrowRight']) p2.x += spd;
    p2.x = Math.max(270, Math.min(470, p2.x));
  }
}

// ---- Drawing ----
function drawCourt() {
  // Background
  ctx.fillStyle = '#0d0d1a';
  ctx.fillRect(0, 0, W, H);

  // Court surface
  const courtTop = 180;
  ctx.fillStyle = '#1a5c2a';
  ctx.fillRect(0, courtTop, W, GROUND_Y - courtTop);

  // Court below ground (dirt)
  ctx.fillStyle = '#0f3018';
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

  // Court lines
  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth = 2;

  // Baselines
  ctx.beginPath(); ctx.moveTo(10, GROUND_Y); ctx.lineTo(490, GROUND_Y); ctx.stroke();

  // Singles sidelines
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(10, courtTop+10); ctx.lineTo(10, GROUND_Y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(490, courtTop+10); ctx.lineTo(490, GROUND_Y); ctx.stroke();

  // Service boxes - center line
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(NET_X, NET_TOP+5); ctx.lineTo(NET_X, GROUND_Y); ctx.stroke();

  // Service lines (halfway between net and baseline)
  ctx.beginPath(); ctx.moveTo(10, GROUND_Y - (GROUND_Y-NET_TOP)/2 + 15); ctx.lineTo(NET_X, GROUND_Y - (GROUND_Y-NET_TOP)/2 + 15); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(NET_X, GROUND_Y - (GROUND_Y-NET_TOP)/2 + 15); ctx.lineTo(490, GROUND_Y - (GROUND_Y-NET_TOP)/2 + 15); ctx.stroke();

  // Net posts
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(NET_X, NET_TOP-5); ctx.lineTo(NET_X, GROUND_Y); ctx.stroke();

  // Net fill
  ctx.fillStyle = 'rgba(220,220,220,0.15)';
  ctx.fillRect(NET_X-3, NET_TOP-5, 6, NET_H+5);

  // Net horizontal lines
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 1;
  for (let y = NET_TOP; y <= GROUND_Y; y += 8) {
    ctx.beginPath(); ctx.moveTo(NET_X-3, y); ctx.lineTo(NET_X+3, y); ctx.stroke();
  }

  // Net top tape
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, NET_TOP); ctx.lineTo(W, NET_TOP); ctx.stroke();

  // Net vertical lines (decorative)
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 0.5;
  for (let x = NET_X-30; x <= NET_X+30; x+=5) {
    ctx.beginPath(); ctx.moveTo(x, NET_TOP); ctx.lineTo(x, GROUND_Y); ctx.stroke();
  }
}

function drawPlayer(p, idx, swinging) {
  const x = p.x;
  const y = p.y;
  const isP1 = idx === 0;
  const baseColor = isP1 ? '#4488ff' : '#ff4444';
  const darkColor = isP1 ? '#2255cc' : '#cc2222';
  const flash = p.hitFlash > 0;
  const col = flash ? '#ffff44' : baseColor;
  const dcol = flash ? '#ccaa00' : darkColor;

  ctx.save();

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(x, y+2, 14, 5, 0, 0, Math.PI*2);
  ctx.fill();

  // Legs
  ctx.strokeStyle = dcol; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x, y-10); ctx.lineTo(x-8, y+2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x, y-10); ctx.lineTo(x+8, y+2); ctx.stroke();

  // Body (torso)
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.ellipse(x, y-22, 8, 13, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = dcol; ctx.lineWidth = 1.5;
  ctx.stroke();

  // Head
  ctx.fillStyle = '#f4c48a';
  ctx.beginPath(); ctx.arc(x, y-38, 8, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = dcol; ctx.lineWidth = 1.5; ctx.stroke();

  // Hair
  ctx.fillStyle = isP1 ? '#3344aa' : '#993322';
  ctx.beginPath(); ctx.arc(x, y-42, 6, Math.PI, 0); ctx.fill();

  // Arms & Racket
  const swingAngle = swinging ? (isP1 ? -0.8 : 0.8) : (isP1 ? 0.3 : -0.3);
  const racketDir = isP1 ? 1 : -1;

  // Arm
  ctx.strokeStyle = '#f4c48a'; ctx.lineWidth = 3;
  const armEndX = x + racketDir * 18 * Math.cos(swingAngle);
  const armEndY = y - 26 + 18 * Math.sin(Math.abs(swingAngle));
  ctx.beginPath();
  ctx.moveTo(x + racketDir*6, y-28);
  ctx.lineTo(armEndX, armEndY);
  ctx.stroke();

  // Racket handle
  ctx.strokeStyle = dcol; ctx.lineWidth = 2;
  const racketEndX = armEndX + racketDir*14;
  const racketEndY = armEndY - 5;
  ctx.beginPath();
  ctx.moveTo(armEndX, armEndY);
  ctx.lineTo(racketEndX, racketEndY);
  ctx.stroke();

  // Racket head (oval)
  ctx.strokeStyle = col; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(racketEndX, racketEndY, 9, 12, isP1 ? 0.3 : -0.3, 0, Math.PI*2);
  ctx.stroke();

  // Racket strings
  ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 0.5;
  for (let i=-6; i<=6; i+=4) {
    ctx.beginPath();
    ctx.moveTo(racketEndX+i, racketEndY-10);
    ctx.lineTo(racketEndX+i, racketEndY+10);
    ctx.stroke();
  }

  ctx.restore();
}

function drawBall() {
  if (!ball.inPlay && gameState==='serve') {
    // Ball on server's racket
    const srv = score.server;
    const p = players[srv];
    const bx = p.x + (srv===0 ? 30 : -30);
    const by = p.y - 30;
    ctx.fillStyle = '#ffee00';
    ctx.beginPath(); ctx.arc(bx, by, BALL_R, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#ccaa00'; ctx.lineWidth = 1; ctx.stroke();
    return;
  }

  // Shadow
  const shadowY = GROUND_Y;
  const shadowScale = Math.max(0.2, 1 - (shadowY - ball.y) / 200);
  ctx.fillStyle = `rgba(0,0,0,${0.3*shadowScale})`;
  ctx.beginPath();
  ctx.ellipse(ball.x, shadowY+1, BALL_R*shadowScale*1.5, BALL_R*shadowScale*0.5, 0, 0, Math.PI*2);
  ctx.fill();

  // Ball
  ctx.fillStyle = '#ffee00';
  ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#ccaa00'; ctx.lineWidth = 1.5; ctx.stroke();

  // Highlight
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath(); ctx.arc(ball.x-2, ball.y-2, 3, 0, Math.PI*2); ctx.fill();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawCourt();
  drawBall();
  players.forEach((p,i) => drawPlayer(p, i, p.swingT > 0));

  // Serve prompt overlay
  if (gameState==='serve') {
    const srv = score.server;
    let hint = '';
    if (gameMode==='cpu') {
      hint = srv===0 ? T('press1p') : '';
    } else {
      hint = srv===0 ? T('press1p') : '[↑] to serve';
    }
    if (hint) {
      ctx.fillStyle = 'rgba(68,255,153,0.8)';
      ctx.font = '11px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText(hint, W/2, 320);
    }
  }
}

// ---- Game Loop ----
let lastTime = 0;
let frameId;

function gameLoop(ts) {
  const dt = ts - lastTime;
  lastTime = ts;

  if (gameState !== 'gameover' && gameState !== 'point') {
    handlePlayerInput();
    cpuAI();
    physicsStep();
  }

  // Decay hit flash
  players.forEach(p => { if (p.hitFlash > 0) p.hitFlash--; });
  // Decay swing
  players.forEach(p => { if (p.swingT > 0) p.swingT--; else p.swinging=false; });

  draw();
  frameId = requestAnimationFrame(gameLoop);
}

// ---- Mode / Difficulty buttons ----
function setMode(m) {
  gameMode = m;
  document.querySelectorAll('.mbtn').forEach(b=>b.classList.toggle('active', b.dataset.mode===m));
  const diffRow = document.getElementById('diff-row');
  diffRow.style.display = m==='cpu' ? 'flex' : 'none';
  updateLabels();
  updateHint();
  initMatch();
}

document.getElementById('btn-cpu').addEventListener('click', ()=>setMode('cpu'));
document.getElementById('btn-2p').addEventListener('click', ()=>setMode('2p'));

document.querySelectorAll('.dbtn').forEach(b=>b.addEventListener('click',()=>{
  difficulty = b.dataset.d;
  document.querySelectorAll('.dbtn').forEach(x=>x.classList.toggle('active',x===b));
}));

document.getElementById('play-again').addEventListener('click', ()=>{
  document.getElementById('play-again').style.display='none';
  initMatch();
});

// ---- Sound init ----
(function(){
  let _started = false;
  function _startAudio() {
    if (_started) return; _started=true;
    if (window.SND) {
      SND.startBGM('game');
      SND.createBtn();
    }
  }
  document.addEventListener('click', _startAudio, {once:true});
  document.addEventListener('keydown', _startAudio, {once:true});
})();

// ---- Init ----
applyLang();
initMatch();
loadRatings();
frameId = requestAnimationFrame(gameLoop);
</script>
