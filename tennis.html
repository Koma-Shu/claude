<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tennis</title>
<script src="sound.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d0d1a; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Courier New', monospace; color: #fff; }
  canvas { border: 2px solid #444; display: block; }
  #back-btn { position: fixed; top: 14px; right: 14px; color: #aaa; text-decoration: none; font-family: 'Courier New', monospace; font-size: 13px; background: rgba(0,0,0,0.5); padding: 6px 12px; border-radius: 4px; border: 1px solid #444; }
  #back-btn:hover { color: #fff; border-color: #888; }
  #lang-btn { position: fixed; top: 14px; left: 14px; color: #aaa; font-family: 'Courier New', monospace; font-size: 13px; background: rgba(0,0,0,0.5); padding: 6px 12px; border-radius: 4px; border: 1px solid #444; cursor: pointer; }
  #lang-btn:hover { color: #fff; border-color: #888; }

  /* Mobile controls */
  #mobile-controls {
    display: none;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 160px;
    pointer-events: none;
    z-index: 20;
  }
  .m-btn {
    position: absolute;
    background: rgba(255,255,255,0.12);
    border: 2px solid rgba(255,255,255,0.25);
    border-radius: 50%;
    color: #fff;
    font-size: 22px;
    display: flex; align-items: center; justify-content: center;
    pointer-events: all;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  .m-btn:active { background: rgba(255,255,255,0.28); }
  #m-up    { width:52px;height:52px; left:88px;  bottom:100px; }
  #m-down  { width:52px;height:52px; left:88px;  bottom:14px;  }
  #m-left  { width:52px;height:52px; left:28px;  bottom:57px;  }
  #m-right { width:52px;height:52px; left:148px; bottom:57px;  }
  #m-hit   { width:80px;height:80px; right:40px; bottom:40px;
              background:rgba(0,212,170,0.25); border-color:rgba(0,212,170,0.6);
              font-size:13px; font-family:'Courier New',monospace; color:#00d4aa; }
  @media (pointer: coarse) {
    #mobile-controls { display: block; }
    canvas {
      width: 100vw !important;
      height: calc(100vw * 450 / 600) !important;
      margin-bottom: 160px;
    }
  }
</style>
</head>
<body>
<a href="index.html" id="back-btn">← ARCADE</a>
<button id="lang-btn" onclick="toggleLang()">EN</button>
<canvas id="c" width="600" height="450"></canvas>

<div id="mobile-controls">
  <div class="m-btn" id="m-up">▲</div>
  <div class="m-btn" id="m-down">▼</div>
  <div class="m-btn" id="m-left">◀</div>
  <div class="m-btn" id="m-right">▶</div>
  <div class="m-btn" id="m-hit">HIT</div>
</div>

<script>
// ── i18n ──────────────────────────────────────────────────────────────────
const LANG = {
  ja: {
    title: 'テニス', subtitle: '背面視点テニスゲーム',
    mode1p: '1P vs CPU', mode2p: '2P ローカル',
    easy: 'イージー', normal: 'ノーマル', hard: 'ハード',
    serve: 'サーブ：Space', move: '移動：矢印キー', swing: 'スイング：Space',
    yourServe: 'あなたのサーブ', cpuServe: 'CPUのサーブ',
    net: 'ネット！', out: 'アウト！', fault: 'フォルト', doubleFault: 'ダブルフォルト！',
    winner: '勝者：', playAgain: 'もう一度：Space',
    deuce: 'デュース', adv: 'アドバンテージ',
    set: 'セット', game: 'ゲーム', match: 'マッチ',
    p1: 'P1', cpu: 'CPU', p2: 'P2',
    rating: '評価', ratingThanks: 'ありがとうございます！',
  },
  en: {
    title: 'TENNIS', subtitle: 'Behind-view tennis game',
    mode1p: '1P vs CPU', mode2p: '2P Local',
    easy: 'Easy', normal: 'Normal', hard: 'Hard',
    serve: 'Serve: Space', move: 'Move: Arrow Keys', swing: 'Swing: Space',
    yourServe: 'Your Serve', cpuServe: 'CPU Serve',
    net: 'NET!', out: 'OUT!', fault: 'FAULT', doubleFault: 'DOUBLE FAULT!',
    winner: 'Winner: ', playAgain: 'Play Again: Space',
    deuce: 'DEUCE', adv: 'ADVANTAGE',
    set: 'Set', game: 'Game', match: 'MATCH',
    p1: 'P1', cpu: 'CPU', p2: 'P2',
    rating: 'Rate this game', ratingThanks: 'Thank you!',
  }
};
let lang = localStorage.getItem('lang') || 'ja';
function T(k) { return (LANG[lang] && LANG[lang][k]) || LANG.ja[k] || k; }
function toggleLang() {
  lang = lang === 'ja' ? 'en' : 'ja';
  localStorage.setItem('lang', lang);
  document.getElementById('lang-btn').textContent = lang === 'ja' ? 'EN' : 'JA';
}
document.getElementById('lang-btn').textContent = lang === 'ja' ? 'EN' : 'JA';

// ── Canvas ────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ── Court coordinate helpers ──────────────────────────────────────────────
// cx: -1=left edge, +1=right edge (normalized)
// cz: 0=near baseline (player), 1=far baseline (CPU)
function courtToScreen(cx, cz) {
  const screenY = 380 - 280 * cz;
  const halfWidth = 260 - 90 * cz;
  const screenX = 300 + cx * halfWidth;
  return { x: screenX, y: screenY };
}

// Ball projection: ground pos + height offset
function ballToScreen(cx, cz, yh) {
  const ground = courtToScreen(cx, cz);
  return {
    x: ground.x,
    y: ground.y - yh * 600,
    gx: ground.x,
    gy: ground.y
  };
}

// ── Game States ───────────────────────────────────────────────────────────
const STATE = { TITLE: 0, SERVING: 1, RALLY: 2, FAULT: 3, POINT_END: 4, GAME_OVER: 5 };
let state = STATE.TITLE;

// ── Scoring ───────────────────────────────────────────────────────────────
const PT_LABELS = ['0', '15', '30', '40'];
let score = {
  pts: [0, 0],
  games: [0, 0],
  sets: [0, 0],
  server: 0,
  deuce: false,
  advantage: -1
};

function ptLabel(p) {
  if (score.deuce) {
    if (score.advantage === p) return T('adv') + '!';
    if (score.advantage === (1 - p)) return T('adv') + ' opp';
    return T('deuce');
  }
  return PT_LABELS[score.pts[p]] || '0';
}

function awardPoint(winner) {
  if (score.deuce) {
    if (score.advantage === winner) {
      winGame(winner);
    } else if (score.advantage === -1) {
      score.advantage = winner;
    } else {
      score.advantage = -1;
    }
  } else {
    score.pts[winner]++;
    pointInGame++;
    if (score.pts[winner] >= 4) {
      if (score.pts[1 - winner] < 3) {
        winGame(winner);
      } else {
        score.deuce = true;
        score.pts[0] = 3; score.pts[1] = 3;
        score.advantage = -1;
      }
    } else if (score.pts[0] === 3 && score.pts[1] === 3) {
      score.deuce = true;
      score.advantage = -1;
    }
  }
}

function winGame(winner) {
  score.games[winner]++;
  score.pts = [0, 0];
  score.deuce = false;
  score.advantage = -1;
  score.server = 1 - score.server;
  pointInGame = 0;
  if (score.games[winner] >= 6 && score.games[winner] - score.games[1 - winner] >= 2) {
    score.sets[winner]++;
    score.games = [0, 0];
    if (score.sets[winner] >= 2) {
      matchWinner = winner;
      state = STATE.GAME_OVER;
      ratingShown = false;
      ratingDone = false;
    }
  }
}

let matchWinner = -1;
let pointInGame = 0; // 0=deuce side, 1=ad side, alternates each point

// ── Mode / Difficulty ─────────────────────────────────────────────────────
let mode2p = false;
let difficulty = 'normal';
const CPU_SPEED = { easy: 0.008, normal: 0.012, hard: 0.018 };
const CPU_ERROR = { easy: 0.20, normal: 0.10, hard: 0.05 };
let titleMode = 0;               // 0=1P vs CPU, 1=2P local
let diffIdx   = 1;               // 0=easy, 1=normal, 2=hard
const DIFF_KEYS = ['easy', 'normal', 'hard'];

// ── Player state ──────────────────────────────────────────────────────────
let player  = { cx: 0, cz: 0.05 };
let player2 = { cx: 0, cz: 0.92 };
let cpu     = { cx: 0, cz: 0.85 };

let p1Swing = 0;
let p2Swing = 0;
let cpuSwing = 0;

// ── Ball state ────────────────────────────────────────────────────────────
let ball = { cx: 0, cz: 0.1, yh: 0.05, vcx: 0, vcz: 0, vcy: 0, active: false };
let lastBounceSide = -1;
let ballBounces = 0;
let lastHitBy = -1;

// ── Messages ──────────────────────────────────────────────────────────────
let msg = '';
let msgTimer = 0;

// ── Rating ────────────────────────────────────────────────────────────────
let ratingShown = false;
let ratingDone = false;
let ratingHover = 0;
let ratingStars = 0;

// ── Fault / Double-fault ──────────────────────────────────────────────────
let faultCount = 0;       // 0 = first serve, 1 = second serve
let serveInFlight = false; // true from serve launch until first bounce

// ── CPU serve scheduling ──────────────────────────────────────────────────
let cpuServeScheduled = false;
let pointEndScheduled = false;

// ── Keys ──────────────────────────────────────────────────────────────────
const keys = {};
let frameCount = 0;

// Charge state: -1 = not charging
let p1ChargeStart = -1;
let p2ChargeStart = -1;

window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyF','KeyW','KeyA','KeyS','KeyD'].includes(e.code)) e.preventDefault();
  // Start charge on press (only during active play)
  const inPlay = state === STATE.SERVING || state === STATE.RALLY;
  if (e.code === 'Space' && inPlay) {
    if (!mode2p && p1ChargeStart < 0) p1ChargeStart = frameCount;   // 1P: Space = P1
    if (mode2p  && p2ChargeStart < 0) p2ChargeStart = frameCount;   // 2P: Space = P2
  }
  if (e.code === 'KeyF' && mode2p && p1ChargeStart < 0 && inPlay) p1ChargeStart = frameCount; // 2P: F = P1
});
window.addEventListener('keyup', e => {
  keys[e.code] = false;
  // Release → execute shot
  if (e.code === 'Space') {
    if (!mode2p && p1ChargeStart >= 0) {
      const charge = Math.min((frameCount - p1ChargeStart) / 60, 1.0);
      p1ChargeStart = -1;
      handleP1Action(charge);
    }
    if (mode2p && p2ChargeStart >= 0) {
      const charge = Math.min((frameCount - p2ChargeStart) / 60, 1.0);
      p2ChargeStart = -1;
      handleP2Action(charge);
    }
  }
  if (e.code === 'KeyF' && mode2p && p1ChargeStart >= 0) {
    const charge = Math.min((frameCount - p1ChargeStart) / 60, 1.0);
    p1ChargeStart = -1;
    handleP1Action(charge);
  }
});

// ── Title ─────────────────────────────────────────────────────────────────
function drawTitle() {
  ctx.fillStyle = '#0d0d1a';
  ctx.fillRect(0, 0, 600, 450);

  ctx.fillStyle = '#00ff88';
  ctx.font = 'bold 48px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText(T('title'), 300, 90);

  ctx.fillStyle = '#aaa';
  ctx.font = '16px Courier New';
  ctx.fillText(T('subtitle'), 300, 120);

  // Mode selection (up/down)
  const modes = [T('mode1p'), T('mode2p')];
  modes.forEach((label, i) => {
    const sel = titleMode === i;
    ctx.fillStyle = sel ? '#ffee00' : '#888';
    ctx.font = sel ? 'bold 24px Courier New' : '19px Courier New';
    ctx.fillText((sel ? '▶ ' : '  ') + label, 300, 185 + i * 48);
  });

  // Difficulty selection (left/right)
  ctx.fillStyle = '#555';
  ctx.font = '13px Courier New';
  ctx.fillText('── ' + (lang === 'ja' ? '難易度' : 'DIFFICULTY') + ' ──', 300, 305);

  const diffColors = ['#44ff99', '#ffee00', '#ff6644'];
  const diffLabel  = T(DIFF_KEYS[diffIdx]);
  ctx.fillStyle = diffColors[diffIdx];
  ctx.font = 'bold 22px Courier New';
  ctx.fillText('◀   ' + diffLabel + '   ▶', 300, 340);

  ctx.fillStyle = '#555';
  ctx.font = '13px Courier New';
  const hint = lang === 'ja'
    ? '↑↓:モード選択   ←→:難易度   Space:スタート'
    : '↑↓: Mode   ←→: Difficulty   Space: Start';
  ctx.fillText(hint, 300, 418);
}

const titleJust = {};
window.addEventListener('keydown', e => {
  if (state === STATE.TITLE) titleJust[e.code] = true;
});
window.addEventListener('keyup', e => {
  if (state === STATE.TITLE && (e.code === 'Space' || e.code === 'Enter') && titleJust[e.code]) {
    delete titleJust[e.code];
    titleConfirm();
  }
  delete titleJust[e.code];
});

function titleConfirm() {
  difficulty = DIFF_KEYS[diffIdx];
  mode2p = titleMode === 1;
  startMatch();
}

const _titleNavPrev = {};
window.addEventListener('keydown', e => {
  if (state === STATE.TITLE && !_titleNavPrev[e.code]) {
    _titleNavPrev[e.code] = true;
    if (e.code === 'ArrowUp')    titleMode = (titleMode + 1) % 2;
    if (e.code === 'ArrowDown')  titleMode = (titleMode + 1) % 2;
    if (e.code === 'ArrowLeft')  diffIdx = (diffIdx + 2) % 3;
    if (e.code === 'ArrowRight') diffIdx = (diffIdx + 1) % 3;
  }
});
window.addEventListener('keyup', e => { delete _titleNavPrev[e.code]; });

function handleTitle() {
  // handled via event listeners above
}

// ── Match / Serve Init ────────────────────────────────────────────────────
function startMatch() {
  score = { pts:[0,0], games:[0,0], sets:[0,0], server:0, deuce:false, advantage:-1 };
  matchWinner = -1;
  ratingShown = false;
  ratingDone = false;
  pointInGame = 0;
  startServe();
}

function getServeSide() {
  // pointInGame%2: 0=deuce(right for P1/near), 1=ad(left for P1/near)
  return pointInGame % 2 === 0 ? 'deuce' : 'ad';
}

function startServe() {
  const side = getServeSide();
  // P1 (near baseline): deuce=right(cx>0), ad=left(cx<0)
  const p1StartCx = side === 'deuce' ? 0.45 : -0.45;
  // CPU (far baseline): deuce=left from CPU's perspective(cx<0), ad=right(cx>0)
  const cpuStartCx = side === 'deuce' ? -0.45 : 0.45;

  player  = { cx: p1StartCx,  cz: 0.0  };  // locked to baseline for serve
  player2 = { cx: -p1StartCx, cz: 1.0  };  // P2 locked to their baseline
  cpu     = { cx: cpuStartCx, cz: 1.0  };  // CPU at baseline for serve
  p1Swing = 0; p2Swing = 0; cpuSwing = 0;
  lastHitBy = -1;
  ballBounces = 0;
  lastBounceSide = -1;
  cpuServeScheduled = false;
  pointEndScheduled = false;
  faultCount = 0;
  serveInFlight = false;

  if (score.server === 0) {
    ball = { cx: p1StartCx + 0.04, cz: 0.0, yh: 0.05, vcx:0, vcz:0, vcy:0, active:false };
    msg = T('yourServe');
  } else {
    ball = { cx: cpuStartCx, cz: 1.0, yh: 0.05, vcx:0, vcz:0, vcy:0, active:false };
    msg = T('cpuServe');
  }
  msgTimer = 90;
  state = STATE.SERVING;
}

// ── Court Drawing ─────────────────────────────────────────────────────────
function drawCourt() {
  // Serve zone highlight (during serving)
  if (state === STATE.SERVING && score.server === 0) {
    const side = getServeSide();
    const zoneX1 = side === 'deuce' ? 0 : -1;
    const zoneX2 = side === 'deuce' ? 1 : 0;
    const bl = courtToScreen(zoneX1, 0.0);
    const br = courtToScreen(zoneX2, 0.0);
    // Highlight a strip along the near baseline
    ctx.fillStyle = 'rgba(255,255,100,0.12)';
    ctx.beginPath();
    ctx.moveTo(bl.x, bl.y); ctx.lineTo(br.x, br.y);
    ctx.lineTo(br.x, br.y - 18); ctx.lineTo(bl.x, bl.y - 18);
    ctx.closePath(); ctx.fill();
    // Arrow indicator
    const midX = (bl.x + br.x) / 2;
    ctx.fillStyle = 'rgba(255,255,100,0.7)';
    ctx.font = 'bold 11px Courier New';
    ctx.textAlign = 'center';
    const sideLabel = lang === 'ja'
      ? (side === 'deuce' ? 'フォア側からサーブ' : 'バック側からサーブ')
      : (side === 'deuce' ? 'Serve from deuce side' : 'Serve from ad side');
    ctx.fillText(sideLabel, midX, bl.y + 16);
  }

  // Surface
  ctx.fillStyle = '#2d6e2d';
  ctx.beginPath();
  ctx.moveTo(40, 380); ctx.lineTo(560, 380);
  ctx.lineTo(470, 100); ctx.lineTo(130, 100);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;

  // Baselines
  line(40, 380, 560, 380);
  line(130, 100, 470, 100);
  // Sidelines
  line(40, 380, 130, 100);
  line(560, 380, 470, 100);

  // Net — drawn with proper height
  const nL = courtToScreen(-1, 0.5);
  const nR = courtToScreen( 1, 0.5);
  const netGroundY = nL.y; // = 240
  const NET_PX = 0.04 * 600; // 24px above ground
  const netTopY = netGroundY - NET_PX;
  // Net fill (mesh)
  ctx.fillStyle = 'rgba(220,220,220,0.12)';
  ctx.fillRect(nL.x, netTopY, nR.x - nL.x, NET_PX);
  // Horizontal mesh lines
  ctx.strokeStyle = 'rgba(220,220,220,0.35)';
  ctx.lineWidth = 0.7;
  for (let i = 0; i <= 4; i++) { const ny = netTopY + NET_PX * i / 4; line(nL.x, ny, nR.x, ny); }
  // Vertical mesh lines
  for (let i = 0; i <= 16; i++) { const nx = nL.x + (nR.x - nL.x) * i / 16; line(nx, netTopY, nx, netGroundY); }
  // Net top tape (white band)
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;
  line(nL.x, netTopY, nR.x, netTopY);
  // Net bottom
  ctx.lineWidth = 1.5;
  line(nL.x, netGroundY, nR.x, netGroundY);
  // Posts
  ctx.strokeStyle = '#ccc';
  ctx.lineWidth = 3;
  line(nL.x, netTopY - 4, nL.x, netGroundY);
  line(nR.x, netTopY - 4, nR.x, netGroundY);

  // Center line
  const cN = courtToScreen(0, 0);
  const cF = courtToScreen(0, 1);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5;
  line(cN.x, cN.y, cF.x, cF.y);

  // Service lines
  const sLP = courtToScreen(-1, 0.25); const sRP = courtToScreen(1, 0.25);
  line(sLP.x, sLP.y, sRP.x, sRP.y);
  const sLC = courtToScreen(-1, 0.75); const sRC = courtToScreen(1, 0.75);
  line(sLC.x, sLC.y, sRC.x, sRC.y);
}

function line(x1, y1, x2, y2) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}

// ── Stick Figure ──────────────────────────────────────────────────────────
// facing: +1 = racket on right (P1), -1 = racket on left (CPU/P2 from far end)
function drawFigure(pos, color, scale, swingFrame, facing) {
  const s = scale;
  const x = pos.x, y = pos.y;

  ctx.strokeStyle = color;
  ctx.fillStyle   = color;
  ctx.lineWidth   = 2 * s;

  // Head
  ctx.beginPath();
  ctx.arc(x, y - 35 * s, 8 * s, 0, Math.PI * 2);
  ctx.fill();

  // Body
  ctx.beginPath(); ctx.moveTo(x, y - 27 * s); ctx.lineTo(x, y - 10 * s); ctx.stroke();

  // Legs
  ctx.beginPath(); ctx.moveTo(x, y - 10 * s); ctx.lineTo(x - 7 * s, y + 8 * s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x, y - 10 * s); ctx.lineTo(x + 7 * s, y + 8 * s); ctx.stroke();

  // Racket arm
  // Rest angle: arm extends to the side (facing direction)
  // Swing: arm swings upward
  let swingRatio = swingFrame > 0 ? (1 - swingFrame / 8) : 0; // 0=start of swing, 1=end
  // At rest: shoulder angle = 0 (horizontal toward facing)
  // During swing: angle goes from 0 to -PI/2 (upward)
  const shoulderAngle = facing * Math.PI / 2 - swingRatio * facing * Math.PI / 2;
  const armBaseX = x + facing * 5 * s;
  const armBaseY = y - 22 * s;
  const armLen   = 15 * s;
  const elbowX   = armBaseX + Math.cos(shoulderAngle) * armLen;
  const elbowY   = armBaseY + Math.sin(shoulderAngle) * armLen;

  ctx.beginPath(); ctx.moveTo(armBaseX, armBaseY); ctx.lineTo(elbowX, elbowY); ctx.stroke();

  // Forearm
  const foreLen  = 10 * s;
  const racketX  = elbowX + Math.cos(shoulderAngle) * foreLen;
  const racketY  = elbowY + Math.sin(shoulderAngle) * foreLen;

  ctx.beginPath(); ctx.moveTo(elbowX, elbowY); ctx.lineTo(racketX, racketY); ctx.stroke();

  // Racket head (oval) — ALWAYS visible
  ctx.save();
  ctx.translate(racketX, racketY);
  ctx.rotate(shoulderAngle + Math.PI / 2);
  ctx.beginPath();
  ctx.ellipse(0, 0, 7 * s, 10 * s, 0, 0, Math.PI * 2);
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5 * s;
  ctx.stroke();
  // Strings
  ctx.beginPath();
  ctx.moveTo(-6 * s, 0); ctx.lineTo(6 * s, 0);
  ctx.moveTo(0, -8 * s); ctx.lineTo(0, 8 * s);
  ctx.lineWidth = 0.8 * s;
  ctx.stroke();
  ctx.restore();
}

// ── Ball Drawing ──────────────────────────────────────────────────────────
function drawBall() {
  const bs = ballToScreen(ball.cx, ball.cz, ball.yh);

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(bs.gx, bs.gy, 9, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  // Ball
  ctx.fillStyle = '#ccdd00';
  ctx.beginPath();
  ctx.arc(bs.x, bs.y, 7, 0, Math.PI * 2);
  ctx.fill();

  // Shine
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.beginPath();
  ctx.arc(bs.x - 2, bs.y - 2, 3, 0, Math.PI * 2);
  ctx.fill();
}

// ── HUD ───────────────────────────────────────────────────────────────────
function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(0, 0, 600, 50);

  const p2Name = mode2p ? T('p2') : T('cpu');

  ctx.font = '13px Courier New';

  ctx.textAlign = 'left';
  ctx.fillStyle = '#4af';
  const p1Ind = score.server === 0 ? ' ●' : '';
  ctx.fillText(T('p1') + p1Ind + ': ' + score.sets[0] + '-' + score.sets[1] +
    ' | ' + score.games[0] + '-' + score.games[1] + ' | ' + ptLabel(0), 10, 20);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#f66';
  const p2Ind = score.server === 1 ? ' ●' : '';
  ctx.fillText(p2Name + p2Ind + ': ' + score.sets[1] + '-' + score.sets[0] +
    ' | ' + score.games[1] + '-' + score.games[0] + ' | ' + ptLabel(1), 590, 20);

  ctx.fillStyle = '#555';
  ctx.font = '11px Courier New';
  ctx.textAlign = 'center';
  const holdHint = lang === 'ja' ? '(長押し=強打)' : '(hold=power)';
  let hintLine = T('move') + '   ' + T('swing') + ' ' + holdHint;
  if (state === STATE.SERVING && score.server === 0) {
    const serveNum = faultCount === 0
      ? (lang === 'ja' ? '【ファーストサーブ】' : '【1st Serve】')
      : (lang === 'ja' ? '【セカンドサーブ】' : '【2nd Serve】');
    hintLine = serveNum;
  }
  ctx.fillText(hintLine, 300, 42);

  // Charge meter (under player)
  const activeCharge = mode2p ? -1 : p1ChargeStart;
  if (activeCharge >= 0 && (state === STATE.SERVING || state === STATE.RALLY)) {
    const charge = Math.min((frameCount - activeCharge) / 60, 1.0);
    const pPos = courtToScreen(player.cx, player.cz);
    const barW = 60, barH = 7;
    const bx = pPos.x - barW/2, by = pPos.y + 18;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(bx - 1, by - 1, barW + 2, barH + 2);
    // Color: green → yellow → red
    const r = Math.floor(charge * 255), g = Math.floor((1 - charge) * 180 + 75);
    ctx.fillStyle = `rgb(${r},${g},0)`;
    ctx.fillRect(bx, by, barW * charge, barH);
    ctx.strokeStyle = '#888';
    ctx.lineWidth = 1;
    ctx.strokeRect(bx, by, barW, barH);
  }

  // Message overlay
  if (msg && msgTimer > 0) {
    ctx.font = 'bold 30px Courier New';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffee00';
    ctx.shadowColor = '#000';
    ctx.shadowBlur = 8;
    ctx.fillText(msg, 300, 245);
    ctx.shadowBlur = 0;
  }
}

// ── Physics ───────────────────────────────────────────────────────────────
function updateBall() {
  if (!ball.active) return;

  // Gravity (subtract: upward velocity decreases over time)
  ball.vcy -= 0.00025;  // gravity (slowed further from 0.0004)

  // Move
  ball.cx  += ball.vcx;
  ball.cz  += ball.vcz;
  ball.yh  += ball.vcy;

  // Ground bounce
  if (ball.yh <= 0) {
    ball.yh = 0;

    if (Math.abs(ball.vcy) < 0.0003) {
      // Ball barely moving vertically — sliding to a stop.
      // End the point now rather than letting the sliding loop trigger
      // double-bounce every frame.
      ball.vcy = 0;
      if (ballBounces >= 1) {
        endPoint(1 - (ball.cz < 0.5 ? 0 : 1), '');
      }
      return;
    }

    ball.vcy  = -ball.vcy * 0.6;
    ball.vcx *= 0.85;
    ball.vcz *= 0.85;

    // First bounce clears serve-in-flight flag
    const bouncedSide = ball.cz < 0.5 ? 0 : 1;

    if (serveInFlight) {
      serveInFlight = false;
      // Check serve landing: must be in opponent's service box (cz 0.5–0.75, |cx|<1)
      const serverSide = score.server === 0 ? 0 : 1; // 0=near,1=far
      const inServiceBox = (serverSide === 0)
        ? (ball.cz >= 0.5 && ball.cz <= 0.75 && Math.abs(ball.cx) <= 1.0)
        : (ball.cz >= 0.25 && ball.cz <= 0.5 && Math.abs(ball.cx) <= 1.0);
      if (!inServiceBox) { serveFault(); return; }
      // Good serve — continue as rally
      ballBounces = 1;
      lastBounceSide = bouncedSide;
      return;
    }

    // Track which side bounced
    if (lastBounceSide === bouncedSide) {
      ballBounces++;
    } else {
      ballBounces = 1;
      lastBounceSide = bouncedSide;
    }

    // Double bounce → point over (standard 2-bounce rule for both sides)
    if (ballBounces >= 2) {
      endPoint(1 - lastBounceSide, '');
      return;
    }

    // Out of bounds after first bounce — CPU side only
    // On player's side, the extra bounce allowance handles the point.
    if (bouncedSide === 1 && (Math.abs(ball.cx) > 1.0 || ball.cz < 0 || ball.cz > 1.0)) {
      endPoint((lastHitBy === 0) ? 1 : 0, T('out'));
      return;
    }
  }

  // Net check (crossing cz = 0.5)
  const prevCz = ball.cz - ball.vcz;
  if ((prevCz < 0.5 && ball.cz >= 0.5) || (prevCz > 0.5 && ball.cz <= 0.5)) {
    if (ball.yh < 0.04) {
      if (serveInFlight) { serveInFlight = false; serveFault(); return; }
      endPoint((lastHitBy === 0) ? 1 : 0, T('net'));
      return;
    }
  }

  // Ball way out (only before first bounce — after valid bounce, double-bounce handles the point)
  if (ball.yh > 0 && ballBounces === 0 && (ball.cx < -1.15 || ball.cx > 1.15)) {
    if (serveInFlight) { serveInFlight = false; serveFault(); return; }
    endPoint((lastHitBy === 0) ? 1 : 0, T('out'));
    return;
  }
  if (ball.cz > 1.05 && ball.yh > 0 && ballBounces === 0) {
    if (serveInFlight) { serveInFlight = false; serveFault(); return; }
    endPoint(lastHitBy === 0 ? 1 : 0, T('out'));
    return;
  }
  if (ball.cz < -0.55 && ball.yh > 0 && ballBounces === 0) {
    if (serveInFlight) { serveInFlight = false; serveFault(); return; }
    endPoint(lastHitBy === 1 ? 0 : 1, T('out'));
    return;
  }
}

function serveFault() {
  if (pointEndScheduled) return;
  ball.active = false;
  serveInFlight = false;
  faultCount++;
  if (faultCount >= 2) {
    // Double fault — server loses the point
    faultCount = 0;
    const faultWinner = 1 - score.server;
    endPoint(faultWinner, T('doubleFault'));
  } else {
    // First fault — allow second serve
    msg = T('fault');
    msgTimer = 90;
    // Return to SERVING without resetting faultCount
    state = STATE.SERVING;
    pointEndScheduled = false;
    const side = getServeSide();
    if (score.server === 0) {
      player.cz = 0.0;
      ball = { cx: player.cx, cz: 0.0, yh: 0.05, vcx:0, vcz:0, vcy:0, active:false };
    } else {
      const cpuStartCx = side === 'deuce' ? -0.45 : 0.45;
      cpu.cx = cpuStartCx;
      ball = { cx: cpu.cx, cz: 1.0, yh: 0.05, vcx:0, vcz:0, vcy:0, active:false };
      cpuServeScheduled = false;
    }
  }
}

function endPoint(winner, reason) {
  if (pointEndScheduled) return;
  pointEndScheduled = true;
  ball.active = false;
  // Only overwrite msg if we have a new reason (don't clear double-fault etc already set)
  if (reason) { msg = reason; msgTimer = 120; }
  awardPoint(winner);
  if (state !== STATE.GAME_OVER) {
    state = STATE.POINT_END;
    setTimeout(() => {
      pointEndScheduled = false;
      if (state === STATE.POINT_END) startServe();
    }, 1800);
  }
}

// ── CPU AI ────────────────────────────────────────────────────────────────
function cpuServeNow() {
  if (state !== STATE.SERVING || score.server !== 1) return;
  // CPU serves toward player: vcz is NEGATIVE (decreasing cz toward 0)
  const serveSide = getServeSide();
  ball.cx  = cpu.cx;
  ball.cz  = 1.0;
  ball.yh  = 0.06;
  ball.vcz = -0.005;           // NEGATIVE toward player
  ball.vcy = +0.014;           // higher arc to clear net comfortably
  // CPU deuce serve → P1's deuce side (cx > 0 in bird's-eye)
  // CPU ad   serve  → P1's ad   side (cx < 0)
  const targetCx = serveSide === 'deuce' ? 0.35 : -0.35;
  const airFrames = 116;
  ball.vcx = (targetCx - cpu.cx) / airFrames + (Math.random() - 0.5) * 0.0008;
  ball.active = true;
  serveInFlight = true;
  lastHitBy = 1;
  ballBounces = 0;
  lastBounceSide = -1;
  cpuSwing = 8;
  state = STATE.RALLY;
  msg = '';
}

function cpuHitBall() {
  if (lastHitBy === 1) return;
  cpuSwing = 8;
  lastHitBy = 1;
  serveInFlight = false;  // CPU hitting always ends serve phase
  ballBounces = 0;
  lastBounceSide = -1;
  const err = CPU_ERROR[difficulty];
  // Extra error for deep balls (ball landing near CPU's baseline)
  const depthFactor = Math.max(0, (ball.cz - 0.65) / 0.35);
  const totalErr = err * (1 + depthFactor * 3);
  // CPU rally shots
  ball.vcz = -0.006 + (Math.random() - 0.5) * totalErr * 0.004;
  ball.vcy = +0.012 + (Math.random() - 0.5) * totalErr * 0.002;
  ball.vcx = (player.cx - ball.cx) * 0.002 + (Math.random() - 0.5) * totalErr * 0.14;
}

function updateCPU() {
  if (mode2p) return;

  const speed = CPU_SPEED[difficulty];

  // Move toward ball when it's on CPU's side
  if (ball.active && ball.cz > 0.52) {
    const err = CPU_ERROR[difficulty];
    const targetCx = ball.cx + (Math.random() - 0.5) * err * 0.08;
    if (cpu.cx < targetCx - 0.01) cpu.cx = Math.min(cpu.cx + speed, 0.88);
    else if (cpu.cx > targetCx + 0.01) cpu.cx = Math.max(cpu.cx - speed, -0.88);
    // Move toward ball depth, staying in back half (cz 0.60–0.85)
    const targetCz = Math.min(Math.max(ball.cz - 0.04, 0.60), 0.85);
    if (cpu.cz < targetCz - 0.01) cpu.cz = Math.min(cpu.cz + speed * 0.6, 0.85);
    else if (cpu.cz > targetCz + 0.01) cpu.cz = Math.max(cpu.cz - speed * 0.6, 0.60);
  } else if (!ball.active || ball.cz <= 0.52) {
    // Return to baseline when ball is on player's side
    if (cpu.cz < 0.78) cpu.cz = Math.min(cpu.cz + speed * 0.3, 0.78);
  }

  // Auto-hit when ball is close enough on CPU side
  if (ball.active && ball.cz > 0.55 && ball.yh < 0.20 && lastHitBy !== 1 && ballBounces >= 1 && lastBounceSide === 1) {
    const cpuPos = courtToScreen(cpu.cx, cpu.cz);
    const bPos   = courtToScreen(ball.cx, ball.cz);
    const dist   = Math.hypot(cpuPos.x - bPos.x, cpuPos.y - bPos.y);
    if (dist < 100) {
      cpuHitBall();
    }
  }

  // Schedule CPU serve
  if (state === STATE.SERVING && score.server === 1 && !cpuServeScheduled) {
    cpuServeScheduled = true;
    setTimeout(() => {
      cpuServeScheduled = false;
      cpuServeNow();
    }, 900 + Math.random() * 500);
  }
}

// ── Player Input ──────────────────────────────────────────────────────────
let spaceJustReleased = false; // for game-over restart (no-charge context)
window.addEventListener('keyup', e => {
  if (e.code === 'Space' && state === STATE.GAME_OVER) spaceJustReleased = true;
  if (e.code === 'Space' && state === STATE.TITLE) spaceJustReleased = true;
});

function updatePlayer() {
  const spd = 0.018;  // faster player movement

  if (state === STATE.SERVING || state === STATE.RALLY) {
    if (!mode2p) {
      const side = getServeSide();
      // During serve: player locked to baseline (cz=0), only their serve half
      if (state === STATE.SERVING && score.server === 0) {
        if (keys['ArrowLeft'])  player.cx = Math.max(player.cx - spd, side === 'ad' ? -0.9 : 0.0);
        if (keys['ArrowRight']) player.cx = Math.min(player.cx + spd, side === 'deuce' ? 0.9 : 0.0);
        player.cz = 0.0; // always locked to baseline during serve
      } else {
        if (keys['ArrowLeft'])  player.cx = Math.max(player.cx - spd, -0.9);
        if (keys['ArrowRight']) player.cx = Math.min(player.cx + spd,  0.9);
        if (keys['ArrowUp'])    player.cz = Math.min(player.cz + spd,  0.38);
        if (keys['ArrowDown'])  player.cz = Math.max(player.cz - spd, -0.50);
      }
    }
    if (mode2p) {
      if (keys['KeyA']) player.cx = Math.max(player.cx - spd, -0.9);
      if (keys['KeyD']) player.cx = Math.min(player.cx + spd,  0.9);
      if (keys['KeyW']) player.cz = Math.min(player.cz + spd,  0.38);
      if (keys['KeyS']) player.cz = Math.max(player.cz - spd, -0.50);
      if (keys['ArrowLeft'])  player2.cx = Math.min(player2.cx + spd, 0.9);
      if (keys['ArrowRight']) player2.cx = Math.max(player2.cx - spd, -0.9);
      if (keys['ArrowUp'])    player2.cz = Math.max(player2.cz - spd, 0.62);
      if (keys['ArrowDown'])  player2.cz = Math.min(player2.cz + spd, 1.0);
    }
  }

  // Actions are handled in keyup listeners (charge system)
  // Game over / title restart
  if (spaceJustReleased) {
    spaceJustReleased = false;
    if (state === STATE.GAME_OVER) state = STATE.TITLE;
  }
}

function handleP1Action(charge) {
  // charge: 0.0 (tap) to 1.0 (full hold ~1s)
  const power = 0.80 + charge * 0.50; // 0.80 .. 1.30 — tap=safe, full charge=risky out

  if (state === STATE.SERVING && score.server === 0) {
    // Serve arc: vcz=0.006, vcy=0.0102, gravity=0.00025
    // Air time ≈ 96 frames; lands at cz≈0.63 (inside service box 0.5–0.75)
    const side = getServeSide();
    ball.cx  = player.cx;
    ball.cz  = 0.0;
    ball.yh  = 0.06;
    ball.vcz = 0.005;    // POSITIVE toward CPU
    ball.vcy = 0.014;    // higher arc to clear net comfortably
    // Diagonal target: deuce → CPU's deuce box (cx < 0 in bird's-eye)
    // ad    target → CPU's ad   box (cx > 0)
    const targetCx = side === 'deuce' ? -0.35 : 0.35;
    const airFrames = 116; // estimated frames in air
    // Aim variation: ←→ key shifts target ±0.20
    const aimShift = keys['ArrowLeft'] ? -0.20 : keys['ArrowRight'] ? 0.20 : 0;
    ball.vcx = (targetCx + aimShift - ball.cx) / airFrames + (Math.random() - 0.5) * 0.0008;
    ball.active = true;
    serveInFlight = true;
    lastHitBy = 0;
    ballBounces = 0;
    lastBounceSide = -1;
    p1Swing = 8;
    state = STATE.RALLY;
    msg = '';
    return;
  }
  if (state === STATE.RALLY) {
    const pPos = courtToScreen(player.cx, player.cz);
    const bPos = ballToScreen(ball.cx, ball.cz, ball.yh);
    const dist = Math.hypot(pPos.x - bPos.x, pPos.y - bPos.y);

    if (ball.cz < 0.48 && ball.cz > -0.55 && dist < 110 && ball.yh < 0.20 && lastHitBy !== 0) {
      p1Swing = 8;
      lastHitBy = 0;
      serveInFlight = false;  // clear regardless — player hit means serve phase is over
      ballBounces = 0;
      lastBounceSide = -1;

      // Direction from movement keys
      let vcx = (Math.random() - 0.5) * 0.0015;
      if (keys['ArrowLeft'])  vcx = -0.005 * power;
      if (keys['ArrowRight']) vcx = +0.005 * power;

      // Depth: base=0.006; up=deep (can go out on full charge), down=short drop
      let vcz = 0.006 * power;
      if (keys['ArrowUp'])   vcz = 0.009 * power;   // deep — full charge risks out
      if (keys['ArrowDown']) vcz = 0.003 * power;   // short drop shot

      ball.vcx = vcx;
      ball.vcz = vcz;  // POSITIVE toward opponent
      ball.vcy = 0.012; // fixed loft for consistent arc; power affects vcz/vcx only
    }
  }
}

function handleP2Action(charge) {
  if (!mode2p) return;
  const power = 0.80 + charge * 0.50;

  if (state === STATE.SERVING && score.server === 1) {
    ball.cx  = player2.cx;
    ball.cz  = 1.0;
    ball.yh  = 0.06;
    ball.vcz = -0.005;
    ball.vcy = +0.014;
    ball.vcx = (Math.random() - 0.5) * 0.005;
    ball.active = true;
    lastHitBy = 1;
    serveInFlight = true;
    ballBounces = 0;
    lastBounceSide = -1;
    p2Swing = 8;
    state = STATE.RALLY;
    msg = '';
    return;
  }
  if (state === STATE.RALLY) {
    const p2Pos = courtToScreen(player2.cx, player2.cz);
    const bPos  = ballToScreen(ball.cx, ball.cz, ball.yh);
    const dist  = Math.hypot(p2Pos.x - bPos.x, p2Pos.y - bPos.y);

    if (ball.cz > 0.55 && dist < 90 && ball.yh < 0.18 && lastHitBy !== 1) {
      p2Swing = 8;
      lastHitBy = 1;
      ballBounces = 0;
      lastBounceSide = -1;

      let vcx = (Math.random() - 0.5) * 0.0015;
      if (keys['ArrowLeft'])  vcx = +0.005 * power;
      if (keys['ArrowRight']) vcx = -0.005 * power;
      let vcz = -0.006 * power;
      if (keys['ArrowUp'])   vcz = -0.009 * power;
      if (keys['ArrowDown']) vcz = -0.003 * power;

      ball.vcx = vcx;
      ball.vcz = vcz;
      ball.vcy = 0.012;
    }
  }
}

function drawGameOver() {
  ctx.fillStyle = '#0d0d1a';

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffee00';
  ctx.fillText(T('match') + '!', 300, 130);

  ctx.font = '24px Courier New';
  ctx.fillStyle = '#fff';
  ctx.fillText(T('winner') + wName, 300, 190);

  ctx.font = '18px Courier New';
  ctx.fillStyle = '#aaa';
  ctx.fillText(score.sets[0] + ' - ' + score.sets[1], 300, 235);

  ctx.fillStyle = '#555';
  ctx.font = '15px Courier New';
  ctx.fillText(T('playAgain'), 300, 285);

  // Rating
  if (!ratingDone) {
    ctx.font = '15px Courier New';
    ctx.fillStyle = '#aaa';
    ctx.fillText(T('rating'), 300, 320);
    for (let i = 0; i < 5; i++) {
      ctx.font = '32px Courier New';
      ctx.fillStyle = (i < ratingHover) ? '#ffee00' : '#444';
      ctx.fillText('★', 185 + i * 46 + 10, 358);
    }
  } else {
    for (let i = 0; i < 5; i++) {
      ctx.font = '32px Courier New';
      ctx.fillStyle = (i < ratingStars) ? '#ffee00' : '#444';
      ctx.fillText('★', 185 + i * 46 + 10, 358);

    ctx.fillStyle = '#0f0';

// ── Rating Mouse ──────────────────────────────────────────────────────────
canvas.addEventListener('mousemove', e => {
  if (state !== STATE.GAME_OVER || ratingDone) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  ratingHover = 0;
  if (my >= 325 && my <= 370) {
    for (let i = 0; i < 5; i++) {
      if (mx >= 185 + i * 46 && mx < 185 + (i + 1) * 46) {
        ratingHover = i + 1;
        break;
      }
    }
  }
});

canvas.addEventListener('click', e => {
  if (state !== STATE.GAME_OVER || ratingDone) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  if (my >= 325 && my <= 370) {
    for (let i = 0; i < 5; i++) {
      if (mx >= 185 + i * 46 && mx < 185 + (i + 1) * 46) {
        ratingStars = i + 1;
        ratingDone = true;
        submitRating(ratingStars);
        break;
      }
    }
  }
});

// ── Main Loop ─────────────────────────────────────────────────────────────
function loop() {
  requestAnimationFrame(loop);
  frameCount++;

  // Clear background
  ctx.fillStyle = '#0d0d1a';
  ctx.fillRect(0, 0, 600, 450);

  if (state === STATE.TITLE) {
    drawTitle();
    handleTitle();
    return;
  }

  if (state === STATE.GAME_OVER) {
    drawGameOver();
    updatePlayer(); // for Space to restart
    return;
  }

  // Draw court
  drawCourt();

  // Tick timers
  if (p1Swing  > 0) p1Swing--;
  if (p2Swing  > 0) p2Swing--;
  if (cpuSwing > 0) cpuSwing--;
  if (msgTimer > 0) msgTimer--;

  // When serving, keep ball at server position and lock positions
  if (state === STATE.SERVING) {
    if (score.server === 0) {
      ball.cx = player.cx + 0.04;
      ball.cz = 0.0;
      ball.yh = 0.05;
      player.cz = 0.0;  // keep player locked to baseline
    } else if (!mode2p) {
      cpu.cz = 1.0;     // CPU stays at baseline while serving
      ball.cx = cpu.cx;
      ball.cz = 1.0;
      ball.yh = 0.05;
    }
  }

  // CPU logic
  updateCPU();

  // Physics
  if (state === STATE.RALLY) updateBall();

  // Player input
  updatePlayer();

  // ── Draw everything ──
  // Draw far side first (CPU / P2)
  if (mode2p) {
    const p2Pos = courtToScreen(player2.cx, player2.cz);
    drawFigure(p2Pos, '#e84040', 0.65, p2Swing, -1);
  } else {
    const cpuPos = courtToScreen(cpu.cx, cpu.cz);
    drawFigure(cpuPos, '#e84040', 0.6, cpuSwing, -1);
  }

  // Ball
  drawBall();

  // Player (near, drawn on top)
  const pPos = courtToScreen(player.cx, player.cz);
  drawFigure(pPos, '#3b82f6', 1.0, p1Swing, 1);

  // HUD (top overlay)
  drawHUD();
}

loop();

// ── Mobile Touch Controls ─────────────────────────────────────────────────
(function() {
  const map = {
    'm-up':    'ArrowUp',
    'm-down':  'ArrowDown',
    'm-left':  'ArrowLeft',
    'm-right': 'ArrowRight',
  };

  function press(code) { keys[code] = true; }
  function release(code) { keys[code] = false; }

  Object.entries(map).forEach(([id, code]) => {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', e => { e.preventDefault(); press(code); }, {passive:false});
    el.addEventListener('touchend',   e => { e.preventDefault(); release(code); }, {passive:false});
    el.addEventListener('touchcancel',e => { e.preventDefault(); release(code); }, {passive:false});
  });

  // HIT button: touchstart = begin charge, touchend = release & fire
  const hitBtn = document.getElementById('m-hit');
  hitBtn.addEventListener('touchstart', e => {
    e.preventDefault();
    const inPlay = state === STATE.SERVING || state === STATE.RALLY;
    if (inPlay && p1ChargeStart < 0) p1ChargeStart = frameCount;
    // Title screen: confirm selection
    if (state === STATE.TITLE) titleConfirm();
  }, {passive:false});
  hitBtn.addEventListener('touchend', e => {
    e.preventDefault();
    if (state === STATE.GAME_OVER) { state = STATE.TITLE; return; }
    if (p1ChargeStart >= 0) {
      const charge = Math.min((frameCount - p1ChargeStart) / 60, 1.0);
      p1ChargeStart = -1;
      handleP1Action(charge);
    }
  }, {passive:false});
  hitBtn.addEventListener('touchcancel', e => {
    e.preventDefault();
    p1ChargeStart = -1;
  }, {passive:false});

  // Show hit button label based on state
  const origLoop = loop;
  function updateHitLabel() {
    const lbl = state === STATE.TITLE ? 'START' :
                state === STATE.GAME_OVER ? 'AGAIN' :
                state === STATE.SERVING ? (lang==='ja'?'サーブ':'SERVE') :
                (lang==='ja'?'HIT':'HIT');
    hitBtn.textContent = lbl;
  }
  // Patch into animation frame
  const _loop = window.requestAnimationFrame;
  setInterval(updateHitLabel, 200);
})();
</script>
</body>
</html>
