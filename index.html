<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>SYMBIONT</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Courier New', monospace;
      color: #eee;
      user-select: none;
    }
    #ui {
      display: flex;
      gap: 40px;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }
    #healthbar-wrap {
      width: 200px;
      height: 14px;
      background: #333;
      border-radius: 7px;
      overflow: hidden;
      border: 1px solid #555;
    }
    #healthbar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #00e5a0, #00aaff);
      transition: width 0.2s;
      border-radius: 7px;
    }
    canvas { display: block; border: 1px solid #333; }
    #overlay {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      pointer-events: none;
    }
    #overlay h2 { font-size: 2rem; letter-spacing: 6px; }
    #overlay p { font-size: 0.85rem; color: #aaa; line-height: 1.8; text-align: center; }
    #overlay .hint { font-size: 0.75rem; color: #666; }
    .light-color { color: #ffe066; }
    .dark-color  { color: #aa88ff; }
  </style>
</head>
<body>

<div id="ui">
  <span>スコア: <strong id="score">0</strong></span>
  <div id="healthbar-wrap"><div id="healthbar"></div></div>
  <span>HP: <strong id="hp">100</strong></span>
</div>
<div style="position:relative;">
  <canvas id="c" width="560" height="560"></canvas>
  <div id="overlay">
    <h2>SYMBIONT</h2>
    <p>
      <span class="light-color">光の生命体</span> → <strong>WASD</strong>キー（上半分）<br>
      <span class="dark-color">闇の生命体</span> → <strong>矢印</strong>キー（下半分）<br>
      2体は糸で繋がれている。離れすぎるとダメージ。<br>
      栄養を集めて天敵を避けろ。
    </p>
    <p class="hint">スペースキーでスタート</p>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height, MID = H / 2;

let state = 'idle';
let score = 0, hp = 100;
let nutrients = [], predators = [], particles = [];
let frameCount = 0;

const keys = {};
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ') {
    if (state !== 'playing') startGame();
    e.preventDefault();
  }
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

const light = { x: W/2, y: MID/2, r: 13, vx: 0, vy: 0, trail: [] };
const dark  = { x: W/2, y: MID + MID/2, r: 13, vx: 0, vy: 0, trail: [] };

const TETHER_MAX = 210;
const TETHER_WARN = 160;
const SPEED = 2.8;
const FRICTION = 0.82;

function startGame() {
  state = 'playing';
  score = 0; hp = 100;
  light.x = W/2; light.y = MID/2; light.vx=0; light.vy=0; light.trail=[];
  dark.x  = W/2; dark.y  = MID+MID/2; dark.vx=0; dark.vy=0; dark.trail=[];
  nutrients = []; predators = []; particles = [];
  frameCount = 0;
  document.getElementById('overlay').style.display = 'none';
  updateUI();
}

function spawnNutrient() {
  nutrients.push({ x: rand(20, W-20), y: rand(20, MID-20), zone: 'light', r: 7, age: 0 });
  nutrients.push({ x: rand(20, W-20), y: rand(MID+20, H-20), zone: 'dark', r: 7, age: 0 });
}

function spawnPredator() {
  const zone = Math.random() < 0.5 ? 'light' : 'dark';
  const yMin = zone === 'light' ? 0 : MID;
  const yMax = zone === 'light' ? MID : H;
  const side = Math.floor(Math.random()*4);
  let x, y;
  if (side===0) { x=rand(0,W); y=yMin; }
  else if (side===1) { x=rand(0,W); y=yMax; }
  else if (side===2) { x=0; y=rand(yMin,yMax); }
  else { x=W; y=rand(yMin,yMax); }
  predators.push({ x, y, zone, r: 10, spd: 0.9 + Math.random()*0.6 });
}

function rand(a, b) { return a + Math.random()*(b-a); }

function emit(x, y, color, n=6) {
  for (let i=0;i<n;i++) {
    const angle = Math.random()*Math.PI*2;
    const spd = 1+Math.random()*2;
    particles.push({ x, y, vx: Math.cos(angle)*spd, vy: Math.sin(angle)*spd, life: 1, color });
  }
}

function updateOrganism(org, up, down, left, right, yMin, yMax) {
  if (keys[up])    org.vy -= SPEED * 0.3;
  if (keys[down])  org.vy += SPEED * 0.3;
  if (keys[left])  org.vx -= SPEED * 0.3;
  if (keys[right]) org.vx += SPEED * 0.3;
  const mag = Math.hypot(org.vx, org.vy);
  if (mag > SPEED) { org.vx = org.vx/mag*SPEED; org.vy = org.vy/mag*SPEED; }
  org.vx *= FRICTION; org.vy *= FRICTION;
  org.x = Math.max(org.r, Math.min(W-org.r, org.x + org.vx));
  org.y = Math.max(yMin+org.r, Math.min(yMax-org.r, org.y + org.vy));
  org.trail.push({x:org.x, y:org.y});
  if (org.trail.length > 18) org.trail.shift();
}

function update() {
  frameCount++;

  updateOrganism(light, 'w','s','a','d', 0, MID);
  updateOrganism(dark, 'ArrowUp','ArrowDown','ArrowLeft','ArrowRight', MID, H);

  const dist = Math.hypot(light.x - dark.x, light.y - dark.y);
  if (dist > TETHER_MAX) {
    const dmg = (dist - TETHER_MAX) * 0.15;
    hp = Math.max(0, hp - dmg);
    emit(light.x, light.y, '#ff4444', 2);
    emit(dark.x, dark.y, '#ff4444', 2);
  }

  if (frameCount % 90 === 0) spawnNutrient();
  nutrients = nutrients.filter(n => {
    n.age++;
    if (n.age > 400) return false;
    const org = n.zone === 'light' ? light : dark;
    if (Math.hypot(org.x-n.x, org.y-n.y) < org.r+n.r) {
      score += 10;
      emit(n.x, n.y, n.zone==='light' ? '#ffe066' : '#aa88ff', 8);
      return false;
    }
    return true;
  });

  if (frameCount % 180 === 0 || (frameCount < 60 && frameCount % 40===0)) spawnPredator();
  predators.forEach(p => {
    const org = p.zone === 'light' ? light : dark;
    const dx = org.x - p.x, dy = org.y - p.y;
    const d = Math.hypot(dx, dy);
    if (d > 0) { p.x += dx/d*p.spd; p.y += dy/d*p.spd; }
    if (d < org.r + p.r) {
      hp = Math.max(0, hp - 1.2);
      emit(org.x, org.y, '#ff2222', 4);
    }
  });
  predators = predators.filter(p => {
    const yMin = p.zone==='light' ? 0 : MID;
    const yMax = p.zone==='light' ? MID : H;
    return p.x>-20&&p.x<W+20&&p.y>yMin-20&&p.y<yMax+20;
  });

  particles.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.vx*=0.9; p.vy*=0.9; p.life-=0.04; });
  particles = particles.filter(p => p.life > 0);

  if (hp <= 0) { hp=0; state='dead'; showGameOver(); }
  updateUI();
}

function updateUI() {
  document.getElementById('score').textContent = score;
  document.getElementById('hp').textContent = Math.ceil(hp);
  document.getElementById('healthbar').style.width = hp + '%';
}

function showGameOver() {
  const ov = document.getElementById('overlay');
  ov.innerHTML = `<h2 style="color:#ff4444">GAME OVER</h2>
    <p>スコア: <strong>${score}</strong></p>
    <p class="hint">スペースキーでリスタート</p>`;
  ov.style.display = 'flex';
}

function drawBg() {
  const lg = ctx.createLinearGradient(0,0,0,MID);
  lg.addColorStop(0, '#1a1a2e');
  lg.addColorStop(1, '#16213e');
  ctx.fillStyle = lg;
  ctx.fillRect(0, 0, W, MID);

  const dg = ctx.createLinearGradient(0,MID,0,H);
  dg.addColorStop(0, '#0d0d1a');
  dg.addColorStop(1, '#1a0d2e');
  ctx.fillStyle = dg;
  ctx.fillRect(0, MID, W, MID);

  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  ctx.setLineDash([6,6]);
  ctx.beginPath(); ctx.moveTo(0,MID); ctx.lineTo(W,MID); ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = 'rgba(255,224,102,0.12)';
  ctx.font = '80px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('☀', W/2, MID*0.72);
  ctx.fillStyle = 'rgba(170,136,255,0.12)';
  ctx.fillText('☽', W/2, MID+MID*0.72);
  ctx.textAlign = 'left';
}

function drawTether() {
  const dist = Math.hypot(light.x-dark.x, light.y-dark.y);
  const t = Math.min(1, Math.max(0, (dist-TETHER_WARN)/(TETHER_MAX-TETHER_WARN)));
  const r = Math.floor(t*255);
  const g = Math.floor((1-t)*180);
  ctx.save();
  ctx.strokeStyle = `rgba(${r},${g},180,${0.4+t*0.4})`;
  ctx.lineWidth = 2 - t;
  ctx.setLineDash([4,4]);
  ctx.beginPath();
  ctx.moveTo(light.x, light.y);
  ctx.bezierCurveTo(light.x, MID, dark.x, MID, dark.x, dark.y);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawTrail(org, color) {
  org.trail.forEach((p, i) => {
    const alpha = i / org.trail.length * 0.4;
    ctx.beginPath();
    ctx.arc(p.x, p.y, org.r * (i/org.trail.length) * 0.7, 0, Math.PI*2);
    ctx.fillStyle = color.replace(')', `,${alpha})`).replace('rgb','rgba');
    ctx.fill();
  });
}

function drawOrganism(org, color, glowColor) {
  ctx.save();
  ctx.shadowColor = glowColor;
  ctx.shadowBlur = 18;
  ctx.beginPath();
  ctx.arc(org.x, org.y, org.r, 0, Math.PI*2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.beginPath();
  ctx.arc(org.x - org.r*0.25, org.y - org.r*0.25, org.r*0.35, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fill();
  ctx.restore();
}

function drawNutrient(n) {
  const pulse = 0.85 + 0.15*Math.sin(frameCount*0.1 + n.x);
  const fade = n.age > 320 ? 1-(n.age-320)/80 : 1;
  ctx.save();
  ctx.globalAlpha = fade;
  ctx.shadowColor = n.zone==='light' ? '#ffe066' : '#aa88ff';
  ctx.shadowBlur = 12*pulse;
  ctx.beginPath();
  ctx.arc(n.x, n.y, n.r*pulse, 0, Math.PI*2);
  ctx.fillStyle = n.zone==='light' ? '#ffe066' : '#aa88ff';
  ctx.fill();
  ctx.restore();
}

function drawPredator(p) {
  ctx.save();
  ctx.shadowColor = '#ff4444';
  ctx.shadowBlur = 10;
  ctx.beginPath();
  const angle = Math.atan2(
    (p.zone==='light'?light:dark).y - p.y,
    (p.zone==='light'?light:dark).x - p.x
  );
  for (let i=0;i<3;i++) {
    const a = angle + i*Math.PI*2/3;
    const r = i===0 ? p.r*1.6 : p.r;
    const x = p.x + Math.cos(a)*r;
    const y = p.y + Math.sin(a)*r;
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.fillStyle = p.zone==='light' ? '#ff6644' : '#cc33aa';
  ctx.fill();
  ctx.restore();
}

function drawParticles() {
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3*p.life, 0, Math.PI*2);
    ctx.fillStyle = p.color;
    ctx.fill();
    ctx.restore();
  });
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawBg();
  drawTether();
  drawTrail(light, 'rgb(255,224,102)');
  drawTrail(dark,  'rgb(170,136,255)');
  nutrients.forEach(drawNutrient);
  predators.forEach(drawPredator);
  drawParticles();
  drawOrganism(light, '#ffe066', '#ffcc00');
  drawOrganism(dark,  '#bb99ff', '#9966ff');
}

function loop() {
  if (state === 'playing') update();
  draw();
  requestAnimationFrame(loop);
}

spawnNutrient(); spawnNutrient();
loop();
</script>
</body>
</html>
