<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>GAME ARCADE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d1a;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
    }
    h1 {
      font-size: 2.2rem;
      letter-spacing: 10px;
      color: #00d4aa;
      margin-bottom: 8px;
      text-shadow: 0 0 20px rgba(0,212,170,0.5);
    }
    .subtitle {
      color: #555;
      font-size: 0.8rem;
      letter-spacing: 4px;
      margin-bottom: 60px;
    }
    .cards {
      display: flex;
      gap: 40px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .card {
      background: #13131f;
      border: 1px solid #222;
      border-radius: 12px;
      width: 320px;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-6px);
      border-color: #444;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }
    .preview {
      width: 320px;
      height: 200px;
      display: block;
    }
    .card-body {
      padding: 24px;
    }
    .card-title {
      font-size: 1.3rem;
      letter-spacing: 4px;
      margin-bottom: 12px;
    }
    .card-desc {
      font-size: 0.78rem;
      color: #888;
      line-height: 1.8;
      margin-bottom: 20px;
    }
    .card-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .tag {
      font-size: 0.65rem;
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid #333;
      color: #666;
      letter-spacing: 1px;
    }
    .play-btn {
      display: block;
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      letter-spacing: 3px;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    .play-btn:hover { opacity: 0.85; }
    .btn-snake {
      background: linear-gradient(135deg, #00d4aa, #0088cc);
      color: #000;
      font-weight: bold;
    }
    .btn-symbiont {
      background: linear-gradient(135deg, #ffe066, #aa88ff);
      color: #000;
      font-weight: bold;
    }
  </style>
</head>
<body>

<h1>ARCADE</h1>
<p class="subtitle">SELECT YOUR GAME</p>

<div class="cards">

  <div class="card">
    <canvas class="preview" id="snakePreview" width="320" height="200"></canvas>
    <div class="card-body">
      <div class="card-title" style="color:#00d4aa">SNAKE</div>
      <p class="card-desc">
        クラシックなスネークゲーム。エサを食べるほどヘビが成長し、スピードも上がる。壁と自分の体に当たるとゲームオーバー。シンプルながら奥が深い。
      </p>
      <div class="card-tags">
        <span class="tag">1 PLAYER</span>
        <span class="tag">KEYBOARD</span>
        <span class="tag">CLASSIC</span>
      </div>
      <a href="snake.html" class="play-btn btn-snake">▶ PLAY</a>
    </div>
  </div>

  <div class="card">
    <canvas class="preview" id="symbPreview" width="320" height="200"></canvas>
    <div class="card-body">
      <div class="card-title" style="color:#ffe066">SYMBIONT</div>
      <p class="card-desc">
        光と闇、2つの生命体を同時に操作する唯一無二のゲーム。WASDと矢印キーを両手で使い、糸で繋がれた2体を天敵から守りながら栄養を集めろ。
      </p>
      <div class="card-tags">
        <span class="tag">1 PLAYER</span>
        <span class="tag">DUAL CONTROL</span>
        <span class="tag">UNIQUE</span>
      </div>
      <a href="symbiont.html" class="play-btn btn-symbiont">▶ PLAY</a>
    </div>
  </div>

</div>

<script>
(function() {
  const c = document.getElementById('snakePreview');
  const ctx = c.getContext('2d');
  const W = c.width, H = c.height;
  const CELL = 16, COLS = Math.floor(W/CELL), ROWS = Math.floor(H/CELL);
  ctx.fillStyle = '#0f0f1a';
  ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 0.5;
  for (let i=0;i<=COLS;i++) { ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,H); ctx.stroke(); }
  for (let j=0;j<=ROWS;j++) { ctx.beginPath(); ctx.moveTo(0,j*CELL); ctx.lineTo(W,j*CELL); ctx.stroke(); }
  const snake = [
    {x:10,y:6},{x:9,y:6},{x:8,y:6},{x:7,y:6},{x:7,y:7},{x:7,y:8},
    {x:6,y:8},{x:5,y:8},{x:4,y:8},{x:4,y:7},{x:4,y:6},{x:4,y:5}
  ];
  snake.forEach((s,i) => {
    const ratio = 1 - i/snake.length;
    ctx.fillStyle = `rgba(0,${Math.floor(180+75*ratio)},${Math.floor(100+110*ratio)},1)`;
    ctx.shadowColor = i===0 ? '#00d4aa' : 'transparent';
    ctx.shadowBlur = i===0 ? 8 : 0;
    ctx.fillRect(s.x*CELL+1, s.y*CELL+1, CELL-2, CELL-2);
  });
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#ff6b6b';
  ctx.shadowColor = '#ff6b6b';
  ctx.shadowBlur = 10;
  ctx.fillRect(13*CELL+2, 4*CELL+2, CELL-4, CELL-4);
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(0, H-30, W, 30);
  ctx.fillStyle = '#00d4aa';
  ctx.font = '11px Courier New';
  ctx.fillText('SCORE: 110   HI: 220', 12, H-10);
})();

(function() {
  const c = document.getElementById('symbPreview');
  const ctx = c.getContext('2d');
  const W = c.width, H = c.height, MID = H/2;
  const lg = ctx.createLinearGradient(0,0,0,MID);
  lg.addColorStop(0,'#1a1a2e'); lg.addColorStop(1,'#16213e');
  ctx.fillStyle = lg; ctx.fillRect(0,0,W,MID);
  const dg = ctx.createLinearGradient(0,MID,0,H);
  dg.addColorStop(0,'#0d0d1a'); dg.addColorStop(1,'#1a0d2e');
  ctx.fillStyle = dg; ctx.fillRect(0,MID,W,MID);
  ctx.strokeStyle = '#333'; ctx.lineWidth=1; ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(0,MID); ctx.lineTo(W,MID); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,224,102,0.15)'; ctx.font='44px serif'; ctx.textAlign='center';
  ctx.fillText('☀',W/2,MID*0.72);
  ctx.fillStyle='rgba(170,136,255,0.15)';
  ctx.fillText('☽',W/2,MID+MID*0.72);
  const lx=W*0.45, ly=MID*0.5, dx=W*0.55, dy=MID+MID*0.5;
  ctx.strokeStyle='rgba(120,180,255,0.5)'; ctx.lineWidth=1.5; ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(lx,ly);
  ctx.bezierCurveTo(lx,MID,dx,MID,dx,dy);
  ctx.stroke(); ctx.setLineDash([]);
  [[W*0.25,MID*0.35,'#ffe066'],[W*0.7,MID*0.65,'#ffe066'],
   [W*0.3,MID+MID*0.6,'#aa88ff'],[W*0.72,MID+MID*0.3,'#aa88ff']].forEach(([x,y,col])=>{
    ctx.shadowColor=col; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(x,y,5,0,Math.PI*2);
    ctx.fillStyle=col; ctx.fill(); ctx.shadowBlur=0;
  });
  [[W*0.15,MID*0.75,'#ff6644'],[W*0.8,MID+MID*0.4,'#cc33aa']].forEach(([x,y,col])=>{
    ctx.shadowColor='#ff4444'; ctx.shadowBlur=8;
    ctx.beginPath();
    ctx.moveTo(x,y-10); ctx.lineTo(x+8,y+6); ctx.lineTo(x-8,y+6);
    ctx.closePath(); ctx.fillStyle=col; ctx.fill(); ctx.shadowBlur=0;
  });
  ctx.shadowColor='#ffcc00'; ctx.shadowBlur=14;
  ctx.beginPath(); ctx.arc(lx,ly,11,0,Math.PI*2);
  ctx.fillStyle='#ffe066'; ctx.fill(); ctx.shadowBlur=0;
  ctx.beginPath(); ctx.arc(lx-3,ly-3,4,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.fill();
  ctx.shadowColor='#9966ff'; ctx.shadowBlur=14;
  ctx.beginPath(); ctx.arc(dx,dy,11,0,Math.PI*2);
  ctx.fillStyle='#bb99ff'; ctx.fill(); ctx.shadowBlur=0;
  ctx.beginPath(); ctx.arc(dx-3,dy-3,4,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.fill();
  ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(0,H-30,W,30);
  ctx.fillStyle='#555'; ctx.fillRect(10,H-20,W-20,8);
  const grad = ctx.createLinearGradient(10,0,W-20,0);
  grad.addColorStop(0,'#00e5a0'); grad.addColorStop(1,'#00aaff');
  ctx.fillStyle=grad; ctx.fillRect(10,H-20,(W-20)*0.72,8);
  ctx.fillStyle='#aaa'; ctx.font='10px Courier New'; ctx.textAlign='left';
  ctx.fillText('HP  SCORE: 230', 12, H-10);
})();
</script>
</body>
</html>
