<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ババ抜き</title>
<script src="netplay.js"></script>
<script src="sound.js"></script>
<script src="track.js"></script>
<script src="cards.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:radial-gradient(circle at 50% 28%,#4a2a1a,#241008);min-height:100vh;
    font-family:'Hiragino Sans','Meiryo','Segoe UI',sans-serif;color:#ffeede;
    display:flex;flex-direction:column;align-items:center;padding:46px 8px 20px;--cw:46px;--ch:65px;}
  h1{font-size:1.3rem;letter-spacing:4px;color:#ffb87a;margin-bottom:6px;}
  .cpus{display:flex;gap:12px;margin-bottom:8px;flex-wrap:wrap;justify-content:center;}
  .cpu{background:rgba(0,0,0,.3);border-radius:10px;padding:6px 14px;font-size:.8rem;text-align:center;min-width:78px;}
  .cpu.act{outline:2px solid #ffb87a;}.cpu.victim{outline:2px solid #ff5050;}
  .cpu.safe{opacity:.5;}.cpu .n{font-weight:bold;}
  .draw-zone{min-height:calc(var(--ch)+30px);display:flex;flex-direction:column;align-items:center;gap:6px;
    background:rgba(0,0,0,.2);border-radius:12px;padding:10px 16px;margin-bottom:8px;}
  .draw-lbl{font-size:.78rem;opacity:.8;}
  .draw-cards{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:680px;}
  .turn{font-size:.88rem;margin:6px 0;min-height:20px;text-align:center;}
  .myhand{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:820px;margin-top:6px;}
  .controls{margin-top:14px;display:flex;gap:12px;}
  button{font-family:inherit;font-size:.9rem;font-weight:bold;border:none;border-radius:9px;padding:10px 22px;cursor:pointer;}
  .b-new{background:#ffb87a;color:#222;}
  .topbtn{position:fixed;top:12px;left:12px;background:#374151;color:#fff;border-radius:8px;padding:7px 14px;font-size:.8rem;cursor:pointer;border:none;}
  .win-msg{font-size:1.15rem;font-weight:bold;margin-top:12px;text-align:center;}
  .rank-list{font-size:.8rem;opacity:.85;margin-top:4px;text-align:center;}
  .pcard.draw-pick{cursor:pointer;}
  .pcard.draw-pick:hover{transform:translateY(-10px);box-shadow:0 8px 16px rgba(0,0,0,.5);}
</style>
</head>
<body>
<button class="topbtn" id="backbtn" onclick="location.href='index.html'">戻る</button>
<button class="topbtn" id="modebtn" style="left:auto;right:12px;background:#7c3aed;"></button>
<h1 id="title">ババ抜き</h1>
<div class="cpus" id="cpus"></div>
<div class="draw-zone" id="drawzone"></div>
<div class="turn" id="turn"></div>
<div class="myhand" id="myhand"></div>
<div class="win-msg" id="winmsg"></div>
<div class="rank-list" id="ranklist"></div>
<div class="controls"><button class="b-new" id="newbtn"></button></div>

<script>
const L={
  title:{ja:'ババ抜き',en:'Old Maid'},you:{ja:'あなた',en:'You'},
  yourdraw:{ja:'から1枚引く',en:': draw one'},
  drawing:{ja:'が引いています…',en:' is drawing…'},
  cputurn:{ja:'の番…',en:'\'s turn…'},newgame:{ja:'新しいゲーム',en:'New Game'},
  safe:{ja:'あがり',en:'SAFE'},
  youlose:{ja:'あなたがババ！負け…',en:'You got the Old Maid! You lose…'},
  youwin:{ja:'あがり！勝ち！',en:'You\'re safe — you win!'},finished:{ja:'ゲーム終了',en:'Game Over'},
  drew:{ja:'が引いた！',en:' drew!'},pair:{ja:'✨ ペア成立！',en:'✨ PAIR!'},
  back:{ja:'戻る',en:'Back'},
  modeJoker:{ja:'ババ抜き(🃏)',en:'Joker Mode'},
  modeOdd:{ja:'ジジ抜き',en:'Odd-Out'},
  p2:{ja:'P2',en:'P2'},opponent:{ja:'相手',en:'Opponent'},
  online:{ja:'オンライン',en:'Online'},local2p:{ja:'ローカル2P',en:'Local 2P'},
  waiting:{ja:'相手の番…',en:'Opponent\'s turn…'},
  tapToDraw:{ja:'カードをタップして引く',en:'Tap a card to draw'},
  easy:{ja:'弱',en:'Easy'},normal:{ja:'普通',en:'Normal'},hard:{ja:'強',en:'Hard'},diff:{ja:'難易度',en:'Difficulty'},cards:{ja:'枚',en:' cards'},
};
let lang=localStorage.getItem('lang')||'ja';
const t=k=>(L[k]&&L[k][lang])||k;
const C=window.CARDS,$=id=>document.getElementById(id);
let jokerMode=(localStorage.getItem('oldmaid_joker')==='1');
let difficulty=localStorage.getItem('oldmaid_diff')||'medium';
if(difficulty==='normal')difficulty='medium'; // legacy value from old button bug
let jokerTrail=null; // tracks which player most recently received a no-match card (likely the joker)

let np=parseInt(localStorage.getItem('oldmaid_np'))||4;
let gameMode='solo',myIdx=0,onlineRole=null,roomId=null,onlineSeq=-1,sbar=null;
let hands,turn,safeOrder,gameOver,phase,victim;

function isHuman(p){return gameMode==='solo'?p===myIdx:(p===0||p===1);}
function playerLabel(p){
  if(p===myIdx)return t('you');
  if(gameMode==='local2p'&&p<2)return t('p2');
  if(gameMode==='online'&&p<2)return t('opponent');
  return 'CPU '+p;
}

function computeInitState(){
  let deck=C.shuffle(C.makeDeck());
  if(jokerMode){deck.push({joker:true,rank:'JOKER',suit:'JOKER',value:-1,id:'JOKER'});C.shuffle(deck);}
  else deck.pop();
  const h=Array.from({length:np},()=>[]);
  deck.forEach((c,i)=>h[i%np].push(c));
  h.forEach(hh=>{discardPairs(hh);C.shuffle(hh);});
  const tt=0;
  return{hands:h,turn:tt,safeOrder:[],gameOver:false,phase:'turn',victim:-1,seq:0};
}
function applyState(st){hands=st.hands;turn=st.turn;safeOrder=st.safeOrder;gameOver=st.gameOver;phase=st.phase;victim=st.victim;}
function discardPairs(h){
  const byVal={};h.forEach(c=>{(byVal[c.value]=byVal[c.value]||[]).push(c);});
  for(const v in byVal){let g=byVal[v];while(g.length>=2){const a=g.pop(),b=g.pop();h.splice(h.indexOf(a),1);h.splice(h.indexOf(b),1);}}
}
function nextActive(from){
  let n=from;
  for(let i=0;i<np;i++){n=(n+1)%np;if(hands[n]&&hands[n].length>0&&!safeOrder.includes(n))break;}
  return n;
}
function setup(){
  myIdx=(gameMode==='online'&&onlineRole==='guest')?1:0;
  const st=computeInitState();onlineSeq=st.seq;
  applyState(st);
  $('winmsg').textContent='';$('ranklist').textContent='';
  render();
  if(checkSafe())return;
  setTimeout(startTurn,500);
}

function render(){
  $('title').textContent=t('title');$('newbtn').textContent=t('newgame');
  $('backbtn').textContent=t('back');
  $('modebtn').textContent=jokerMode?t('modeJoker'):t('modeOdd');
  const cE=$('cpus');cE.innerHTML='';
  for(let p=0;p<np;p++){
    if(p===myIdx)continue;
    const d=document.createElement('div');
    let cls='cpu';if(turn===p&&!gameOver)cls+=' act';if(victim===p)cls+=' victim';if(safeOrder.includes(p))cls+=' safe';
    d.className=cls;
    let st=safeOrder.includes(p)?'✅'+t('safe'):`${(hands[p]||[]).length}${t('cards')}`;
    d.innerHTML=`<div class="n">${playerLabel(p)}</div><div>${st}</div>`;
    cE.appendChild(d);
  }
  const dz=$('drawzone');dz.innerHTML='';
  const isMyTurn=turn===myIdx&&!gameOver;
  if(phase==='pick'&&isMyTurn&&victim>=0){
    const lbl=document.createElement('div');lbl.className='draw-lbl';
    lbl.textContent=playerLabel(victim)+t('yourdraw')+' — '+t('tapToDraw');
    dz.appendChild(lbl);
    const dc=document.createElement('div');dc.className='draw-cards';
    (hands[victim]||[]).forEach((c,i)=>{
      const el=C.cardEl(c,gameMode==='online'&&victim===myIdx?true:false);
      el.classList.add('draw-pick');el.onclick=()=>playerDraw(i);dc.appendChild(el);
    });
    dz.appendChild(dc);
  }else if(phase==='cpudraw'&&victim>=0){
    const lbl=document.createElement('div');lbl.className='draw-lbl';
    lbl.textContent=`${playerLabel(turn)} → ${playerLabel(victim)}${t('drawing')}`;
    dz.appendChild(lbl);
    const dc=document.createElement('div');dc.className='draw-cards';
    (hands[victim]||[]).forEach(c=>dc.appendChild(C.cardEl(c,victim===myIdx)));
    dz.appendChild(dc);
  }
  let turnTxt;
  if(gameOver)turnTxt=t('finished');
  else if(isMyTurn)turnTxt='';
  else if(!isHuman(turn))turnTxt=playerLabel(turn)+t('cputurn');
  else turnTxt=t('waiting');
  $('turn').textContent=turnTxt;
  const mh=$('myhand');mh.innerHTML='';
  (hands[myIdx]||[]).forEach(c=>mh.appendChild(C.cardEl(c,true)));
}

function startTurn(){
  if(gameOver)return;
  victim=nextActive(turn);
  if(victim===turn){checkSafe();return;}
  if(isHuman(turn)&&turn===myIdx){phase='pick';render();}
  else if(isHuman(turn)&&turn!==myIdx){
    // Other human's turn (local2p or online)
    if(gameMode==='local2p'){
      phase='cpudraw';render();
      NETPLAY.showHandoff(playerLabel(turn),lang,()=>{myIdx=turn;phase='pick';render();});
    }else{
      phase='cpudraw';render(); // online: wait for their push
    }
  }else{
    phase='cpudraw';render();setTimeout(()=>cpuDraw(),900);
  }
}
function playerDraw(i){
  if(phase!=='pick'||turn!==myIdx)return;
  takeCard(myIdx,victim,i);
}
function cpuDraw(){
  if(gameOver||isHuman(turn))return;
  const n=(hands[victim]||[]).length;
  if(!n)return;
  let i;
  if(difficulty!=='easy'&&jokerTrail===victim){
    // Avoid the center position (a rough heuristic for where the odd card ends up)
    const avoidProb=difficulty==='medium'?0.5:0.8;
    if(Math.random()<avoidProb){
      const mid=Math.floor(n/2);
      const opts=Array.from({length:n},(_,k)=>k).filter(k=>k!==mid);
      i=opts.length?opts[Math.floor(Math.random()*opts.length)]:Math.floor(Math.random()*n);
    }else{i=Math.floor(Math.random()*n);}
  }else{i=Math.floor(Math.random()*n);}
  takeCard(turn,victim,i);
}
function takeCard(drawer,from,idx){
  if(!(hands[from]&&hands[from][idx]))return;
  const card=hands[from].splice(idx,1)[0];
  SND.sfx.draw&&SND.sfx.draw();
  const dz=$('drawzone');dz.innerHTML='';
  const lbl=document.createElement('div');lbl.className='draw-lbl';
  lbl.textContent=playerLabel(drawer)+t('drew');dz.appendChild(lbl);
  const flashEl=C.cardEl(card,true);
  flashEl.classList.add('glow-gold');
  flashEl.style.setProperty('--cw','56px');flashEl.style.setProperty('--ch','80px');
  dz.appendChild(flashEl);
  setTimeout(()=>{
    hands[drawer].push(card);
    const match=hands[drawer].find(c=>c.value===card.value&&c.id!==card.id);
    const afterPair=()=>{
      C.shuffle(hands[drawer]);
      phase='turn';victim=-1;
      if(gameMode==='online')pushOnline();
      else{render();checkSafe();if(gameOver)return;turn=nextActive(turn);render();setTimeout(startTurn,650);}
    };
    if(match){
      hands[drawer].splice(hands[drawer].indexOf(match),1);hands[drawer].splice(hands[drawer].indexOf(card),1);
      if(drawer===myIdx)SND.sfx.pointWin&&SND.sfx.pointWin();else SND.sfx.discard&&SND.sfx.discard();
      C.showOverlay(t('pair'),[card,match],'#7dffb0',1400,afterPair);
    }else{jokerTrail=drawer;afterPair();}
  },650);
}
function checkSafe(){
  let changed=false;
  for(let p=0;p<np;p++){
    if((hands[p]||[]).length===0&&!safeOrder.includes(p)){safeOrder.push(p);changed=true;
      if(p===myIdx)SND.sfx.win&&SND.sfx.win();}
  }
  const active=[];for(let p=0;p<np;p++)if(!safeOrder.includes(p))active.push(p);
  if(active.length<=1){if(active.length===1)safeOrder.push(active[0]);endGame();return true;}
  if(changed)render();
  return false;
}
function endGame(){
  gameOver=true;SND.stopBGM&&SND.stopBGM();
  if(gameMode==='online'){NETPLAY.stopPoll();if(sbar)sbar.remove();}
  const loser=safeOrder[safeOrder.length-1];
  const m=$('winmsg');
  if(loser===myIdx){m.textContent='😱 '+t('youlose');m.style.color='#ff9090';SND.sfx.lose&&SND.sfx.lose();}
  else{m.textContent='🎉 '+t('youwin');m.style.color='#7dffb0';SND.sfx.win&&SND.sfx.win();}
  $('ranklist').textContent=safeOrder.map((p,i)=>`${i<safeOrder.length-1?'✅':'💀'} ${playerLabel(p)}`).join('   ');
  victim=-1;phase='turn';
  if(gameMode==='online')pushOnline();
  render();
}

// Online
function getState(){return{hands,turn,safeOrder,gameOver,phase,victim,seq:++onlineSeq};}
async function pushOnline(){
  try{await NETPLAY.pushState(roomId,getState());}catch(e){console.error(e);}
  // After push, advance turn locally only if host
  if(!gameOver&&onlineRole==='host'){
    render();checkSafe();if(gameOver)return;
    turn=nextActive(turn);render();setTimeout(startTurn,650);
  }
}
function onPoll(room){
  if(!room.state||room.state.seq<=onlineSeq)return;
  onlineSeq=room.state.seq;
  applyState(room.state);
  if(room.state.gameOver){endGame();return;}
  render();
  // If it's now my turn, enable interaction
  if(turn===myIdx&&!gameOver){startTurn();}
}

function initUI(){
  const area=document.querySelector('.controls');
  const np_div=document.createElement('div');
  np_div.style.cssText='display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:10px;';
  np_div.appendChild(NETPLAY.playerCountPicker({min:2,max:6,current:np,lang,onChange:n=>{
    if(gameMode==='online')return;
    np=n;localStorage.setItem('oldmaid_np',n);setup();
  }}));
  const modeRow=document.createElement('div');modeRow.style.cssText='display:flex;gap:8px;';
  const l2btn=document.createElement('button');
  l2btn.style.cssText='background:#7c3aed;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:.82rem;cursor:pointer;font-weight:bold;';
  const onbtn=document.createElement('button');
  onbtn.style.cssText='background:#10b981;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:.82rem;cursor:pointer;font-weight:bold;';
  function updateBtns(){
    l2btn.textContent=t('local2p');onbtn.textContent=t('online');
    l2btn.style.opacity=gameMode==='local2p'?'1':'.55';
    onbtn.style.opacity=gameMode==='online'?'1':'.55';
  }
  l2btn.onclick=()=>{
    if(gameMode==='online'){NETPLAY.stopPoll();if(sbar){sbar.remove();sbar=null;}onlineRole=null;roomId=null;}
    gameMode=gameMode==='local2p'?'solo':'local2p';myIdx=0;setup();updateBtns();
  };
  onbtn.onclick=()=>{
    NETPLAY.showLobby({
      game:'oldmaid',lang,initState:()=>computeInitState(),
      onHost:(id,room)=>{roomId=id;onlineRole='host';myIdx=0;gameMode='online';applyState(room.state);onlineSeq=room.state.seq;if(sbar)sbar.remove();sbar=NETPLAY.statusBar(lang);sbar.online('host');$('winmsg').textContent='';$('ranklist').textContent='';render();if(checkSafe())return;setTimeout(startTurn,500);NETPLAY.startPoll(roomId,1500,onPoll);updateBtns();},
      onJoin:(room,tok)=>{roomId=room.id;onlineRole='guest';myIdx=1;gameMode='online';applyState(room.state);onlineSeq=room.state.seq;if(sbar)sbar.remove();sbar=NETPLAY.statusBar(lang);sbar.online('guest');$('winmsg').textContent='';$('ranklist').textContent='';render();NETPLAY.startPoll(roomId,1500,onPoll);updateBtns();},
      onCancel:()=>{}
    });
  };
  modeRow.appendChild(l2btn);modeRow.appendChild(onbtn);
  np_div.appendChild(modeRow);
  area.parentNode.insertBefore(np_div,area.nextSibling);
  updateBtns();
}

$('newbtn').onclick=()=>{
  if(gameMode==='online'){NETPLAY.stopPoll();if(sbar){sbar.remove();sbar=null;}gameMode='solo';onlineRole=null;roomId=null;}
  SND.startBGM&&SND.startBGM('game');setup();
};
$('modebtn').onclick=()=>{jokerMode=!jokerMode;localStorage.setItem('oldmaid_joker',jokerMode?'1':'0');SND.sfx.click&&SND.sfx.click();setup();};

setup();initUI();
// Difficulty row
(()=>{
  const diffRow=document.createElement('div');
  diffRow.style.cssText='margin-top:6px;display:flex;gap:6px;align-items:center;justify-content:center;';
  const diffLbl=document.createElement('span');diffLbl.style.cssText='font-size:.78rem;color:#aaa;margin-right:4px;';diffLbl.textContent=t('diff')+':';
  diffRow.appendChild(diffLbl);
  const DIFFS=[['easy','easy'],['medium','normal'],['hard','hard']]; // [value, label key]
  DIFFS.forEach(([d,lab])=>{
    const b=document.createElement('button');
    b.style.cssText=`font-size:.75rem;font-weight:bold;border:none;border-radius:6px;padding:4px 10px;cursor:pointer;color:#fff;background:${d===difficulty?'#7c3aed':'#374151'};`;
    b.textContent=t(lab);
    b.onclick=()=>{
      difficulty=d;localStorage.setItem('oldmaid_diff',d);
      diffRow.querySelectorAll('button').forEach((x,i)=>{x.style.background=DIFFS[i][0]===difficulty?'#7c3aed':'#374151';});
    };
    diffRow.appendChild(b);
  });
  document.querySelector('.controls').insertAdjacentElement('afterend',diffRow);
})();
if(typeof SND!=='undefined'){SND.createBtn(document.body);SND.startBGM('game');}
</script>
</body>
</html>
