<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>フレンド | ARCADE</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#0d0d1a;min-height:100vh;font-family:'Courier New',monospace;color:#eee;display:flex;flex-direction:column;align-items:center;padding:60px 20px 40px;}
    h1{font-size:1.4rem;letter-spacing:8px;color:#00d4aa;margin-bottom:28px;text-shadow:0 0 16px rgba(0,212,170,0.4);}
    #lang-btn{position:fixed;top:14px;left:14px;background:#1e1e2e;border:1px solid #444;border-radius:6px;color:#888;font-family:'Courier New',monospace;font-size:0.72rem;padding:5px 10px;cursor:pointer;z-index:10;}
    #back-btn{position:fixed;top:14px;right:14px;background:#1e1e2e;border:1px solid #444;border-radius:6px;color:#888;font-family:'Courier New',monospace;font-size:0.72rem;padding:5px 10px;cursor:pointer;z-index:10;text-decoration:none;}
    #no-login-screen{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:16px;color:#555;}
    #no-login-screen a{padding:10px 24px;background:linear-gradient(135deg,#00d4aa,#0088cc);border-radius:8px;color:#000;font-family:'Courier New',monospace;font-size:0.85rem;font-weight:bold;text-decoration:none;letter-spacing:2px;}
    #main-app{display:none;flex-direction:column;align-items:center;width:100%;}
    .tabs{display:flex;gap:0;margin-bottom:24px;border-bottom:1px solid #1a1a2a;width:100%;max-width:560px;}
    .tab{padding:10px 20px;font-size:0.68rem;letter-spacing:3px;color:#555;cursor:pointer;border-bottom:2px solid transparent;transition:all 0.15s;user-select:none;}
    .tab.active{color:#00d4aa;border-bottom-color:#00d4aa;}
    .tab:hover:not(.active){color:#888;}
    .badge{display:inline-block;background:#00d4aa;color:#000;border-radius:10px;font-size:0.58rem;padding:1px 6px;margin-left:5px;font-weight:bold;vertical-align:middle;}
    .panel{width:100%;max-width:560px;display:none;}
    .panel.active{display:block;}
    .search-row{display:flex;gap:8px;margin-bottom:14px;}
    .search-row input{flex:1;background:#13131f;border:1px solid #222;border-radius:6px;padding:10px 12px;color:#eee;font-family:'Courier New',monospace;font-size:0.82rem;outline:none;}
    .search-row input:focus{border-color:#00d4aa;}
    .search-row button{padding:0 18px;background:linear-gradient(135deg,#00d4aa,#0088cc);border:none;border-radius:6px;color:#000;font-family:'Courier New',monospace;font-size:0.8rem;font-weight:bold;cursor:pointer;letter-spacing:2px;}
    .search-row button:hover{opacity:0.85;}
    .user-card{background:#13131f;border:1px solid #1e1e2e;border-radius:10px;padding:14px 18px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
    .user-info{display:flex;flex-direction:column;gap:3px;min-width:0;}
    .u-name{font-size:0.85rem;color:#eee;}
    .u-full{font-size:0.68rem;color:#555;}
    .btn-group{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
    .btn-sm{padding:6px 14px;border-radius:6px;font-family:'Courier New',monospace;font-size:0.7rem;letter-spacing:1px;cursor:pointer;transition:all 0.15s;border:1px solid #333;background:transparent;color:#888;}
    .btn-sm:hover{border-color:#555;color:#eee;}
    .btn-add   {background:linear-gradient(135deg,#00d4aa,#0088cc);border:none;color:#000;font-weight:bold;}
    .btn-accept{background:#00aa44;border:none;color:#fff;font-weight:bold;}
    .btn-decline{border-color:#ff4444;color:#ff6666;}
    .btn-decline:hover{background:#cc0000;border-color:#cc0000;color:#fff;}
    .btn-remove{border-color:#555;color:#555;}
    .btn-remove:hover{border-color:#ff6666;color:#ff6666;}
    .btn-chat  {background:linear-gradient(135deg,#5566ff,#0088cc);border:none;color:#fff;font-weight:bold;}
    .pending-lbl{font-size:0.6rem;color:#998866;background:#2a2510;border:1px solid #443a10;border-radius:4px;padding:3px 8px;}
    .empty{color:#333;font-size:0.78rem;text-align:center;padding:36px;letter-spacing:2px;}
    .flash{font-size:0.72rem;text-align:center;padding:8px;min-height:22px;}
    .flash.ok {color:#00d4aa;}
    .flash.err{color:#ff5566;}
    .flash.inf{color:#888;}
  </style>
</head>
<body>

<button id="lang-btn">EN</button>
<a href="ARCADES/ARCADE/arcade.html" id="back-btn">← HOME</a>

<!-- ログインしていない場合 -->
<div id="no-login-screen">
  <div id="nl-msg" style="letter-spacing:3px;font-size:0.8rem;"></div>
  <a href="login.html?next=friends.html" id="nl-btn"></a>
</div>

<!-- メインUI -->
<div id="main-app">
  <h1>FRIENDS</h1>

  <div class="tabs" id="tabs-row">
    <div class="tab active" id="tab-friends" data-panel="pnl-friends"></div>
    <div class="tab"        id="tab-requests" data-panel="pnl-requests">
      <span id="tab-req-txt"></span><span id="req-badge" class="badge" style="display:none"></span>
    </div>
    <div class="tab"        id="tab-search"   data-panel="pnl-search"></div>
  </div>

  <!-- フレンド一覧 -->
  <div class="panel active" id="pnl-friends">
    <div class="flash" id="flash-friends"></div>
    <div id="list-friends"></div>
  </div>

  <!-- 申請一覧 -->
  <div class="panel" id="pnl-requests">
    <div class="flash" id="flash-requests"></div>
    <div id="list-requests"></div>
  </div>

  <!-- ユーザー検索 -->
  <div class="panel" id="pnl-search">
    <div class="search-row">
      <input type="text" id="search-q" maxlength="30">
      <button id="search-go"></button>
    </div>
    <div class="flash" id="flash-search"></div>
    <div id="list-search"></div>
  </div>
</div>

<script>
'use strict';

/* ── 定数 ─────────────────────────────────── */
const SB_URL = 'https://qveznkwqfjjtjxqxdyls.supabase.co';
const SB_KEY = 'sb_publishable_Eu8ppaJ-BxQvwGyj1UlNjw_vyywq8ge';

/* ── i18n ────────────────────────────────── */
const TX = {
  ja:{
    tabF:'フレンド', tabR:'申請', tabS:'ユーザー検索',
    phSearch:'ユーザIDで検索', btnSearch:'検索',
    noLogin:'ログインが必要です', noLoginBtn:'ログイン', back:'← HOME',
    emptyF:'フレンドはいません', emptyR:'フレンド申請はありません', emptyS:'見つかりません',
    btnAdd:'申請する', btnAccept:'承認', btnDecline:'拒否',
    btnRemove:'削除', btnChat:'チャット', pending:'申請中',
    searching:'検索中…',
    sendOk:'フレンド申請を送りました',
    sendErr:'送信に失敗しました。しばらく待ってから再試行してください',
    alreadySent:'既に申請済みです',
    acceptOk:'承認しました', declineOk:'拒否しました', removeOk:'削除しました',
    needQuery:'ユーザIDを入力してください'
  },
  en:{
    tabF:'Friends', tabR:'Requests', tabS:'Search',
    phSearch:'Search by user ID', btnSearch:'SEARCH',
    noLogin:'Login required', noLoginBtn:'LOGIN', back:'← HOME',
    emptyF:'No friends yet', emptyR:'No pending requests', emptyS:'No users found',
    btnAdd:'ADD', btnAccept:'ACCEPT', btnDecline:'DECLINE',
    btnRemove:'REMOVE', btnChat:'CHAT', pending:'PENDING',
    searching:'Searching…',
    sendOk:'Friend request sent',
    sendErr:'Failed to send. Please try again',
    alreadySent:'Already sent',
    acceptOk:'Accepted', declineOk:'Declined', removeOk:'Removed',
    needQuery:'Enter a user ID'
  }
};
let lang = localStorage.getItem('lang') || 'ja';
const T = k => TX[lang][k] || TX.ja[k] || k;

function applyLang() {
  document.getElementById('lang-btn').textContent   = lang === 'ja' ? 'EN' : 'JA';
  document.getElementById('back-btn').textContent   = T('back');
  document.getElementById('tab-friends').textContent = T('tabF');
  document.getElementById('tab-req-txt').textContent = T('tabR');
  document.getElementById('tab-search').textContent  = T('tabS');
  document.getElementById('search-q').placeholder   = T('phSearch');
  document.getElementById('search-go').textContent  = T('btnSearch');
  const nlm = document.getElementById('nl-msg'); if (nlm) nlm.textContent = T('noLogin');
  const nlb = document.getElementById('nl-btn'); if (nlb) nlb.textContent = T('noLoginBtn');
  document.documentElement.lang = lang;
}

document.getElementById('lang-btn').addEventListener('click', () => {
  lang = lang === 'ja' ? 'en' : 'ja';
  localStorage.setItem('lang', lang);
  applyLang();
  if (typeof renderAll === 'function') renderAll();
});
applyLang();

/* ── Supabase helpers ────────────────────── */
async function sbGet(path) {
  try {
    const r = await fetch(SB_URL + path, {
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY }
    });
    const txt = await r.text();
    const data = txt ? JSON.parse(txt) : null;
    if (!r.ok) { console.warn('sbGet', r.status, data); return null; }
    return Array.isArray(data) ? data : [];
  } catch (e) { console.error('sbGet', e); return null; }
}

async function sbPost(path, body) {
  try {
    const r = await fetch(SB_URL + path, {
      method: 'POST',
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY,
                 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify(body)
    });
    return r.ok;
  } catch (e) { console.error('sbPost', e); return false; }
}

async function sbPatch(path, body) {
  try {
    const r = await fetch(SB_URL + path, {
      method: 'PATCH',
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY,
                 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify(body)
    });
    return r.ok;
  } catch (e) { console.error('sbPatch', e); return false; }
}

async function sbDelete(path) {
  try {
    const r = await fetch(SB_URL + path, {
      method: 'DELETE',
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY }
    });
    return r.ok;
  } catch (e) { console.error('sbDelete', e); return false; }
}

/* ── ユーティリティ ──────────────────────── */
const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function flash(elId, text, cls) {
  const el = document.getElementById(elId);
  if (!el) return;
  el.textContent = text;
  el.className = 'flash ' + (cls || '');
  clearTimeout(el._t);
  el._t = setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 3000);
}

/* ── ログイン確認 ────────────────────────── */
let me = null;
try { me = JSON.parse(localStorage.getItem('arcade_user') || 'null'); } catch(e) { me = null; }

if (!me) {
  document.getElementById('no-login-screen').style.display = 'flex';
} else {
  document.getElementById('main-app').style.display = 'flex';
  init();
}

/* ── メイン処理 ──────────────────────────── */
function init() {
  let friends = [], pendingIn = [], pendingOut = [];

  /* タブ切り替え */
  document.getElementById('tabs-row').addEventListener('click', e => {
    const tab = e.target.closest('.tab');
    if (!tab) return;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    const pnl = document.getElementById(tab.dataset.panel);
    if (pnl) pnl.classList.add('active');
  });

  /* ── データ読み込み ─────────────────────── */
  async function loadAll() {
    const [sent, recv] = await Promise.all([
      sbGet('/rest/v1/friends?requester_id=eq.' + me.id + '&select=id,requester_id,addressee_id,status'),
      sbGet('/rest/v1/friends?addressee_id=eq.'  + me.id + '&select=id,requester_id,addressee_id,status')
    ]);

    if (sent === null && recv === null) {
      document.getElementById('list-friends').innerHTML =
        '<div class="empty" style="color:#ff5566">friendsテーブルが見つかりません。<br>Supabase SQL Editorでmigrate SQLを実行してください。</div>';
      return;
    }

    const rows = [...(sent || []), ...(recv || [])];
    friends = []; pendingIn = []; pendingOut = [];
    const seen = new Set();
    const needIds = new Set();

    for (const r of rows) {
      if (seen.has(r.id)) continue;
      seen.add(r.id);
      if (r.status === 'accepted') {
        const otherId = r.requester_id === me.id ? r.addressee_id : r.requester_id;
        friends.push({ id: r.id, otherId });
        needIds.add(otherId);
      } else if (r.status === 'pending') {
        if (r.requester_id === me.id) { pendingOut.push(r); needIds.add(r.addressee_id); }
        else                           { pendingIn.push(r);  needIds.add(r.requester_id); }
      }
    }

    /* ユーザー情報を取得 */
    const umap = {};
    if (needIds.size > 0) {
      const ids = [...needIds].join(',');
      const users = await sbGet('/rest/v1/users?id=in.(' + ids + ')&select=id,username,full_name') || [];
      users.forEach(u => { umap[u.id] = u; });
    }

    friends    = friends.map(f    => ({ ...f, user: umap[f.otherId]      || { username:'?', full_name:'' } }));
    pendingIn  = pendingIn.map(f  => ({ ...f, user: umap[f.requester_id] || { username:'?', full_name:'' } }));
    pendingOut = pendingOut.map(f => ({ ...f, user: umap[f.addressee_id] || { username:'?', full_name:'' } }));

    const badge = document.getElementById('req-badge');
    badge.textContent = pendingIn.length;
    badge.style.display = pendingIn.length > 0 ? '' : 'none';

    renderAll();
  }

  /* ── 描画 ───────────────────────────────── */
  function renderAll() { renderFriends(); renderRequests(); }
  window.renderAll = renderAll;  // lang切替から呼べるよう公開

  function renderFriends() {
    const el = document.getElementById('list-friends');
    if (!friends.length) { el.innerHTML = '<div class="empty">' + T('emptyF') + '</div>'; return; }
    el.innerHTML = friends.map(f =>
      '<div class="user-card">' +
        '<div class="user-info">' +
          '<div class="u-name">@' + esc(f.user.username) + '</div>' +
          '<div class="u-full">' + esc(f.user.full_name) + '</div>' +
        '</div>' +
        '<div class="btn-group">' +
          '<button class="btn-sm btn-chat"   onclick="doChat(\''   + esc(f.user.username) + '\')">' + T('btnChat')   + '</button>' +
          '<button class="btn-sm btn-remove" onclick="doRemove(\'' + f.id                 + '\')">' + T('btnRemove') + '</button>' +
        '</div>' +
      '</div>'
    ).join('');
  }

  function renderRequests() {
    const el = document.getElementById('list-requests');
    const rows = [];

    pendingIn.forEach(f => {
      rows.push(
        '<div class="user-card">' +
          '<div class="user-info">' +
            '<div class="u-name">@' + esc(f.user.username) + '</div>' +
            '<div class="u-full">' + esc(f.user.full_name) + '</div>' +
          '</div>' +
          '<div class="btn-group">' +
            '<button class="btn-sm btn-accept"  onclick="doAccept(\''  + f.id + '\')">' + T('btnAccept')  + '</button>' +
            '<button class="btn-sm btn-decline" onclick="doDecline(\'' + f.id + '\')">' + T('btnDecline') + '</button>' +
          '</div>' +
        '</div>'
      );
    });

    pendingOut.forEach(f => {
      rows.push(
        '<div class="user-card">' +
          '<div class="user-info">' +
            '<div class="u-name">@' + esc(f.user.username) + '</div>' +
            '<div class="u-full">' + esc(f.user.full_name) + '</div>' +
          '</div>' +
          '<div class="btn-group"><span class="pending-lbl">' + T('pending') + '</span></div>' +
        '</div>'
      );
    });

    el.innerHTML = rows.length ? rows.join('') : '<div class="empty">' + T('emptyR') + '</div>';
  }

  /* ── アクション ─────────────────────────── */
  window.doAccept = async function(id) {
    if (await sbPatch('/rest/v1/friends?id=eq.' + id, { status: 'accepted' })) {
      flash('flash-requests', T('acceptOk'), 'ok'); loadAll();
    }
  };
  window.doDecline = async function(id) {
    if (await sbDelete('/rest/v1/friends?id=eq.' + id)) {
      flash('flash-requests', T('declineOk'), 'ok'); loadAll();
    }
  };
  window.doRemove = async function(id) {
    if (await sbDelete('/rest/v1/friends?id=eq.' + id)) {
      flash('flash-friends', T('removeOk'), 'ok'); loadAll();
    }
  };
  window.doChat = function(username) {
    location.href = 'chat.html?user=' + encodeURIComponent(username);
  };

  /* ── ユーザー検索 ───────────────────────── */
  document.getElementById('search-go').addEventListener('click', doSearch);
  document.getElementById('search-q').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

  async function doSearch() {
    const q = document.getElementById('search-q').value.trim();
    if (!q) { flash('flash-search', T('needQuery'), 'err'); return; }
    flash('flash-search', T('searching'), 'inf');
    document.getElementById('list-search').innerHTML = '';

    const rows = await sbGet('/rest/v1/users?username=ilike.*' + encodeURIComponent(q) + '*&select=id,username,full_name&limit=20') || [];
    const list = rows.filter(u => u.id !== me.id);

    document.getElementById('flash-search').textContent = '';
    if (!list.length) { document.getElementById('list-search').innerHTML = '<div class="empty">' + T('emptyS') + '</div>'; return; }

    const fIds  = new Set(friends.map(f => f.otherId));
    const outIds= new Set(pendingOut.map(f => f.addressee_id));
    const inIds = new Set(pendingIn.map(f => f.requester_id));

    document.getElementById('list-search').innerHTML = list.map(u => {
      let btn;
      if      (fIds.has(u.id))   btn = '<button class="btn-sm btn-chat"    onclick="doChat(\''       + esc(u.username) + '\')">' + T('btnChat')   + '</button>';
      else if (outIds.has(u.id)) btn = '<span class="pending-lbl">' + T('pending') + '</span>';
      else if (inIds.has(u.id))  btn = '<button class="btn-sm btn-accept"   onclick="doAcceptUser(\'' + u.id            + '\')">' + T('btnAccept') + '</button>';
      else                        btn = '<button class="btn-sm btn-add"      onclick="doSend(\''       + u.id + '\',\'' + esc(u.username) + '\')">' + T('btnAdd')    + '</button>';
      return '<div class="user-card"><div class="user-info"><div class="u-name">@' + esc(u.username) + '</div><div class="u-full">' + esc(u.full_name) + '</div></div><div class="btn-group">' + btn + '</div></div>';
    }).join('');
  }

  /* ── 申請送信 ───────────────────────────── */
  window.doSend = async function(userId, username) {
    /* 既存チェック（2方向） */
    const [a, b] = await Promise.all([
      sbGet('/rest/v1/friends?requester_id=eq.' + me.id   + '&addressee_id=eq.' + userId + '&select=id'),
      sbGet('/rest/v1/friends?requester_id=eq.' + userId  + '&addressee_id=eq.' + me.id  + '&select=id')
    ]);
    if ((a && a.length) || (b && b.length)) { flash('flash-search', T('alreadySent'), 'inf'); return; }

    const ok = await sbPost('/rest/v1/friends', { requester_id: me.id, addressee_id: userId, status: 'pending' });
    if (ok) { flash('flash-search', T('sendOk'), 'ok'); await loadAll(); doSearch(); }
    else    { flash('flash-search', T('sendErr'), 'err'); }
  };

  window.doAcceptUser = async function(userId) {
    const row = pendingIn.find(f => f.requester_id === userId);
    if (row) { await window.doAccept(row.id); doSearch(); }
  };

  /* ── 初期ロード & ポーリング ─────────────── */
  loadAll();
  setInterval(loadAll, 10000);
}
</script>
</body>
</html>
