<script>

      oppTurnB:'⚫ 相手の番',oppTurnW:'⚪ 相手の番',resignWin:'投了 — {w}の勝ち！',

  en:{yourTurn:'⚫ Your turn (Black)',cpuThink:'CPU thinking...',win:'You win! 🎉',cpuWin:'CPU wins',opWin:'Opponent wins',draw:'Draw (board full)',resign:'Resign',resignMsg:'Resign?',weak:'Weak',normal:'Normal',strong:'Strong',
      blackLabel:'B',whiteLabel:'W',onlineMode:'Online 2P',helpBtn:'? Rules',
      rateGame:'Rate this game',roomCode:'Room Code',shareCode:'Share this code with opponent',
      codePlaceholder:'Enter code',joinBtn:'Join',submitBtn:'Submit',commentPlaceholder:'Comment (optional)...',
      noRatings:'No ratings yet',enter6:'Enter a 6-character code',
      roomNotFound:'Room not found',roomStarted:'This room has already started',
      createRoom:'Create room (you play Black)',waiting:'Waiting for opponent...',
      connected:'Opponent joined! You play Black',joined:'Connected! You play White',
      createLabel:'Create or join a room',createFail:'Create failed: ',joinFail:'Join failed: ',
      blackTurn:'⚫ Black\'s turn',whiteTurn:'⚪ White\'s turn',yourTurnB:'⚫ Your turn',yourTurnW:'⚪ Your turn',
      oppTurnB:'⚫ Opponent\'s turn',oppTurnW:'⚪ Opponent\'s turn',resignWin:'Resigned — {w} wins!',
      gameEnd:'Game over — {msg}',
      helpContent:'⚫ Black goes first<br>● First to line up 5 in a row wins<br>● Place on any empty intersection<br>● Board full = draw<br>● No forbidden moves (free style)'}
};
let lang = localStorage.getItem('lang') || 'ja';
function T(k,vars={}){let s=LANG[lang][k]||LANG.ja[k]||k;Object.entries(vars).forEach(([v,val])=>s=s.replace('{'+v+'}',val));return s;}
function applyLang(){

  document.documentElement.lang=lang;
  document.getElementById('lbl-online').textContent=T('onlineMode');
  document.getElementById('btn-create').textContent=T('createRoom');
  document.getElementById('btn-resign').textContent=T('resign');
  document.getElementById('lbl-black').textContent=T('blackLabel');
  document.getElementById('lbl-white').textContent=T('whiteLabel');

  document.querySelectorAll('.dbtn').forEach(b=>b.textContent=T(b.dataset.d));
}
document.getElementById('lang-btn').addEventListener('click',()=>{
  lang=lang==='ja'?'en':'ja';
  localStorage.setItem('lang',lang);
  applyLang();
});
let difficulty='weak';
document.querySelectorAll('.dbtn').forEach(b=>b.addEventListener('click',()=>{difficulty=b.dataset.d;document.querySelectorAll('.dbtn').forEach(x=>x.classList.toggle('active',x===b));if(!gameOver)startGame();}));
const SUPABASE_URL = 'https://qveznkwqfjjtjxqxdyls.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Eu8ppaJ-BxQvwGyj1UlNjw_vyywq8ge';
const GAME = 'gomoku';
const GS = 15;
const DIRS4 = [[0,1],[1,0],[1,1],[1,-1]];

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let CELL, SZ;

let board, turn, gameOver, lastMove, moveCount, winLine;
let mode = 'cpu';
let myColor = 1, cpuColor = 2, cpuBusy = false;
let roomId = null, myRole = null, pollTid = null, lastMoves = -1;

function initBoard() { return Array.from({length:GS},()=>Array(GS).fill(0)); }

function checkWin(b, r, c) {
  const p = b[r][c]; if (!p) return null;
  for (const [dr,dc] of DIRS4) {
    let line = [{r,c}];
    for (const d of [-1,1]) {
      let nr=r+dr*d, nc=c+dc*d;
      while (nr>=0&&nr<GS&&nc>=0&&nc<GS&&b[nr][nc]===p) { line.push({r:nr,c:nc}); nr+=dr*d; nc+=dc*d; }
    }
    if (line.length>=5) return line;
  }
  return null;
}

function isBoardFull(b) { return b.every(row=>row.every(c=>c!==0)); }

function scoreSeq(count, open) {
  if (count>=5) return 1000000;
  if (count===4 && open===2) return 100000;
  if (count===4 && open===1) return 10000;
  if (count===3 && open===2) return 5000;
  if (count===3 && open===1) return 500;
  if (count===2 && open===2) return 100;
  if (count===2 && open===1) return 10;
  return count;
}

function evalCell(b, r, c, p) {
  let score = 0;
  for (const [dr,dc] of DIRS4) {
    let cnt=1, open=0;
    for (const d of [-1,1]) {
      let nr=r+dr*d, nc=c+dc*d;
      while (nr>=0&&nr<GS&&nc>=0&&nc<GS&&b[nr][nc]===p) { cnt++; nr+=dr*d; nc+=dc*d; }
      if (nr>=0&&nr<GS&&nc>=0&&nc<GS&&b[nr][nc]===0) open++;
    }
    score += scoreSeq(cnt, open);
  }
  return score;
}

function cpuPick(b, p) {
  const opp = 3-p;
  if(difficulty==='weak'){
    const cands=[];
    for(let r=0;r<GS;r++) for(let c=0;c<GS;c++) if(!b[r][c]) cands.push({r,c});
    if(!cands.length) return null;
    return cands[Math.floor(Math.random()*cands.length)];
  }
  const candidates = new Set();
  let hasStones = false;
  for (let r=0;r<GS;r++) for (let c=0;c<GS;c++) {
    if (b[r][c]!==0) {
      hasStones=true;
      for (let dr=-2;dr<=2;dr++) for (let dc=-2;dc<=2;dc++) {
        const nr=r+dr,nc=c+dc;
        if (nr>=0&&nr<GS&&nc>=0&&nc<GS&&b[nr][nc]===0) candidates.add(nr*GS+nc);
      }
    }
  }
  if (!hasStones) return {r:7,c:7};

  // Immediate win check
  for (const key of candidates) {
    const r=Math.floor(key/GS),c=key%GS;
    if (b[r][c]!==0) continue;
    b[r][c]=p; const w=checkWin(b,r,c); b[r][c]=0;
    if (w) return {r,c};
  }
  // Block opponent win
  for (const key of candidates) {
    const r=Math.floor(key/GS),c=key%GS;
    if (b[r][c]!==0) continue;
    b[r][c]=opp; const w=checkWin(b,r,c); b[r][c]=0;
    if (w) return {r,c};
  }
  // Score-based
  let best=null, bestScore=-Infinity;
  for (const key of candidates) {
    const r=Math.floor(key/GS),c=key%GS;
    if (b[r][c]!==0) continue;
    b[r][c]=p; const atk=evalCell(b,r,c,p); b[r][c]=0;
    b[r][c]=opp; const def=evalCell(b,r,c,opp); b[r][c]=0;
    const center=(7-Math.abs(r-7))+(7-Math.abs(c-7));
    const depthBonus=difficulty==='strong'?atk*0.5:0;
  const score=atk*1.3+def+center*0.5+depthBonus+Math.random()*0.5;
    if (score>bestScore) { bestScore=score; best={r,c}; }
  }
  return best||{r:7,c:7};
}

function resize() {
  CELL=Math.floor(Math.min(window.innerWidth-20,510)/GS);
  SZ=CELL*GS; canvas.width=SZ; canvas.height=SZ;
}

function draw() {
  ctx.fillStyle='#2a1a08'; ctx.fillRect(0,0,SZ,SZ);
  ctx.strokeStyle='#4a3018'; ctx.lineWidth=1;
  for (let i=0;i<GS;i++) {
    const x=CELL/2+i*CELL, y=CELL/2+i*CELL;
    ctx.beginPath(); ctx.moveTo(x,CELL/2); ctx.lineTo(x,SZ-CELL/2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(CELL/2,y); ctx.lineTo(SZ-CELL/2,y); ctx.stroke();
  }
  [[3,3],[3,7],[3,11],[7,3],[7,7],[7,11],[11,3],[11,7],[11,11]].forEach(([r,c])=>{
    ctx.beginPath(); ctx.arc(CELL/2+c*CELL,CELL/2+r*CELL,3.5,0,Math.PI*2);
    ctx.fillStyle='#6a4828'; ctx.fill();
  });
  if (lastMove) {
    ctx.fillStyle='rgba(255,220,100,0.2)';
    ctx.fillRect(lastMove.c*CELL,lastMove.r*CELL,CELL,CELL);
  }
  if (winLine&&winLine.length>=2) {
    ctx.save(); ctx.strokeStyle='rgba(255,80,40,0.9)'; ctx.lineWidth=4;
    const s=winLine[0],e=winLine[winLine.length-1];
    ctx.beginPath(); ctx.moveTo(CELL/2+s.c*CELL,CELL/2+s.r*CELL); ctx.lineTo(CELL/2+e.c*CELL,CELL/2+e.r*CELL); ctx.stroke(); ctx.restore();
  }
  for (let r=0;r<GS;r++) for (let c=0;c<GS;c++) {
    if (!board[r][c]) continue;
    const x=CELL/2+c*CELL, y=CELL/2+r*CELL, rad=CELL*0.43, isB=board[r][c]===1;
    const grad=ctx.createRadialGradient(x-rad*0.3,y-rad*0.3,rad*0.05,x,y,rad);
    if (isB) { grad.addColorStop(0,'#555'); grad.addColorStop(1,'#111'); }
    else { grad.addColorStop(0,'#fff'); grad.addColorStop(1,'#ccc'); }
    ctx.save(); ctx.shadowColor=isB?'#ff6644':'#aaaaee'; ctx.shadowBlur=6;
    ctx.beginPath(); ctx.arc(x,y,rad,0,Math.PI*2); ctx.fillStyle=grad; ctx.fill();
    ctx.strokeStyle=isB?'#ff6644':'#8888cc'; ctx.lineWidth=1; ctx.stroke(); ctx.restore();
  }
  let bk=0,wh=0;
  for (let r=0;r<GS;r++) for (let c=0;c<GS;c++) { if(board[r][c]===1)bk++; else if(board[r][c]===2)wh++; }
  document.getElementById('sb').textContent=bk;
  document.getElementById('sw').textContent=wh;
  document.getElementById('move-count').textContent=moveCount>0?`${moveCount}手目`:'';
}

function setStatus(msg) { document.getElementById('status').textContent=msg; }
function updateResignBtn() {
  const canResign=!gameOver&&!cpuBusy&&(mode==='cpu'?turn===myColor:turn===myColor);
  document.getElementById('btn-resign').style.display=canResign?'inline-block':'none';
}

function startGame() {
  board=initBoard(); turn=1; gameOver=false; lastMove=null; moveCount=0; winLine=null;
  cpuBusy=false; myColor=1; cpuColor=2;
  setStatus(T('yourTurn'));
  draw(); updateResignBtn();
}

function doPlace(r, c) {
  if (gameOver||cpuBusy) return;
  if (mode==='cpu'&&turn!==myColor) return;
  if (mode==='online'&&turn!==myColor) return;
  if (board[r][c]!==0) { if(window.SND)SND.sfx.invalid(); return; }
  board[r][c]=turn; lastMove={r,c}; moveCount++;
  if(window.SND) SND.sfx.place();
  draw();
  const wl=checkWin(board,r,c);
  if (wl) { winLine=wl; draw(); endGame(turn); return; }
  if (isBoardFull(board)) { endGame(0); return; }
  if (mode==='online') { const mc=lastMoves+1; pushMove(r,c,turn,board.map(row=>[...row]),mc); }
  turn=3-turn;
  if (mode==='cpu'&&turn===cpuColor) {
    cpuBusy=true; setStatus(T('cpuThink')); draw(); updateResignBtn();
    setTimeout(doCpu,400);
  } else {
    setStatus(turn===1?T('blackTurn'):T('whiteTurn'));
    draw(); updateResignBtn();
  }
}

function doCpu() {
  if (gameOver) { cpuBusy=false; return; }
  const m=cpuPick(board,cpuColor); cpuBusy=false;
  if (!m) { endGame(0); return; }
  board[m.r][m.c]=cpuColor; lastMove=m; moveCount++;
  draw();
  const wl=checkWin(board,m.r,m.c);
  if (wl) { winLine=wl; draw(); endGame(cpuColor); return; }
  if (isBoardFull(board)) { endGame(0); return; }
  turn=myColor; setStatus(T('yourTurn'));
  draw(); updateResignBtn();
}

function endGame(winner) {
  gameOver=true;
  let msg;
  if (winner===0) { msg=T('draw'); if(window.SND) SND.sfx.lose(); }
  else if (mode==='cpu') {
    if(winner===myColor){msg=T('win');if(window.SND)SND.sfx.win();}
    else{msg=T('cpuWin');if(window.SND)SND.sfx.lose();}
  } else {
    if(winner===myColor){msg=T('win');if(window.SND)SND.sfx.win();}
    else{msg=T('opWin');if(window.SND)SND.sfx.lose();}
  }
  setStatus(T('gameEnd',{msg}));
  draw(); updateResignBtn();
  if (pollTid) { clearInterval(pollTid); pollTid=null; }
}

function doResign() {
  if (gameOver) return;
  if (!confirm(T('resignMsg'))) return;
  gameOver=true;
  const winner=myColor===1?T('whiteLabel'):T('blackLabel');
  setStatus(T('resignWin',{w:winner}));
  draw(); updateResignBtn();
  if (mode==='online') {
    const wc=myColor===1?2:1;
    const st={board:board.map(r=>[...r]),turn,moves:lastMoves+1,winner:wc,lastMove};
    sb(`/rest/v1/rooms?id=eq.${roomId}`,{method:'PATCH',body:JSON.stringify({state:st,updated_at:new Date().toISOString()})}).catch(()=>{});
  }
  if (pollTid) { clearInterval(pollTid); pollTid=null; }
}

canvas.addEventListener('click',e=>{
  const rect=canvas.getBoundingClientRect(),sc=SZ/rect.width;
  const px=(e.clientX-rect.left)*sc,py=(e.clientY-rect.top)*sc;
  const c=Math.round((px-CELL/2)/CELL),r=Math.round((py-CELL/2)/CELL);
  if (r>=0&&r<GS&&c>=0&&c<GS) doPlace(r,c);
});
canvas.addEventListener('touchend',e=>{
  e.preventDefault();
  const rect=canvas.getBoundingClientRect(),sc=SZ/rect.width;
  const t=e.changedTouches[0];
  const px=(t.clientX-rect.left)*sc,py=(t.clientY-rect.top)*sc;
  const c=Math.round((px-CELL/2)/CELL),r=Math.round((py-CELL/2)/CELL);
  if (r>=0&&r<GS&&c>=0&&c<GS) doPlace(r,c);
},{passive:false});

document.getElementById('btn-resign').addEventListener('click',doResign);
document.getElementById('btn-cpu').addEventListener('click',()=>{
  mode='cpu';
  document.getElementById('btn-cpu').classList.add('active');
  document.getElementById('btn-online').classList.remove('active');
  document.getElementById('online-panel').classList.remove('open');
  document.getElementById('diff-row').style.display='flex';
  if (pollTid) { clearInterval(pollTid); pollTid=null; }
  startGame();
});
document.getElementById('btn-online').addEventListener('click',()=>{
  mode='online'; gameOver=true;
  document.getElementById('btn-online').classList.add('active');
  document.getElementById('btn-cpu').classList.remove('active');
  document.getElementById('online-panel').classList.add('open');
  document.getElementById('diff-row').style.display='none';
  setStatus(T('createLabel'));
  board=initBoard(); moveCount=0; winLine=null; draw(); updateResignBtn();
});
document.getElementById('btn-create').addEventListener('click',async()=>{
  const code=genCode(),tok=genTok();
  roomId=code; myRole='host'; myColor=1; lastMoves=0;
  const state={board:initBoard(),turn:1,moves:0,winner:0,lastMove:null};
  try {
    await sb('/rest/v1/rooms',{method:'POST',body:JSON.stringify({id:code,game:GAME,state,player1_token:tok,status:'waiting'})});
    document.getElementById('room-code').textContent=code;
    document.getElementById('code-display').style.display='block';
    document.getElementById('online-msg').textContent=T('waiting');
    board=initBoard(); turn=1; gameOver=true; moveCount=0; winLine=null;
    draw(); updateResignBtn(); pollTid=setInterval(pollRoom,2000);
  } catch(e) { document.getElementById('online-msg').textContent=T('createFail')+e.message; }
});
document.getElementById('btn-join').addEventListener('click',async()=>{
  const code=document.getElementById('code-input').value.trim().toUpperCase();
  if (code.length!==6) { alert(T('enter6')); return; }
  const tok=genTok();
  try {
    const rows=await sb(`/rest/v1/rooms?id=eq.${code}&game=eq.${GAME}`);
    if (!rows||!rows.length) { alert(T('roomNotFound')); return; }
    const room=rows[0];
    if (room.status!=='waiting') { alert(T('roomStarted')); return; }
    await sb(`/rest/v1/rooms?id=eq.${code}`,{method:'PATCH',body:JSON.stringify({player2_token:tok,status:'playing'})});
    roomId=code; myRole='guest'; myColor=2; lastMoves=0;
    const st=room.state;
    board=st.board; turn=st.turn; gameOver=false; lastMove=st.lastMove||null; moveCount=st.moves||0; winLine=null;
    document.getElementById('online-msg').textContent=T('joined');
    setStatus(turn===myColor?T('yourTurnW'):T('oppTurnB'));
    draw(); updateResignBtn(); pollTid=setInterval(pollRoom,2000);
  } catch(e) { document.getElementById('online-msg').textContent=T('joinFail')+e.message; }
});

async function pollRoom() {
  if (!roomId) return;
  try {
    const rows=await sb(`/rest/v1/rooms?id=eq.${roomId}`);
    if (!rows||!rows.length) return;
    const room=rows[0],st=room.state;
    if (myRole==='host'&&room.status==='playing'&&gameOver) {
      gameOver=false; board=initBoard(); turn=1; lastMove=null; moveCount=0; winLine=null;
      document.getElementById('online-msg').textContent=T('connected');
      setStatus(T('yourTurn')); draw(); updateResignBtn(); return;
    }
    const rm=st.moves||0;
    if (rm>lastMoves) {
      lastMoves=rm; board=st.board; turn=st.turn; lastMove=st.lastMove||null; moveCount=rm; winLine=null;
      gameOver=st.winner>0;
      if (st.winner>0) {
        if (lastMove) winLine=checkWin(board,lastMove.r,lastMove.c);
        const won=st.winner===myColor;
        const pmsg=st.winner===3?T('draw'):won?T('win'):T('opWin');
        setStatus(T('gameEnd',{msg:pmsg}));
        clearInterval(pollTid); pollTid=null;
      } else {
        setStatus(turn===myColor?(myColor===1?T('yourTurnB'):T('yourTurnW')):(myColor===1?T('oppTurnW'):T('oppTurnB')));
      }
      draw(); updateResignBtn();
    }
  } catch(e) { console.error('poll',e); }
}

async function pushMove(r,c,p,nb,mc) {
  const wl=checkWin(nb,r,c);
  const winner=wl?p:(isBoardFull(nb)?3:0);
  const st={board:nb,turn:winner?p:3-p,moves:mc,lastMove:{r,c},winner};
  try { await sb(`/rest/v1/rooms?id=eq.${roomId}`,{method:'PATCH',body:JSON.stringify({state:st,updated_at:new Date().toISOString()})}); lastMoves=mc; } catch(e){console.error(e);}
}

function genCode(){const ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return Array.from({length:6},()=>ch[Math.floor(Math.random()*ch.length)]).join('');}
function genTok(){return Math.random().toString(36).slice(2)+Date.now().toString(36);}
async function sb(path,opts={}) {
  const r=await fetch(SUPABASE_URL+path,{headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=representation',...opts.headers},...opts});
  if (!r.ok&&r.status!==201) throw new Error(await r.text());
  const t=await r.text(); return t?JSON.parse(t):null;
}
async function loadRatings(){
  try{const rows=await sb(`/rest/v1/ratings?game=eq.${GAME}&order=created_at.desc&limit=20`);renderR(rows||[]);avgBadge(rows||[]);}catch(e){renderR([]);}
}
async function subRating(stars,cmt){
  const me=JSON.parse(localStorage.getItem('arcade_user')||'null');
  const body={game:GAME,stars,comment:cmt||null};
  if(me){body.user_id=me.id;body.username=me.username;}
  await sb('/rest/v1/ratings',{method:'POST',body:JSON.stringify(body)});loadRatings();
}
function renderR(list){
  const el=document.getElementById('rlist');
  if(!list.length){el.innerHTML=`<div style="color:#333;text-align:center;font-size:0.72rem;padding:8px">${T('noRatings')}</div>`;return;}
  el.innerHTML=list.map(r=>`<div class="ri"><span class="rs">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)}</span>${r.username?`<span class="rd" style="color:#00d4aa">@${r.username.replace(/</g,'&lt;')}</span>`:''}<span class="rd">${new Date(r.created_at).toLocaleDateString('ja-JP')}</span>${r.comment?`<p class="rc">${r.comment.replace(/</g,'&lt;')}</p>`:''}</div>`).join('');
}
function avgBadge(list){
  const el=document.getElementById('avg-d');
  if(!list.length){el.textContent='';return;}
  const avg=(list.reduce((s,r)=>s+r.stars,0)/list.length).toFixed(1);
  el.innerHTML=`<span>${'★'.repeat(Math.round(avg))}</span> ${avg} (${list.length}件)`;
}
let sel=0;
document.getElementById('rtoggle').addEventListener('click',()=>document.getElementById('rform').classList.toggle('open'));
document.querySelectorAll('.star').forEach(s=>s.addEventListener('click',()=>{sel=+s.dataset.v;document.querySelectorAll('.star').forEach((st,i)=>st.classList.toggle('active',i<sel));}));
document.getElementById('rsub').addEventListener('click',async()=>{if(!sel){alert(lang==='ja'?'星を選んでください':'Please select a star rating');return;}await subRating(sel,document.getElementById('cmt').value.trim());sel=0;document.querySelectorAll('.star').forEach(s=>s.classList.remove('active'));document.getElementById('cmt').value='';document.getElementById('rform').classList.remove('open');});
document.getElementById('help-toggle').addEventListener('click',()=>document.getElementById('help-panel').classList.toggle('open'));

resize();
window.addEventListener('resize',()=>{resize();draw();});
applyLang();
startGame();
loadRatings();
const hash=location.hash.slice(1);
if(hash.length===6){document.getElementById('code-input').value=hash;document.getElementById('btn-online').click();}
</script>
