<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン | ARCADE</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#0d0d1a;min-height:100vh;font-family:'Courier New',monospace;color:#eee;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;}
    .box{background:#13131f;border:1px solid #222;border-radius:12px;width:100%;max-width:400px;padding:36px 32px;}
    h2{font-size:1.4rem;letter-spacing:6px;color:#00d4aa;text-align:center;margin-bottom:6px;text-shadow:0 0 16px rgba(0,212,170,0.4);}
    .sub{text-align:center;font-size:0.7rem;letter-spacing:3px;color:#555;margin-bottom:32px;}
    label{display:block;font-size:0.68rem;letter-spacing:2px;color:#666;margin-bottom:5px;margin-top:16px;}
    input{width:100%;background:#0d0d1a;border:1px solid #2a2a3a;border-radius:6px;padding:10px 12px;color:#eee;font-family:'Courier New',monospace;font-size:0.85rem;outline:none;transition:border-color 0.2s;}
    input:focus{border-color:#00d4aa;}
    .btn{width:100%;margin-top:28px;padding:13px;background:linear-gradient(135deg,#00d4aa,#0088cc);border:none;border-radius:8px;color:#000;font-family:'Courier New',monospace;font-size:0.9rem;letter-spacing:3px;font-weight:bold;cursor:pointer;transition:opacity 0.15s;}
    .btn:hover{opacity:0.85;}
    .btn:disabled{opacity:0.4;cursor:not-allowed;}
    .msg{margin-top:14px;text-align:center;font-size:0.75rem;min-height:20px;}
    .err{color:#ff5566;}
    .ok{color:#00d4aa;}
    .link{display:block;text-align:center;margin-top:20px;font-size:0.7rem;color:#555;text-decoration:none;letter-spacing:2px;}
    .link:hover{color:#888;}
    #lang-btn{position:fixed;top:14px;left:14px;background:#1e1e2e;border:1px solid #444;border-radius:6px;color:#888;font-family:'Courier New',monospace;font-size:0.72rem;padding:5px 10px;cursor:pointer;z-index:10;}
    #back-btn{position:fixed;top:14px;right:14px;background:#1e1e2e;border:1px solid #444;border-radius:6px;color:#888;font-family:'Courier New',monospace;font-size:0.72rem;padding:5px 10px;cursor:pointer;z-index:10;text-decoration:none;}
  </style>
</head>
<body>
<button id="lang-btn">EN</button>
<a href="index.html" id="back-btn">← HOME</a>

<div class="box">
  <h2 id="title-login">LOGIN</h2>
  <div class="sub" id="sub-login">SIGN IN TO YOUR ACCOUNT</div>

  <label id="lbl-uid">ユーザID</label>
  <input type="text" id="uid" autocomplete="username">

  <label id="lbl-pw">パスワード</label>
  <input type="password" id="pw" autocomplete="current-password">

  <button class="btn" id="login-btn">ログイン</button>
  <div class="msg" id="msg"></div>
  <a href="register.html" class="link" id="link-reg">アカウント登録はこちら</a>
</div>

<script>
const SUPABASE_URL='https://qveznkwqfjjtjxqxdyls.supabase.co';
const SUPABASE_KEY='sb_publishable_Eu8ppaJ-BxQvwGyj1UlNjw_vyywq8ge';

const T_={
  ja:{title:'LOGIN',sub:'アカウントにサインイン',lUid:'ユーザID',lPw:'パスワード',btn:'ログイン',linkReg:'アカウント登録はこちら',back:'← HOME',errEmpty:'ユーザIDとパスワードを入力してください',errInvalid:'ユーザIDまたはパスワードが正しくありません',ok:'ログイン成功！',errServer:'エラーが発生しました'},
  en:{title:'LOGIN',sub:'SIGN IN TO YOUR ACCOUNT',lUid:'User ID',lPw:'Password',btn:'LOGIN',linkReg:'Create an account',back:'← HOME',errEmpty:'Please enter your user ID and password',errInvalid:'Invalid user ID or password',ok:'Logged in!',errServer:'An error occurred'}
};
let lang=localStorage.getItem('lang')||'ja';
function T(k){return T_[lang][k]||T_.ja[k]||k;}
function applyLang(){
  document.getElementById('lang-btn').textContent=lang==='ja'?'EN':'JA';
  document.getElementById('title-login').textContent=T('title');
  document.getElementById('sub-login').textContent=T('sub');
  document.getElementById('lbl-uid').textContent=T('lUid');
  document.getElementById('lbl-pw').textContent=T('lPw');
  document.getElementById('login-btn').textContent=T('btn');
  document.getElementById('link-reg').textContent=T('linkReg');
  document.getElementById('back-btn').textContent=T('back');
  document.documentElement.lang=lang;
}
document.getElementById('lang-btn').addEventListener('click',()=>{lang=lang==='ja'?'en':'ja';localStorage.setItem('lang',lang);applyLang();});
applyLang();

async function hashPw(pw){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pw));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function sb(path,opts={}){
  const r=await fetch(SUPABASE_URL+path,{headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',...(opts.headers||{})},...opts});
  const t=await r.text();return t?JSON.parse(t):null;
}

document.getElementById('login-btn').addEventListener('click',async()=>{
  const uid=document.getElementById('uid').value.trim();
  const pw=document.getElementById('pw').value;
  const msg=document.getElementById('msg');
  msg.className='msg';msg.textContent='';

  if(!uid||!pw){msg.className='msg err';msg.textContent=T('errEmpty');return;}
  document.getElementById('login-btn').disabled=true;
  try{
    const hash=await hashPw(pw);
    const rows=await sb(`/rest/v1/users?username=eq.${encodeURIComponent(uid)}&password_hash=eq.${hash}&select=id,username,full_name`);
    if(!rows||rows.length===0){msg.className='msg err';msg.textContent=T('errInvalid');document.getElementById('login-btn').disabled=false;return;}
    const user=rows[0];
    localStorage.setItem('arcade_user',JSON.stringify({id:user.id,username:user.username,full_name:user.full_name}));
    msg.className='msg ok';msg.textContent=T('ok');
    const next=new URLSearchParams(location.search).get('next')||'index.html';
    setTimeout(()=>location.href=next,900);
  }catch(e){msg.className='msg err';msg.textContent=T('errServer');document.getElementById('login-btn').disabled=false;}
});

document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('login-btn').click();});
</script>
</body>
</html>
