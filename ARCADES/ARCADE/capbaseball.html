<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>CAP BASEBALL</title>
<script src="../../sound.js"></script>
<script src="../../track.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0d0d1a;min-height:100vh;font-family:'Courier New',monospace;color:#eee;display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none;}
#lang-btn{position:fixed;top:12px;left:12px;background:#1e1e2e;border:1px solid #444;border-radius:6px;color:#888;font-family:'Courier New',monospace;font-size:.7rem;padding:5px 10px;cursor:pointer;z-index:200;}
#back-btn{position:fixed;top:12px;right:12px;background:#1e1e2e;border:1px solid #444;border-radius:6px;color:#888;font-family:'Courier New',monospace;font-size:.7rem;padding:5px 10px;cursor:pointer;z-index:200;text-decoration:none;}
#help-btn{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#1e1e2e;border:1px solid #444;border-radius:6px;color:#888;font-family:'Courier New',monospace;font-size:.7rem;padding:5px 10px;cursor:pointer;z-index:200;}

/* ── SETUP ── */
#screen-setup{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:24px;padding:80px 16px 40px;}
.s-title{font-size:1.5rem;letter-spacing:8px;color:#ff6633;text-shadow:0 0 20px rgba(255,102,51,.5);}
.s-section{background:#13131f;border:1px solid #2a2a3a;border-radius:10px;padding:18px 22px;width:100%;max-width:400px;}
.s-lbl{font-size:.55rem;letter-spacing:4px;color:#555;margin-bottom:12px;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}
.sel{background:#1e1e2e;border:1px solid #333;border-radius:7px;color:#666;font-family:'Courier New',monospace;font-size:.8rem;letter-spacing:1px;padding:9px 16px;cursor:pointer;transition:all .12s;}
.sel:hover{border-color:#555;color:#aaa;}
.sel.on{border-color:#ff6633;color:#ff6633;background:rgba(255,102,51,.1);}
#go-btn{background:linear-gradient(135deg,#ff6633,#cc3300);border:none;border-radius:9px;color:#fff;font-family:'Courier New',monospace;font-size:.95rem;letter-spacing:4px;padding:14px 0;cursor:pointer;width:100%;max-width:400px;transition:opacity .12s;}
#go-btn:hover{opacity:.85;}

/* ── GAME ── */
#screen-game{display:none;flex-direction:column;align-items:center;width:100%;max-width:520px;padding:58px 8px 16px;}
#scoreboard{width:100%;background:#13131f;border:1px solid #1e1e2e;border-radius:8px;padding:8px 10px;font-size:.58rem;letter-spacing:1px;margin-bottom:6px;}
.sb-row{display:flex;align-items:center;gap:2px;}
.sb-name{width:42px;color:#555;font-size:.56rem;}
.sb-num{flex:1;text-align:center;padding:3px 1px;border-radius:3px;min-width:18px;}
.sb-hdr{color:#2a2a3a;}
.sb-act{background:rgba(255,102,51,.2);color:#ff9966;}
.sb-you{color:#00d4aa;}
.sb-cpu{color:#ff6633;}
.sb-tot{font-weight:bold;color:#ffd700;width:26px;text-align:center;}

#gc{border-radius:10px;border:1px solid #222;width:100%;max-width:500px;display:block;cursor:crosshair;touch-action:manipulation;}

/* Count HUD */
#count-hud{display:flex;justify-content:space-between;align-items:center;width:100%;padding:5px 6px 3px;gap:4px;}
.c-grp{display:flex;flex-direction:column;align-items:center;gap:2px;}
.c-lbl{font-size:.5rem;letter-spacing:2px;color:#444;}
.c-dots{display:flex;gap:4px;}
.cd{width:10px;height:10px;border-radius:50%;border:1.5px solid #2a2a3a;}
.cd.b{background:#00d4aa;border-color:#00d4aa;box-shadow:0 0 6px #00d4aa;}
.cd.s{background:#ff4444;border-color:#ff4444;box-shadow:0 0 6px #ff4444;}
.cd.o{background:#ff6633;border-color:#ff6633;box-shadow:0 0 6px #ff6633;}

/* Result flash */
#rflash{min-height:26px;text-align:center;font-size:1.05rem;letter-spacing:2px;margin:2px 0;}

/* Pitcher controls */
#pitcher-ui{display:none;flex-direction:column;align-items:center;gap:8px;width:100%;margin-top:4px;}
#pz-wrap{display:flex;flex-direction:column;align-items:center;gap:3px;}
.pz-lbl{font-size:.52rem;letter-spacing:3px;color:#555;}
.pz-outside-row{display:flex;justify-content:center;}
.pz-mid-row{display:flex;align-items:center;gap:3px;}
.pz-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;}
.pz-cell{width:44px;height:40px;background:#1a1a2a;border:1px solid #2a2a3a;border-radius:5px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#444;font-size:.6rem;transition:all .1s;}
.pz-cell:hover{border-color:#666;color:#888;}
.pz-cell.sel{border-color:#ff6633;background:rgba(255,102,51,.15);color:#ff9966;}
.pz-out{background:#13131f;border:1px solid #222;border-radius:5px;color:#383838;font-family:'Courier New',monospace;font-size:.58rem;padding:5px 9px;cursor:pointer;transition:all .1s;letter-spacing:1px;}
.pz-out:hover{border-color:#555;color:#888;}
.pz-out.sel{border-color:#4488ff;background:rgba(68,136,255,.15);color:#4488ff;}
#pt-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.pt{background:#13131f;border:1px solid #222;border-radius:6px;color:#555;font-family:'Courier New',monospace;font-size:.65rem;padding:7px 11px;cursor:pointer;letter-spacing:1px;transition:all .1s;position:relative;}
.pt:hover{border-color:#666;color:#999;}
.pt.sel{font-weight:bold;}
#throw-btn{background:linear-gradient(135deg,#ff6633,#cc3300);border:none;border-radius:8px;color:#fff;font-family:'Courier New',monospace;font-size:.88rem;letter-spacing:3px;padding:11px 36px;cursor:pointer;transition:opacity .1s;}
#throw-btn:hover{opacity:.85;}

/* Batter take button */
#batter-ui{display:none;justify-content:center;gap:10px;width:100%;margin-top:6px;}
#take-btn{background:#1e1e2e;border:1px solid #444;border-radius:8px;color:#888;font-family:'Courier New',monospace;font-size:.85rem;letter-spacing:3px;padding:11px 28px;cursor:pointer;transition:all .1s;}
#take-btn:hover{border-color:#666;color:#bbb;}

/* Overlays */
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:100;}
.ov.hidden{display:none;}
#msg-ov{background:rgba(0,0,0,.82);}
#msg-ov .ov-title{font-size:1.6rem;letter-spacing:4px;color:#ff6633;text-shadow:0 0 18px rgba(255,102,51,.7);text-align:center;}
#msg-ov .ov-sub{font-size:.82rem;color:#888;letter-spacing:2px;text-align:center;white-space:pre-line;line-height:1.7;}
#msg-ov .ov-btn{background:linear-gradient(135deg,#ff6633,#cc3300);border:none;border-radius:8px;color:#fff;font-family:'Courier New',monospace;font-size:.88rem;letter-spacing:3px;padding:12px 34px;cursor:pointer;}
#pass-ov{background:#0d0d1a;}
#pass-ov .pass-t{font-size:1.1rem;letter-spacing:4px;color:#ffd700;}
#pass-ov .pass-s{font-size:.75rem;color:#555;letter-spacing:2px;text-align:center;}
#pass-ov .pass-btn{background:linear-gradient(135deg,#ffd700,#aa8800);border:none;border-radius:8px;color:#000;font-family:'Courier New',monospace;font-size:.88rem;letter-spacing:3px;padding:12px 32px;cursor:pointer;font-weight:bold;}
#help-ov{background:rgba(0,0,0,.92);padding:20px;overflow-y:auto;}
#help-ov .help-box{background:#13131f;border:1px solid #2a2a3a;border-radius:12px;padding:24px 28px;max-width:460px;width:100%;max-height:80vh;overflow-y:auto;}
#help-ov h2{font-size:1rem;letter-spacing:4px;color:#ff6633;margin-bottom:16px;text-align:center;}
#help-ov h3{font-size:.72rem;letter-spacing:3px;color:#ffd700;margin:14px 0 6px;}
#help-ov p,#help-ov li{font-size:.72rem;color:#888;line-height:1.8;margin:2px 0;}
#help-ov ul{padding-left:16px;}
#help-ov .close-btn{margin-top:16px;background:#1e1e2e;border:1px solid #444;border-radius:8px;color:#888;font-family:'Courier New',monospace;font-size:.8rem;padding:10px 28px;cursor:pointer;}
</style>
</head>
<body>
<button id="lang-btn">EN</button>
<a href="arcade.html" id="back-btn">← ARCADE</a>
<button id="help-btn">? HELP</button>

<!-- SETUP -->
<div id="screen-setup">
  <div class="s-title">CAP BASEBALL</div>
  <div class="s-section">
    <div class="s-lbl" id="lbl-mode">MODE</div>
    <div class="btn-row">
      <button class="sel on" data-mode="1p" id="btn-1p">1P vs CPU</button>

  <div class="s-section">

</div>

<!-- GAME -->
<div id="screen-game">
  <div id="scoreboard"></div>
  <canvas id="gc" width="500" height="300"></canvas>
  <div id="count-hud">
    <div class="c-grp"><div class="c-lbl" id="lbl-b">BALL</div><div class="c-dots" id="b-dots"></div></div>
    <div class="c-grp"><div class="c-lbl" id="lbl-inn2">INNING</div><div style="font-size:.95rem;color:#eee" id="val-inn">1▲</div></div>
    <div class="c-grp"><div class="c-lbl" id="lbl-s">STRIKE</div><div class="c-dots" id="s-dots"></div></div>
    <div class="c-grp"><div class="c-lbl" id="lbl-o">OUT</div><div class="c-dots" id="o-dots"></div></div>
  </div>
  <div id="rflash"></div>

  <!-- Pitcher UI -->
  <div id="pitcher-ui">
    <div id="pz-wrap">
      <div class="pz-lbl" id="pz-lbl">コースを選択</div>
      <div class="pz-outside-row"><button class="pz-out" data-zone="9" id="pz9">↑ HIGH</button></div>
      <div class="pz-mid-row">
        <button class="pz-out" data-zone="11" id="pz11">← IN</button>
        <div class="pz-grid" id="pz-grid"></div>
        <button class="pz-out" data-zone="12" id="pz12">OUT →</button>
      </div>
      <div class="pz-outside-row"><button class="pz-out" data-zone="10" id="pz10">↓ LOW</button></div>
    </div>
    <div id="pt-row"></div>
    <button id="throw-btn">投げる！</button>
  </div>

  <!-- Batter take button -->
  <div id="batter-ui">
    <button id="take-btn" id="take-btn">見逃す</button>
  </div>
</div>

<!-- Message overlay -->
<div class="ov hidden" id="msg-ov">
  <div class="ov-title" id="ov-title"></div>
  <div class="ov-sub" id="ov-sub"></div>
  <button class="ov-btn" id="ov-btn"></button>
</div>

<!-- Pass device overlay -->
<div class="ov hidden" id="pass-ov">
  <div class="pass-t" id="pass-t"></div>
  <div class="pass-s" id="pass-s"></div>
  <button class="pass-btn" id="pass-btn"></button>
</div>

<!-- Help overlay -->
<div class="ov hidden" id="help-ov">
  <div class="help-box" id="help-box"></div>
</div>

<script>
// ──────────────────────────────────────────
// i18n
// ──────────────────────────────────────────
const LANG={
  ja:{
    mode:'MODE', inn:'INNINGS', play:'▶ プレイ開始',
    m1p:'1P vs CPU', m2p:'2Pローカル',
    top:'表', bot:'裏', you:'YOU', cpu:'CPU', tot:'計',
    lbl_b:'ボール', lbl_s:'ストライク', lbl_o:'アウト', lbl_inn:'イニング',
    pzLbl:'コースを選択', ptLbl:'球種を選択',
    throw:'投げる！', take:'見逃す',
    swing_hint:'カーソルで狙いを定めてクリック！',
    rHR:'🎉 ホームラン！', r3b:'🔥 3塁打！', r2b:'⚡ 2塁打！', r1b:'✅ ヒット！',
    rFoul:'ファール', rMiss:'空振り！', rStr:'見逃しストライク', rBall:'ボール', rWalk:'四球！', rOut:'アウト！',
    threeOuts:'3アウト！チェンジ',
    intro_top:(i)=>`${i}回表`, intro_bot:(i)=>`${i}回裏`,
    isub_top_1p:'あなたの攻撃', isub_bot_1p:'CPUの攻撃',
    isub_2p:(p)=>`P${p}の攻撃`,
    ok:'OK', ok2:'準備OK！',
    pass_t:'デバイスを渡してください',
    pass_bat:(p)=>`P${p}のバッター番`, pass_pitch:(p)=>`P${p}のピッチャー番`,
    over:'ゲーム終了', again:'もう一度',
    you_win:'あなたの勝ち！', cpu_win:'CPUの勝ち！',
    p1_win:'P1の勝ち！', p2_win:'P2の勝ち！', draw:'引き分け！',
    sc_1p:(a,b)=>`YOU ${a} - CPU ${b}`, sc_2p:(a,b)=>`P1 ${a} - P2 ${b}`,
    help_h:'キャップ野球 遊び方',
    help_pitch_h:'【守備】ピッチャー',
    help_pitch:[
      'コースを選んで配球を決める（内・外・高・低）',
      '球種を選択：直球 / カーブ / スライダー / フォーク / シンカー',
      '変化球は曲がり始めるまでコースが分かりにくい',
      '「投げる！」ボタンで投球',
    ],
    help_bat_h:'【攻撃】バッター',
    help_bat:[
      'マウス（またはタッチ）でカーソルを振るコースに合わせる',
      'クリック（またはタップ）でスイング！タイミングが命',
      'ボール球は「見逃す」でボールカウントを稼ごう',
      'バッターからキャップは白く見える（球種は自分で読め！）',
    ],
    help_tip_h:'【タイミングリング】',
    help_tip:[
      '画面下のリングがだんだん縮む',
      'リングが小さくなった瞬間にスイングすると好タイミング！',
      'コースとタイミングの両方が合うとホームランになる',
    ],
    help_result_h:'【判定】',
    help_result:[
      'ストライクゾーン（白枠内）への投球を見逃すとストライク',
      '3ストライクでアウト、4ボールで四球（ランナー出塁）',
      '3アウトでチェンジ（攻守交代）',
    ],
    close:'閉じる', bases:'塁',
  },
  en:{
    mode:'MODE', inn:'INNINGS', play:'▶ PLAY',
    m1p:'1P vs CPU', m2p:'2P LOCAL',
    top:'▲', bot:'▼', you:'YOU', cpu:'CPU', tot:'R',
    lbl_b:'BALL', lbl_s:'STRIKE', lbl_o:'OUT', lbl_inn:'INNING',
    pzLbl:'Select location', ptLbl:'Select pitch',
    throw:'THROW!', take:'TAKE',
    swing_hint:'Aim cursor & click to swing!',
    rHR:'🎉 HOME RUN!', r3b:'🔥 TRIPLE!', r2b:'⚡ DOUBLE!', r1b:'✅ SINGLE!',
    rFoul:'FOUL', rMiss:'SWING & MISS!', rStr:'CALLED STRIKE', rBall:'BALL', rWalk:'WALK!', rOut:'OUT!',
    threeOuts:'3 Outs! Change sides',
    intro_top:(i)=>`Inning ${i} Top`, intro_bot:(i)=>`Inning ${i} Bottom`,
    isub_top_1p:'Your turn to bat', isub_bot_1p:'CPU batting',
    isub_2p:(p)=>`P${p} batting`,
    ok:'OK', ok2:"I'M READY!",
    pass_t:'Pass the device',
    pass_bat:(p)=>`P${p}: Ready to bat?`, pass_pitch:(p)=>`P${p}: Ready to pitch?`,
    over:'GAME OVER', again:'PLAY AGAIN',
    you_win:'YOU WIN!', cpu_win:'CPU WINS!',
    p1_win:'P1 WINS!', p2_win:'P2 WINS!', draw:'DRAW!',
    sc_1p:(a,b)=>`YOU ${a} - CPU ${b}`, sc_2p:(a,b)=>`P1 ${a} - P2 ${b}`,
    help_h:'How to Play Cap Baseball',
    help_pitch_h:'PITCHING (Defense)',
    help_pitch:[
      'Select a target zone (inside/outside/high/low)',
      'Choose pitch type: Fastball / Curve / Slider / Forkball / Sinker',
      'Breaking balls move late — keep the batter guessing!',
      'Press "THROW!" to deliver the pitch',
    ],
    help_bat_h:'BATTING (Offense)',
    help_bat:[
      'Move your cursor (or touch) to aim at a zone',
      'Click (or tap) to swing — timing is everything!',
      'Press "TAKE" on ball pitches to earn a walk',
      'The cap appears white — read the break yourself!',
    ],
    help_tip_h:'TIMING RING',
    help_tip:[
      'A ring shrinks at the bottom of the screen as the pitch arrives',
      'Swing when the ring is smallest for perfect timing!',
      'Zone + timing both correct = Home Run!',
    ],
    help_result_h:'RULES',
    help_result:[
      'Looking at a strike (in the white box) = called strike',
      '3 strikes = out, 4 balls = walk (runner advances)',
      '3 outs = side change (half-inning over)',
    ],
    close:'CLOSE', bases:'',
  }
};
let lang=localStorage.getItem('lang')||'ja';
function T(k,...a){const v=(LANG[lang]||LANG.ja)[k]||(LANG.ja)[k]||k;return typeof v==='function'?v(...a):v;}
function applyLang(){
  document.getElementById('lang-btn').textContent=lang==='ja'?'EN':'JA';
  document.getElementById('lbl-mode').textContent=T('mode');
  document.getElementById('lbl-inn').textContent=T('inn');
  document.getElementById('go-btn').textContent=T('play');
  document.getElementById('btn-1p').textContent=T('m1p');
  document.getElementById('btn-2p').textContent=T('m2p');
  document.getElementById('lbl-b').textContent=T('lbl_b');
  document.getElementById('lbl-s').textContent=T('lbl_s');
  document.getElementById('lbl-o').textContent=T('lbl_o');
  document.getElementById('lbl-inn2').textContent=T('lbl_inn');
  document.getElementById('pz-lbl').textContent=T('pzLbl');
  document.getElementById('throw-btn').textContent=T('throw');
  document.getElementById('take-btn').textContent=T('take');
  document.documentElement.lang=lang;
}
document.getElementById('lang-btn').addEventListener('click',()=>{
  lang=lang==='ja'?'en':'ja'; localStorage.setItem('lang',lang);
  applyLang(); renderSB(); renderInn(); buildPitcherGrid();
});

// ──────────────────────────────────────────
// Game constants
// ──────────────────────────────────────────
const CW=500, CH=300;
// Zone system: 0-8 = strike zones (3×3), 9=high ball, 10=low ball, 11=inside, 12=outside
const SZX=CW/2, SZY=CH/2-8, ZW=56, ZH=48;
const ZONE_POS=[
  {x:SZX-ZW,y:SZY-ZH},{x:SZX,y:SZY-ZH},{x:SZX+ZW,y:SZY-ZH},
  {x:SZX-ZW,y:SZY   },{x:SZX,y:SZY   },{x:SZX+ZW,y:SZY   },
  {x:SZX-ZW,y:SZY+ZH},{x:SZX,y:SZY+ZH},{x:SZX+ZW,y:SZY+ZH},
];
const BALL_POS={9:{x:SZX,y:SZY-ZH*2.4},10:{x:SZX,y:SZY+ZH*2.4},11:{x:SZX-ZW*2.4,y:SZY},12:{x:SZX+ZW*2.4,y:SZY}};
function zonePos(z){return z<9?ZONE_POS[z]:BALL_POS[z];}
function isStrike(z){return z>=0&&z<9;}

const PITCHES={
  straight:{ja:'直球', en:'Fastball',  bR:0,   bC:0,   aR:0,    aC:0,   spd:1.0},
  curve:   {ja:'カーブ',en:'Curve',    bR:2.3, bC:-1.2,aR:-2.1, aC:1.1, spd:.74},
  slider:  {ja:'スライダー',en:'Slider',bR:.4,  bC:2.4, aR:-.3,  aC:-2.2,spd:.84},
  fork:    {ja:'フォーク',en:'Forkball',bR:2.9, bC:0,   aR:-2.6, aC:0,   spd:.77},
  sinker:  {ja:'シンカー',en:'Sinker', bR:1.8, bC:-1.6,aR:-1.5, aC:1.4, spd:.87},
};
const PT_KEYS=Object.keys(PITCHES);
const PT_COLORS={straight:'#ff9966',curve:'#66aaff',slider:'#ff66aa',fork:'#66ff99',sinker:'#ffcc44'};

// ──────────────────────────────────────────
// State
// ──────────────────────────────────────────
let MODE='1p', INNINGS=5;
let inning=1, half=0;       // half:0=top(A bats),1=bot(B bats)
let balls=0,strikes=0,outs=0;
let runners=[false,false,false];
let innScore=0;
let scores={a:Array(9).fill(null),b:Array(9).fill(null)};
let phase='idle'; // idle|pitcher|batter_wait|batter_anim|result|over

let selZone=-1;          // pitcher selected zone
let selPT='straight';    // pitcher selected pitch type
let pitchZone=-1;        // the zone that was thrown
let pitchPT='straight';  // pitch type thrown

let batZone=-1;          // batter cursor zone (-1=no hover)
let swingZone=-1;        // zone where batter swung
let swingT=-1;           // normalized timing (0..1), -1=no swing

let animRaf=null, animStart=0, animDur=0;
let capT=0;              // 0..1 current animation progress
let pitchActualPos={x:CW/2,y:60};
let pitchApparentPos={x:CW/2,y:60};
let capAngle=0;
const CAP_START={x:CW/2,y:CH*0.34};
const BREAK_T=0.55;
const PERFECT_T=0.80;

// ──────────────────────────────────────────
// Canvas & drawing
// ──────────────────────────────────────────
const canvas=document.getElementById('gc');
const ctx=canvas.getContext('2d');

function drawBG(){
  const sky=ctx.createLinearGradient(0,0,0,CH*.55);
  sky.addColorStop(0,'#090914'); sky.addColorStop(1,'#111828');
  ctx.fillStyle=sky; ctx.fillRect(0,0,CW,CH*.55);
  const gnd=ctx.createLinearGradient(0,CH*.55,0,CH);
  gnd.addColorStop(0,'#0e1e0a'); gnd.addColorStop(1,'#080f06');
  ctx.fillStyle=gnd; ctx.fillRect(0,CH*.55,CW,CH*.45);
  // Mound
  ctx.save();
  ctx.beginPath(); ctx.ellipse(CW/2,CH*.42,26,12,0,0,Math.PI*2);
  ctx.fillStyle='rgba(100,65,30,.6)'; ctx.fill();
  ctx.restore();
  // Pitcher figure
  drawFigure(CW/2,CH*.35,'rgba(255,120,60,.65)');
  // Batter figure (left side)
  drawFigure(70,CH-22,'rgba(0,180,140,.65)',true);
}

function drawFigure(x,y,color,mirror){
  ctx.save();
  if(mirror){ctx.translate(x,y);ctx.scale(-1,1);ctx.translate(-x,-y);}
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.arc(x,y-20,6,0,Math.PI*2); ctx.fill();
  ctx.fillRect(x-4,y-14,7,15);
  ctx.strokeStyle=color; ctx.lineWidth=3; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x+3,y-10); ctx.lineTo(x+16,y-20); ctx.stroke();
  ctx.restore();
}

function drawStrikeZone(hoveredZone){
  // Outer box
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,0.18)'; ctx.lineWidth=1.5;
  ctx.strokeRect(SZX-ZW*1.5,SZY-ZH*1.5,ZW*3,ZH*3);
  // Grid lines
  for(let i=1;i<3;i++){
    ctx.beginPath(); ctx.moveTo(SZX-ZW*1.5+i*ZW,SZY-ZH*1.5); ctx.lineTo(SZX-ZW*1.5+i*ZW,SZY+ZH*1.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(SZX-ZW*1.5,SZY-ZH*1.5+i*ZH); ctx.lineTo(SZX+ZW*1.5,SZY-ZH*1.5+i*ZH); ctx.stroke();
  }
  // Hover highlight
  if(hoveredZone>=0&&hoveredZone<9){
    const p=ZONE_POS[hoveredZone];
    ctx.fillStyle='rgba(255,255,255,0.07)';
    ctx.fillRect(p.x-ZW/2,p.y-ZH/2,ZW,ZH);
    // Cursor crosshair
    ctx.strokeStyle='rgba(255,220,100,0.8)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(p.x-12,p.y); ctx.lineTo(p.x+12,p.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p.x,p.y-10); ctx.lineTo(p.x,p.y+10); ctx.stroke();
    ctx.beginPath(); ctx.arc(p.x,p.y,5,0,Math.PI*2); ctx.strokeStyle='rgba(255,220,100,.9)'; ctx.stroke();
  } else if(hoveredZone>=9){
    // Ball zone hint
    const p=zonePos(hoveredZone);
    ctx.strokeStyle='rgba(100,150,255,0.5)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(p.x,p.y,10,0,Math.PI*2); ctx.stroke();
  }
  ctx.restore();
}

function drawTimingRing(t){
  const PERFECT=PERFECT_T;
  const d=Math.abs(t-PERFECT);
  const maxR=55, minR=7;
  // Ring grows from max→min up to perfect, then grows back
  const prog=Math.max(0,1-d/(PERFECT*.98));
  const r=minR+(maxR-minR)*(1-prog);
  const g=Math.min(255,Math.floor(prog*2*255));
  const rb=Math.max(0,255-Math.floor(prog*2*255));
  const color=`rgb(${rb},${g},80)`;
  ctx.save();
  const cx=CW/2, cy=CH-28;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.strokeStyle=color; ctx.lineWidth=3; ctx.globalAlpha=.75; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx,cy,4,0,Math.PI*2);
  ctx.fillStyle=color; ctx.globalAlpha=.9; ctx.fill();
  ctx.restore();
}

function drawBottleCap(x,y,r,spinAngle,color,axisAngle){
  // True 3-D cylinder projection. Rotation is around the horizontal diameter axis.
  //
  // The fix for "circle on top of rectangle":
  //   wallH = H * cosA  (wall SHRINKS as face rotates toward viewer)
  //   faceH = faceR * sinA  (face GROWS as it rotates toward viewer)
  //   outerH = max(wallH, faceH)  → ONE unified ellipse, never two separate shapes
  //
  const isWhite=color==='#f0f0f0';
  const sinA=Math.abs(Math.sin(spinAngle));
  const cosA=Math.abs(Math.cos(spinAngle));
  const axTilt=axisAngle||0;

  const H=r*.30;        // cylinder half-height
  const rimW=r*.20;     // knurled rim band width
  const faceR=r-rimW;   // inner disc radius (r*0.80)

  // Correctly foreshortened projections
  const wallH=H*cosA;          // shrinks to 0 when face-on
  const faceH=faceR*sinA;      // grows to faceR when face-on
  const outerH=Math.max(wallH,faceH,r*.055); // always show at least a sliver

  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(axTilt);

  ctx.shadowColor='rgba(0,0,0,.5)';
  ctx.shadowBlur=r*.5;
  ctx.shadowOffsetY=outerH*.35;

  // ── Outer shell: wall + rim band as ONE ellipse ──
  // Cylindrical shading (dark top/bottom edges = surfaces curving away from viewer,
  // bright equator = surface facing directly toward viewer).
  const shG=ctx.createLinearGradient(0,-outerH,0,outerH);
  if(isWhite){
    shG.addColorStop(0,'#606060');
    shG.addColorStop(.20,'#cccccc');
    shG.addColorStop(.5,'#ffffff');
    shG.addColorStop(.80,'#c8c8c8');
    shG.addColorStop(1,'#606060');
  } else {
    shG.addColorStop(0,darkenHex(color,.46));
    shG.addColorStop(.20,lightenHex(color,.10));
    shG.addColorStop(.5,lightenHex(color,.40));
    shG.addColorStop(.80,lightenHex(color,.04));
    shG.addColorStop(1,darkenHex(color,.50));
  }
  ctx.beginPath();
  ctx.ellipse(0,0,r,outerH,0,0,Math.PI*2);
  ctx.fillStyle=shG; ctx.fill();
  ctx.shadowBlur=0; ctx.shadowOffsetY=0;
  ctx.strokeStyle='rgba(0,0,0,.15)'; ctx.lineWidth=.5; ctx.stroke();

  // Knurling clipped to the outer ellipse
  ctx.save();
  ctx.beginPath(); ctx.ellipse(0,0,r,outerH,0,0,Math.PI*2); ctx.clip();
  for(let i=1;i<22;i++){
    const kx=-r+(i/22)*r*2;
    ctx.beginPath(); ctx.moveTo(kx,-outerH); ctx.lineTo(kx,outerH);
    ctx.strokeStyle=i%2===0?'rgba(255,255,255,.28)':'rgba(0,0,0,.13)';
    ctx.lineWidth=.7; ctx.stroke();
  }
  ctx.restore();

  // ── Inner face disc (only when face rotates toward viewer) ──
  if(faceH>1.5){
    const fg=ctx.createRadialGradient(-faceR*.2,-faceH*.15,0,0,0,faceR);
    if(isWhite){
      fg.addColorStop(0,'#ffffff'); fg.addColorStop(.65,'#f0f0f0'); fg.addColorStop(1,'#d8d8d8');
    } else {
      fg.addColorStop(0,lightenHex(color,.35)); fg.addColorStop(.65,color); fg.addColorStop(1,darkenHex(color,.18));
    }
    ctx.beginPath();
    ctx.ellipse(0,0,faceR,faceH,0,0,Math.PI*2);
    ctx.fillStyle=fg; ctx.fill();

    if(sinA>.28){
      // Center logo mark
      ctx.beginPath();
      ctx.ellipse(0,0,r*.17,r*.17*sinA,0,0,Math.PI*2);
      ctx.fillStyle='rgba(0,0,0,.10)'; ctx.fill();
      // Specular
      ctx.beginPath();
      ctx.ellipse(-faceR*.25,-faceH*.3,faceR*.22,faceH*.10,-.3,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${.38*sinA})`; ctx.fill();
    }
  }

  ctx.restore();
}
function lightenHex(col,amt){
  const n=parseInt(col.replace('#',''),16);
  const r=Math.min(255,((n>>16)&255)+Math.round(255*amt));
  const g=Math.min(255,((n>>8)&255)+Math.round(255*amt));
  const b=Math.min(255,(n&255)+Math.round(255*amt));
  return `rgb(${r},${g},${b})`;
}
function darkenHex(col,amt){return lightenHex(col,-amt);}

function drawRunnerDiamond(){
  // Drawn bottom-right corner of canvas
  const cx=CW-52, cy=CH-52, sz=30;
  ctx.save();
  // Background panel
  ctx.fillStyle='rgba(0,0,0,.45)'; ctx.beginPath();
  ctx.roundRect(cx-sz-8,cy-sz-8,sz*2+16,sz*2+16,6); ctx.fill();
  // Diamond lines
  ctx.strokeStyle='rgba(255,255,255,.2)'; ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(cx,cy-sz); ctx.lineTo(cx+sz,cy);
  ctx.lineTo(cx,cy+sz); ctx.lineTo(cx-sz,cy); ctx.closePath(); ctx.stroke();
  // Bases: 0=1B(right), 1=2B(top), 2=3B(left)
  const bpos=[{x:cx+sz,y:cy},{x:cx,y:cy-sz},{x:cx-sz,y:cy}];
  bpos.forEach(({x,y},i)=>{
    ctx.beginPath(); ctx.rect(x-6,y-6,12,12);
    if(runners[i]){ctx.fillStyle='#ffd700';ctx.shadowColor='#ffd700';ctx.shadowBlur=10;}
    else ctx.fillStyle='#2a2a3a';
    ctx.fill(); ctx.shadowBlur=0;
    ctx.strokeStyle=runners[i]?'#ffd700':'#444'; ctx.lineWidth=1.5; ctx.stroke();
  });
  // Home plate
  ctx.beginPath(); ctx.arc(cx,cy+sz,5,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.fill();
  // Runner label
  const runCount=runners.filter(Boolean).length;
  if(runCount>0){
    ctx.fillStyle='#ffd700'; ctx.font='bold 9px Courier New'; ctx.textAlign='center';
    ctx.fillText(runCount+T('bases'),cx,cy+4);
  }
  ctx.restore();
}

function drawScoreBox(){
  // Top-left score overlay
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,.55)';
  ctx.beginPath(); ctx.roundRect(8,8,100,46,5); ctx.fill();
  const ya=scores.a.reduce((s,v)=>s+(v||0),0);
  const yb=scores.b.reduce((s,v)=>s+(v||0),0);
  const nameA=MODE==='2p'?'P1':T('you'), nameB=MODE==='2p'?'P2':T('cpu');
  ctx.font='bold 11px Courier New'; ctx.textAlign='left';
  ctx.fillStyle='#00d4aa'; ctx.fillText(nameA+': '+ya,14,26);
  ctx.fillStyle='#ff6633'; ctx.fillText(nameB+': '+yb,14,44);
  // Current inning run
  if(innScore>0){
    ctx.fillStyle='rgba(255,215,0,.8)'; ctx.font='10px Courier New';
    ctx.fillText('+'+innScore+'点',68,26);
  }
  ctx.restore();
}

function drawField(capX,capY,capR,isWhite,spinAngle,axisAngle){
  ctx.clearRect(0,0,CW,CH);
  drawBG();
  drawStrikeZone(phase==='batter_anim'||phase==='batter_wait'?batZone:-1);
  drawRunnerDiamond();
  drawScoreBox();
  if(capR>0) drawBottleCap(capX,capY,capR,spinAngle||capAngle,isWhite?'#f0f0f0':'#cc3300',axisAngle||0);
}

// ──────────────────────────────────────────
// Pitch animation
// ──────────────────────────────────────────
function lerp(a,b,t){return a+(b-a)*t;}
function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
function clampPos(p){return{x:Math.max(20,Math.min(CW-20,p.x)),y:Math.max(20,Math.min(CH-20,p.y))};}

function startPitchAnim(zone,pt,onArrive){
  cancelAnim();
  const p=PITCHES[pt];
  const actual=clampPos(zonePos(zone));
  pitchActualPos=actual; pitchApparentPos=actual;
  animDur=900/p.spd;
  animStart=performance.now();
  capAngle=0; capT=0;
  let arrived=false;

  function step(now){
    capT=Math.min((now-animStart)/animDur,1);
    const s=ease(capT);
    const px=lerp(CAP_START.x,actual.x,s);
    const py=lerp(CAP_START.y,actual.y,s);
    capAngle+=0.28;
    const axisTilt={straight:0,curve:Math.PI*.18,slider:-Math.PI*.15,fork:Math.PI*.10,sinker:Math.PI*.08}[pt]||0;
    const r=lerp(4,23,ease(capT));
    drawField(px,py,r,true,capAngle,axisTilt);
    drawTimingRing(capT);

    if(swingT>=0&&!arrived){
      arrived=true; cancelAnim();
      onArrive(px,py);
    } else if(capT<1){
      animRaf=requestAnimationFrame(step);
    } else {
      arrived=true; animRaf=null;
      drawField(actual.x,actual.y,22,true);
      setTimeout(()=>onArrive(actual.x,actual.y),120);
    }
  }
  animRaf=requestAnimationFrame(step);
}
function cancelAnim(){if(animRaf){cancelAnimationFrame(animRaf);animRaf=null;}}

// ──────────────────────────────────────────
// Canvas input (batter cursor)
// ──────────────────────────────────────────
function canvasXY(e){
  const r=canvas.getBoundingClientRect();
  const sx=CW/r.width, sy=CH/r.height;
  const src=e.touches?e.touches[0]:e;
  return {x:(src.clientX-r.left)*sx, y:(src.clientY-r.top)*sy};
}
function nearestZone(x,y){
  // Find closest zone (including ball zones for awareness)
  let best=-1, bestD=9999;
  for(let z=0;z<9;z++){
    const p=ZONE_POS[z], d=Math.hypot(x-p.x,y-p.y);
    if(d<bestD){bestD=d;best=z;}
  }
  // Also check ball zones
  for(let z=9;z<=12;z++){
    const p=BALL_POS[z], d=Math.hypot(x-p.x,y-p.y);
    if(d<bestD){bestD=d;best=z;}
  }
  return bestD<70?best:-1;
}
canvas.addEventListener('mousemove',e=>{
  if(phase!=='batter_anim'&&phase!=='batter_wait') return;
  const {x,y}=canvasXY(e);
  batZone=nearestZone(x,y);
});
canvas.addEventListener('touchmove',e=>{
  if(phase!=='batter_anim'&&phase!=='batter_wait') return;
  e.preventDefault();
  const {x,y}=canvasXY(e);
  batZone=nearestZone(x,y);
},{passive:false});
canvas.addEventListener('click',e=>{
  if(phase==='batter_anim'||phase==='batter_wait') doSwing();
});
canvas.addEventListener('touchend',e=>{
  if(phase==='batter_anim'||phase==='batter_wait'){e.preventDefault();doSwing();}
},{passive:false});

// ──────────────────────────────────────────
// Game actions
// ──────────────────────────────────────────
function doSwing(){
  if(phase!=='batter_anim'&&phase!=='batter_wait') return;
  swingZone=batZone>=0?batZone:4; // default center if no cursor
  swingT=capT>=0?capT:0.1;
  if(phase==='batter_wait'){
    phase='batter_anim'; swingT=0.08;
    startPitchAnim(pitchZone,pitchPT,(fx,fy)=>resolve(fx,fy));
  }
  // If already animating, swingT is set and animation step will catch it
}
function doTake(){
  if(phase!=='batter_anim'&&phase!=='batter_wait') return;
  swingT=-2; // deliberate take — let animation finish so batter sees where pitch goes
  if(phase==='batter_wait'){
    phase='batter_anim';
    startPitchAnim(pitchZone,pitchPT,(fx,fy)=>resolve(fx,fy));
  }
  // If already animating, just set flag; animation will resolve naturally at end
}
document.getElementById('take-btn').addEventListener('click',doTake);
document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){
    e.preventDefault();
    if(phase==='batter_anim'||phase==='batter_wait') doSwing();
    else if(phase==='pitcher') document.getElementById('throw-btn').click();
  }
});

// ──────────────────────────────────────────
// Evaluate at-bat result
// ──────────────────────────────────────────
function zoneDist(a,b){
  // Manhattan-ish distance on 3×3 grid
  if(a<0||b<0) return 9;
  if(a>=9||b>=9){
    // Ball zones adjacent to edge strike zones
    if(a<9&&b>=9){
      const edges={9:[0,1,2],10:[6,7,8],11:[0,3,6],12:[2,5,8]};
      return (edges[b]||[]).includes(a)?1:2;
    }
    if(b<9&&a>=9){
      const edges={9:[0,1,2],10:[6,7,8],11:[0,3,6],12:[2,5,8]};
      return (edges[a]||[]).includes(b)?1:2;
    }
    return Math.abs(a-b);
  }
  const ar=Math.floor(a/3),ac=a%3,br=Math.floor(b/3),bc=b%3;
  return Math.max(Math.abs(ar-br),Math.abs(ac-bc));
}

function evaluate(pZone,sZone,sT){
  // sT=-2: deliberate take; sT=-1: no swing (missed window); sT>=0: swing
  const pitchIsStr=isStrike(pZone);
  if(sT<0){
    return pitchIsStr?{type:'called_strike'}:{type:'ball'};
  }
  // Swing
  if(sZone<0) return {type:'miss'};
  // Swinging at ball zone is almost always a miss
  if(sZone>=9){
    if(pZone===sZone&&Math.abs(sT-PERFECT_T)<.06) return {type:'foul'};
    return {type:'miss'};
  }
  const tErr=Math.abs(sT-PERFECT_T);
  const tScore=Math.min(tErr/.13,1); // narrower timing window
  const dist=zoneDist(pZone,sZone);
  // Same zone
  if(dist===0&&tScore<.06)  return {type:'HR'};
  if(dist===0&&tScore<.14)  return {type:'3B'};
  if(dist===0&&tScore<.26)  return {type:'2B'};
  if(dist===0&&tScore<.44)  return {type:'1B'};
  if(dist===0&&tScore<.70)  return {type:'foul'};
  // Adjacent zone (±1)
  if(dist===1&&tScore<.10)  return {type:'2B'};
  if(dist===1&&tScore<.22)  return {type:'1B'};
  if(dist===1&&tScore<.50)  return {type:'foul'};
  // 2 zones away
  if(dist===2&&tScore<.09)  return {type:'foul'};
  // Everything else
  return {type:'miss'};
}

function advanceRunners(bases){
  let runs=0;
  const nr=[false,false,false];
  for(let i=2;i>=0;i--){
    if(!runners[i]) continue;
    const nb=i+1+bases;
    if(nb>=3) runs++; else nr[nb]=true;
  }
  if(bases>=4) runs++; else if(bases>0) nr[bases-1]=true;
  runners=nr; innScore+=runs; return runs;
}

function resolve(fx,fy){
  phase='result';
  const res=evaluate(pitchZone,swingZone,swingT);

  let msg='',color='#eee',delay=1100;
  let hit=false;
  // Perspective: in 1P, a hit helps whoever's batting. Out cues flip with it.
  const SE=(typeof SND!=='undefined')?SND.sfx:null;
  const twoP=MODE==='2p';
  const humanBatting=!twoP&&half===0;
  const humanPitching=!twoP&&half===1;
  if(res.type==='ball'){
    balls++; msg=T('rBall'); color='#88aaff';
    if(SE) SE.click();
    if(balls>=4){advanceRunners(1);balls=0;strikes=0;msg=T('rWalk');color='#00d4aa';delay=1400;
      if(SE){ if(humanBatting)SE.pointWin(); else if(humanPitching)SE.pointLose(); }}
  } else if(res.type==='called_strike'||res.type==='miss'){
    strikes++; msg=res.type==='miss'?T('rMiss'):T('rStr'); color='#ff4444';
    if(SE) SE.strike();
    if(strikes>=3){outs++;balls=0;strikes=0;msg+='\n'+T('rOut');delay=1500;
      if(SE){ if(humanPitching)SE.pointWin(); else if(humanBatting)SE.pointLose(); }}
  } else if(res.type==='foul'){
    if(strikes<2) strikes++; msg=T('rFoul'); color='#ffaa00';
    if(SE) SE.flip();
  } else {
    hit=true;
    if(res.type==='HR'){advanceRunners(4);msg=T('rHR');color='#ffd700';}
    else if(res.type==='3B'){advanceRunners(3);msg=T('r3b');color='#ff9933';}
    else if(res.type==='2B'){advanceRunners(2);msg=T('r2b');color='#00d4aa';}
    else {advanceRunners(1);msg=T('r1b');color='#88ff88';}
    balls=0;strikes=0;
    // Opponent connecting off you → negative; you (or 2P batter) connecting → crack/fanfare
    if(SE){ if(humanPitching) SE.pointLose();
            else if(res.type==='HR') SE.homerun();
            else SE.hitBall(); }
  }

  drawField(fx,fy,22,true);
  flash(msg,color);
  renderHUD(); renderSB();

  setTimeout(()=>{
    if(outs>=3) endHalf();
    else nextAtBat();
  },delay);
}

function flashPitchLanding(){
  // Show zone highlight for where pitch actually landed
  if(pitchZone<0) return;
  const p=zonePos(pitchZone);
  ctx.save();
  ctx.strokeStyle='#ffd700'; ctx.lineWidth=2;
  ctx.globalAlpha=.8;
  if(isStrike(pitchZone)){
    ctx.strokeRect(p.x-ZW/2,p.y-ZH/2,ZW,ZH);
  } else {
    ctx.beginPath(); ctx.arc(p.x,p.y,16,0,Math.PI*2); ctx.stroke();
  }
  ctx.restore();
}

// ──────────────────────────────────────────
// Turn management
// ──────────────────────────────────────────
function isBatHuman(){return MODE==='2p'||(half===0);}
function isPitchHuman(){return MODE==='2p'||(half===1);}

function startHalf(){
  outs=0;balls=0;strikes=0;runners=[false,false,false];innScore=0;
  if(typeof SND!=='undefined'&&!SND.isMuted()&&inning===1&&half===0) SND.startBGM('baseball');
  renderHUD(); renderInn(); renderSB(); drawField(0,0,0,true);
  const t=half===0?T('intro_top',inning):T('intro_bot',inning);
  let sub;
  if(MODE==='2p') sub=T('isub_2p',half===0?1:2);
  else sub=half===0?T('isub_top_1p'):T('isub_bot_1p');
  showMsg(t,sub,T('ok'),()=>nextAtBat());
}
function nextAtBat(){
  selZone=-1; selPT='straight'; batZone=-1; swingZone=-1; swingT=-1; capT=0;
  flash('','#fff');
  document.querySelectorAll('.pz-cell,.pz-out').forEach(c=>c.classList.remove('sel'));
  if(isPitchHuman()){
    if(MODE==='2p'){
      const pw=half===0?2:1;
      showPass(T('pass_pitch',pw),()=>setPitcherPhase());
    } else setPitcherPhase();
  } else {
    // CPU pitches
    const {zone,pt}=cpuPitch();
    selZone=zone; selPT=pt;
    setPitcherPhase();
    setTimeout(()=>executePitch(),400);
  }
}
function setPitcherPhase(){
  phase='pitcher';
  document.getElementById('pitcher-ui').style.display='flex';
  document.getElementById('batter-ui').style.display='none';
  drawField(0,0,0,false);
}

document.getElementById('throw-btn').addEventListener('click',()=>{
  if(phase!=='pitcher') return;
  if(selZone<0){selZone=4;} // default center
  executePitch();
});

function executePitch(){
  pitchZone=selZone; pitchPT=selPT;
  document.getElementById('pitcher-ui').style.display='none';
  if(typeof SND!=='undefined') SND.sfx.pitch();

  if(isBatHuman()){
    if(MODE==='2p'){
      const bw=half===0?1:2;
      showPass(T('pass_bat',bw),()=>startBatter());
    } else startBatter();
  } else {
    // CPU bats
    const {sz,st}=cpuBat(pitchZone,pitchPT);
    swingZone=sz; swingT=st;
    phase='batter_anim';
    startPitchAnim(pitchZone,pitchPT,(fx,fy)=>resolve(fx,fy));
  }
}
function startBatter(){
  phase='batter_wait'; batZone=-1; swingZone=-1; swingT=-1; capT=0;
  document.getElementById('batter-ui').style.display='flex';
  flash(T('swing_hint'),'#888');
  drawField(0,0,0,true);
  setTimeout(()=>{
    if(phase!=='batter_wait') return;
    phase='batter_anim';
    startPitchAnim(pitchZone,pitchPT,(fx,fy)=>{
      if(swingT===-2) resolve(fx,fy);
      else if(swingT>=0) resolve(fx,fy);
      else { swingT=-1; resolve(fx,fy); } // pitch arrived, no swing = take
    });
  },350);
}

// ──────────────────────────────────────────
// Inning management
// ──────────────────────────────────────────
function endHalf(){
  document.getElementById('pitcher-ui').style.display='none';
  document.getElementById('batter-ui').style.display='none';
  cancelAnim();
  if(half===0) scores.a[inning-1]=innScore;
  else scores.b[inning-1]=innScore;
  if(half===1){
    if(inning>=INNINGS){endGame();return;}
    inning++;
  }
  half=1-half;
  renderSB(); renderInn();
  showMsg(T('threeOuts'),'',T('ok'),()=>startHalf());
}
function endGame(){
  phase='over';
  const ta=scores.a.reduce((s,v)=>s+(v||0),0);
  const tb=scores.b.reduce((s,v)=>s+(v||0),0);
  // In 1P the human is team A (bats first); win/lose by actual result.
  if(typeof SND!=='undefined'){
    SND.stopBGM();
    if(MODE==='2p') SND.sfx.win();
    else if(ta>tb) SND.sfx.win();
    else if(tb>ta) SND.sfx.lose();
    else SND.sfx.point();
  }
  const sc=MODE==='2p'?T('sc_2p',ta,tb):T('sc_1p',ta,tb);
  let res;
  if(MODE==='2p') res=ta>tb?T('p1_win'):tb>ta?T('p2_win'):T('draw');
  else res=ta>tb?T('you_win'):tb>ta?T('cpu_win'):T('draw');
  showMsg(T('over'),res+'\n'+sc,T('again'),()=>{
    document.getElementById('screen-game').style.display='none';
    document.getElementById('screen-setup').style.display='flex';
  });
}

// ──────────────────────────────────────────
// CPU AI
// ──────────────────────────────────────────
function cpuPitch(){
  const strikePlan=[
    {zone:6,pt:'straight'},{zone:8,pt:'slider'},{zone:16%9,pt:'sinker'},
    {zone:2,pt:'curve'},{zone:4,pt:'straight'},{zone:7,pt:'fork'},
    {zone:0,pt:'curve'},{zone:5,pt:'slider'},{zone:3,pt:'sinker'},
  ];
  // Map to correct zones 0-8
  const plans=[
    {zone:0,pt:'curve'},{zone:1,pt:'straight'},{zone:2,pt:'slider'},
    {zone:3,pt:'sinker'},{zone:4,pt:'straight'},{zone:5,pt:'slider'},
    {zone:6,pt:'fork'},{zone:7,pt:'sinker'},{zone:8,pt:'curve'},
    {zone:9,pt:'curve'},{zone:10,pt:'fork'},{zone:11,pt:'slider'},
  ];
  const i=Math.random()<.72?Math.floor(Math.random()*9):9+Math.floor(Math.random()*3);
  return plans[i]||{zone:4,pt:'straight'};
}
function cpuBat(pZone,pPT){
  const isStr=isStrike(pZone);
  // CPU takes balls more often
  if(!isStr&&Math.random()<.82) return {sz:-1,st:-1};
  if(!isStr&&Math.random()<.6)  return {sz:-1,st:-1};
  // Zone guess: often off by 1-2, sometimes completely wrong
  const zi=isStr?pZone:4;
  const rnd=Math.random();
  const off=rnd<.35?0:rnd<.70?Math.floor(Math.random()*3)-1:Math.floor(Math.random()*5)-2;
  const sz=Math.max(0,Math.min(8,zi+off));
  // Timing: wider spread → more misses and fouls
  const st=PERFECT_T+((Math.random()-.5)*.52);
  return {sz,st:Math.max(.25,Math.min(1,st))};
}

// ──────────────────────────────────────────
// Pitcher zone grid (HTML)
// ──────────────────────────────────────────
function buildPitcherGrid(){
  const g=document.getElementById('pz-grid');
  g.innerHTML='';
  const labels=['↖','↑','↗','←','●','→','↙','↓','↘'];
  for(let z=0;z<9;z++){
    const d=document.createElement('div');
    d.className='pz-cell'+(selZone===z?' sel':'');
    d.dataset.zone=z;
    d.textContent=labels[z];
    d.addEventListener('click',()=>{
      if(phase!=='pitcher') return;
      selZone=z;
      document.querySelectorAll('.pz-cell,.pz-out').forEach(c=>c.classList.remove('sel'));
      d.classList.add('sel');
      updatePitcherCanvas();
    });
    g.appendChild(d);
  }
  // Outside buttons
  [9,10,11,12].forEach(z=>{
    const el=document.getElementById('pz'+z);
    if(!el) return;
    el.classList.toggle('sel',selZone===z);
    el.onclick=()=>{
      if(phase!=='pitcher') return;
      selZone=z;
      document.querySelectorAll('.pz-cell,.pz-out').forEach(c=>c.classList.remove('sel'));
      el.classList.add('sel');
      updatePitcherCanvas();
    };
  });
  // Pitch type buttons
  const pt=document.getElementById('pt-row');
  pt.innerHTML='';
  PT_KEYS.forEach(k=>{
    const b=document.createElement('button');
    b.className='pt'+(selPT===k?' sel':'');
    b.style.borderColor=PT_COLORS[k];
    if(selPT===k){b.style.color=PT_COLORS[k];b.style.background=PT_COLORS[k]+'22';}
    const names=PITCHES[k];
    b.textContent=lang==='ja'?names.ja:names.en;
    b.title=lang==='ja'?names.en:names.ja;
    b.addEventListener('click',()=>{
      if(phase!=='pitcher') return;
      selPT=k;
      document.querySelectorAll('.pt').forEach(bt=>{
        bt.classList.remove('sel');
        bt.style.color=''; bt.style.background='';
      });
      b.classList.add('sel');
      b.style.color=PT_COLORS[k]; b.style.background=PT_COLORS[k]+'22';
      updatePitcherCanvas();
    });
    pt.appendChild(b);
  });
}
function updatePitcherCanvas(){
  if(phase!=='pitcher') return;
  drawField(0,0,0,false);
  if(selZone>=0){
    const p=zonePos(selZone);
    // Show colored cap at pitcher's selected zone (pitcher sees pitch color)
    drawBottleCap(p.x,p.y,18,Math.PI/6,PT_COLORS[selPT]||'#ff6633');
    // Show apparent break trajectory hint
    const pt=PITCHES[selPT];
    const actual=zonePos(selZone);
    const apparent={x:actual.x+pt.aC*ZW,y:actual.y+pt.aR*ZH};
    if(pt.bR>0.3||Math.abs(pt.bC)>0.3){
      ctx.save();
      ctx.setLineDash([4,4]);
      ctx.strokeStyle='rgba(255,255,255,0.2)'; ctx.lineWidth=1.5;
      ctx.beginPath();
      ctx.moveTo(Math.max(20,Math.min(CW-20,apparent.x)),Math.max(20,Math.min(CH-20,apparent.y)));
      ctx.lineTo(actual.x,actual.y);
      ctx.stroke();
      ctx.setLineDash([]);
      // Apparent start (where it looks like it's going initially)
      ctx.beginPath(); ctx.arc(
        Math.max(20,Math.min(CW-20,apparent.x)),
        Math.max(20,Math.min(CH-20,apparent.y)),
        5,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,0.25)'; ctx.fill();
      ctx.restore();
    }
  }
}

// ──────────────────────────────────────────
// HUD / UI helpers
// ──────────────────────────────────────────
function renderHUD(){
  document.getElementById('b-dots').innerHTML=[0,1,2].map(i=>`<div class="cd${i<balls?' b':''}"></div>`).join('');
  document.getElementById('s-dots').innerHTML=[0,1].map(i=>`<div class="cd${i<strikes?' s':''}"></div>`).join('');
  document.getElementById('o-dots').innerHTML=[0,1,2].map(i=>`<div class="cd${i<outs?' o':''}"></div>`).join('');
}
function renderInn(){
  document.getElementById('val-inn').textContent=inning+(half===0?T('top'):T('bot'));
}
function renderSB(){
  const sb=document.getElementById('scoreboard');
  const na=MODE==='2p'?'P1':T('you'), nb=MODE==='2p'?'P2':T('cpu');
  let h=`<div class="sb-row"><div class="sb-name"></div>`;
  for(let i=1;i<=INNINGS;i++) h+=`<div class="sb-num sb-hdr">${i}</div>`;
  h+=`<div class="sb-tot">${T('tot')}</div></div>`;
  ['a','b'].forEach((t,ti)=>{
    const n=ti===0?na:nb, cls=ti===0?'sb-you':'sb-cpu';
    const active=ti===0?(half===0?inning:0):(half===1?inning:0);
    h+=`<div class="sb-row"><div class="sb-name ${cls}">${n}</div>`;
    for(let i=1;i<=INNINGS;i++){
      const v=scores[t][i-1];
      const ac=(i===active)?` sb-act`:``;
      h+=`<div class="sb-num ${cls}${ac}">${v===null?'-':v}</div>`;
    }
    h+=`<div class="sb-tot">${scores[t].reduce((s,v)=>s+(v||0),0)}</div></div>`;
  });
  sb.innerHTML=h;
}
function flash(msg,color){
  const el=document.getElementById('rflash');
  el.textContent=msg; el.style.color=color||'#eee';
}
