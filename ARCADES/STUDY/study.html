<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STUDY | 就活対策トレーニング</title>
  <link rel="manifest" href="../../manifest.json">
  <meta name="theme-color" content="#00d4aa">
  <link rel="apple-touch-icon" href="../../icon-192.png">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    :root{
      --bg:#0d0d1a; --panel:#13131f; --panel2:#0f0f1a; --line:#222; --line2:#2a2a3a;
      --txt:#eee; --dim:#888; --dim2:#555; --accent:#00d4aa; --accent2:#0088cc;
      --good:#34d399; --warn:#fbbf24; --bad:#ff5566; --purple:#a78bfa; --pink:#f472b6; --blue:#60a5fa;
    }
    body{background:var(--bg);min-height:100vh;font-family:'Courier New',monospace;color:var(--txt);
      padding:58px 16px 60px;display:flex;flex-direction:column;align-items:center;}
    a{color:inherit;}
    /* top bar */
    #lang-btn{position:fixed;top:14px;left:14px;background:#1e1e2e;border:1px solid #444;border-radius:6px;color:#888;font-family:inherit;font-size:0.72rem;padding:5px 10px;cursor:pointer;z-index:30;}
    #top-right{position:fixed;top:14px;right:14px;display:flex;gap:8px;z-index:30;}
    .top-btn{background:#1e1e2e;border:1px solid #444;border-radius:6px;color:#888;font-family:inherit;font-size:0.72rem;padding:5px 10px;cursor:pointer;text-decoration:none;display:inline-block;transition:.15s;}
    .top-btn:hover{color:#eee;border-color:#666;}
    .top-btn.primary{border-color:var(--accent);color:var(--accent);}
    .wrap{width:100%;max-width:920px;}
    h1{font-size:1.9rem;letter-spacing:9px;color:var(--accent);text-align:center;margin-bottom:6px;text-shadow:0 0 20px rgba(0,212,170,.45);}
    .subtitle{color:var(--dim2);font-size:.72rem;letter-spacing:3px;text-align:center;margin-bottom:8px;}
    .greet{text-align:center;color:var(--dim);font-size:.8rem;margin-bottom:26px;}
    .greet b{color:var(--warn);}
    /* guest banner */
    #guest-banner{background:#1a1408;border:1px solid #4a3a1a;border-radius:10px;padding:11px 16px;margin-bottom:22px;font-size:.74rem;color:#caa84a;text-align:center;line-height:1.7;}
    #guest-banner a{color:var(--warn);text-decoration:underline;}
    /* hero */
    .hero{background:linear-gradient(135deg,#10202a,#13131f);border:1px solid #1c3a36;border-radius:14px;padding:24px;margin-bottom:22px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;}
    .hero-left{flex:1;min-width:220px;}
    .hero-h{font-size:.7rem;letter-spacing:3px;color:var(--dim);margin-bottom:8px;}
    .hero-num{font-size:2.6rem;color:var(--accent);font-weight:bold;line-height:1;}
    .hero-num small{font-size:.9rem;color:var(--dim);font-weight:normal;letter-spacing:1px;margin-left:6px;}
    .hero-sub{font-size:.74rem;color:var(--dim);margin-top:8px;line-height:1.6;}
    .big-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:10px;color:#001a16;font-family:inherit;font-size:1rem;letter-spacing:2px;font-weight:bold;padding:16px 26px;cursor:pointer;transition:opacity .15s,transform .1s;white-space:nowrap;}
    .big-btn:hover{opacity:.9;}.big-btn:active{transform:scale(.97);}
    .big-btn:disabled{opacity:.35;cursor:not-allowed;}
    .big-btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--dim);}
    /* stats row */
    .stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:24px;}
    .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 8px;text-align:center;}
    .stat .v{font-size:1.5rem;font-weight:bold;color:var(--accent);}
    .stat .l{font-size:.6rem;letter-spacing:1px;color:var(--dim2);margin-top:4px;}
    /* section title */
    .sec-title{font-size:.72rem;letter-spacing:3px;color:var(--dim);margin:6px 0 14px;display:flex;align-items:center;gap:10px;}
    .sec-title::after{content:"";flex:1;height:1px;background:var(--line);}
    /* track grid */
    .tracks{margin-bottom:30px;}
    .group{margin-bottom:26px;}
    .group-head{display:flex;align-items:center;gap:10px;padding:6px 2px 9px;border-bottom:1px solid var(--line);margin-bottom:14px;}
    .group-icon{font-size:1.25rem;}
    .group-name{font-size:1.05rem;font-weight:bold;letter-spacing:3px;}
    .group-prog{margin-left:auto;font-size:.68rem;color:var(--dim2);letter-spacing:1px;}
    .group-prog .due{color:var(--warn);}
    .tracks-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;}
    .track{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;transition:border-color .2s,transform .2s;}
    .track:hover{border-color:#444;transform:translateY(-3px);}
    .track-top{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
    .track-icon{font-size:1.5rem;}
    .track-name{font-size:1rem;font-weight:bold;letter-spacing:1px;}
    .track-desc{font-size:.7rem;color:var(--dim);line-height:1.6;margin-bottom:12px;min-height:2.7em;}
    .bar{height:7px;background:#0a0a14;border-radius:4px;overflow:hidden;margin-bottom:6px;}
    .bar > div{height:100%;border-radius:4px;transition:width .4s;}
    .track-meta{display:flex;justify-content:space-between;font-size:.64rem;color:var(--dim2);margin-bottom:13px;}
    .track-meta .due{color:var(--warn);}
    .track-btns{display:flex;gap:8px;}
    .t-btn{flex:1;background:#0a0a14;border:1px solid var(--line2);border-radius:7px;color:var(--txt);font-family:inherit;font-size:.74rem;padding:9px;cursor:pointer;letter-spacing:1px;transition:.15s;}
    .t-btn:hover{border-color:var(--accent);color:var(--accent);}
    .t-btn.solid{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#001a16;font-weight:bold;border:none;}
    .t-btn:disabled{opacity:.4;cursor:not-allowed;}
    /* forgetting curve panel */
    .fc-panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:30px;}
    .fc-flex{display:flex;gap:22px;flex-wrap:wrap;align-items:center;}
    .fc-canvas-wrap{flex:1;min-width:280px;}
    canvas{width:100%;height:auto;display:block;}
    .fc-text{flex:1;min-width:240px;font-size:.76rem;color:var(--dim);line-height:1.85;}
    .fc-text b{color:var(--txt);}
    .fc-text .hl{color:var(--accent);}
    .gauge-wrap{display:flex;align-items:center;gap:14px;margin-top:14px;}
    .gauge{flex:1;height:9px;background:#0a0a14;border-radius:5px;overflow:hidden;}
    .gauge>div{height:100%;background:linear-gradient(90deg,var(--bad),var(--warn),var(--good));border-radius:5px;transition:width .5s;}
    .gauge-val{font-size:.8rem;color:var(--good);font-weight:bold;min-width:42px;text-align:right;}
    /* heatmap */
    .heat{display:flex;gap:3px;overflow-x:auto;padding-bottom:6px;}
    .heat-col{display:flex;flex-direction:column;gap:3px;}
    .heat-cell{width:11px;height:11px;border-radius:2px;background:#15151f;}
    .heat-legend{display:flex;align-items:center;gap:6px;justify-content:flex-end;font-size:.6rem;color:var(--dim2);margin-top:8px;}
    .heat-legend .hc{width:11px;height:11px;border-radius:2px;}
    /* ── session view ── */
    #view-session{display:none;width:100%;max-width:760px;}
    .sess-bar{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
    .sess-back{background:#1e1e2e;border:1px solid #444;border-radius:6px;color:#888;font-family:inherit;font-size:.72rem;padding:6px 11px;cursor:pointer;}
    .sess-prog{flex:1;height:8px;background:#0a0a14;border-radius:5px;overflow:hidden;}
    .sess-prog>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s;}
    .sess-count{font-size:.72rem;color:var(--dim);min-width:48px;text-align:right;}
    .sess-timer{font-size:.72rem;color:var(--dim);white-space:nowrap;flex-shrink:0;}
    .sess-timer.over{color:var(--warn);}
    .sess-timer .t-tgt{color:var(--dim2);}
    .time-row{margin-top:12px;font-size:.8rem;color:var(--dim);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;}
    .time-row b{color:var(--txt);}
    .time-row .sep{color:var(--dim2);margin:0 5px;}
    .time-row .judge{margin-left:8px;font-weight:bold;}
    .time-row.in .judge{color:var(--good);}
    .time-row.over .judge{color:var(--warn);}
    .q-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;}
    .q-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
    .q-badge{font-size:.62rem;padding:4px 10px;border-radius:20px;border:1px solid var(--line2);color:var(--dim);letter-spacing:1px;}
    .q-badge.cat{border-color:var(--accent);color:var(--accent);}
    .q-diff{font-size:.7rem;color:var(--warn);letter-spacing:1px;}
    .q-text{font-size:.95rem;line-height:1.9;margin-bottom:20px;}
    .q-text u{text-decoration-color:var(--accent);text-underline-offset:3px;}
    .choices{display:flex;flex-direction:column;gap:10px;}
    .choice{background:#0a0a14;border:1px solid var(--line2);border-radius:9px;padding:13px 16px;cursor:pointer;font-family:inherit;font-size:.9rem;color:var(--txt);text-align:left;transition:.13s;display:flex;gap:11px;align-items:flex-start;}
    .choice:hover:not(:disabled){border-color:var(--accent);}
    .choice .ix{color:var(--dim2);font-weight:bold;}
    .choice.correct{border-color:var(--good);background:rgba(52,211,153,.1);}
    .choice.wrong{border-color:var(--bad);background:rgba(255,85,102,.08);}
    .choice:disabled{cursor:default;}
    .num-row{display:flex;gap:10px;align-items:stretch;}
    .num-row input{flex:1;background:#0a0a14;border:1px solid var(--line2);border-radius:9px;padding:13px 16px;color:var(--txt);font-family:inherit;font-size:1rem;outline:none;}
    .num-row input:focus{border-color:var(--accent);}
    .num-unit{display:flex;align-items:center;color:var(--dim);font-size:.85rem;padding:0 4px;}
    .submit-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:9px;color:#001a16;font-family:inherit;font-weight:bold;font-size:.9rem;padding:0 22px;cursor:pointer;letter-spacing:1px;}
    .reveal-btn{width:100%;background:#0a0a14;border:1px solid var(--line2);border-radius:9px;color:var(--accent);font-family:inherit;font-size:.9rem;padding:14px;cursor:pointer;letter-spacing:2px;}
    .reveal-btn:hover{border-color:var(--accent);}
    /* result + explanation */
    .result{margin-top:18px;padding:14px 16px;border-radius:10px;font-size:.85rem;display:flex;align-items:center;gap:10px;}
    .result.ok{background:rgba(52,211,153,.1);border:1px solid #1d5c46;color:var(--good);}
    .result.ng{background:rgba(255,85,102,.08);border:1px solid #5c1d28;color:var(--bad);}
    .result.neutral{background:rgba(96,165,250,.08);border:1px solid #234a6b;color:var(--blue);}
    .explanation{margin-top:16px;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:16px 18px;font-size:.82rem;line-height:1.85;color:#cfcfd8;}
    .explanation h4{color:var(--accent);font-size:.82rem;letter-spacing:1px;margin:4px 0 8px;}
    .explanation p{margin:8px 0;}
    .explanation ul{margin:8px 0 8px 20px;}.explanation li{margin:4px 0;}
    .explanation b{color:var(--txt);}
    .explanation u{text-decoration-color:var(--accent);}
    .explanation .tip{color:var(--accent);background:rgba(0,212,170,.06);border-radius:8px;padding:9px 12px;margin-top:12px;font-size:.78rem;}
    .explanation .exp-table{border-collapse:collapse;width:100%;margin:10px 0;font-size:.76rem;}
    .explanation .exp-table th,.explanation .exp-table td{border:1px solid var(--line2);padding:6px 9px;text-align:left;}
    .explanation .exp-table th{background:#171723;color:var(--accent);}
    /* tables embedded in question / explanation (玉手箱 表の空欄推測 等) */
    .q-text .qtable,.explanation .qtable{border-collapse:collapse;margin:12px 0;font-size:.82rem;}
    .q-text .qtable th,.q-text .qtable td,.explanation .qtable th,.explanation .qtable td{border:1px solid var(--line2);padding:6px 12px;text-align:center;}
    .q-text .qtable th,.explanation .qtable th{background:#171723;color:var(--accent);}
    /* grade buttons */
    .grade-label{font-size:.68rem;color:var(--dim2);letter-spacing:2px;margin:20px 0 9px;text-align:center;}
    .grades{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
    .grade{border:1px solid var(--line2);border-radius:9px;background:#0a0a14;color:var(--txt);font-family:inherit;padding:11px 4px;cursor:pointer;text-align:center;transition:.13s;}
    .grade:hover{transform:translateY(-2px);}
    .grade .g{font-size:.82rem;font-weight:bold;}
    .grade .gi{font-size:.6rem;color:var(--dim2);margin-top:3px;}
    .grade.again{border-color:#5c1d28;}.grade.again:hover{background:rgba(255,85,102,.1);}
    .grade.hard{border-color:#5c4a1d;}.grade.hard:hover{background:rgba(251,191,36,.1);}
    .grade.good{border-color:#1d5c46;}.grade.good:hover{background:rgba(52,211,153,.1);}
    .grade.easy{border-color:#234a6b;}.grade.easy:hover{background:rgba(96,165,250,.1);}
    .next-btn{width:100%;margin-top:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:9px;color:#001a16;font-family:inherit;font-weight:bold;font-size:.92rem;letter-spacing:2px;padding:14px;cursor:pointer;}
    /* summary */
    #view-summary{display:none;width:100%;max-width:600px;text-align:center;}
    .sum-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:34px 26px;}
    .sum-emoji{font-size:3rem;margin-bottom:10px;}
    .sum-h{font-size:1.2rem;letter-spacing:3px;color:var(--accent);margin-bottom:18px;}
    .sum-stats{display:flex;justify-content:center;gap:30px;margin:20px 0;}
    .sum-stat .v{font-size:1.8rem;font-weight:bold;}
    .sum-stat .l{font-size:.64rem;color:var(--dim2);letter-spacing:1px;margin-top:4px;}
    /* misc */
    .footnote{font-size:.66rem;color:var(--dim2);text-align:center;line-height:1.8;margin-top:10px;}
    .hidden{display:none!important;}
    @media(max-width:560px){
      .stats-row{grid-template-columns:repeat(3,1fr);}
      h1{font-size:1.5rem;letter-spacing:5px;}
      .hero-num{font-size:2rem;}
    }
  </style>
  <script src="../../sound.js"></script>
  <script src="srs.js"></script>
  <script src="study-data.js"></script>
  <script src="study-data-spinum.js"></script>
  <script src="study-data-verbal.js"></script>
  <script src="study-data-calc.js"></script>
  <script src="study-data-open.js"></script>
  <script src="study-data-ext-spi.js"></script>
  <script src="study-data-ext-tama-num.js"></script>
  <script src="study-data-ext-tama-verb.js"></script>
  <script src="study-data-ext-tama-eng.js"></script>
  <script src="study-data-ext-tgweb-num.js"></script>
  <script src="study-data-ext-tgweb-verb.js"></script>
  <script src="study-data-ext-tgweb-eng.js"></script>
  <script src="study-data-ext-tgweb-num2.js"></script>
  <script src="study-data-ext-tama-num2.js"></script>
</head>
<body>
<button id="lang-btn">EN</button>
<div id="top-right">
  <a href="../../index.html" class="top-btn" id="home-btn">← HOME</a>
  <span id="auth-area"></span>
</div>

<!-- ══════════════ DASHBOARD ══════════════ -->
<div class="wrap" id="view-dash">
  <h1>STUDY</h1>
  <div class="subtitle" id="t-subtitle">適性検査・ケース面接 トレーニング</div>
  <div class="greet" id="t-greet"></div>

  <div id="guest-banner" class="hidden"></div>

  <!-- today's review hero -->
  <div class="hero">
    <div class="hero-left">
      <div class="hero-h" id="t-hero-h">今日の復習</div>
      <div><span class="hero-num" id="due-num">0</span><small id="t-due-unit">問</small></div>
      <div class="hero-sub" id="hero-sub"></div>
    </div>
    <button class="big-btn" id="start-review">復習を始める</button>
  </div>

  <!-- stats -->
  <div class="stats-row" id="stats-row"></div>

  <!-- forgetting curve -->
  <div class="sec-title" id="t-sec-science">学習の仕組み</div>
  <div class="fc-panel">
    <div class="fc-flex">
      <div class="fc-canvas-wrap"><canvas id="fc-canvas" width="520" height="300"></canvas></div>
      <div class="fc-text" id="fc-text"></div>
    </div>
    <div class="gauge-wrap">
      <span style="font-size:.7rem;color:var(--dim);letter-spacing:1px;" id="t-retention">現在の定着度</span>
      <div class="gauge"><div id="ret-gauge" style="width:0%"></div></div>
      <span class="gauge-val" id="ret-val">–</span>
    </div>
  </div>

  <!-- tracks -->
  <div class="sec-title" id="t-sec-tracks">出題分野</div>
  <div class="tracks" id="tracks"></div>

  <!-- activity -->
  <div class="sec-title" id="t-sec-activity">学習の記録</div>
  <div class="fc-panel">
    <div class="heat" id="heat"></div>
    <div class="heat-legend">
      <span id="t-heat-less">少</span>
      <span class="hc" style="background:#15151f"></span>
      <span class="hc" style="background:#0d4035"></span>
      <span class="hc" style="background:#147d63"></span>
      <span class="hc" style="background:#1f8a72"></span>
      <span class="hc" style="background:#2fd6b0"></span>
      <span id="t-heat-more">多</span>
    </div>
  </div>

  <div class="footnote" id="t-footnote"></div>
</div>

<!-- ══════════════ SESSION ══════════════ -->
<div id="view-session">
  <div class="sess-bar">
    <button class="sess-back" id="sess-back">✕</button>
    <div class="sess-prog"><div id="sess-prog-bar" style="width:0%"></div></div>
    <div class="sess-count" id="sess-count">0 / 0</div>
    <div class="sess-timer" id="sess-timer"></div>
  </div>
  <div class="q-card" id="q-card"></div>
</div>

<!-- ══════════════ SUMMARY ══════════════ -->
<div id="view-summary">
  <div class="sum-card">
    <div class="sum-emoji" id="sum-emoji">🎉</div>
    <div class="sum-h" id="sum-h">セッション完了</div>
    <div class="sum-stats" id="sum-stats"></div>
    <div class="fc-text" id="sum-msg" style="margin:14px 0 22px;"></div>
    <button class="big-btn" id="sum-back">ダッシュボードに戻る</button>
  </div>
</div>

<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
const META = window.STUDY_META, TRACKS = window.STUDY_TRACKS, DATA = window.STUDY_DATA;
const GROUPS = window.STUDY_GROUPS;
const ALL_IDS = DATA.map(p=>p.id);
const BY_ID = {}; DATA.forEach(p=>BY_ID[p.id]=p);
const NEW_PER_SESSION = 8, SESSION_MAX = 20, REVIEW_MAX = 40;

// ── i18n (UI chrome only; problem content is JP) ───────────────────────────
const L = {
  ja:{
    subtitle:'適性検査・ケース面接 トレーニング',
    login:'ログイン', register:'登録', home:'← HOME', menu:'≡ メニュー', toStudy:'← STUDY',
    greetNew:'ようこそ。まずは1分、始めてみましょう。',
    greetStreak:n=>`<b>${n}日連続</b>で学習中です。この調子！`,
    greetBack:'おかえりなさい。今日も少しずつ。',
    guest:'ゲストモードです。進捗はこの端末にのみ保存されます。<a href="login.html?next=study.html">ログイン</a>すると、どの端末でも記録が引き継がれます。',
    heroH:'今日の復習', dueUnit:'問',
    heroDue:n=>`忘却曲線に基づき、ちょうど復習すべき問題が <span class="hl">${n}問</span> あります。`,
    heroNone:'今日復習すべき問題はありません。新しい分野に挑戦しましょう。',
    startReview:'復習を始める', startNew:'新しく学ぶ',
    stTotal:'総問題数', stStudied:'学習済', stMastered:'定着', stDue:'復習待ち', stAcc:'正答率',
    secScience:'学習の仕組み', secTracks:'出題分野', secActivity:'学習の記録',
    retention:'現在の定着度',

    let gtot=0, gstud=0, gdue=0;

// ── forgetting-curve illustration ──────────────────────────────────────────
function drawForgettingCurve(){
  const cv=$('fc-canvas'); if(!cv) return;
  const dpr=window.devicePixelRatio||1;
  const W=520,H=300;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.maxWidth=W+'px';
  const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  const pad={l:40,r:14,t:16,b:30};
  const x0=pad.l, x1=W-pad.r, y0=H-pad.b, y1=pad.t;
  const X=t=>x0+(x1-x0)*(t/30);          // 0..30 days
  const Y=r=>y0-(y0-y1)*r;                // 0..1 retention
  // axes
  ctx.strokeStyle='#2a2a3a'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x0,y1); ctx.lineTo(x0,y0); ctx.lineTo(x1,y0); ctx.stroke();
  ctx.fillStyle='#555'; ctx.font='10px Courier New';
  [0,.5,1].forEach(r=>{ ctx.fillText(Math.round(r*100)+'%', 6, Y(r)+3); ctx.strokeStyle='#191923';
    ctx.beginPath(); ctx.moveTo(x0,Y(r)); ctx.lineTo(x1,Y(r)); ctx.stroke(); });
  ctx.fillStyle='#555'; ctx.fillText(lang==='ja'?'時間 →':'time →', x1-54, y0+20);
  // curve A: forget without review (dotted)
  ctx.strokeStyle='#666'; ctx.setLineDash([4,4]); ctx.lineWidth=1.5; ctx.beginPath();
  for(let t=0;t<=30;t+=.3){ const r=Math.exp(-t/2.2); const x=X(t),y=Y(r); t===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
  ctx.stroke(); ctx.setLineDash([]);
  // curve B: spaced repetition (solid) — resets at increasing intervals, stability grows
  const reviews=[0,1,3,7,16,30]; ctx.strokeStyle='#00d4aa'; ctx.lineWidth=2.4; ctx.beginPath();
  for(let i=0;i<reviews.length-1;i++){
    const a=reviews[i], b=reviews[i+1], S=1.6+i*2.4;   // stability increases each review
    for(let t=a;t<=b;t+=.25){ const r=Math.exp(-(t-a)/S); const x=X(t),y=Y(r); (i===0&&t===a)?ctx.moveTo(x,y):ctx.lineTo(x,y); }
    ctx.lineTo(X(b),Y(1)); // vertical jump back up at review (next segment continues)
  }
  ctx.stroke();
  // review markers
  ctx.fillStyle='#00d4aa';
  reviews.slice(0,-1).forEach(t=>{ ctx.beginPath(); ctx.arc(X(t),Y(1),3.2,0,7); ctx.fill(); });
  // legend
  ctx.font='11px Courier New';
  ctx.fillStyle='#00d4aa'; ctx.fillText('━ '+(lang==='ja'?'復習あり':'with review'), x0+8, y1+12);
  ctx.fillStyle='#888';    ctx.fillText('┈ '+(lang==='ja'?'復習なし':'no review'), x0+8, y1+28);
}

// ── activity heatmap ───────────────────────────────────────────────────────
function renderHeatmap(){
  const act=SRS.activity(); const wrap=$('heat'); wrap.innerHTML='';
  const WEEKS=17, today=new Date(); today.setHours(0,0,0,0);
  // align to Sunday columns
  const start=new Date(today); start.setDate(start.getDate()-(WEEKS*7-1));
  const color=n=> n>=8?'#2fd6b0': n>=4?'#1f8a72': n>=2?'#147d63': n>=1?'#0d4035':'#15151f';
  for(let w=0;w<WEEKS;w++){
    const col=document.createElement('div'); col.className='heat-col';
    for(let d=0;d<7;d++){
      const dt=new Date(start); dt.setDate(start.getDate()+w*7+d);
      const key=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
      const cell=document.createElement('div'); cell.className='heat-cell';
      if(dt<=today){ const n=act[key]||0; cell.style.background=color(n); cell.title=key+' : '+n; }
      else cell.style.visibility='hidden';
      col.appendChild(cell);
    }
    wrap.appendChild(col);
  }
}

// ── per-question timer (目標解答時間 vs かかった時間) ──────────────────────
let qTimer=null, qStart=0, qTarget=0;
// Target solving time (seconds) — per-problem override `p.time`, else by
// category / topic, scaled by difficulty. Reflects the pace these timed tests
// actually demand (玉手箱の四則逆算は速さ勝負、TG-WEBは思考重視で長め、など)。
function targetTime(p){
  if(p.time) return p.time;
  if(p.type==='open') return 300;            // ケース/フェルミは目安5分
  let base = ({'spi-num':75,'spi-verb':50,'tama':40,'tgweb':90})[p.cat] || 60;
  if(p.cat==='tama') base = /四則逆算/.test(p.topic)?25 : /英語/.test(p.topic)?70 : 45;
  const mult = p.diff===1?0.85 : p.diff===3?1.25 : 1.0;
  return Math.max(10, Math.round(base*mult/5)*5);
}
function mmss(sec){ sec=Math.max(0,Math.round(sec)); const m=Math.floor(sec/60), s=sec%60; return m+':'+String(s).padStart(2,'0'); }
function startQTimer(target){ qStart=Date.now(); qTarget=target; updateTimer(); if(qTimer)clearInterval(qTimer); qTimer=setInterval(updateTimer,500); }
function updateTimer(){
  const e=Math.round((Date.now()-qStart)/1000); const el=$('sess-timer');
  if(el){ el.innerHTML='⏱ '+mmss(e)+' <span class="t-tgt">/ '+T('target')+' '+mmss(qTarget)+'</span>'; el.classList.toggle('over', e>qTarget); }
}
function stopQTimer(){ if(qTimer){clearInterval(qTimer);qTimer=null;} return Math.max(0,Math.round((Date.now()-qStart)/1000)); }
function recordTime(){ const el=stopQTimer(); S.lastTime=el; S.lastTarget=qTarget; S.timeSum=(S.timeSum||0)+el; S.timeCnt=(S.timeCnt||0)+1; }

function startSession(ids, mode, track){
  if(!ids || !ids.length) return;            // nothing to study — stay on dashboard
  S = { queue: ids.slice(), i:0, mode, track, solved:0, correct:0, requeued:new Set(), total:ids.length, timeSum:0, timeCnt:0 };
  show('view-session'); renderQuestion();
}
function endSessionToDash(){ if(qTimer){clearInterval(qTimer);qTimer=null;} S=null; show('view-dash'); renderDash(); }

$('sess-back').onclick = endSessionToDash;

function renderQuestion(){
  const id=S.queue[S.i]; const p=BY_ID[id];
  $('sess-prog-bar').style.width = Math.round(S.i/S.total*100)+'%';
  $('sess-count').textContent = (S.i+1)+' / '+S.total;
  const m=META[p.cat];
  const catName = lang==='ja'? m.ja : m.en;
  let body = `<div class="q-head">
      <span class="q-badge cat">${m.icon} ${catName}</span>
      <span class="q-badge">${p.topic}</span>
      <span class="q-diff" title="${T('diffLabel')(p.diff)}">${diffStars(p.diff)}</span>
    </div>
    <div class="q-text">${p.q}</div>`;

  if(p.type==='mc'){
    body += `<div class="choices" id="choices">` + p.choices.map((c,ix)=>
      `<button class="choice" data-ix="${ix}"><span class="ix">${String.fromCharCode(65+ix)}</span><span>${c}</span></button>`).join('') + `</div>`;
  } else if(p.type==='num'){
    body += `<div class="num-row">
        <input type="text" id="num-input" inputmode="decimal" autocomplete="off" placeholder="${T('placeholder')}">
        ${p.unit?`<span class="num-unit">${p.unit}</span>`:''}
        <button class="submit-btn" id="num-submit">${T('submit')}</button>
      </div>`;
  } else { // open
    body += `<button class="reveal-btn" id="reveal">${T('answerCheck')}</button>`;
  }
  body += `<div id="post"></div>`;
  $('q-card').innerHTML = body;

  if(p.type==='mc'){
    $('choices').querySelectorAll('.choice').forEach(b=>b.onclick=()=>answerMC(p,+b.dataset.ix));
  } else if(p.type==='num'){
    const inp=$('num-input'); inp.focus();
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') submitNum(p); });
    $('num-submit').onclick=()=>submitNum(p);
  } else {
    $('reveal').onclick=()=>revealOpen(p);
  }
  startQTimer(targetTime(p));
}

function parseNum(s){ if(s==null) return NaN; return parseFloat(String(s).replace(/[,，\s%％]/g,'').replace(/[^0-9.\-]/g,'')); }

function answerMC(p, ix){
  recordTime();
  const ok = ix===p.answer;
  $('choices').querySelectorAll('.choice').forEach((b,i)=>{ b.disabled=true;
    if(i===p.answer) b.classList.add('correct');
    if(i===ix && !ok) b.classList.add('wrong');
  });
  sfx(ok?'win':'lose');
  showResult(p, ok, ok? T('correct'): T('wrong'), p.choices[p.answer]);
}
function submitNum(p){
  const raw=$('num-input').value; const val=parseNum(raw);
  if(isNaN(val)) { $('num-input').focus(); return; }
  recordTime();
  const tol = p.tolerance!=null? p.tolerance : Math.max(0.01, Math.abs(p.answer)*1e-6);
  const ok = Math.abs(val-p.answer)<=tol;
  $('num-input').disabled=true; const sb=$('num-submit'); if(sb) sb.disabled=true;
  $('num-input').style.borderColor = ok? 'var(--good)':'var(--bad)';
  sfx(ok?'win':'lose');
  const ansStr = p.answer + (p.unit?(' '+p.unit):'');
  showResult(p, ok, ok? T('correct'): T('wrong'), ansStr);
}
function revealOpen(p){
  recordTime();
  $('reveal').remove();
  sfx('click');
  showResult(p, null, null, null); // self-graded
}

// ok=true/false for objective; ok=null for self-graded (open)
function showResult(p, ok, label, ansStr){
  const post=$('post'); let html='';
  if(ok!==null){
    html += `<div class="result ${ok?'ok':'ng'}">${ok?'✓':'✗'} <span>${label}${(!ok&&ansStr!=null)?(' &nbsp;/&nbsp; '+T('correctAns')(ansStr)):''}</span></div>`;
  } else {
    html += `<div class="result neutral">📝 <span>${T('selfCheck')}</span></div>`;
  }
  // 解答にかかった時間 vs 目標解答時間
  { const tEl=S.lastTime||0, tgt=S.lastTarget||qTarget, within=tEl<=tgt;
    html += `<div class="time-row ${within?'in':'over'}">⏱ ${T('timeTaken')}: <b>${mmss(tEl)}</b> <span class="sep">/</span> ${T('target')}: ${mmss(tgt)}<span class="judge">${within?T('inTime'):T('overTime')}</span></div>`; }
  html += `<div class="explanation">${p.exp}</div>`;
  html += `<div class="grade-label">${T('gradeLabel')}</div><div class="grades" id="grades"></div>`;
  post.innerHTML = html;

  // build grade buttons; preview next interval per option
  const grades = ok===false
    ? [['again',T('again')],['hard',T('hard')],['good',T('good')],['easy',T('easy')]]   // still allow override after a miss
    : [['again',T('again')],['hard',T('hard')],['good',T('good')],['easy',T('easy')]];
  const defaultGrade = ok===false ? 'again' : (ok===true ? 'good' : 'good');
  $('grades').innerHTML = grades.map(([key,name])=>{
    const prev = SRS.nextIntervalPreview(p.id, key).label;
    const star = key===defaultGrade ? ' style="outline:1px solid '+META[p.cat].color+'"' : '';
    return `<button class="grade ${key}" data-g="${key}"${star}><div class="g">${name}</div><div class="gi">${prev}</div></button>`;
  }).join('');
  $('grades').querySelectorAll('.grade').forEach(b=>b.onclick=()=>grade(p, b.dataset.g, ok));
}

function grade(p, label, ok){
  SRS.grade(p.id, label);
  S.solved++;
  if(ok===true || (ok===null && label!=='again')) S.correct++;
  // re-queue lapses once within this session (relearn)
  if(label==='again' && !S.requeued.has(p.id)){ S.requeued.add(p.id); S.queue.push(p.id); S.total++; }
  S.i++;
  if(S.i>=S.queue.length){ finishSession(); }
  else renderQuestion();
}

function finishSession(){
  $('sess-prog-bar').style.width='100%';
  const acc = S.solved? Math.round(S.correct/S.solved*100):0;
  $('sum-emoji').textContent = acc>=80?'🏆': acc>=50?'🎉':'💪';
  $('sum-h').textContent = T('sumH');
  $('sum-stats').innerHTML = [
    ['sumSolved', S.solved, 'var(--accent)'],
    ['sumCorrect', S.correct, 'var(--good)'],
    ['sumAcc', acc+'%', acc>=50?'var(--good)':'var(--warn)'],
    ['sumAvgTime', S.timeCnt? mmss(S.timeSum/S.timeCnt) : '–', 'var(--blue)']
  ].map(([k,v,c])=>`<div class="sum-stat"><div class="v" style="color:${c}">${v}</div><div class="l">${T(k)}</div></div>`).join('');
  $('sum-msg').innerHTML = T('sumMsg')(acc, S.solved);
  show('view-summary');
}
$('sum-back').onclick = endSessionToDash;

// ── boot ───────────────────────────────────────────────────────────────────
applyChrome();
SRS.ready.then(()=>{ renderDash(); });
renderDash(); // immediate render with local data; refreshes after remote pull
window.addEventListener('resize', ()=>{ if($('view-dash').style.display!=='none') drawForgettingCurve(); });
})();
</script>
<script src="../../track.js"></script>
</body>
