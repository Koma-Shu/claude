<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>七並べ</title>
<script src="netplay.js"></script>
<script src="sound.js"></script>
<script src="track.js"></script>
<script src="cards.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:radial-gradient(circle at 50% 30%,#0a4c5c,#052230);min-height:100vh;
    font-family:'Hiragino Sans','Meiryo','Segoe UI',sans-serif;color:#eafaff;
    display:flex;flex-direction:column;align-items:center;padding:48px 8px 20px;--cw:40px;--ch:56px;}
  h1{font-size:1.3rem;letter-spacing:4px;color:#7fe9ff;margin-bottom:6px;}
  .cpus{display:flex;gap:14px;margin-bottom:8px;flex-wrap:wrap;justify-content:center;}
  .cpu{background:rgba(0,0,0,.3);border-radius:10px;padding:5px 12px;font-size:.8rem;text-align:center;}
  .cpu.act{outline:2px solid #7fe9ff;}.cpu .n{font-weight:bold;}
  .board{display:flex;flex-direction:column;gap:4px;background:rgba(0,0,0,.22);
    padding:8px;border-radius:10px;margin-bottom:10px;}
  .brow{display:flex;gap:3px;align-items:center;}
  .slot{width:var(--cw);height:var(--ch);border-radius:5px;border:1px dashed rgba(255,255,255,.12);flex:0 0 auto;}
  .slot.seven{border-color:rgba(255,226,122,.4);}
  .turn{font-size:.9rem;margin:6px 0;min-height:22px;text-align:center;}
  .myhand{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:760px;margin-top:6px;}
  .controls{margin-top:12px;display:flex;gap:12px;}
  button{font-family:inherit;font-size:.88rem;font-weight:bold;border:none;border-radius:9px;padding:9px 20px;cursor:pointer;}
  button:disabled{opacity:.4;cursor:default;}
  .b-pass{background:#ef4444;color:#fff;}.b-new{background:#7fe9ff;color:#063;}
  .topbtn{position:fixed;top:12px;left:12px;background:#374151;color:#fff;border-radius:8px;padding:7px 14px;font-size:.8rem;cursor:pointer;border:none;}
  .win-msg{font-size:1.15rem;font-weight:bold;margin-top:12px;text-align:center;}
  .rank-list{font-size:.82rem;opacity:.85;margin-top:4px;text-align:center;}
</style>
</head>
<body>
<button class="topbtn" id="backbtn" onclick="location.href='arcade.html'">戻る</button>
<h1 id="title">七並べ</h1>
<div class="cpus" id="cpus"></div>
<div class="board" id="board"></div>
<div class="turn" id="turn"></div>
<div class="myhand" id="myhand"></div>
<div class="win-msg" id="winmsg"></div>
<div class="rank-list" id="ranklist"></div>
<div class="controls">
  <button class="b-pass" id="passbtn"></button>
  <button class="b-new" id="newbtn"></button>
</div>

<script>
const L={
  title:{ja:'七並べ',en:'Sevens'},you:{ja:'あなた',en:'You'},
  yourturn:{ja:'あなたの番 — カードを置くかパス',en:'Your turn — play a card or pass'},
  cputurn:{ja:'の番…',en:'\'s turn…'},pass:{ja:'パス',en:'Pass'},passes:{ja:'残パス',en:'passes'},
  newgame:{ja:'新しいゲーム',en:'New Game'},out:{ja:'上がり！',en:'OUT!'},
  finished:{ja:'ゲーム終了',en:'Game Over'},cards:{ja:'枚',en:'cards'},
  bust:{ja:'脱落',en:'BUST'},back:{ja:'戻る',en:'Back'},
  p2:{ja:'P2',en:'P2'},opponent:{ja:'相手',en:'Opponent'},
  online:{ja:'オンライン',en:'Online'},local2p:{ja:'ローカル2P',en:'Local 2P'},
  waiting:{ja:'相手の番…',en:'Opponent\'s turn…'},
  easy:{ja:'弱',en:'Easy'},normal:{ja:'普通',en:'Normal'},hard:{ja:'強',en:'Hard'},diff:{ja:'難易度',en:'Difficulty'},
};
let lang=localStorage.getItem('lang')||'ja';
const t=k=>(L[k]&&L[k][lang])||k;
const C=window.CARDS,$=id=>document.getElementById(id);
const SUITS=['S','H','D','C'];

let np=parseInt(localStorage.getItem('sevens_np'))||4;
let difficulty=localStorage.getItem('sevens_diff')||'medium';
if(difficulty==='normal')difficulty='medium'; // legacy value from old button bug
let gameMode='solo',myIdx=0,onlineRole=null,roomId=null,onlineSeq=-1,sbar=null;
let hands,placed,passesLeft,turn,finishOrder,busted,gameOver;

function isHuman(p){return gameMode==='solo'?p===myIdx:(p===0||p===1);}
function playerLabel(p){
  if(p===myIdx)return t('you');
  if(gameMode==='local2p'&&p<2)return t('p2');
  if(gameMode==='online'&&p<2)return t('opponent');
  return 'CPU '+p;
}

function serializePlaced(pl){const o={};SUITS.forEach(s=>o[s]=[...pl[s]]);return o;}
function deserializePlaced(o){const pl={};SUITS.forEach(s=>pl[s]=new Set(o[s]||[]));return pl;}

function computeInitState(){
  const deck=C.shuffle(C.makeDeck());
  const h=Array.from({length:np},()=>[]);
  deck.forEach((c,i)=>h[i%np].push(c));
  h.forEach(hh=>hh.sort((a,b)=>a.suit.localeCompare(b.suit)||a.value-b.value));
  const pl={S:new Set(),H:new Set(),D:new Set(),C:new Set()};
  const pl7=h.findIndex(hh=>hh.some(c=>c.id==='D7'));
  return {
    hands:h, placed:serializePlaced(pl),
    passesLeft:new Array(np).fill(3),
    finishOrder:[], busted:new Array(np).fill(false), gameOver:false,
    turn:pl7>=0?pl7:0, seq:0
  };
}
function applyState(st){
  hands=st.hands; placed=deserializePlaced(st.placed);
  passesLeft=st.passesLeft; finishOrder=st.finishOrder;
  busted=st.busted; gameOver=st.gameOver; turn=st.turn;
}
function setup(){
  myIdx=(gameMode==='online'&&onlineRole==='guest')?1:0;
  const st=computeInitState(); onlineSeq=st.seq;
  applyState(st);
  $('winmsg').textContent='';$('ranklist').textContent='';
  render(); afterTurnChange();
}

function playable(card){
  const s=placed[card.suit];
  if(card.value===7)return true;
  if(s.size===0)return false;
  return s.has(card.value-1)||s.has(card.value+1);
}
function hasMove(p){return hands[p].some(playable);}

function render(){
  $('title').textContent=t('title');$('newbtn').textContent=t('newgame');$('backbtn').textContent=t('back');
  const cE=$('cpus');cE.innerHTML='';
  for(let p=0;p<np;p++){
    if(p===myIdx)continue;
    const d=document.createElement('div');d.className='cpu'+(turn===p&&!gameOver?' act':'');
    let status=`${hands[p].length}${t('cards')}`;
    if(busted[p])status=t('bust');
    if(finishOrder.includes(p))status='👑'+(finishOrder.indexOf(p)+1);
    d.innerHTML=`<div class="n">${playerLabel(p)}</div><div>${status}</div>`;
    cE.appendChild(d);
  }
  const b=$('board');b.innerHTML='';
  SUITS.forEach(s=>{
    const row=document.createElement('div');row.className='brow';
    for(let v=1;v<=13;v++){
      if(placed[s].has(v)){
        const card={suit:s,rank:C.RANKS[v-1],value:v,id:s+C.RANKS[v-1]};
        row.appendChild(C.cardEl(card,true));
      }else{
        const sl=document.createElement('div');sl.className='slot'+(v===7?' seven':'');
        row.appendChild(sl);
      }
    }
    b.appendChild(row);
  });
  let turnTxt;
  if(gameOver)turnTxt=t('finished');
  else if(turn===myIdx)turnTxt=t('yourturn');
  else if(!isHuman(turn))turnTxt=playerLabel(turn)+t('cputurn');
  else turnTxt=t('waiting');
  $('turn').textContent=turnTxt;
  const mh=$('myhand');mh.innerHTML='';
  const myTurn=turn===myIdx&&!gameOver;
  (hands[myIdx]||[]).forEach(c=>{
    const el=C.cardEl(c,true);
    const canPlay=myTurn&&playable(c);
    if(canPlay){el.classList.add('playable');el.onclick=()=>playCard(myIdx,c);}
    else el.classList.add('dim');
    mh.appendChild(el);
  });
  const pb=$('passbtn');
  pb.textContent=`${t('pass')} (${t('passes')} ${(passesLeft[myIdx])||0})`;
  pb.disabled=!(myTurn&&(passesLeft[myIdx]||0)>0);
  pb.onclick=()=>doPass(myIdx);
}

function afterTurnChange(){
  render();
  if(gameOver)return;
  if(!isHuman(turn)){
    if(gameMode!=='online'||onlineRole==='host')setTimeout(cpuTurn,650);
    return;
  }
  if(turn===myIdx)return;
  if(gameMode==='local2p'){
    NETPLAY.showHandoff(playerLabel(turn),lang,()=>{myIdx=turn;render();});
  }
}

function playCard(p,card){
  if(turn!==p||gameOver||!playable(card))return;
  placed[card.suit].add(card.value);
  hands[p]=hands[p].filter(c=>c.id!==card.id);
  SND.sfx.discard&&SND.sfx.discard();
  if(hands[p].length===0){finishOrder.push(p);SND.sfx.pointWin&&SND.sfx.pointWin();}
  next();
}
function doPass(p){
  if(turn!==p||gameOver)return;
  passesLeft[p]--;if(passesLeft[p]<0)passesLeft[p]=0;
  SND.sfx.click&&SND.sfx.click();
  next();
}
function bustPlayer(p){
  busted[p]=true;
  hands[p].forEach(c=>placed[c.suit].add(c.value));
  hands[p]=[];
}
function next(){
  const active=[];
  for(let p=0;p<np;p++)if(!finishOrder.includes(p)&&!busted[p])active.push(p);
  if(active.length<=1){active.forEach(p=>finishOrder.push(p));endGame();return;}
  let nt=turn;
  do{nt=(nt+1)%np;}while(finishOrder.includes(nt)||busted[nt]);
  turn=nt;
  if(gameMode==='online'){pushOnline();}
  else{
    if(turn===myIdx&&!hasMove(myIdx)&&passesLeft[myIdx]<=0){bustPlayer(myIdx);setTimeout(next,500);return;}
    afterTurnChange();
  }
}
function cpuTurn(){
  if(gameOver||isHuman(turn))return;
  const p=turn;
  const moves=hands[p].filter(playable);
  if(!moves.length){
    if(passesLeft[p]>0)doPass(p);
    else{bustPlayer(p);setTimeout(next,500);}
    return;
  }
  let pick;
  if(difficulty==='easy'){
    // Random move
    pick=moves[Math.floor(Math.random()*moves.length)];
    // Random pass
    if(passesLeft[p]>0&&Math.random()<0.3){doPass(p);return;}
  }else if(difficulty==='medium'){
    moves.sort((a,b)=>Math.abs(b.value-7)-Math.abs(a.value-7));
    pick=moves[0];
    if(passesLeft[p]>0&&pick.value===7&&hands[p].length>6&&Math.random()<0.4){doPass(p);return;}
  }else{
    // Hard: prioritize extending longest runs, avoid blocking own chains
    moves.sort((a,b)=>{
      // Prefer cards far from 7 (edges of runs — clears hand faster)
      const da=Math.abs(a.value-7),db=Math.abs(b.value-7);
      return db-da;
    });
    pick=moves[0];
    // Hard CPU is stingy with passes — only pass when truly stuck
    if(passesLeft[p]>0&&hands[p].filter(playable).length<=1&&hands[p].length>8){doPass(p);return;}
  }
  playCard(p,pick);
}
function endGame(){
  gameOver=true;SND.stopBGM&&SND.stopBGM();
  if(gameMode==='online'){NETPLAY.stopPoll();if(sbar)sbar.remove();}
  for(let p=0;p<np;p++)if(!finishOrder.includes(p))finishOrder.push(p);
  const myRank=finishOrder.indexOf(myIdx)+1;
  const m=$('winmsg');
  if(myRank===1){m.textContent='🏆 '+t('you')+' 1st!';m.style.color='#7dffb0';SND.sfx.win&&SND.sfx.win();}
  else{m.textContent=`${t('you')}: ${myRank}${lang==='ja'?'位':'th'}`;m.style.color='#ffe27a';SND.sfx.lose&&SND.sfx.lose();}
  $('ranklist').textContent=finishOrder.map((p,i)=>`${i+1}. ${playerLabel(p)}${busted[p]?'('+t('bust')+')':''}`).join('   ');
  if(gameMode==='online')pushOnline();
  render();
}

// Online helpers
function getState(){return{hands,placed:serializePlaced(placed),passesLeft,finishOrder,busted,gameOver,turn,seq:++onlineSeq};}
async function pushOnline(){
  try{await NETPLAY.pushState(roomId,getState());}catch(e){console.error(e);}
  if(!gameOver)afterTurnChange();
}
function onPoll(room){
  if(!room.state||room.state.seq<=onlineSeq)return;
  onlineSeq=room.state.seq;
  applyState(room.state);
  if(room.state.gameOver){endGame();return;}
  afterTurnChange();
}

// UI
function initUI(){
  const area=document.querySelector('.controls');
  const np_div=document.createElement('div');
  np_div.style.cssText='display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:10px;';
  np_div.appendChild(NETPLAY.playerCountPicker({min:2,max:6,current:np,lang,onChange:n=>{
    if(gameMode==='online')return;
    np=n;localStorage.setItem('sevens_np',n);setup();
  }}));
  const modeRow=document.createElement('div');modeRow.style.cssText='display:flex;gap:8px;';
  const l2btn=document.createElement('button');
  l2btn.style.cssText='background:#7c3aed;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:.82rem;cursor:pointer;font-weight:bold;';
  const onbtn=document.createElement('button');
  onbtn.style.cssText='background:#10b981;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:.82rem;cursor:pointer;font-weight:bold;';
  function updateBtns(){
    l2btn.textContent=t('local2p');onbtn.textContent=t('online');
    l2btn.style.opacity=gameMode==='local2p'?'1':'.55';
    onbtn.style.opacity=gameMode==='online'?'1':'.55';
  }
  l2btn.onclick=()=>{
    if(gameMode==='online'){NETPLAY.stopPoll();if(sbar){sbar.remove();sbar=null;}onlineRole=null;roomId=null;}
    gameMode=gameMode==='local2p'?'solo':'local2p';myIdx=0;setup();updateBtns();
  };
  onbtn.onclick=()=>{
    NETPLAY.showLobby({
      game:'sevens',lang,
      initState:()=>computeInitState(),
      onHost:(id,room)=>{
        roomId=id;onlineRole='host';myIdx=0;gameMode='online';
        applyState(room.state);onlineSeq=room.state.seq;
        if(sbar)sbar.remove();sbar=NETPLAY.statusBar(lang);sbar.online('host');
        $('winmsg').textContent='';$('ranklist').textContent='';
        render();afterTurnChange();NETPLAY.startPoll(roomId,1500,onPoll);updateBtns();
      },
      onJoin:(room,tok)=>{
        roomId=room.id;onlineRole='guest';myIdx=1;gameMode='online';
        applyState(room.state);onlineSeq=room.state.seq;
        if(sbar)sbar.remove();sbar=NETPLAY.statusBar(lang);sbar.online('guest');
        $('winmsg').textContent='';$('ranklist').textContent='';
        render();afterTurnChange();NETPLAY.startPoll(roomId,1500,onPoll);updateBtns();
      },
      onCancel:()=>{}
    });
  };
  modeRow.appendChild(l2btn);modeRow.appendChild(onbtn);
  np_div.appendChild(modeRow);
  area.parentNode.insertBefore(np_div,area.nextSibling);
  updateBtns();
}

$('newbtn').onclick=()=>{
  if(gameMode==='online'){NETPLAY.stopPoll();if(sbar){sbar.remove();sbar=null;}gameMode='solo';onlineRole=null;roomId=null;}
  SND.startBGM&&SND.startBGM('game');setup();
};

setup();initUI();
(()=>{
  const diffRow=document.createElement('div');
  diffRow.style.cssText='margin-top:6px;display:flex;gap:6px;align-items:center;justify-content:center;';
  const diffLbl=document.createElement('span');diffLbl.style.cssText='font-size:.78rem;color:#aaa;margin-right:4px;';diffLbl.textContent=t('diff')+':';
  diffRow.appendChild(diffLbl);
  const DIFFS=[['easy','easy'],['medium','normal'],['hard','hard']]; // [value, label key]
  DIFFS.forEach(([d,lab])=>{
    const b=document.createElement('button');
    b.style.cssText=`font-size:.75rem;font-weight:bold;border:none;border-radius:6px;padding:4px 10px;cursor:pointer;color:#fff;background:${d===difficulty?'#7c3aed':'#374151'};`;
    b.textContent=t(lab);
    b.onclick=()=>{
      difficulty=d;localStorage.setItem('sevens_diff',d);
      diffRow.querySelectorAll('button').forEach((x,i)=>{x.style.background=DIFFS[i][0]===difficulty?'#7c3aed':'#374151';});
      if(gameMode==='solo')setup();
    };
    diffRow.appendChild(b);
  });
  document.querySelector('.controls').insertAdjacentElement('afterend',diffRow);
})();
if(typeof SND!=='undefined'){SND.createBtn(document.body);SND.startBGM('game');}
</script>
<script src="nav.js"></script>
</body>
</html>
