<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ブラックジャック</title>
<script src="sound.js"></script>
<script src="track.js"></script>
<script src="cards.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:radial-gradient(circle at 50% 30%,#0a5c3a,#053522);min-height:100vh;
    font-family:'Hiragino Sans','Meiryo','Segoe UI',sans-serif;color:#eafff4;
    display:flex;flex-direction:column;align-items:center;padding:54px 12px 90px;--cw:62px;--ch:88px;}
  h1{font-size:1.5rem;letter-spacing:4px;color:#ffe27a;text-shadow:0 2px 8px rgba(0,0,0,.5);margin-bottom:6px;}
  .chips{font-size:.95rem;color:#ffe27a;margin-bottom:14px;}
  .area{width:100%;max-width:640px;margin:8px 0;}
  .label{font-size:.8rem;letter-spacing:2px;color:#bfe;opacity:.85;margin-bottom:6px;display:flex;gap:10px;align-items:center;}
  .score-badge{background:rgba(0,0,0,.35);padding:2px 10px;border-radius:12px;font-weight:bold;color:#fff;}
  .hand{display:flex;gap:8px;min-height:var(--ch);flex-wrap:wrap;}
  .msg{min-height:32px;font-size:1.15rem;font-weight:bold;margin:12px 0;text-align:center;letter-spacing:1px;}
  .msg.win{color:#7dffb0;} .msg.lose{color:#ff9090;} .msg.push{color:#ffe27a;}
  .controls{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:6px;}
  button{font-family:inherit;font-size:.95rem;font-weight:bold;border:none;border-radius:10px;
    padding:11px 26px;cursor:pointer;letter-spacing:1px;transition:transform .1s,filter .1s;}
  button:active{transform:scale(.95);} button:disabled{opacity:.4;cursor:default;}
  .b-hit{background:#3b82f6;color:#fff;} .b-stand{background:#ef4444;color:#fff;}
  .b-deal{background:#ffe27a;color:#222;} .b-bet{background:#10b981;color:#fff;font-size:.85rem;padding:9px 16px;}
  .bet-row{display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:12px;flex-wrap:wrap;}
  .bet-amt{font-size:1.05rem;color:#ffe27a;font-weight:bold;min-width:60px;text-align:center;}
  .topbtn{position:fixed;top:12px;border-radius:8px;padding:7px 14px;font-size:.8rem;}
  .back{left:12px;background:#374151;color:#fff;}
</style>
</head>
<body>
<button class="topbtn back" id="backbtn" onclick="location.href='index.html'">戻る</button>
<h1 id="title">ブラックジャック</h1>
<div class="chips" id="chips"></div>

<div class="area">
  <div class="label"><span id="dealer-lbl">ディーラー</span> <span class="score-badge" id="dscore">–</span></div>
  <div class="hand" id="dealer"></div>
</div>
<div class="area">
  <div class="label"><span id="player-lbl">あなた</span> <span class="score-badge" id="pscore">–</span></div>
  <div class="hand" id="player"></div>
</div>

<div class="msg" id="msg"></div>

<div class="bet-row" id="betrow">
  <button class="b-bet" onclick="changeBet(-50)">−50</button>
  <span class="bet-amt" id="betamt">100</span>
  <button class="b-bet" onclick="changeBet(50)">+50</button>
</div>
<div class="controls" id="controls"></div>

<script>
const L={
  title:{ja:'ブラックジャック',en:'Blackjack'},dealer:{ja:'ディーラー',en:'Dealer'},
  player:{ja:'あなた',en:'You'},chips:{ja:'チップ',en:'Chips'},bet:{ja:'ベット',en:'Bet'},
  hit:{ja:'ヒット',en:'Hit'},stand:{ja:'スタンド',en:'Stand'},deal:{ja:'配る',en:'Deal'},
  win:{ja:'あなたの勝ち！',en:'You win!'},lose:{ja:'あなたの負け…',en:'You lose…'},
  push:{ja:'引き分け',en:'Push'},bust:{ja:'バスト！',en:'Bust!'},
  bj:{ja:'ブラックジャック！',en:'Blackjack!'},dbust:{ja:'ディーラー バスト！',en:'Dealer busts!'},
  broke:{ja:'チップ切れ。タップでリセット',en:'Out of chips. Tap to reset'},
  back:{ja:'戻る',en:'Back'},
};
let lang=localStorage.getItem('lang')||'ja';
const t=k=>(L[k]&&L[k][lang])||k;
const C=window.CARDS;
let deck,player,dealer,chips=500,bet=100,phase='bet',msgKey='',msgCls='';
let holeEl=null, dealing=false;
const $=id=>document.getElementById(id);

function handValue(h){
  let v=0,aces=0;
  for(const c of h){ if(c.rank==='A'){v+=11;aces++;} else if(['J','Q','K','10'].includes(c.rank))v+=10; else v+=c.value; }
  while(v>21&&aces){v-=10;aces--;}
  return v;
}
function isBJ(h){return h.length===2&&handValue(h)===21;}

function renderControls(){
  $('title').textContent=t('title');$('dealer-lbl').textContent=t('dealer');$('player-lbl').textContent=t('player');
  $('backbtn').textContent=t('back');
  $('chips').textContent=`💰 ${t('chips')}: ${chips}`;
  $('betamt').textContent=bet;
  $('pscore').textContent=player.length?handValue(player):'–';
  if(phase==='player'&&dealer.length) $('dscore').textContent=handValue([dealer[0]])+' +?';
  else $('dscore').textContent=dealer.length?handValue(dealer):'–';
  const m=$('msg');m.textContent=msgKey?t(msgKey):'';m.className='msg '+msgCls;
  const ctr=$('controls');ctr.innerHTML='';
  $('betrow').style.display=(phase==='bet')?'flex':'none';
  if(phase==='bet'){
    const b=document.createElement('button');b.className='b-deal';b.textContent=t('deal');
    b.onclick=startRound;ctr.appendChild(b);
  } else if(phase==='player'&&!dealing){
    const h=document.createElement('button');h.className='b-hit';h.textContent=t('hit');h.onclick=hit;
    const s=document.createElement('button');s.className='b-stand';s.textContent=t('stand');s.onclick=stand;
    ctr.appendChild(h);ctr.appendChild(s);
  } else if(phase==='over'){
    const b=document.createElement('button');b.className='b-deal';b.textContent=t('deal');
    b.onclick=()=>{phase='bet';msgKey='';renderControls();};ctr.appendChild(b);
  }
}

function changeBet(d){ bet=Math.max(50,Math.min(chips,bet+d)); renderControls(); }

function dealOneCard(container, card, faceUp, onDone){
  const el=C.cardEl(card,false);
  container.appendChild(el);
  C.dealIn(el, 0, ()=>{
    if(faceUp){ C.flipCard(el,card,()=>{ SND.sfx.flip&&SND.sfx.flip(); if(onDone)onDone(el); }); }
    else { if(onDone)onDone(el); }
  });
}

function startRound(){
  if(dealing)return;
  if(chips<bet)bet=chips;
  if(chips<=0)chips=500;
  deck=C.shuffle(C.makeDeck());
  player=[deck.pop(),deck.pop()];
  dealer=[deck.pop(),deck.pop()];
  phase='player'; msgKey=''; msgCls='';
  dealing=true;
  renderControls();

  const dEl=$('dealer'),pEl=$('player');
  const oldEls=[...Array.from(dEl.children),...Array.from(pEl.children)];
  holeEl=null;

  const doNewDeal=()=>{
    dEl.innerHTML='';pEl.innerHTML='';
    // P1 → D1 → P2 → D2(hole, face-down)
    dealOneCard(pEl,player[0],true,()=>{
      dealOneCard(dEl,dealer[0],true,()=>{
        dealOneCard(pEl,player[1],true,()=>{
          dealOneCard(dEl,dealer[1],false,el=>{
            holeEl=el;
            dealing=false;
            if(isBJ(player)||isBJ(dealer)){phase='dealer';setTimeout(dealerPlay,300);}
            renderControls();
          });
        });
      });
    });
  };

  if(oldEls.length===0){ doNewDeal(); return; }
  let exited=0;
  oldEls.forEach(el=>C.exitCard(el,()=>{
    exited++;
    if(exited===oldEls.length) setTimeout(doNewDeal,80);
  }));
}

function hit(){
  if(dealing||phase!=='player')return;
  dealing=true;
  renderControls();
  const card=deck.pop();player.push(card);
  dealOneCard($('player'),card,true,()=>{
    dealing=false;
    $('pscore').textContent=handValue(player);
    if(handValue(player)>21){ finish(); } else renderControls();
  });
}

function stand(){
  if(dealing||phase!=='player')return;
  phase='dealer';
  renderControls();
  // Reveal hole card
  C.flipCard(holeEl,dealer[1],()=>{
    SND.sfx.flip&&SND.sfx.flip();
    $('dscore').textContent=handValue(dealer);
    setTimeout(dealerPlay,450);
  });
}

function dealerPlay(){
  if(handValue(dealer)<17&&handValue(player)<=21&&!isBJ(player)){
    dealing=true;
    const card=deck.pop();dealer.push(card);
    dealOneCard($('dealer'),card,true,()=>{
      dealing=false;
      $('dscore').textContent=handValue(dealer);
      setTimeout(dealerPlay,500);
    });
  } else finish();
}

function finish(){
  // Reveal hole if still face-down (e.g. player bust before stand)
  const doFinish=()=>{
    phase='over';
    const pv=handValue(player),dv=handValue(dealer);
    const pbj=isBJ(player),dbj=isBJ(dealer);
    let outcome;
    if(pv>21){outcome=-1;msgKey='bust';}
    else if(pbj&&!dbj){outcome=1.5;msgKey='bj';}
    else if(dbj&&!pbj){outcome=-1;msgKey='lose';}
    else if(dv>21){outcome=1;msgKey='dbust';}
    else if(pv>dv){outcome=1;msgKey='win';}
    else if(pv<dv){outcome=-1;msgKey='lose';}
    else{outcome=0;msgKey='push';}
    if(outcome>0){chips+=Math.floor(bet*outcome);msgCls='win';SND.sfx.win&&SND.sfx.win();}
    else if(outcome<0){chips-=bet;msgCls='lose';SND.sfx.lose&&SND.sfx.lose();}
    else{msgCls='push';SND.sfx.point&&SND.sfx.point();}
    bet=Math.min(bet,Math.max(50,chips));
    $('dscore').textContent=handValue(dealer);
    renderControls();
  };
  if(holeEl&&holeEl.classList.contains('back')){
    C.flipCard(holeEl,dealer[1],()=>{ SND.sfx.flip&&SND.sfx.flip(); doFinish(); });
  } else doFinish();
}

player=[];dealer=[];renderControls();
if(typeof SND!=='undefined'){SND.createBtn(document.body);SND.startBGM('game');}
</script>
</body>
</html>
